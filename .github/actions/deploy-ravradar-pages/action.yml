name: Deploy the exact RavRadar Pages artifact
description: Bruger den officielle Pages-rute; samme-job-genforsøg er midlertidigt inaktivt.
inputs:
  artifact_name:
    description: Exact upload name
    required: true
  immediate_retry:
    description: Allow the checked ordinary-weather path
    required: true
  github_token:
    description: Existing Pages writer job token
    required: true
outputs:
  page_url:
    description: Target URL from the exact deployment receipt
    value: ${{ steps.scheduled.outputs.page_url || steps.standard.outputs.page_url }}
  closed_unpublished:
    description: All submitted Pages writes are terminal and the exact predecessor is still public
    value: ${{ steps.scheduled.outputs.closed_unpublished }}
runs:
  using: composite
  steps:
    - name: Deploy with the standard Pages action
      id: standard
      uses: actions/deploy-pages@v5
      with:
        artifact_name: ${{ inputs.artifact_name }}
        token: ${{ inputs.github_token }}
    - name: Deploy ordinary weather with one bounded immediate retry
      id: scheduled
      # Midlertidigt inaktiv: den nye botrute har en uafklaret deployregression.
      # Bevar koden, indtil rettelse og faktisk drift er verificeret.
      if: ${{ false }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RAVRADAR_ORDINARY_PAGES_RETRY: ${{ inputs.immediate_retry }}
        RAVRADAR_PAGES_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      run: node scripts/deploy-ordinary-pages-with-immediate-retry.mjs
