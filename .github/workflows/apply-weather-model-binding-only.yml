name: Apply RavRadar backend bindings without weather

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv APPLY-WEATHER-MODEL-BINDING"
        required: true
        type: string
      upgrade_current_grid_original:
        description: "Særskilt godkendt originalbevarelse før præcis 220000-installation"
        required: false
        default: false
        type: boolean
      diagnose_current_grid_original:
        description: "Skrivefri originaldiagnose; ingen SQL, Edge eller offentlig levering"
        required: false
        default: false
        type: boolean
      upgrade_assistant_later_h0_original:
        description: "Særskilt original586 B/S/native-bank-bevarelse før præcis udstedt assistant-NEXT"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

# Backend binding and a normal weather run must never interleave. This
# workflow never publishes or deploys weather. Named current-grid opt-in
# additionally restores unchanged PRIVATE originals to a separately approved
# run-owned destination before SQL; it never installs them in the checkout.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  apply-binding:
    name: Apply exact database and assistant bindings without touching saved weather
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ravradar-trip-storage-production
      cancel-in-progress: false
    env:
      RAVRADAR_CURRENT_GRID_UPGRADE_OPT_IN: ${{ inputs.upgrade_current_grid_original }}
      RAVRADAR_CURRENT_GRID_DIAGNOSE_ONLY: ${{ inputs.diagnose_current_grid_original }}
      RAVRADAR_ASSISTANT_LATER_H0_ORIGINAL_OPT_IN: ${{ inputs.upgrade_assistant_later_h0_original }}
      RAVRADAR_ASSISTANT_LATER_H0_BINDING_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require explicit main authority and exact head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          if test "$RAVRADAR_CURRENT_GRID_DIAGNOSE_ONLY" = true; then
            test "$RAVRADAR_CURRENT_GRID_UPGRADE_OPT_IN" = true
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$CONFIRMATION" = CHECK-CURRENT-GRID-ORIGINALS
          else
            test "$CONFIRMATION" = APPLY-WEATHER-MODEL-BINDING
          fi
          if test "${RAVRADAR_ASSISTANT_LATER_H0_ORIGINAL_OPT_IN:-false}" = true; then
            test "$RAVRADAR_CURRENT_GRID_UPGRADE_OPT_IN" != true
            test "$RAVRADAR_CURRENT_GRID_DIAGNOSE_ONLY" != true
            test "$GITHUB_RUN_ATTEMPT" = 1
            test "$CONFIRMATION" = APPLY-WEATHER-MODEL-BINDING
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Reuse exact successful pull-request source proof
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require existing source proof without a duplicate gate
        shell: bash
        run: test "${{ steps.source-proof.outputs.required }}" = false

      - name: Seal exact integrated implementation identity
        id: integrated-implementation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/seal-ravscore-public-browser-closure.mjs \
            --root . \
            --output "$RUNNER_TEMP/integrated-public-closure.json" \
            --model integrated \
            --identity-output "$RUNNER_TEMP/integrated-implementation-identity.json"
          closure_sha256="$(jq -er '.implementationClosureSha256 | select(test("^[a-f0-9]{64}$"))' "$RUNNER_TEMP/integrated-implementation-identity.json")"
          echo "closure_sha256=$closure_sha256" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { LATEST_REQUIRED_CUTOVER_MIGRATION } from './scripts/integrated-cutover-readiness.mjs';
          import { deferCurrentGridBindingEdges } from './scripts/lib/production-workflow-sources.mjs';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'defer_edges='
            + deferCurrentGridBindingEdges(LATEST_REQUIRED_CUTOVER_MIGRATION.version) + '\n');
          NODE

      - uses: actions/setup-python@v6
        if: inputs.upgrade_assistant_later_h0_original == true
        with:
          python-version: "3.12"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0

      - name: Prepare isolated exact migration view
        id: migration-view
        shell: bash
        run: |
          set -euo pipefail
          migration_workdir="$(mktemp -d)"
          echo "workdir=$migration_workdir" >> "$GITHUB_OUTPUT"
          node scripts/integrated-cutover-readiness.mjs assert-source \
            --public-implementation-closure-sha256 \
            "${{ steps.integrated-implementation.outputs.closure_sha256 }}"
          node scripts/integrated-cutover-readiness.mjs prepare-workdir \
            --statistics-preference-revision-source --output "$migration_workdir"

      - name: Read linked migration history
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/weather-binding-migrations-before.txt"

      - name: Hydrate only already-applied migration identities
        run: >-
          node scripts/integrated-cutover-readiness.mjs hydrate-history
          --workdir "${{ steps.migration-view.outputs.workdir }}"
          --migration-list "$RUNNER_TEMP/weather-binding-migrations-before.txt"

      - name: Read and materialize the normal central registry without promotion
        if: inputs.upgrade_assistant_later_h0_original == true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/sync-admin-config.py | tee "$RUNNER_TEMP/assistant-binding-admin-sync.json"
          python scripts/apply-central-zone-reviews.py
          node scripts/build-public-coastal-parts-v2.mjs

      - name: Preserve authenticated original586 B and S for the fixed assistant successor
        if: inputs.upgrade_assistant_later_h0_original == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND: r2
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
        run: node scripts/assistant-later-h0-binding-prewrite.mjs prepare

      - name: Preserve authenticated unchanged originals for the named current-grid successor
        if: inputs.upgrade_current_grid_original == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND: r2
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
        run: node scripts/current-grid-binding-prewrite.mjs prepare

      - name: Acknowledge successful read-only original check without installation
        if: inputs.diagnose_current_grid_original == true
        shell: bash
        run: |
          printf '%s\n' 'CURRENT_GRID_ORIGINAL_READONLY_CHECK_COMPLETE'
          printf '%s\n' '::notice title=Current-grid read-only original check::phase=PREPARE;criterion=ORIGINALS_PRESERVED;category=SUCCESS'

      - name: Dry-run and allow only the latest exact binding migration
        if: inputs.diagnose_current_grid_original != true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_BINDING_MIGRATION_WORKDIR: ${{ steps.migration-view.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase migration list --linked | tee "$RUNNER_TEMP/weather-binding-migrations-plan.txt"
          supabase db push --linked --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/weather-binding-migrations-dry-run.txt"
          cd "$GITHUB_WORKSPACE"
          if test "$RAVRADAR_CURRENT_GRID_UPGRADE_OPT_IN" = true; then
            node scripts/current-grid-binding-prewrite.mjs verify-plan
          elif test "${RAVRADAR_ASSISTANT_LATER_H0_ORIGINAL_OPT_IN:-false}" = true; then
            node scripts/assistant-later-h0-binding-prewrite.mjs plan
          else
            node scripts/verify-code-only-migration-plan.mjs \
              --migration-list "$RUNNER_TEMP/weather-binding-migrations-plan.txt" \
              --dry-run "$RUNNER_TEMP/weather-binding-migrations-dry-run.txt" \
              --migrations-directory "${{ steps.migration-view.outputs.workdir }}/supabase/migrations"
          fi

      - name: Reconfirm main immediately before the one database write
        if: inputs.diagnose_current_grid_original != true
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Apply only the dry-run-verified binding migration
        if: inputs.diagnose_current_grid_original != true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_BINDING_MIGRATION_WORKDIR: ${{ steps.migration-view.outputs.workdir }}
        run: |
          set -euo pipefail
          if test "$RAVRADAR_CURRENT_GRID_UPGRADE_OPT_IN" = true; then
            node scripts/current-grid-binding-prewrite.mjs verify-plan
          elif test "${RAVRADAR_ASSISTANT_LATER_H0_ORIGINAL_OPT_IN:-false}" = true; then
            python scripts/sync-admin-config.py | tee "$RUNNER_TEMP/assistant-binding-admin-sync.json"
            python scripts/apply-central-zone-reviews.py
            node scripts/build-public-coastal-parts-v2.mjs
            node scripts/assistant-later-h0-binding-prewrite.mjs verify
          fi
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase db push --linked --skip-vault

      - name: Read back applied migration and live database binding
        if: inputs.diagnose_current_grid_original != true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase migration list --linked | tee "$RUNNER_TEMP/weather-binding-migrations-applied.txt"
          cd "$GITHUB_WORKSPACE"
          node scripts/integrated-cutover-readiness.mjs applied \
            --migration-list "$RUNNER_TEMP/weather-binding-migrations-applied.txt"
          node scripts/integrated-cutover-readiness.mjs verify-db

      - name: Reconfirm exact main before assistant Edge deployment
        if: inputs.diagnose_current_grid_original != true && steps.integrated-implementation.outputs.defer_edges != 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Deploy only the exact RavRadar assistant Edge function
        if: inputs.diagnose_current_grid_original != true && steps.integrated-implementation.outputs.defer_edges != 'true'
        timeout-minutes: 5
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase functions deploy ravradar-assistant --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if test "$attempt" -lt 3; then
              echo "RavRadar assistant deployment attempt $attempt of 3 failed; retrying." >&2
              sleep $((attempt * 5))
            fi
          done
          exit 1

      - name: Verify exact backend and assistant readback without weather or Pages
        if: inputs.diagnose_current_grid_original != true && steps.integrated-implementation.outputs.defer_edges != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RAVRADAR_REQUIRE_INTEGRATED_BINDING: "true"
        run: >-
          node scripts/integrated-cutover-readiness.mjs publish
          --public-implementation-closure-sha256
          "${{ steps.integrated-implementation.outputs.closure_sha256 }}"
