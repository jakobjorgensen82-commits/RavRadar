name: Audit authenticated saved weather inputs without production work

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv AUDIT-SAVED-WEATHER-INPUTS"
        required: true
        type: string
      expected_main_head:
        description: "Eksakt main-commit med grøn kildekontrol"
        required: true
        type: string
      progress_source_run_id:
        description: "Eksakt afsluttet normalrun med krypteret fremdrift"
        required: true
        type: string
      progress_source_attempt:
        description: "Eksakt run-attempt; ingen prefix-fallback"
        required: true
        default: "1"
        type: string
      include_raw_manifest:
        description: "Tæl kun manifest-captures fra en præcis RAW-cache; ingen GRIB-analyse"
        required: false
        default: false
        type: boolean
      raw_manifest_cache_key:
        description: "Eksakt dmi-grib-v4-Linux-YYYY-Www-run-attempt; kun ved manifestdiagnose"
        required: false
        default: ""
        type: string
      progress_baseline_target_hour:
        description: "Kun særskilt godkendt normal metadataovergang: checkpointets oprindelige UTC-time"
        required: false
        default: ""
        type: string
      raw_manifest_source:
        description: "Kun særskilt godkendt ældre RAW-kilde: 38577766010-1; tom bruger checkpointets egen kilde"
        required: false
        default: ""
        type: string
      include_raw_file_presence:
        description: "Kun særskilt godkendt filtilstedeværelse via lstat; aldrig åbning/hash af RAW"
        required: false
        default: false
        type: boolean
      include_selected_current_preflight:
        description: "Skrivefri optælling af den normale originalforberedelses første stop pr. kystdel; ingen RAW"
        required: false
        default: false
        type: boolean

      include_current_window_diagnostic:
        description: "Kun390057/05Z eller390663/20Z: normal beregning i privat scratch;390663 kræver ægte read-only B/S-origin; aldrig vejr/deploy"
        required: false
        default: false
        type: boolean

      include_current586_endpoints:
        description: "Kun CURRENT586_ENDPOINTS_39666991481_1: B-only endpointoptælling; ingen progress/RAW/S/vejrhentning"
        required: false
        default: false
        type: boolean

      include_current586_cached_originals:
        description: "Kun CURRENT586/39666991481-1 og præcis gemt RAW395206: privat originalbevis; ingen progress/S/vejrhentning/score"
        required: false
        default: false
        type: boolean

      component_summary_only:
        description: "Read only the authenticated current B component summary; no progress or RAW"
        required: false
        default: false
        type: boolean
      component_summary_dataset_id:
        description: "Exact protected dataset, required only for component_summary_only"
        required: false
        default: ""
        type: string
      component_summary_reference_at:
        description: "Exact canonical UTC production hour, required only for component_summary_only"
        required: false
        default: ""
        type: string

      water_level_voersaa_trace_20261101:
        description: "Fixed private DK-B02-06 trace from exact4145/232 originals; no provider or production work"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

# Take a consistent read snapshot without racing an ordinary production writer.
# The default audit never invokes reentry/acquisition/scoring/deploy. The exact
# opt-in can run unchanged scoring only in private scratch, never publication.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    if: inputs.component_summary_only != true && inputs.water_level_voersaa_trace_20261101 != true
    name: Authenticate existing packages and report only bounded aggregates
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.include_current_window_diagnostic && 75 || 30 }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require approved exact main and completed normal source attempt
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          COMPONENT_SUMMARY_DATASET: ${{ inputs.component_summary_dataset_id }}
          COMPONENT_SUMMARY_REFERENCE: ${{ inputs.component_summary_reference_at }}
          EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
          SOURCE_RUN_ID: ${{ inputs.progress_source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.progress_source_attempt }}
          INCLUDE_RAW_MANIFEST: ${{ inputs.include_raw_manifest }}
          RAW_MANIFEST_CACHE_KEY: ${{ inputs.raw_manifest_cache_key }}
          PROGRESS_BASELINE_TARGET_HOUR: ${{ inputs.progress_baseline_target_hour }}
          RAW_MANIFEST_SOURCE: ${{ inputs.raw_manifest_source }}
          INCLUDE_RAW_FILE_PRESENCE: ${{ inputs.include_raw_file_presence }}
          INCLUDE_SELECTED_CURRENT_PREFLIGHT: ${{ inputs.include_selected_current_preflight }}
          INCLUDE_CURRENT_WINDOW_DIAGNOSTIC: ${{ inputs.include_current_window_diagnostic }}
          INCLUDE_CURRENT586_ENDPOINTS: ${{ inputs.include_current586_endpoints }}
          INCLUDE_CURRENT586_CACHED_ORIGINALS: ${{ inputs.include_current586_cached_originals }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = AUDIT-SAVED-WEATHER-INPUTS
          test -z "$COMPONENT_SUMMARY_DATASET"
          test -z "$COMPONENT_SUMMARY_REFERENCE"
          [[ "$EXPECTED_MAIN_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]
          [[ "$INCLUDE_RAW_MANIFEST" == true || "$INCLUDE_RAW_MANIFEST" == false ]]
          [[ "$INCLUDE_RAW_FILE_PRESENCE" == true || "$INCLUDE_RAW_FILE_PRESENCE" == false ]]
          [[ "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" == true || "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" == false ]]
          [[ "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" == true || "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" == false ]]
          [[ "$INCLUDE_CURRENT586_ENDPOINTS" == true || "$INCLUDE_CURRENT586_ENDPOINTS" == false ]]
          [[ "$INCLUDE_CURRENT586_CACHED_ORIGINALS" == true || "$INCLUDE_CURRENT586_CACHED_ORIGINALS" == false ]]
          if test "$INCLUDE_CURRENT586_CACHED_ORIGINALS" = true; then
            test "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" = 39666991481-1
            test "$INCLUDE_CURRENT586_ENDPOINTS" = false
            test "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" = false
            test "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" = false
            test "$INCLUDE_RAW_MANIFEST" = false
            test "$INCLUDE_RAW_FILE_PRESENCE" = false
            test -z "$RAW_MANIFEST_SOURCE"
            test -z "$RAW_MANIFEST_CACHE_KEY"
            test -z "$PROGRESS_BASELINE_TARGET_HOUR"
          fi
          if test "$INCLUDE_CURRENT586_ENDPOINTS" = true; then
            test "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" = 39666991481-1
            test "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" = false
            test "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" = false
            test "$INCLUDE_RAW_MANIFEST" = false
            test "$INCLUDE_RAW_FILE_PRESENCE" = false
            test -z "$RAW_MANIFEST_SOURCE"
            test -z "$RAW_MANIFEST_CACHE_KEY"
            test -z "$PROGRESS_BASELINE_TARGET_HOUR"
          fi
          if test "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" = true; then
            if test "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" = 39066350748-1; then
              test "$PROGRESS_BASELINE_TARGET_HOUR" = 2026-10-17T20:00:00.000Z
            else
            test "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" = 39005745097-1
            test "$PROGRESS_BASELINE_TARGET_HOUR" = 2026-10-17T05:00:00.000Z
            fi
            test "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" = false
            test "$INCLUDE_RAW_MANIFEST" = false
            test "$INCLUDE_RAW_FILE_PRESENCE" = false
            test -z "$RAW_MANIFEST_SOURCE"
            test -z "$RAW_MANIFEST_CACHE_KEY"
          fi
          if test "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" = true; then
            test "$INCLUDE_RAW_MANIFEST" = false
            test "$INCLUDE_RAW_FILE_PRESENCE" = false
            test -z "$RAW_MANIFEST_SOURCE"
            test -z "$RAW_MANIFEST_CACHE_KEY"
            case "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT:$PROGRESS_BASELINE_TARGET_HOUR" in
              38692413809-1:2026-10-14T18:00:00.000Z|38768040429-1:2026-10-15T16:00:00.000Z) ;;
              *) exit 1 ;;
            esac
          fi
          if test -n "$RAW_MANIFEST_SOURCE"; then
            test "$INCLUDE_RAW_MANIFEST" = true
            test "$RAW_MANIFEST_SOURCE" = 38577766010-1
            test "$RAW_MANIFEST_CACHE_KEY" = dmi-grib-v4-Linux-2026-W42-38577766010-1
            test "$SOURCE_RUN_ID" = 38692413809
            test "$SOURCE_RUN_ATTEMPT" = 1
            test "$PROGRESS_BASELINE_TARGET_HOUR" = 2026-10-14T18:00:00.000Z
          fi
          if test "$INCLUDE_RAW_FILE_PRESENCE" = true; then
            test "$INCLUDE_RAW_MANIFEST" = true
            test "$RAW_MANIFEST_SOURCE" = 38577766010-1
          fi
          if test -n "$PROGRESS_BASELINE_TARGET_HOUR"; then
            [[ "$PROGRESS_BASELINE_TARGET_HOUR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00\.000Z$ ]]
          fi
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_HEAD"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/saved-input-source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg run "$SOURCE_RUN_ID" \
            --arg attempt "$SOURCE_RUN_ATTEMPT" '
            (.id | tostring) == $run and (.run_attempt | tostring) == $attempt
            and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_branch == "main" and .event == "workflow_dispatch"
            and .path == ".github/workflows/run-current-weather-once.yml"
            and .status == "completed" and (.head_sha | test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/saved-input-source-run.json" >/dev/null
          source_head="$(jq -er '.head_sha' "$RUNNER_TEMP/saved-input-source-run.json")"
          git merge-base --is-ancestor "$source_head" "$GITHUB_SHA"
          if test "$INCLUDE_CURRENT586_ENDPOINTS" = true; then
            test "$source_head" = 94b2b6173747b9d1f7d261c5110042a657af0cac
            jq -e '.id == 39666991481 and .run_attempt == 1 and .conclusion == "failure"' \
              "$RUNNER_TEMP/saved-input-source-run.json" >/dev/null
          fi
          if test "$INCLUDE_CURRENT586_CACHED_ORIGINALS" = true; then
            test "$source_head" = 94b2b6173747b9d1f7d261c5110042a657af0cac
            jq -e '.id == 39666991481 and .run_attempt == 1 and .conclusion == "failure"' \
              "$RUNNER_TEMP/saved-input-source-run.json" >/dev/null
          fi
          echo "cache_key=weather-private-progress-encrypted-v2-Linux-main-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if test "$INCLUDE_RAW_MANIFEST" = true; then
            if test -z "$RAW_MANIFEST_SOURCE"; then
              [[ "$RAW_MANIFEST_CACHE_KEY" =~ ^dmi-grib-v4-Linux-[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}$ ]]
            else
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/38577766010/attempts/1" \
                > "$RUNNER_TEMP/saved-input-older-raw-source-run.json"
              jq -e --arg repo "$GITHUB_REPOSITORY" '
                .id == 38577766010 and .run_attempt == 1
                and .repository.full_name == $repo and .head_repository.full_name == $repo
                and .head_branch == "main" and .event == "workflow_dispatch"
                and .path == ".github/workflows/run-current-weather-once.yml"
                and .status == "completed"
                and .head_sha == "584e0e19530ce14f8d4f15c20ea3fbee9dd63e7e"
              ' "$RUNNER_TEMP/saved-input-older-raw-source-run.json" >/dev/null
              git merge-base --is-ancestor 584e0e19530ce14f8d4f15c20ea3fbee9dd63e7e "$GITHUB_SHA"
            fi
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
              -f key="$RAW_MANIFEST_CACHE_KEY" -f ref=refs/heads/main -f per_page=100 \
              > "$RUNNER_TEMP/saved-input-raw-cache-metadata.json"
            jq -e --arg key "$RAW_MANIFEST_CACHE_KEY" '
              .total_count == 1 and (.actions_caches | length) == 1
              and .actions_caches[0].key == $key
              and .actions_caches[0].ref == "refs/heads/main"
              and .actions_caches[0].version == "9d434ae81d3120176028232ea936fc3f9dc0ed030022ff6d98bec91aa9cf117a"
              and (.actions_caches[0].size_in_bytes | type == "number" and . > 0)
            ' "$RUNNER_TEMP/saved-input-raw-cache-metadata.json" >/dev/null
            if test -n "$RAW_MANIFEST_SOURCE"; then
              jq -e '.actions_caches[0].id == 8945631595
                and .actions_caches[0].size_in_bytes == 2614349607' \
                "$RUNNER_TEMP/saved-input-raw-cache-metadata.json" >/dev/null
            fi
            echo "raw_cache_key=$RAW_MANIFEST_CACHE_KEY" >> "$GITHUB_OUTPUT"
          else
            test -z "$RAW_MANIFEST_CACHE_KEY"
          fi
          if test "$INCLUDE_CURRENT586_CACHED_ORIGINALS" = true; then
            current586_cached_raw_key=dmi-grib-v4-Linux-2026-W43-39520623069-1
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
              -f key="$current586_cached_raw_key" -f ref=refs/heads/main -f per_page=100 \
              > "$RUNNER_TEMP/current586-cached-originals-raw-cache-metadata.json"
            jq -e --arg key "$current586_cached_raw_key" '
              .total_count == 1 and (.actions_caches | length) == 1
              and .actions_caches[0].id == 9250979458
              and .actions_caches[0].key == $key
              and .actions_caches[0].ref == "refs/heads/main"
              and .actions_caches[0].version == "9d434ae81d3120176028232ea936fc3f9dc0ed030022ff6d98bec91aa9cf117a"
              and .actions_caches[0].size_in_bytes == 2729841089
            ' "$RUNNER_TEMP/current586-cached-originals-raw-cache-metadata.json" >/dev/null
            echo "current586_cached_raw_key=$current586_cached_raw_key" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify live exact-content source validation
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stop unless current source already has live green proof
        shell: bash
        env:
          SOURCE_REQUIRED: ${{ steps.source-proof.outputs.required }}
        run: |
          set -euo pipefail
          test "$SOURCE_REQUIRED" = false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install only existing offline reader dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt -r requirements-geometry.txt -r requirements-copernicus.txt

      - name: Restore only the requested encrypted acquisition snapshot
        if: inputs.include_current586_endpoints != true && inputs.include_current586_cached_originals != true
        id: progress
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-private-progress.encrypted
          key: ${{ steps.authority.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Require exact cache hit before reading any protected data
        if: inputs.include_current586_endpoints != true && inputs.include_current586_cached_originals != true
        shell: bash
        env:
          EXACT_KEY: ${{ steps.authority.outputs.cache_key }}
          MATCHED_KEY: ${{ steps.progress.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.progress.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$EXACT_KEY"
          test -s .cache/weather-private-progress.encrypted
          test ! -L .cache/weather-private-progress.encrypted
          mkdir "$RUNNER_TEMP/ravradar-saved-input-audit"
          install -m 0600 .cache/weather-private-progress.encrypted \
            "$RUNNER_TEMP/ravradar-saved-input-audit/progress.encrypted"

      # The existing producer cache is an indivisible archive. Restore that exact
      # path/version. The audit opens only asset-manifest.json; explicit optional
      # presence inventory uses lstat, never RAW open/hash/decode or admission.
      - name: Optionally restore the exact same-run RAW cache for manifest counts
        if: inputs.include_raw_manifest == true
        id: raw-manifest
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-grib
          key: ${{ steps.authority.outputs.raw_cache_key }}
          fail-on-cache-miss: true

      - name: Require the exact RAW cache before optional manifest inspection
        if: inputs.include_raw_manifest == true
        shell: bash
        env:
          EXACT_KEY: ${{ steps.authority.outputs.raw_cache_key }}
          MATCHED_KEY: ${{ steps.raw-manifest.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.raw-manifest.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$EXACT_KEY"
          test -d .cache/dmi-grib
          test ! -L .cache
          test ! -L .cache/dmi-grib
          test ! -L .cache/dmi-grib/asset-manifest.json

      # This separate fixed CURRENT profile restores the same indivisible normal
      # RAW path/version. It does not enable the old manifest or progress scopes.
      - name: Restore only the fixed CURRENT586 original RAW cache
        if: inputs.include_current586_cached_originals == true
        id: current586-cached-raw
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-grib
          key: ${{ steps.authority.outputs.current586_cached_raw_key }}
          fail-on-cache-miss: true

      - name: Require exact CURRENT586 original RAW cache hit
        if: inputs.include_current586_cached_originals == true
        shell: bash
        env:
          EXACT_KEY: ${{ steps.authority.outputs.current586_cached_raw_key }}
          MATCHED_KEY: ${{ steps.current586-cached-raw.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.current586-cached-raw.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$EXACT_KEY" = dmi-grib-v4-Linux-2026-W43-39520623069-1
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = "$EXACT_KEY"
          test -d .cache/dmi-grib
          test ! -L .cache
          test ! -L .cache/dmi-grib
          test ! -L .cache/dmi-grib/asset-manifest.json

      - name: Create only the CURRENT586 diagnostic private root
        if: inputs.include_current586_endpoints == true || inputs.include_current586_cached_originals == true
        shell: bash
        run: mkdir "$RUNNER_TEMP/ravradar-saved-input-audit"

      - name: Read the current protected source identity without storage writes
        run: >-
          node scripts/audit-saved-weather-inputs.mjs describe
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/describe-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Materialize exact original producer code without running it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          producer_head="$(jq -er '.sourceHead' "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json")"
          [[ "$producer_head" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$producer_head" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          git archive "$producer_head" | tar -x -C "$RUNNER_TEMP/ravradar-saved-input-predecessor"

      - name: Prepare exact current code only inside CURRENT586 diagnostic scratch
        if: inputs.include_current586_endpoints == true || inputs.include_current586_cached_originals == true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          root="$RUNNER_TEMP/ravradar-saved-input-audit/current586-source"
          mkdir "$root"
          git archive "$GITHUB_SHA" | tar -x -C "$root"

      - name: Prepare exact current code and normal central registry only inside diagnostic scratch
        if: inputs.include_current_window_diagnostic == true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ravradar-saved-input-audit"
          mkdir "$root/current-window-logs"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          if test "${{ inputs.progress_source_run_id }}-${{ inputs.progress_source_attempt }}" = 39066350748-1; then
            # Existing local Git objects only; no remote fetch or invented
            # producer. Origin's unchanged ancestry/whole-blob checks run later.
            git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$root/current-window-source"
            git -C "$root/current-window-source" -c core.autocrlf=false checkout --detach "$GITHUB_SHA"
          else
            mkdir "$root/current-window-source"
            git archive "$GITHUB_SHA" | tar -x -C "$root/current-window-source"
          fi
          cd "$root/current-window-source"
          if ! (python scripts/refine-coastlines-constrained-4.0.48.py &&
            python scripts/sync-admin-config.py &&
            python scripts/apply-central-zone-reviews.py &&
            node scripts/build-public-coastal-parts-v2.mjs) >"$root/current-window-logs/normal-admin-hydration.stdout" 2>"$root/current-window-logs/normal-admin-hydration.stderr"; then
            echo SAVED_CURRENT_WINDOW_CENTRAL_HYDRATION_UNAVAILABLE >&2
            exit 1
          fi
          test -s .cache/admin-config-sync.json
          test -s data/live/coastal-parts-v2.json

      - name: Authenticate and measure saved inputs without production rebuild
        if: inputs.include_current586_endpoints != true && inputs.include_current586_cached_originals != true
        id: input-audit
        run: >-
          node scripts/audit-saved-weather-inputs.mjs audit
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --progress-file "$RUNNER_TEMP/ravradar-saved-input-audit/progress.encrypted"
          --progress-source "$PROGRESS_SOURCE"
          --progress-cache-key "$PROGRESS_CACHE_KEY"
          --include-raw-manifest "$INCLUDE_RAW_MANIFEST"
          --include-raw-file-presence "$INCLUDE_RAW_FILE_PRESENCE"
          --include-selected-current-preflight "$INCLUDE_SELECTED_CURRENT_PREFLIGHT"
          --include-current-window-diagnostic "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC"
          ${RAW_MANIFEST_ARGS}
          ${RAW_SOURCE_ARGS}
          ${PROGRESS_BASELINE_ARGS}
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/summary-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          WEATHER_PROGRESS_MASTER_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROGRESS_SOURCE: ${{ inputs.progress_source_run_id }}-${{ inputs.progress_source_attempt }}
          PROGRESS_CACHE_KEY: ${{ steps.authority.outputs.cache_key }}
          INCLUDE_RAW_MANIFEST: ${{ inputs.include_raw_manifest }}
          INCLUDE_RAW_FILE_PRESENCE: ${{ inputs.include_raw_file_presence }}
          INCLUDE_SELECTED_CURRENT_PREFLIGHT: ${{ inputs.include_selected_current_preflight }}
          INCLUDE_CURRENT_WINDOW_DIAGNOSTIC: ${{ inputs.include_current_window_diagnostic }}
          RAW_MANIFEST_ARGS: ${{ inputs.include_raw_manifest && format('--raw-cache-key {0}', steps.authority.outputs.raw_cache_key) || '' }}
          RAW_SOURCE_ARGS: ${{ inputs.raw_manifest_source != '' && format('--raw-manifest-source {0}', inputs.raw_manifest_source) || '' }}
          PROGRESS_BASELINE_ARGS: ${{ inputs.progress_baseline_target_hour != '' && format('--progress-baseline-target-hour {0}', inputs.progress_baseline_target_hour) || '' }}

      - name: Diagnose only exact CURRENT586 selected native endpoints
        if: inputs.include_current586_endpoints == true
        id: current586-audit
        run: >-
          node scripts/audit-saved-weather-inputs.mjs audit
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --progress-source 39666991481-1
          --include-current586-endpoints true
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/summary-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}

      - name: Prove only fixed CURRENT586 cached native originals in private scratch
        if: inputs.include_current586_cached_originals == true
        id: current586-cached-originals-audit
        run: >-
          node scripts/audit-saved-weather-inputs.mjs audit
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --progress-source 39666991481-1
          --include-current586-cached-originals true
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/summary-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}

      - name: Upload only the fixed-schema payload-free aggregate report
        if: always() && (steps.input-audit.outcome == 'success' || steps.input-audit.outcome == 'failure' || steps.current586-audit.outcome == 'success' || steps.current586-audit.outcome == 'failure' || steps.current586-cached-originals-audit.outcome == 'success' || steps.current586-cached-originals-audit.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: saved-weather-input-audit-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ravradar-saved-input-audit/summary-safe.json
          if-no-files-found: error
          retention-days: 14

  component-summary:
    if: inputs.component_summary_only == true && inputs.water_level_voersaa_trace_20261101 != true
    name: Read only the authenticated protected component summary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require exact main and a separate B-only summary request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
          SOURCE_RUN_ID: ${{ inputs.progress_source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.progress_source_attempt }}
          EXPECTED_DATASET_ID: ${{ inputs.component_summary_dataset_id }}
          EXPECTED_REFERENCE_AT: ${{ inputs.component_summary_reference_at }}
          INCLUDE_RAW_MANIFEST: ${{ inputs.include_raw_manifest }}
          INCLUDE_RAW_FILE_PRESENCE: ${{ inputs.include_raw_file_presence }}
          INCLUDE_SELECTED_CURRENT_PREFLIGHT: ${{ inputs.include_selected_current_preflight }}
          INCLUDE_CURRENT_WINDOW_DIAGNOSTIC: ${{ inputs.include_current_window_diagnostic }}
          INCLUDE_CURRENT586_ENDPOINTS: ${{ inputs.include_current586_endpoints }}
          INCLUDE_CURRENT586_CACHED_ORIGINALS: ${{ inputs.include_current586_cached_originals }}
          RAW_MANIFEST_CACHE_KEY: ${{ inputs.raw_manifest_cache_key }}
          RAW_MANIFEST_SOURCE: ${{ inputs.raw_manifest_source }}
          PROGRESS_BASELINE_TARGET_HOUR: ${{ inputs.progress_baseline_target_hour }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = AUDIT-SAVED-WEATHER-INPUTS
          [[ "$EXPECTED_MAIN_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]
          for flag in "$INCLUDE_RAW_MANIFEST" "$INCLUDE_RAW_FILE_PRESENCE" "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" "$INCLUDE_CURRENT586_ENDPOINTS" "$INCLUDE_CURRENT586_CACHED_ORIGINALS"; do
            test "$flag" = false
          done
          test -z "$RAW_MANIFEST_CACHE_KEY"
          test -z "$RAW_MANIFEST_SOURCE"
          test -z "$PROGRESS_BASELINE_TARGET_HOUR"
          node --input-type=module <<'NODE'
          const id=process.env.EXPECTED_DATASET_ID,reference=process.env.EXPECTED_REFERENCE_AT;
          if(typeof id!=='string'||!/^rr-[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(id)
            ||typeof reference!=='string'||!/^\d{4}-\d{2}-\d{2}T\d{2}:00:00\.000Z$/.test(reference)
            ||!Number.isFinite(Date.parse(reference))||new Date(reference).toISOString()!==reference)process.exit(1);
          NODE
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_HEAD"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT" > "$RUNNER_TEMP/component-summary-source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg run "$SOURCE_RUN_ID" --arg attempt "$SOURCE_RUN_ATTEMPT" '
            (.id|tostring)==$run and (.run_attempt|tostring)==$attempt
            and .repository.full_name==$repo and .head_repository.full_name==$repo
            and .head_branch=="main" and .event=="workflow_dispatch"
            and .path==".github/workflows/run-current-weather-once.yml"
            and .status=="completed" and (.head_sha|test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/component-summary-source-run.json" >/dev/null
          source_head="$(jq -er '.head_sha' "$RUNNER_TEMP/component-summary-source-run.json")"
          git merge-base --is-ancestor "$source_head" "$GITHUB_SHA"

      - name: Verify live exact-content source validation for B-only summary
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stop unless the B-only source already has live green proof
        shell: bash
        env:
          SOURCE_REQUIRED: ${{ steps.source-proof.outputs.required }}
        run: test "$SOURCE_REQUIRED" = false

      - name: Create only the separate B-only diagnostic private root
        run: mkdir "$RUNNER_TEMP/ravradar-saved-input-audit"
      - name: Describe only the current protected generation for B-only summary
        run: >-
          node scripts/audit-saved-weather-inputs.mjs describe
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/describe-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Materialize only the exact archived B reader without executing producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          producer_head="$(jq -er '.sourceHead' "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json")"
          [[ "$producer_head" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$producer_head" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          git archive "$producer_head" | tar -x -C "$RUNNER_TEMP/ravradar-saved-input-predecessor"
      - name: Read only the authenticated B component summary
        id: component-summary
        run: >-
          node scripts/audit-saved-weather-inputs.mjs component-summary
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --expected-dataset "$EXPECTED_DATASET_ID"
          --expected-reference "$EXPECTED_REFERENCE_AT"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/summary-safe.json"
        env:
          EXPECTED_DATASET_ID: ${{ inputs.component_summary_dataset_id }}
          EXPECTED_REFERENCE_AT: ${{ inputs.component_summary_reference_at }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
      - name: Upload only the fixed B-only summary report
        if: always() && (steps.component-summary.outcome == 'success' || steps.component-summary.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: saved-weather-component-summary-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ravradar-saved-input-audit/summary-safe.json
          if-no-files-found: error
          retention-days: 14

  voersaa-water-trace:
    if: inputs.water_level_voersaa_trace_20261101 == true
    name: Read two exact original B water traces privately
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require exclusive fixed read scope and exact main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
          COMPONENT_SUMMARY: ${{ inputs.component_summary_only }}
          COMPONENT_DATASET: ${{ inputs.component_summary_dataset_id }}
          COMPONENT_REFERENCE: ${{ inputs.component_summary_reference_at }}
          INCLUDE_RAW_MANIFEST: ${{ inputs.include_raw_manifest }}
          INCLUDE_RAW_FILE_PRESENCE: ${{ inputs.include_raw_file_presence }}
          INCLUDE_SELECTED_CURRENT_PREFLIGHT: ${{ inputs.include_selected_current_preflight }}
          INCLUDE_CURRENT_WINDOW_DIAGNOSTIC: ${{ inputs.include_current_window_diagnostic }}
          INCLUDE_CURRENT586_ENDPOINTS: ${{ inputs.include_current586_endpoints }}
          INCLUDE_CURRENT586_CACHED_ORIGINALS: ${{ inputs.include_current586_cached_originals }}
          RAW_MANIFEST_CACHE_KEY: ${{ inputs.raw_manifest_cache_key }}
          RAW_MANIFEST_SOURCE: ${{ inputs.raw_manifest_source }}
          PROGRESS_BASELINE_TARGET_HOUR: ${{ inputs.progress_baseline_target_hour }}
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = AUDIT-SAVED-WEATHER-INPUTS
          [[ "$EXPECTED_MAIN_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_HEAD"
          test "$(git -c protocol.allow=never rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          for flag in "$COMPONENT_SUMMARY" "$INCLUDE_RAW_MANIFEST" "$INCLUDE_RAW_FILE_PRESENCE" "$INCLUDE_SELECTED_CURRENT_PREFLIGHT" "$INCLUDE_CURRENT_WINDOW_DIAGNOSTIC" "$INCLUDE_CURRENT586_ENDPOINTS" "$INCLUDE_CURRENT586_CACHED_ORIGINALS"; do test "$flag" = false; done
          for value in "$COMPONENT_DATASET" "$COMPONENT_REFERENCE" "$RAW_MANIFEST_CACHE_KEY" "$RAW_MANIFEST_SOURCE" "$PROGRESS_BASELINE_TARGET_HOUR"; do test -z "$value"; done
          for pair in '41231144384 7a08f6a8dfb2131898e7270a2429c3f4f810a842 .github/workflows/update-and-deploy.yml' '41256251412 37a34703d9ae8bfb2c28056f21a7ea73944033ae .github/workflows/run-current-weather-once.yml'; do
            read -r run head workflow <<< "$pair"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/1" > "$RUNNER_TEMP/voersaa-source-$run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg run "$run" --arg head "$head" --arg workflow "$workflow" '
              (.id|tostring)==$run and .run_attempt==1 and .head_sha==$head
              and .repository.full_name==$repo and .head_repository.full_name==$repo
              and .head_branch=="main" and .event=="workflow_dispatch"
              and .path==$workflow and .status=="completed"
            ' "$RUNNER_TEMP/voersaa-source-$run.json" >/dev/null
            git -c protocol.allow=never merge-base --is-ancestor "$head" "$GITHUB_SHA"
          done
      - name: Verify live exact-content source proof for the fixed trace
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Stop unless the fixed trace source has live green proof
        shell: bash
        env:
          SOURCE_REQUIRED: ${{ steps.source-proof.outputs.required }}
        run: test "$SOURCE_REQUIRED" = false
      - name: Materialize only the two genuine normal archived readers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_NO_LAZY_FETCH=1 GIT_OPTIONAL_LOCKS=0
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ravradar-voersaa-water-trace" "$RUNNER_TEMP/ravradar-voersaa-water-readers"
          mkdir "$RUNNER_TEMP/ravradar-voersaa-water-readers/4145" "$RUNNER_TEMP/ravradar-voersaa-water-readers/232"
          git -c protocol.allow=never archive 7a08f6a8dfb2131898e7270a2429c3f4f810a842 | tar -x -C "$RUNNER_TEMP/ravradar-voersaa-water-readers/4145"
          git -c protocol.allow=never archive 37a34703d9ae8bfb2c28056f21a7ea73944033ae | tar -x -C "$RUNNER_TEMP/ravradar-voersaa-water-readers/232"
      - name: Authenticate original B generations and encrypt only the fixed trace
        id: fixed-water-trace
        run: >-
          node scripts/audit-saved-weather-inputs.mjs water-level-voersaa-20261101
          --private-root "${{ runner.temp }}/ravradar-voersaa-water-trace"
          --predecessor-root "${{ runner.temp }}/ravradar-voersaa-water-readers"
          --output "${{ runner.temp }}/ravradar-voersaa-water-trace/status-safe.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEATHER_PROGRESS_MASTER_SECRET: ${{ secrets.WEATHER_PROGRESS_MASTER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
      - name: Keep only ciphertext and fixed safe status for one day
        if: always() && (steps.fixed-water-trace.outcome == 'success' || steps.fixed-water-trace.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: voersaa-water-trace-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ravradar-voersaa-water-trace/status-safe.json.encrypted
            ${{ runner.temp }}/ravradar-voersaa-water-trace/status-safe.json
          if-no-files-found: error
          retention-days: 1
