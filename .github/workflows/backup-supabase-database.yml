name: Back up RavRadar Supabase database

on:
  workflow_run:
    workflows: ['Run current RavRadar weather once']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact already qualified current main SHA
        required: true
        type: string
      source_weather_run_id:
        description: Bound ordinary bot weather source; empty for manual work
        type: string
        default: ''
      operation:
        description: Fixed private backup operation; readonly bucket check by default
        type: choice
        default: bucket-readonly
        options: [bucket-readonly, bucket-create, capture, discover, bootstrap, audit-fixed-844-role-grant]
      confirmation:
        description: Exact bucket-create, capture, or fixed 844 role audit confirmation; otherwise empty
        type: string
        default: ''
      index_sha:
        description: Optional exact authenticated index wire SHA for bootstrap only
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

# Preserve the qualified weather OUTER -> trip storage INNER lock order.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  supabase-database-backup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login != 'github-actions[bot]' && vars.RAVRADAR_SUPABASE_BACKUP_AUTOMATION == 'weekly')
    concurrency:
      group: ravradar-trip-storage-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the fixed hosted main invocation
        id: admission
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.sha || inputs.expected_main }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_weather_run_id }}
          AUTOMATION: ${{ vars.RAVRADAR_SUPABASE_BACKUP_AUTOMATION }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_INDEX: ${{ inputs.index_sha }}
        run: |
          set -euo pipefail
          automatic=false
          case "$GITHUB_EVENT_NAME" in
            workflow_run) test "$AUTOMATION" = weekly; automatic=true ;;
            workflow_dispatch)
              if test -n "$SOURCE_RUN_ID"; then
                test "$AUTOMATION" = weekly
                test "$GITHUB_ACTOR" = 'github-actions[bot]'
                test "$REQUESTED_OPERATION" = bucket-readonly
                test -z "$REQUESTED_CONFIRMATION"
                test -z "$REQUESTED_INDEX"
                automatic=true
              fi ;;
            *) exit 1 ;;
          esac
          echo "automatic=$automatic" >> "$GITHUB_OUTPUT"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = jakobjorgensen82-commits/RavRadar
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the fixed caller before any private access
        timeout-minutes: 2
        run: node --test scripts/test-supabase-database-backup-workflow.mjs
      - name: Restore source-content validation locator
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-supabase-backup
          restore-keys: |
            weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-
      - name: Require the already qualified exact-content source
        id: source-proof
        timeout-minutes: 2
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reject missing source proof before private access
        run: test "${{ steps.source-proof.outputs.required }}" = false
      - name: Plan one weekly capture or isolated verification in the original weather window
        id: auto-plan
        if: steps.admission.outputs.automatic == 'true'
        timeout-minutes: 2
        run: node scripts/run-autonomous-supabase-backup.mjs --plan
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.sha || inputs.expected_main }}
          SUPABASE_BACKUP_SOURCE_WEATHER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_weather_run_id }}
          SUPABASE_BACKUP_AUTOMATION: ${{ vars.RAVRADAR_SUPABASE_BACKUP_AUTOMATION }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_BACKUP_RESERVE_INDEX_COMMITMENT: ${{ vars.RAVRADAR_SUPABASE_BACKUP_RESERVE_INDEX_COMMITMENT }}
          SUPABASE_BACKUP_RESERVE_RESTORE_RUN_ID: ${{ vars.RAVRADAR_SUPABASE_BACKUP_RESERVE_RESTORE_RUN_ID }}
      - name: Check private bucket before capture-only CLI setup
        if: steps.admission.outputs.automatic != 'true' && inputs.operation == 'capture'
        timeout-minutes: 2
        run: node scripts/run-hosted-supabase-backup.mjs --preflight
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_main }}
          SUPABASE_BACKUP_OPERATION: ${{ inputs.operation }}
          SUPABASE_BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_BACKUP_INDEX_SHA: ${{ inputs.index_sha }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Set up the already used pinned Supabase CLI only for capture
        if: (steps.admission.outputs.automatic != 'true' && inputs.operation == 'capture') || steps.auto-plan.outputs.proceed == 'true'
        timeout-minutes: 2
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0
      - name: ${{ inputs.operation == 'capture' && 'Capture private Supabase database' || 'Run only the fixed backup operation' }}
        if: steps.admission.outputs.automatic != 'true' && inputs.operation != 'audit-fixed-844-role-grant'
        timeout-minutes: 21
        run: node scripts/run-hosted-supabase-backup.mjs --execute
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_main }}
          SUPABASE_BACKUP_OPERATION: ${{ inputs.operation }}
          SUPABASE_BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_BACKUP_INDEX_SHA: ${{ inputs.index_sha }}
          SUPABASE_URL: ${{ (inputs.operation == 'capture' || inputs.operation == 'discover') && secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (inputs.operation == 'capture' || inputs.operation == 'discover' || inputs.operation == 'bootstrap') && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_ACCESS_TOKEN: ${{ (inputs.operation == 'capture' || inputs.operation == 'discover') && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          SUPABASE_DB_PASSWORD: ${{ inputs.operation == 'capture' && secrets.SUPABASE_DB_PASSWORD || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.operation != 'bootstrap' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ (inputs.operation == 'capture' || inputs.operation == 'discover' || inputs.operation == 'bootstrap') && secrets.RAVRADAR_R2_ACCESS_KEY_ID || '' }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ (inputs.operation == 'capture' || inputs.operation == 'discover' || inputs.operation == 'bootstrap') && secrets.RAVRADAR_R2_SECRET_ACCESS_KEY || '' }}

      - name: ${{ steps.auto-plan.outputs.action == 'capture' && 'Capture private Supabase database' || 'Verify or rotate an existing private database backup' }}
        if: steps.admission.outputs.automatic == 'true' && steps.auto-plan.outputs.proceed == 'true'
        timeout-minutes: 26
        run: node scripts/run-autonomous-supabase-backup.mjs --execute
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.sha || inputs.expected_main }}
          SUPABASE_BACKUP_SOURCE_WEATHER_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_weather_run_id }}
          SUPABASE_BACKUP_AUTOMATION: ${{ vars.RAVRADAR_SUPABASE_BACKUP_AUTOMATION }}
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_BACKUP_RESERVE_INDEX_COMMITMENT: ${{ vars.RAVRADAR_SUPABASE_BACKUP_RESERVE_INDEX_COMMITMENT }}
          SUPABASE_BACKUP_RESERVE_RESTORE_RUN_ID: ${{ vars.RAVRADAR_SUPABASE_BACKUP_RESERVE_RESTORE_RUN_ID }}

      - name: Require the exact fixed 844 role audit before archive access
        if: inputs.operation == 'audit-fixed-844-role-grant'
        timeout-minutes: 2
        run: node scripts/run-hosted-supabase-backup.mjs --preflight
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_main }}
          SUPABASE_BACKUP_OPERATION: ${{ inputs.operation }}
          SUPABASE_BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_BACKUP_AUDIT_INDEX_ABSENT: ${{ inputs.index_sha == '' && 'true' || 'false' }}
      - name: Read only the fixed 844 archive roles
        if: inputs.operation == 'audit-fixed-844-role-grant'
        timeout-minutes: 4
        run: node scripts/run-hosted-supabase-backup.mjs --execute
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_main }}
          SUPABASE_BACKUP_OPERATION: ${{ inputs.operation }}
          SUPABASE_BACKUP_CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_BACKUP_AUDIT_INDEX_ABSENT: ${{ inputs.index_sha == '' && 'true' || 'false' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
