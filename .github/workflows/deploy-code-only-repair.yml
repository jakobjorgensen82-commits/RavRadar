          fi
          if test "${RAVRADAR_CURRENT_MEMORY_WARMUP_PHASE:-}" = 'before'; then
            env -u SUPABASE_DB_PASSWORD node "$GITHUB_WORKSPACE/scripts/current-memory-warmup-prewrite.mjs" --slot final
            supabase migration list --linked | tee "$RUNNER_TEMP/code-only-current-memory-warmup-final-plan.txt"
            supabase db push --linked --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/code-only-current-memory-warmup-final-dry-run.txt"
            node "$GITHUB_WORKSPACE/scripts/verify-current-memory-warmup-plan.mjs" \
              --phase before --migration-list "$RUNNER_TEMP/code-only-current-memory-warmup-final-plan.txt" \
              --dry-run "$RUNNER_TEMP/code-only-current-memory-warmup-final-dry-run.txt" \
              --migrations-directory "$PWD/supabase/migrations"
          fi
          supabase db push --linked --skip-vault

      - name: Read back migration and database binding
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
