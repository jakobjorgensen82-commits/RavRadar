            supabase db push --linked --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/code-only-account-final-dry-run.txt"
            node "$GITHUB_WORKSPACE/scripts/verify-code-only-migration-plan.mjs" \
              --account-assistant-prewrite-plan --require-prewrite-gate \
              --expected-pending-version 20261013210000 \
              --migration-list "$RUNNER_TEMP/code-only-account-final-plan.txt" \
              --dry-run "$RUNNER_TEMP/code-only-account-final-dry-run.txt" \
              --migrations-directory "$PWD/supabase/migrations"
          fi
          if test "${RAVRADAR_STATISTICS_REVISION_PHASE:-}" = "before"; then
            supabase migration list --linked | tee "$RUNNER_TEMP/code-only-statistics-final-plan.txt"
            supabase db push --linked --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/code-only-statistics-final-dry-run.txt"
            node "$GITHUB_WORKSPACE/scripts/verify-statistics-preference-revision-plan.mjs" \
              --phase before --migration-list "$RUNNER_TEMP/code-only-statistics-final-plan.txt" \
              --dry-run "$RUNNER_TEMP/code-only-statistics-final-dry-run.txt" \
