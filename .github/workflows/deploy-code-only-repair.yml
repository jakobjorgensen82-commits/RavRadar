          echo "RAVRADAR_USERDATA_PREWRITE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Reverify the same account/assistant originals before binding installation
        if: env.RAVRADAR_ACCOUNT_ASSISTANT_PREWRITE_REQUIRED == 'true'
        shell: bash
        env:
