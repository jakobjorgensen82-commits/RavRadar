            --predecessor-descriptor "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-source-head "$(jq -er '.sourceHead' "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json")" \
            --report .geometry-v2-work/post-cutover-private-runtime-migration.json
          echo "RAVRADAR_ACCOUNT_ASSISTANT_PREWRITE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Authenticate native0600 B/S and compare every prepared successor byte before new binding
        if: env.RAVRADAR_CURRENT_MEMORY_WARMUP_METADATA_ONLY == 'true' && steps.migrated-private-install.outcome == 'success'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/current-memory-warmup-prewrite.mjs --slot proof

      - name: Select the sole pending current-memory warmup successor after actual original and no-loss proof
        if: env.RAVRADAR_CURRENT_MEMORY_WARMUP_UPGRADE_OPT_IN == 'true'
        run: >-
          node scripts/verify-current-memory-warmup-plan.mjs --select
          --migration-list "$RUNNER_TEMP/code-only-migrations-before.txt"

      - name: Verify unchanged current originals and schema1 before statistics revision
        if: env.RAVRADAR_STATISTICS_REVISION_PHASE == 'before'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "${{ steps.current-private-install.outcome }}" = "success"
          test "${{ steps.migrated-private-install.outcome }}" != "success"
          jq -e '.mode == "code-only-reuse" and .providerRequestsPerformed == false and .weatherValuesChanged == false and .scoresChanged == false and .geometryChanged == false and .privatePayloadIncluded == false and .zoneCount == 210 and .coastalPartCount == 673' .geometry-v2-work/code-only-public-runtime-reuse.json
          node scripts/verify-account-assistant-schema.mjs
          echo "RAVRADAR_STATISTICS_REVISION_PREWRITE_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Dry-run and require only the latest exact integrated migration
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase migration list --linked | tee "$RUNNER_TEMP/code-only-migrations-plan.txt"
          supabase db push --linked --dry-run --skip-vault 2>&1 | tee "$RUNNER_TEMP/code-only-migrations-dry-run.txt"
          cd "$GITHUB_WORKSPACE"
          account_plan_args=()
          if test "${RAVRADAR_ACCOUNT_ASSISTANT_PREWRITE_REQUIRED:-false}" = "true"; then
