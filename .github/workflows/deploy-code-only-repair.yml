name: Deploy RavRadar code-only repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv DEPLOY-CODE-ONLY-REPAIR eller DEPLOY-SAVED-WEATHER-REPAIR"
        required: true
        type: string
      upgrade_existing_owner_export:
        description: "Opgrader kun eksisterende ejer-turlager efter installeret current050000"
        required: false
        default: false
        type: boolean
      upgrade_account_assistant:
        description: "Installer kun den eksakte account/assistant-successor efter installeret 200000"
        required: false
        default: false
        type: boolean
      upgrade_statistics_preference_revision:
        description: "Installer kun den eksakte statistikpræference-revision efter verificeret current220"
        required: false
        default: false
        type: boolean
      upgrade_current_memory_warmup:
        description: "Installer kun den nye opvarmningsrettelse efter faktisk native0600 og230"
        required: false
        default: false
        type: boolean
      publish_newest_saved_weather:
        description: "Fortsæt den nyeste centralt gemte og allerede validerede vejrpakke uden providerkald"
        required: false
        default: false
        type: boolean
      recover_public_run_id:
        description: "Eksakt tidligere Pages-run hvis offentlig artifact blev uploadet før aktivering fejlede"
        required: false
        default: ""
        type: string
      recover_public_run_attempt:
        description: "Attempt for det eksakte Pages-run"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

# Code-only-rettelser og normal vejrhentning deler produktionslåsen, men
# deler aldrig providertrin eller providercredentials.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate manual authority before any recovery writes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the exact dispatch purpose on main
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SAVED_WEATHER: ${{ inputs.publish_newest_saved_weather }}
          RECOVER_PUBLIC_RUN_ID: ${{ inputs.recover_public_run_id }}
          RECOVER_PUBLIC_RUN_ATTEMPT: ${{ inputs.recover_public_run_attempt }}
          UPGRADE_EXISTING_OWNER_EXPORT: ${{ inputs.upgrade_existing_owner_export }}
          UPGRADE_ACCOUNT_ASSISTANT: ${{ inputs.upgrade_account_assistant }}
          UPGRADE_STATISTICS_REVISION: ${{ inputs.upgrade_statistics_preference_revision }}
          UPGRADE_CURRENT_MEMORY_WARMUP: ${{ inputs.upgrade_current_memory_warmup }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          if test "$UPGRADE_EXISTING_OWNER_EXPORT" = "true"; then
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
            test "$SAVED_WEATHER" != "true"
            test -z "$RECOVER_PUBLIC_RUN_ID"
          fi
          if test "$UPGRADE_ACCOUNT_ASSISTANT" = "true"; then
            test "$UPGRADE_EXISTING_OWNER_EXPORT" != "true"
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
            test "$SAVED_WEATHER" != "true"
            test -z "$RECOVER_PUBLIC_RUN_ID"
          fi
          if test "$UPGRADE_STATISTICS_REVISION" = "true"; then
            test "$UPGRADE_EXISTING_OWNER_EXPORT" != "true"
            test "$UPGRADE_ACCOUNT_ASSISTANT" != "true"
            test "$GITHUB_RUN_ATTEMPT" = "1"
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
            test "$SAVED_WEATHER" != "true"
            test -z "$RECOVER_PUBLIC_RUN_ID"
          fi
          if test "$UPGRADE_CURRENT_MEMORY_WARMUP" = "true"; then
            test "$UPGRADE_EXISTING_OWNER_EXPORT" != "true"
            test "$UPGRADE_ACCOUNT_ASSISTANT" != "true"
            test "$UPGRADE_STATISTICS_REVISION" != "true"
            test "$GITHUB_RUN_ATTEMPT" = "1"
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
            test "$SAVED_WEATHER" != "true"
            test -z "$RECOVER_PUBLIC_RUN_ID"
          fi
          if test "$SAVED_WEATHER" = "true"; then
            test "$CONFIRMATION" = "DEPLOY-SAVED-WEATHER-REPAIR"
          else
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
          fi
          if test -n "$RECOVER_PUBLIC_RUN_ID"; then
            test "$SAVED_WEATHER" = "true"
            test "$CONFIRMATION" = "DEPLOY-SAVED-WEATHER-REPAIR"
            [[ "$RECOVER_PUBLIC_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$RECOVER_PUBLIC_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]
          else
            test "$RECOVER_PUBLIC_RUN_ATTEMPT" = "1"
          fi

  operational-recovery-gate:
    name: Finish an interrupted generation before new work
    needs: validate-authority
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-operational-reentry.yml
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  build-code-only:
    needs: operational-recovery-gate
    concurrency:
      # Current source deploys the two transitively rebound trip Edges too.
      group: ravradar-trip-storage-production
      cancel-in-progress: false
    name: Reuse exact runtime and build code-only artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      active_deployment_id: ${{ steps.public-source.outputs.deployment_id }}
      central_version: ${{ steps.operational-model.outputs.central_version }}
      integrated_implementation_closure_sha256: ${{ steps.integrated-implementation.outputs.closure_sha256 }}
      operational_action: ${{ steps.operational-action.outputs.action }}
      source_repair_id: ${{ steps.public-source.outputs.repair_id }}
    env:
      # Rebuilding the public 210/673/118 runtime temporarily retains the
      # restored private conditions, the current public comparison oracle and
      # the newly generated projection.  The normal production builder already
      # uses this bounded heap for the same integrated runtime shape.  Keep it
      # at job scope so every later Node sealing/bundle step inherits the same
      # capacity instead of moving the 4 GiB failure one step downstream.
      NODE_OPTIONS: --max-old-space-size=8192
      RAVRADAR_PRIVATE_RUNTIME_ROOT: /tmp/ravradar-private-production-runtime
      RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND: ${{ vars.RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND || 'supabase' }}
      RAVRADAR_PRIVATE_RUNTIME_BUNDLE: /tmp/ravradar-private-production-runtime/bundle
      RAVRADAR_PRIVATE_RUNTIME_RESTORE: /tmp/ravradar-private-production-runtime/restored
      # The predecessor is resolved from the live protected-runtime descriptor
      # during the run.  Keep the workspace path neutral so a historical source
      # SHA can never leak into the workflow environment as a stale binding.
      RAVRADAR_PREDECESSOR_SOURCE_ROOT: /tmp/ravradar-private-production-runtime/source-predecessor
      RAVRADAR_PREDECESSOR_PRIVATE_ROOT: /tmp/ravradar-private-production-runtime/predecessor
      RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE: /tmp/ravradar-private-production-runtime/predecessor/bundle
      RAVRADAR_PREDECESSOR_PRIVATE_RESTORE: /tmp/ravradar-private-production-runtime/predecessor/restored
      RAVRADAR_MIGRATED_PRIVATE_RUNTIME_RESTORE: /tmp/ravradar-private-production-runtime/migrated
      RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT: /tmp/ravradar-code-only-public-snapshot
      RAVRADAR_MISSED_CUTOVER_RECOVERY: /tmp/ravradar-missed-cutover-recovery
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-model
      RAVRADAR_OPERATIONAL_HANDOFF: /tmp/ravradar-operational-handoff
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      RAVRADAR_USERDATA_UPGRADE_OPT_IN: ${{ inputs.upgrade_existing_owner_export == true && 'true' || 'false' }}
      RAVRADAR_ACCOUNT_ASSISTANT_UPGRADE_OPT_IN: ${{ inputs.upgrade_account_assistant == true && 'true' || 'false' }}
      RAVRADAR_STATISTICS_REVISION_UPGRADE_OPT_IN: ${{ inputs.upgrade_statistics_preference_revision == true && 'true' || 'false' }}
      RAVRADAR_STATISTICS_REVISION_CONFIRMATION: ${{ inputs.confirmation }}
      RAVRADAR_STATISTICS_REVISION_SAVED_WEATHER: ${{ inputs.publish_newest_saved_weather }}
      RAVRADAR_STATISTICS_REVISION_RECOVERY_RUN_ID: ${{ inputs.recover_public_run_id }}
      RAVRADAR_CURRENT_MEMORY_WARMUP_UPGRADE_OPT_IN: ${{ inputs.upgrade_current_memory_warmup == true && 'true' || 'false' }}
      RAVRADAR_CURRENT_MEMORY_WARMUP_CONFIRMATION: ${{ inputs.confirmation }}
      RAVRADAR_CURRENT_MEMORY_WARMUP_SAVED_WEATHER: ${{ inputs.publish_newest_saved_weather }}
      RAVRADAR_CURRENT_MEMORY_WARMUP_RECOVERY_RUN_ID: ${{ inputs.recover_public_run_id }}
      RAVRADAR_CURRENT_MEMORY_WARMUP_RECOVERY_GATE_RESULT: ${{ needs.operational-recovery-gate.result }}
      # This job holds both unchanged production/trip-storage writer locks.
      RAVRADAR_CURRENT_MEMORY_WARMUP_WRITER_ACTIVE: 'false'
      RAVRADAR_CURRENT_MEMORY_WARMUP_METADATA_ONLY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate exact manual code-only authority and main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if test "${{ inputs.publish_newest_saved_weather }}" = "true"; then
            test "$CONFIRMATION" = "DEPLOY-SAVED-WEATHER-REPAIR"
          else
            test "$CONFIRMATION" = "DEPLOY-CODE-ONLY-REPAIR"
          fi
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The saved private weather-component pack is revalidated during
      # restore.  That credential-free check imports the same Copernicus
      # reader stack as the normal weather workflow, even though it makes no
      # provider calls.  Keep the code-only recovery path self-contained so a
      # valid sealed pack is not rejected merely because Python dependencies
      # were absent on this fresh runner.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Install private weather-component verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Seal exact integrated implementation identity
        id: integrated-implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          node scripts/seal-ravscore-public-browser-closure.mjs \
            --root . \
            --output "$RAVRADAR_OPERATIONAL_WORK/integrated-public-closure.json" \
            --model integrated \
            --identity-output "$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json"
          closure_sha256="$(jq -er '.implementationClosureSha256 | select(test("^[a-f0-9]{64}$"))' "$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json")"
          echo "closure_sha256=$closure_sha256" >> "$GITHUB_OUTPUT"

      - name: Reuse exact successful pull-request source proof
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refuse duplicate or missing source validation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.source-proof.outputs.required }}" = "false"
          echo "Exact source tree already passed the PR source gate; it is not run again."

      - name: Preserve the protected 11Z and 15Z pair for the next normal weather run
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/protected-private-production-runtime.mjs --describe-current \
            --output "$RUNNER_TEMP/code-only-current-private-source.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { isLatestUnpairedWeatherGeneration } from './scripts/protected-private-production-runtime.mjs';
          import { buildCurrentGridSamplingOriginalRestoreExpectation }
            from './scripts/lib/bounded-conditions-predecessor-transition.mjs';
          const source = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/code-only-current-private-source.json', 'utf8'));
          if (isLatestUnpairedWeatherGeneration(source)) {
            throw new Error('The sealed 11Z/15Z weather pair must be recovered by the next normal weather run; use the binding-only workflow before it, not code-only deployment');
          }
          const currentGridOriginal = await buildCurrentGridSamplingOriginalRestoreExpectation({
            sourceDescription: source,
            targetReferenceAt: source.productionReferenceAt,
          });
          if (currentGridOriginal?.currentGridSamplingTransition
            === 'EXACT_CURRENT_GRID_SAMPLING_ORIGINAL_RESTORE_V1') {
            throw new Error('Current-grid source succession requires the next normal NEW-hour weather run; code-only deployment cannot install or publish its original archive bridge');
          }
          NODE

      - name: Download exact currently public code-only source
        id: public-snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT"
          mkdir -p "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT" .cache .geometry-v2-work "$RAVRADAR_OPERATIONAL_WORK"
          curl --version
          node scripts/acquire-code-only-public-snapshot.mjs acquire
          target_reference="$(jq -er '.productionReferenceAt | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00(.000)?Z$"))' "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json")"
          echo "target_reference=$target_reference" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECOVER_PUBLIC_RUN_ID: ${{ inputs.recover_public_run_id }}

      - name: Download exact public maintenance handoff
        if: inputs.recover_public_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ravscore-operational-handoff-${{ inputs.recover_public_run_id }}-${{ inputs.recover_public_run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/public-recovery-source
          run-id: ${{ inputs.recover_public_run_id }}
          github-token: ${{ github.token }}

      - name: Detect only the exact missed initial cutover state
        id: missed-cutover
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ravscore-operational-activation.mjs read --output "$RAVRADAR_OPERATIONAL_WORK/before-missed-cutover-recovery.json"
          current="$RAVRADAR_OPERATIONAL_WORK/before-missed-cutover-recovery.json"
          public_manifest="$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json"
          if test "$(jq -r '.model' "$current")" = "legacy-candidate-g" && test "$(jq -r '.status' "$current")" = "CANDIDATE_G_ACTIVE" && test "$(jq -r '.centralVersion' "$current")" = "0" && test "$(jq -r '.initialCutoverRequired' "$current")" = "true" && test "$(jq -r '.legacySourceRequired' "$current")" = "true"; then
            node --input-type=module -e "import { LATEST_REQUIRED_CUTOVER_MIGRATION as m } from './scripts/integrated-cutover-readiness.mjs'; if (m.version === '20261010120000') throw new Error('Assistant successor cannot recover a historical cutover');"
            manifest_sha256="$(TARGET_MANIFEST="$public_manifest" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
            test "$manifest_sha256" = "4254bdb2ba157bbde3847c8d621ac7a3182e14296a3ae99aa40a2ac7f6f8211e"
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            test "$(jq -r '.model' "$current")" = "integrated"
            test "$(jq -r '.status' "$current")" = "INTEGRATED_ACTIVE"
            test "$(jq -r '.initialCutoverRequired' "$current")" = "false"
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Download exact privacy-safe evidence from the missed cutover
        if: steps.missed-cutover.outputs.required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ravscore-operational-recovery-34877443841-1
          path: ${{ env.RAVRADAR_MISSED_CUTOVER_RECOVERY }}
          run-id: 34877443841
          github-token: ${{ github.token }}

      - name: Freshly verify the exact historical integrated artifact is still public
        if: steps.missed-cutover.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for evidence in source-manifest.json source-verification.json legacy-source-attestation.json public-audit.json integrated-readiness.json target-binding.json target-contract.js target-bundle.generated.js target-public-closure.json pages-artifact-seal.json; do
            test -f "$RAVRADAR_MISSED_CUTOVER_RECOVERY/$evidence"
          done
          node scripts/verify-ravscore-operational-pages-deployment.mjs --base-url "$RAVRADAR_PUBLIC_BASE_URL" --source-head fa418f43bbd070c446ed19b6587541b93af89599 --model integrated --manifest "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json" --binding "$RAVRADAR_MISSED_CUTOVER_RECOVERY/target-binding.json" --contract "$RAVRADAR_MISSED_CUTOVER_RECOVERY/target-contract.js" --bundle "$RAVRADAR_MISSED_CUTOVER_RECOVERY/target-bundle.generated.js" --public-closure "$RAVRADAR_MISSED_CUTOVER_RECOVERY/target-public-closure.json" --observation-nonce "missed-cutover-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output "$RAVRADAR_OPERATIONAL_WORK/missed-cutover-public-verification.json"

      - name: Reconfirm current main immediately before missed-cutover recovery
        if: steps.missed-cutover.outputs.required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$current_main" = "$EXPECTED_HEAD_SHA"

      - name: Atomically record the exact already-public historical cutover
        if: steps.missed-cutover.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ravscore-operational-activation.mjs recover-missed-initial-cutover --source-manifest "$RAVRADAR_MISSED_CUTOVER_RECOVERY/source-manifest.json" --source-attestation "$RAVRADAR_MISSED_CUTOVER_RECOVERY/legacy-source-attestation.json" --source-verification "$RAVRADAR_MISSED_CUTOVER_RECOVERY/source-verification.json" --manifest "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json" --audit "$RAVRADAR_MISSED_CUTOVER_RECOVERY/public-audit.json" --readiness "$RAVRADAR_MISSED_CUTOVER_RECOVERY/integrated-readiness.json" --binding "$RAVRADAR_MISSED_CUTOVER_RECOVERY/target-binding.json" --verification "$RAVRADAR_OPERATIONAL_WORK/missed-cutover-public-verification.json" --pages-artifact-seal "$RAVRADAR_MISSED_CUTOVER_RECOVERY/pages-artifact-seal.json" --output "$RAVRADAR_OPERATIONAL_WORK/missed-cutover-recovered.json"
        env:
          RAVRADAR_MISSED_INITIAL_CUTOVER_RECOVERY_CONFIRMATION: RECOVER-MISSED-INTEGRATED-CUTOVER-34877443841
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Read exact centrally active operational RavScore
        id: operational-model
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ravscore-operational-activation.mjs read --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          node scripts/acquire-code-only-public-snapshot.mjs assert-current
          for field in model status bindingCurrent centralVersion initialCutoverRequired legacySourceRequired sourceHead activeImplementationClosureSha256 deploymentId; do
            output_name="$(printf '%s' "$field" | sed -E 's/([A-Z])/_\L\1/g')"
            echo "$output_name=$(jq -r --arg field "$field" 'if has($field) then .[$field] else "" end' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Resolve the actual currently public source
        id: public-source
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${{ inputs.recover_public_run_id }}"; then
            test -f "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/handoff.json"
            test -f "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/pages-artifact-seal.json"
            test -f "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/target-binding.json"
            git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
            source_head="$(jq -er '.headSha' "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/pages-artifact-seal.json")"
            git merge-base --is-ancestor "$source_head" "$GITHUB_SHA"
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" node scripts/resolve-code-only-public-source.mjs \
              --current "$RAVRADAR_OPERATIONAL_WORK/current.json" \
              --manifest "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json" \
              --handoff "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/handoff.json" \
              --seal "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/pages-artifact-seal.json" \
              --binding "$RAVRADAR_OPERATIONAL_WORK/public-recovery-source/target-binding.json" \
              --expected-run-id "${{ inputs.recover_public_run_id }}" \
              --expected-run-attempt "${{ inputs.recover_public_run_attempt }}" \
              --output "$RAVRADAR_OPERATIONAL_WORK/public-source.json"
          else
            node scripts/resolve-code-only-public-source.mjs \
              --current "$RAVRADAR_OPERATIONAL_WORK/current.json" \
              --manifest "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT/manifest.json" \
              --output "$RAVRADAR_OPERATIONAL_WORK/public-source.json"
          fi
          for field in deploymentId implementationClosureSha256 repairId sourceHead publicManifestSha256; do
            output_name="$(printf '%s' "$field" | sed -E 's/([A-Z])/_\L\1/g')"
            echo "$output_name=$(jq -r --arg field "$field" 'if has($field) and .[$field] != null then .[$field] else "" end' "$RAVRADAR_OPERATIONAL_WORK/public-source.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Resolve exact known public source evidence coordinates
        id: source-repair-policy
        if: steps.public-source.outputs.repair_id != ''
        shell: bash
        env:
          SOURCE_REPAIR_ID: ${{ steps.public-source.outputs.repair_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { RAVSCORE_KNOWN_PUBLIC_SOURCE_REPAIR_POLICY as policy } from './scripts/lib/ravscore-known-public-source-repair.mjs';
          if (process.env.SOURCE_REPAIR_ID !== policy.id) {
            throw new Error('Unknown public source repair evidence request');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `run_id=${policy.sourceRunId}\nrun_attempt=${policy.sourceRunAttempt}\nartifact_name=ravscore-operational-handoff-${policy.sourceRunId}-${policy.sourceRunAttempt}\n`);
          NODE

      - name: Download exact known public source audit evidence
        if: steps.public-source.outputs.repair_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.source-repair-policy.outputs.artifact_name }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/source-repair-evidence
          run-id: ${{ steps.source-repair-policy.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Resolve only post-cutover integrated maintenance
        id: operational-action
        shell: bash
        env:
          ACTIVE_MODEL: ${{ steps.operational-model.outputs.model }}
          ACTIVE_STATUS: ${{ steps.operational-model.outputs.status }}
          BINDING_CURRENT: ${{ steps.operational-model.outputs.binding_current }}
          INITIAL_CUTOVER_REQUIRED: ${{ steps.operational-model.outputs.initial_cutover_required }}
          LEGACY_SOURCE_REQUIRED: ${{ steps.operational-model.outputs.legacy_source_required }}
          ACTIVE_SOURCE_HEAD: ${{ steps.operational-model.outputs.source_head }}
          PUBLIC_SOURCE_DEPLOYMENT_ID: ${{ steps.public-source.outputs.deployment_id }}
          PUBLIC_SOURCE_CLOSURE_SHA256: ${{ steps.public-source.outputs.implementation_closure_sha256 }}
        run: |
          set -euo pipefail
          test "$ACTIVE_MODEL" = "integrated"
          test "$ACTIVE_STATUS" = "INTEGRATED_ACTIVE"
          test "$INITIAL_CUTOVER_REQUIRED" = "false"
          test "$LEGACY_SOURCE_REQUIRED" = "false"
          case "$BINDING_CURRENT" in
            true) action=integrated ;;
            false)
              [[ "$ACTIVE_SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
              [[ "$PUBLIC_SOURCE_DEPLOYMENT_ID" =~ ^pages-[1-9][0-9]*-[1-9][0-9]*$ ]]
              [[ "$PUBLIC_SOURCE_CLOSURE_SHA256" =~ ^[a-f0-9]{64}$ ]]
              action=integrated-historical-maintenance
              ;;
            *) echo "Unknown integrated binding state." >&2; exit 1 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0

      - name: Prepare isolated post-cutover migration view
        id: migration-view
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        env:
          RAVRADAR_EXPECTED_SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          migration_workdir="$(mktemp -d)"
          echo "workdir=$migration_workdir" >> "$GITHUB_OUTPUT"
          node scripts/integrated-cutover-readiness.mjs assert-source \
            --public-implementation-closure-sha256 \
            "${{ steps.integrated-implementation.outputs.closure_sha256 }}"
          node scripts/integrated-cutover-readiness.mjs prepare-workdir \
            --statistics-preference-revision-source --output "$migration_workdir"

      - name: Read linked migration history without changing Supabase
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          cd "${{ steps.migration-view.outputs.workdir }}"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked | tee "$RUNNER_TEMP/code-only-migrations-before.txt"

      - name: Require originals before the pending assistant binding
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { LATEST_REQUIRED_CUTOVER_MIGRATION as latest, TRIP_BINDING_POLICY_SOURCE_MIGRATION as userdataPolicy, parseSupabaseMigrationList } from './scripts/integrated-cutover-readiness.mjs';
          const rows = parseSupabaseMigrationList(fs.readFileSync(`${process.env.RUNNER_TEMP}/code-only-migrations-before.txt`, 'utf8'));
          const required = latest.version === '20261010120000' && !rows.some(row => row.remote === latest.version);
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_ASSISTANT_PREWRITE_REQUIRED=${required}\n`);
          const userdataPending = !rows.some(row => row.remote === userdataPolicy.version);
          const optedIn = process.env.RAVRADAR_USERDATA_UPGRADE_OPT_IN === 'true';
          if (userdataPending && !optedIn) throw new Error('Pending userdata binding requires explicit existing-owner-export opt-in');
          if (optedIn && (latest.version !== '20261010130000' || !userdataPending
              || !rows.some(row => row.remote === '20261005000000')
              || rows.some(row => row.remote > '20261005000000'))) {
            throw new Error('Userdata upgrade requires installed current050000 and sole pending130000; no intermediary or automatic replay');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_USERDATA_PREWRITE_REQUIRED=${optedIn && userdataPending}\n`);
          // A later checkpoint-only migration must not suppress the installed
          // userdata storage readback or replay the one-time userdata upgrade.
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_USERDATA_FINAL_REQUIRED=${userdataPolicy.version === '20261010130000'}\n`);
          // This implementation-only repair must never select the normal
          // continuation-repair/recomputation branch for archived weather.
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_CHECKPOINT_CAS_METADATA_ONLY=${latest.version === '20261012200000'}\n`);
          const accountCurrent = latest.version === '20261013210000';
          const accountPending = accountCurrent && !rows.some(row => row.remote === latest.version);
          const accountOptIn = process.env.RAVRADAR_ACCOUNT_ASSISTANT_UPGRADE_OPT_IN === 'true';
          if (accountPending && !accountOptIn) throw new Error('Pending account/assistant successor requires its named opt-in');
          if (accountOptIn && (!accountPending || optedIn
              || !rows.some(row => row.remote === '20261012200000')
              || rows.some(row => row.remote > '20261012200000'))) {
            throw new Error('Account/assistant upgrade requires installed200000 and sole pending20261013210000; no replay');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_ACCOUNT_ASSISTANT_PREWRITE_REQUIRED=${accountOptIn && accountPending}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_ACCOUNT_ASSISTANT_METADATA_ONLY=${accountCurrent}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RAVRADAR_ACCOUNT_ASSISTANT_FINAL_REQUIRED=${accountCurrent}\n`);
          NODE

      - name: Select only an already-installed current-memory warmup successor before private work
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        shell: bash
        run: |
          set -euo pipefail
          if test "$RAVRADAR_CURRENT_MEMORY_WARMUP_UPGRADE_OPT_IN" = 'false'; then
            node scripts/verify-current-memory-warmup-plan.mjs --select \
              --migration-list "$RUNNER_TEMP/code-only-migrations-before.txt"
          else
            # Pending selection stays forbidden until actual B/S/no-loss proof.
            test "$RAVRADAR_CURRENT_MEMORY_WARMUP_UPGRADE_OPT_IN" = 'true'
          fi

      - name: Hydrate only already-applied migration identities
        if: steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance'
        run: >-
          node scripts/integrated-cutover-readiness.mjs hydrate-history
          --workdir "${{ steps.migration-view.outputs.workdir }}"
          --migration-list "$RUNNER_TEMP/code-only-migrations-before.txt"

      - name: Build current private-runtime restore expectation
        if: inputs.publish_newest_saved_weather != true
        shell: bash
        env:
          PUBLIC_REFERENCE: ${{ steps.public-snapshot.outputs.target_reference }}
        run: |
          set -euo pipefail
          echo "RAVRADAR_PRODUCTION_TARGET_HOUR=$PUBLIC_REFERENCE" >> "$GITHUB_ENV"
          node scripts/private-production-runtime-workflow.mjs expected --repository-root "$GITHUB_WORKSPACE" --target-reference "$PUBLIC_REFERENCE" --output .cache/private-production-runtime-expected.json

      - name: Describe newest protected runtime for saved-weather continuation
        run: >-
          node scripts/protected-private-production-runtime.mjs --describe-current
          --output "$RAVRADAR_OPERATIONAL_WORK/current-private-runtime-source.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Bind saved-weather continuation to exact newer runtime
        if: inputs.publish_newest_saved_weather == true
        shell: bash
        env:
          PUBLIC_REFERENCE: ${{ steps.public-snapshot.outputs.target_reference }}
          RECOVER_PUBLIC_RUN_ID: ${{ inputs.recover_public_run_id }}
        run: |
          set -euo pipefail
          case "${{ steps.operational-action.outputs.action }}" in
            integrated|integrated-historical-maintenance) ;;
            *) echo "Saved-weather continuation requires active integrated maintenance." >&2; exit 1 ;;
          esac
          test -z "${{ steps.public-source.outputs.repair_id }}"
          descriptor="$RAVRADAR_OPERATIONAL_WORK/current-private-runtime-source.json"
          # The protected-runtime descriptor owns this identity.  Preserve its
          # canonical UTC serialization byte-for-byte; downstream private
          # runtime validation intentionally rejects equivalent rewrites.
          target_reference="$(jq -er '.productionReferenceAt | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00[.]000Z$"))' "$descriptor")"
          source_head="$(jq -er '.sourceHead | select(type == "string" and test("^[a-f0-9]{40}$"))' "$descriptor")"
          SAVED_REFERENCE="$target_reference" RECOVER_PUBLIC_RUN_ID="$RECOVER_PUBLIC_RUN_ID" node --input-type=module <<'NODE'
          const publicMs = Date.parse(process.env.PUBLIC_REFERENCE);
          const savedMs = Date.parse(process.env.SAVED_REFERENCE);
          const exactFailedMaintenanceRecovery = /^[1-9][0-9]{0,19}$/.test(
            process.env.RECOVER_PUBLIC_RUN_ID ?? '',
          );
          if (!Number.isFinite(publicMs) || !Number.isFinite(savedMs)
            || savedMs < publicMs
            || (savedMs === publicMs && !exactFailedMaintenanceRecovery)) {
            throw new Error(
              exactFailedMaintenanceRecovery
                ? 'Saved protected runtime is older than the exact public recovery target'
                : 'Saved protected runtime does not strictly advance the public production hour',
            );
          }
          NODE
          git merge-base --is-ancestor "$source_head" "$GITHUB_SHA"
          freshness_output="$RUNNER_TEMP/saved-weather-freshness.txt"
          : > "$freshness_output"
          node scripts/check-production-target-freshness.mjs --target "$target_reference" --maximum-age-minutes 240 --github-output "$freshness_output"
          # Target age is a quality warning, not an availability gate.  The
          # classifier has already failed closed above for a future or expired
          # horizon; accept both of its horizon-valid outcomes here.
          grep -Eq '^status=(FRESH|STALE_TARGET_VALID)$' "$freshness_output"
          echo "RAVRADAR_PRODUCTION_TARGET_HOUR=$target_reference" >> "$GITHUB_ENV"
          node scripts/private-production-runtime-workflow.mjs expected --repository-root "$GITHUB_WORKSPACE" --target-reference "$target_reference" --output .cache/private-production-runtime-expected.json

      - name: Prepare exact original binding for owner current-domain release
        id: owner-current-original
        run: >-
          node scripts/prepare-historical-wave-predecessor-restore.mjs
          --source-description "$RAVRADAR_OPERATIONAL_WORK/current-private-runtime-source.json"
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Try newest current-compatible private runtime
        id: current-private-protected-restore
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          restore_root="$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          restore_bundle="$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          restore_expected=.cache/private-production-runtime-expected.json
          if test "${{ steps.owner-current-original.outputs.transition_kind }}" = "owner-current-domain-original"; then
            restore_root="$RAVRADAR_PREDECESSOR_PRIVATE_ROOT"
            restore_bundle="$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE"
            restore_expected="$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"
          fi
          status=1
          for attempt in 1 2 3; do
            rm -rf "$restore_bundle"
            if node scripts/protected-private-production-runtime.mjs --restore \
                --private-root "$restore_root" \
                --bundle "$restore_bundle" \
                --repository-root "$GITHUB_WORKSPACE" \
                --expected "$restore_expected"; then
              exit 0
            else
              status=$?
            fi
            echo "Protected current restore attempt $attempt of 3 failed."
            if test "$attempt" -lt 3; then sleep 5; fi
          done
          exit "$status"
        env:
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Try verifying current-compatible private runtime
        id: current-private-bundle-restore
        if: steps.current-private-protected-restore.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          restore_root="$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          restore_bundle="$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          restore_expected=.cache/private-production-runtime-expected.json
          restore_output="$RAVRADAR_PRIVATE_RUNTIME_RESTORE"
          if test "${{ steps.owner-current-original.outputs.transition_kind }}" = "owner-current-domain-original"; then
            restore_root="$RAVRADAR_PREDECESSOR_PRIVATE_ROOT"
            restore_bundle="$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE"
            restore_expected="$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"
            restore_output="$RAVRADAR_PREDECESSOR_PRIVATE_RESTORE"
          fi
          node scripts/private-production-runtime-bundle.mjs restore \
            --private-root "$restore_root" --bundle "$restore_bundle" \
            --expected "$restore_expected" --output "$restore_output"

      - name: Try installing current-compatible private runtime
        id: current-private-install
        if: steps.current-private-bundle-restore.outcome == 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        continue-on-error: true
        run: >-
          node scripts/private-production-runtime-workflow.mjs install
          --restored "$RAVRADAR_PRIVATE_RUNTIME_RESTORE"
          --repository-root "$GITHUB_WORKSPACE"

      - name: Prove the current-compatible runtime is no longer client-readable
        if: steps.current-private-install.outcome == 'success'
        run: >-
          node scripts/protected-private-production-runtime.mjs --audit-anon
        env:
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Require authenticated exact original before owner binding migration
        if: steps.owner-current-original.outputs.transition_kind == 'owner-current-domain-original'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.current-private-protected-restore.outcome }}" = "success"
          test "${{ steps.current-private-bundle-restore.outcome }}" = "success"

      - name: Describe exact target private runtime source for bounded migration
        if: steps.current-private-install.outcome != 'success'
        run: >-
          node scripts/protected-private-production-runtime.mjs --describe-target
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare exact predecessor source for bounded binding migration
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        shell: bash
        run: |
          set -euo pipefail
          predecessor="$(jq -er '.sourceHead | select(type == "string" and test("^[a-f0-9]{40}$"))' "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json")"
          case "${{ steps.operational-action.outputs.action }}" in
            integrated|integrated-historical-maintenance) ;;
            *) echo "Private runtime contract rebind requires active integrated maintenance." >&2; exit 1 ;;
          esac
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$predecessor...$GITHUB_SHA" --jq '.status')" = "ahead"
          git fetch --no-tags --depth=1 origin "$predecessor"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$predecessor"
          test ! -e "$RAVRADAR_PREDECESSOR_SOURCE_ROOT"
          mkdir -p "$RAVRADAR_PREDECESSOR_SOURCE_ROOT"
          git archive "$predecessor" | tar -x -C "$RAVRADAR_PREDECESSOR_SOURCE_ROOT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build exact predecessor private-runtime expectation
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        run: >-
          node "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/private-production-runtime-workflow.mjs" expected
          --repository-root "$RAVRADAR_PREDECESSOR_SOURCE_ROOT"
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"

      - name: Verify installed current050000 predecessor before userdata preparation
        if: env.RAVRADAR_USERDATA_PREWRITE_REQUIRED == 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test "${{ steps.current-private-install.outcome }}" != "success"
          test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
          (
          cd "$RAVRADAR_PREDECESSOR_SOURCE_ROOT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { LATEST_REQUIRED_CUTOVER_MIGRATION as latest } from './scripts/integrated-cutover-readiness.mjs';
          assert.equal(latest.version, '20261005000000', 'Userdata predecessor source must end at current050000');
          assert.equal(createHash('sha256').update(fs.readFileSync('supabase/migrations/20261005000000_owner_water_level_only_binding.sql')).digest('hex'),
            '6b161bc71753b52c5728c8b9a03b02d5d0955d0e42e751a3f2a51a6ea6900496', 'Userdata predecessor migration must remain immutable');
          NODE
          node scripts/integrated-cutover-readiness.mjs verify-db
          )

      - name: Install and import-check the exact predecessor restore compatibility closure
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        shell: bash
        run: |
          set -euo pipefail
          # The expectation above is deliberately sealed against the untouched
          # predecessor source first. Only then are the current, source-gated
          # restore wrapper and its complete changed helper closure copied into
          # that source tree. The predecessor model contract and bundle verifier
          # remain untouched and therefore still validate the exact old runtime.
          install -m 0644 scripts/protected-private-production-runtime.mjs \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/protected-private-production-runtime.mjs"
          install -m 0644 scripts/lib/r2-private-runtime-storage.mjs \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/lib/r2-private-runtime-storage.mjs"
          install -m 0644 scripts/lib/supabase-admin-rest.mjs \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/lib/supabase-admin-rest.mjs"
          install -m 0644 scripts/lib/private-weather-component-inventory.mjs \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/lib/private-weather-component-inventory.mjs"
          install -m 0644 scripts/lib/bounded-conditions-predecessor-transition.mjs \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/lib/bounded-conditions-predecessor-transition.mjs"
          node --input-type=module - \
            "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/protected-private-production-runtime.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';
          const target = process.argv[2];
          if (!target) throw new Error('Predecessor restore import target is missing');
          await import(`${pathToFileURL(target).href}?compatibility-closure=1`);
          NODE

      - name: Prove the saved predecessor runtime is no longer client-readable
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        run: >-
          node "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/protected-private-production-runtime.mjs"
          --audit-anon
        env:
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Restore exact predecessor private runtime
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        shell: bash
        run: |
          set -uo pipefail
          status=1
          for attempt in 1 2 3; do
            rm -rf "$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE"
            if node "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/protected-private-production-runtime.mjs" --restore \
                --private-root "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT" \
                --bundle "$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE" \
                --repository-root "$RAVRADAR_PREDECESSOR_SOURCE_ROOT" \
                --expected "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"; then
              exit 0
            else
              status=$?
            fi
            echo "Protected predecessor restore attempt $attempt of 3 failed."
            if test "$attempt" -lt 3; then sleep 5; fi
          done
          exit "$status"
        env:
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify and unpack exact predecessor private runtime
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        run: >-
          node "$RAVRADAR_PREDECESSOR_SOURCE_ROOT/scripts/private-production-runtime-bundle.mjs" restore
          --private-root "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT"
          --bundle "$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE"
          --expected "$RAVRADAR_PREDECESSOR_PRIVATE_ROOT/expected.json"
          --output "$RAVRADAR_PREDECESSOR_PRIVATE_RESTORE"

      - name: Select only the exact authenticated native0600 metadata bridge
        if: steps.current-private-install.outcome != 'success' && steps.owner-current-original.outputs.transition_kind != 'owner-current-domain-original'
        shell: bash
        run: node scripts/current-memory-warmup-prewrite.mjs --slot select

      - name: Rebind saved private runtime to current source without changing measurements
        if: steps.current-private-install.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          migration_args=(--predecessor-root "$RAVRADAR_PREDECESSOR_SOURCE_ROOT")
          if test "${{ steps.owner-current-original.outputs.transition_kind }}" = "owner-current-domain-original"; then
            migration_args=(--owner-current-original)
          fi
          if test "${RAVRADAR_ASSISTANT_PREWRITE_REQUIRED:-false}" = "true"; then
            test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
            migration_args+=(--metadata-only)
          fi
          if test "${RAVRADAR_USERDATA_PREWRITE_REQUIRED:-false}" = "true"; then
            test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
            migration_args+=(--metadata-only)
          fi
          if test "${RAVRADAR_CHECKPOINT_CAS_METADATA_ONLY:-false}" = "true"; then
            test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
            migration_args+=(--metadata-only)
          fi
          if test "${RAVRADAR_ACCOUNT_ASSISTANT_METADATA_ONLY:-false}" = "true"; then
            test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
            migration_args+=(--metadata-only)
          fi
          if test "${RAVRADAR_CURRENT_MEMORY_WARMUP_METADATA_ONLY:-false}" = "true"; then
            test "${{ steps.owner-current-original.outputs.transition_kind }}" != "owner-current-domain-original"
            migration_args+=(--metadata-only)
          fi
          node scripts/migrate-post-cutover-private-runtime.mjs \
            "${migration_args[@]}" \
            --source "$RAVRADAR_PREDECESSOR_PRIVATE_RESTORE" \
            --output "$RAVRADAR_MIGRATED_PRIVATE_RUNTIME_RESTORE" \
            --bundle-manifest "$RAVRADAR_PREDECESSOR_PRIVATE_BUNDLE/manifest.json" \
            --predecessor-descriptor "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-source-head "$(jq -er '.sourceHead' "$RAVRADAR_OPERATIONAL_WORK/target-private-runtime-source.json")" \
            --report .geometry-v2-work/post-cutover-private-runtime-migration.json

      - name: Install migrated saved private runtime atomically
        id: migrated-private-install
        if: steps.current-private-install.outcome != 'success'
        run: >-
          node scripts/private-production-runtime-workflow.mjs install
          --restored "$RAVRADAR_MIGRATED_PRIVATE_RUNTIME_RESTORE"
          --repository-root "$GITHUB_WORKSPACE"

      - name: Require one exact saved private runtime
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.current-private-install.outcome }}" = "success"; then
            echo "Current-compatible private runtime restored."
          else
            test "${{ steps.migrated-private-install.outcome }}" = "success"
            echo "Exact predecessor runtime migrated and installed."
          fi

      - name: Rebuild public runtime from saved state without provider acquisition
        shell: bash
        run: |
          set -euo pipefail
          mode=code-only-reuse
          if test "${{ inputs.publish_newest_saved_weather }}" = "true"; then
            mode=saved-weather-continuation
          elif test "${{ steps.migrated-private-install.outcome }}" = "success"; then
            case "$(jq -er '.transitionKind' .geometry-v2-work/post-cutover-private-runtime-migration.json)" in
              MODEL_BINDING_METADATA_ONLY|OWNER_CURRENT_ORIGINAL_ARCHIVE_BRIDGE) mode=code-only-reuse ;;
              MODEL_BINDING_MIGRATION) mode=post-cutover-last-mile-repair ;;
              CONTRACT_ONLY_REBIND) mode=post-cutover-contract-rebind ;;
              *) echo "Unknown private runtime migration kind." >&2; exit 1 ;;
            esac
          fi
          exact_public_recovery_flag=()
          if test -n "${{ inputs.recover_public_run_id }}"; then
            test "$mode" = "saved-weather-continuation"
            exact_public_recovery_flag+=(--allow-equal-saved-weather-reference)
          fi
          node scripts/prepare-code-only-public-runtime.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --snapshot-root "$RAVRADAR_CODE_ONLY_PUBLIC_SNAPSHOT" \
            --report .geometry-v2-work/code-only-public-runtime-reuse.json \
            --mode "$mode" \
            "${exact_public_recovery_flag[@]}"

      - name: Require exact code-only reuse invariants
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ inputs.publish_newest_saved_weather }}" = "true"; then
            jq -e '.providerRequestsPerformed == false and .savedProtectedRuntimeReused == true and .publicRuntimeAdvanced == true and .geometryChanged == false and .privatePayloadIncluded == false and .zoneCount == 210 and .coastalPartCount == 673' .geometry-v2-work/code-only-public-runtime-reuse.json
          elif test "${{ steps.migrated-private-install.outcome }}" = "success"; then
            transition_kind="$(jq -er '.transitionKind' .geometry-v2-work/post-cutover-private-runtime-migration.json)"
            case "$transition_kind" in
              MODEL_BINDING_METADATA_ONLY|OWNER_CURRENT_ORIGINAL_ARCHIVE_BRIDGE)
                jq -e '.mode == "code-only-reuse" and .scoresChanged == false' .geometry-v2-work/code-only-public-runtime-reuse.json
                ;;
              MODEL_BINDING_MIGRATION)
                jq -e '.mode == "post-cutover-last-mile-repair" and .scoresChanged == true and .savedProtectedRuntimeReused == true' .geometry-v2-work/code-only-public-runtime-reuse.json
                ;;
              CONTRACT_ONLY_REBIND)
                jq -e '.mode == "post-cutover-contract-rebind" and .scoresChanged == false and .savedProtectedRuntimeReused == true' .geometry-v2-work/code-only-public-runtime-reuse.json
                ;;
              *) echo "Unknown private runtime migration kind." >&2; exit 1 ;;
            esac
            jq -e '.providerRequestsPerformed == false and .publicRuntimeAdvanced == false and .weatherValuesChanged == false and .geometryChanged == false and .privatePayloadIncluded == false and .zoneCount == 210 and .coastalPartCount == 673' .geometry-v2-work/code-only-public-runtime-reuse.json
          else
            jq -e '.providerRequestsPerformed == false and .weatherValuesChanged == false and .scoresChanged == false and .geometryChanged == false and .privatePayloadIncluded == false and .zoneCount == 210 and .coastalPartCount == 673' .geometry-v2-work/code-only-public-runtime-reuse.json
          fi


      - name: Reverify the same assistant originals before binding installation
