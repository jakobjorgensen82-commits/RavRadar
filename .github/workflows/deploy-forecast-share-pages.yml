name: Deploy RavRadar forecast sharing Pages

on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: "Eksakt kvalificeret main SHA (40 tegn)"
        required: true
        type: string
      confirmation:
        description: "Skriv DEPLOY-FORECAST-SHARE-PAGES"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# Isolated delivery, same exclusive physical production queue as weather.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  deploy-share-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require fixed Pages release on exact current main
        shell: bash
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          SHARE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$SHARE_CONFIRMATION" = DEPLOY-FORECAST-SHARE-PAGES
          [[ "$EXPECTED_MAIN" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_MAIN"

      - name: Reuse exact successful source proof
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require existing proof without a duplicate source gate
        shell: bash
        run: test "${{ steps.source-proof.outputs.required }}" = false

      - name: Install pinned Pages CLI in this run-owned runtime only
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/ravradar-share-pages-wrangler-$GITHUB_RUN_ID-1"
          test ! -e "$runtime"
          npm install --prefix "$runtime" --no-save --package-lock=false --ignore-scripts wrangler@4.28.1

      - name: Create only absent fixed project and deploy Pages once
        run: node scripts/deploy-forecast-share-pages.mjs
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          SHARE_CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_REQUIRED: ${{ steps.source-proof.outputs.required }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Preserve safe Pages release outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-share-pages-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/forecast-share-pages-release.jsonl
          if-no-files-found: ignore
          retention-days: 7
