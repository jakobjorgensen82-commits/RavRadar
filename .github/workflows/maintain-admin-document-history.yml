name: Maintain RavRadar admin document history

on:
  workflow_run:
    workflows: ['Run current RavRadar weather once']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact qualified current main SHA
        required: true
        type: string
      source_weather_run_id:
        description: Exact bot-started source run for the bound automatic handoff; empty for manual work
        type: string
        default: ''
      operation:
        description: Fixed private history operation; publish creates and verifies a fresh archive first
        type: choice
        default: plan
        options: [plan, archive, publish-locator, discover, restore, prune, maintain, bucket-readonly, bucket-create]
      confirmation:
        description: Exact publish-locator, prune, maintain or bucket-create confirmation; empty for read-only/archive operations
        type: string
        default: ''
      prune_limit:
        description: Exact prune batch; keep25 for the first bounded live qualification
        type: choice
        default: '25'
        options: ['25', '100', '600']
      index_sha:
        description: Optional exact index SHA for discover/restore only
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read

# Existing weather OUTER and trip INNER locks. Completion-triggered; no new weather or daily schedule.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  admin-document-history:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login != 'github-actions[bot]' && vars.RAVRADAR_ADMIN_HISTORY_MAINTENANCE == 'enabled')
    concurrency:
      group: ravradar-trip-storage-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require the fixed main invocation before any qualified read
        id: admission
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.sha || inputs.expected_main }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_PRUNE_LIMIT: ${{ inputs.prune_limit }}
          REQUESTED_INDEX_SHA: ${{ inputs.index_sha }}
          SOURCE_WEATHER_RUN_ID: ${{ inputs.source_weather_run_id }}
          TRIGGER_ACTOR: ${{ github.event.workflow_run.actor.login }}
          AUTOMATIC_MAINTENANCE_ENABLED: ${{ vars.RAVRADAR_ADMIN_HISTORY_MAINTENANCE }}
          TRIGGER_ACTION: ${{ github.event.action }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_RUN_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          TRIGGER_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_STATUS: ${{ github.event.workflow_run.status }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = jakobjorgensen82-commits/RavRadar
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          now=$(date -u +%s)
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [[ -n "$SOURCE_WEATHER_RUN_ID" ]]; then
                test "$AUTOMATIC_MAINTENANCE_ENABLED" = enabled
                test "$GITHUB_ACTOR" = 'github-actions[bot]'
                [[ "$SOURCE_WEATHER_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
                test "$REQUESTED_OPERATION" = plan
                test -z "$REQUESTED_CONFIRMATION"
                test "$REQUESTED_PRUNE_LIMIT" = 25
                test -z "$REQUESTED_INDEX_SHA"
              elif [[ "$REQUESTED_OPERATION" = maintain ]]; then
                next=$(( now / 14400 * 14400 + 19 * 60 ))
                if (( next <= now )); then next=$(( next + 14400 )); fi
                since=$(( 14400 - (next - now) ))
                if (( next - now < 30 * 60 || since < 180 * 60 )); then
                  echo 'proceed=false' >> "$GITHUB_OUTPUT"
                  echo '{"status":"DOCUMENT_HISTORY_SKIPPED_NO_WEATHER_WINDOW","privateAccessStarted":false}'
                  exit 0
                fi
              fi
              ;;
            workflow_run)
              if [[ "$AUTOMATIC_MAINTENANCE_ENABLED" != enabled ]]; then
                echo 'proceed=false' >> "$GITHUB_OUTPUT"
                echo '{"status":"DOCUMENT_HISTORY_SKIPPED_AUTOMATION_DISABLED","privateAccessStarted":false}'
                exit 0
              fi
              test "$TRIGGER_ACTION" = completed
              test -n "$TRIGGER_ACTOR"
              test "$TRIGGER_ACTOR" != 'github-actions[bot]'
              [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test "$TRIGGER_RUN_EVENT" = workflow_dispatch
              test "$TRIGGER_RUN_NAME" = 'Run current RavRadar weather once'
              test "$TRIGGER_RUN_PATH" = .github/workflows/run-current-weather-once.yml
              test "$TRIGGER_REPOSITORY" = jakobjorgensen82-commits/RavRadar
              test "$TRIGGER_HEAD_REPOSITORY" = jakobjorgensen82-commits/RavRadar
              test "$TRIGGER_REPOSITORY_ID" = 1306858343
              test "$TRIGGER_HEAD_REPOSITORY_ID" = 1306858343
              test "$TRIGGER_HEAD_BRANCH" = main
              test "$TRIGGER_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
              test "$TRIGGER_STATUS" = completed
              test "$TRIGGER_CONCLUSION" = success
              [[ "$TRIGGER_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              created=$(date -u -d "$TRIGGER_CREATED_AT" +%s)
              next=$(( created / 14400 * 14400 + 19 * 60 ))
              if (( next <= created )); then next=$(( next + 14400 )); fi
              if (( now < created || next - now < 30 * 60 )); then
                echo 'proceed=false' >> "$GITHUB_OUTPUT"
                echo '{"status":"DOCUMENT_HISTORY_SKIPPED_NO_WEATHER_WINDOW","privateAccessStarted":false}'
                exit 0
              fi
              ;;
            *) exit 1 ;;
          esac
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.admission.outputs.proceed == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: steps.admission.outputs.proceed == 'true'
        with:
          node-version: 22
      - name: Verify the completed source and its one exact recipient
        id: bot-handoff
        if: steps.admission.outputs.proceed == 'true' && github.event_name == 'workflow_dispatch' && inputs.source_weather_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_WEATHER_RUN_ID: ${{ inputs.source_weather_run_id }}
        run: |
          node <<'HANDOFF'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const env = process.env;
          function need(value) { if (!value) throw new Error('DOCUMENT_HISTORY_HANDOFF_REJECTED'); }
          function read(path) {
            const raw = execFileSync('gh', ['api', '--method', 'GET', '-H', 'Accept: application/vnd.github+json',
              '-H', 'X-GitHub-Api-Version: 2026-03-10', path],
              { timeout: 10000, maxBuffer: 512 * 1024, stdio: ['ignore', 'pipe', 'pipe'] });
            return JSON.parse(raw.toString('utf8'));
          }
          try {
            const { SOURCE_WEATHER_RUN_ID: sourceId, GITHUB_RUN_ID: recipient, GITHUB_SHA: head } = env;
            const isId = value => /^[1-9][0-9]{0,14}$/.test(value || '');
            const repo = 'jakobjorgensen82-commits/RavRadar';
            need(isId(sourceId) && isId(recipient) && sourceId !== recipient && /^[a-f0-9]{40}$/.test(head || '')
              && env.GITHUB_REPOSITORY === repo && env.GITHUB_REF === 'refs/heads/main'
              && env.GITHUB_EVENT_NAME === 'workflow_dispatch' && env.GITHUB_RUN_ATTEMPT === '1'
              && env.GITHUB_ACTOR === 'github-actions[bot]');
            const endpoint = 'repos/' + repo + '/actions/runs/' + sourceId;
            const source = read(endpoint);
            const ownRepo = value => value?.id === 1306858343 && value.full_name === repo;
            need(String(source.id) === sourceId && source.run_attempt === 1 && source.event === 'workflow_dispatch'
              && source.name === 'Run current RavRadar weather once'
              && source.path === '.github/workflows/run-current-weather-once.yml'
              && ownRepo(source.repository) && ownRepo(source.head_repository)
              && source.head_branch === 'main' && source.head_sha === head
              && source.actor?.login === 'github-actions[bot]'
              && source.status === 'completed' && source.conclusion === 'success');
            const created = Date.parse(source.created_at);
            need(Number.isFinite(created) && new Date(created).toISOString().replace('.000Z', 'Z') === source.created_at);
            const slot = 4 * 60 * 60 * 1000;
            const nextBase = Math.floor(created / slot) * slot + 19 * 60 * 1000;
            const next = nextBase <= created ? nextBase + slot : nextBase;
            const now = Date.now();
            if (now < created || next - now < 30 * 60 * 1000) {
              fs.appendFileSync(env.GITHUB_OUTPUT, 'proceed=false\n');
              console.log('{"status":"DOCUMENT_HISTORY_SKIPPED_NO_WEATHER_WINDOW","privateAccessStarted":false}');
            } else {
              const jobs = read(endpoint + '/attempts/1/jobs?per_page=100');
              need(Array.isArray(jobs.jobs) && jobs.jobs.length > 0 && jobs.jobs.length <= 100
                && jobs.total_count === jobs.jobs.length);
              function completedJob(name) {
                const matches = jobs.jobs.filter(job => job.name === name);
                need(matches.length === 1);
                const job = matches[0];
                need(String(job.run_id) === sourceId && job.head_sha === head
                  && job.status === 'completed' && job.conclusion === 'success');
                return job;
              }
              completedJob('Require a verified current-weather deployment');
              const handoff = completedJob('Hand off verified ordinary weather to admin document history');
              need(Array.isArray(handoff.steps));
              const bindings = handoff.steps.filter(step => step.name?.startsWith('Bind document history recipient '));
              need(bindings.length === 1 && bindings[0].name === 'Bind document history recipient ' + recipient
                && bindings[0].status === 'completed' && bindings[0].conclusion === 'success');
              fs.appendFileSync(env.GITHUB_OUTPUT, 'proceed=true\nsource_created_at=' + source.created_at + '\n');
            }
          } catch {
            console.error('DOCUMENT_HISTORY_HANDOFF_REJECTED');
            process.exitCode = 1;
          }
          HANDOFF
      - name: Restore source-content validation locator
        if: steps.admission.outputs.proceed == 'true' && (inputs.source_weather_run_id == '' || steps.bot-handoff.outputs.proceed == 'true')
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-admin-history
          restore-keys: |
            weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-
      - name: Require the already qualified exact-content source
        if: steps.admission.outputs.proceed == 'true' && (inputs.source_weather_run_id == '' || steps.bot-handoff.outputs.proceed == 'true')
        id: source-proof
        timeout-minutes: 2
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reject missing source proof before private access
        if: steps.admission.outputs.proceed == 'true' && (inputs.source_weather_run_id == '' || steps.bot-handoff.outputs.proceed == 'true')
        run: test "${{ steps.source-proof.outputs.required }}" = false
      - name: Run only the fixed document-history operation
        if: steps.admission.outputs.proceed == 'true' && (inputs.source_weather_run_id == '' || steps.bot-handoff.outputs.proceed == 'true')
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.sha || inputs.expected_main }}
          SOURCE_WEATHER_RUN_ID: ${{ inputs.source_weather_run_id }}
          HANDOFF_SOURCE_CREATED_AT: ${{ steps.bot-handoff.outputs.source_created_at }}
          DOCUMENT_HISTORY_OPERATION: ${{ (github.event_name == 'workflow_run' || steps.bot-handoff.outputs.proceed == 'true') && 'maintain' || inputs.operation }}
          DOCUMENT_HISTORY_CONFIRMATION: ${{ (github.event_name == 'workflow_run' || steps.bot-handoff.outputs.proceed == 'true') && 'MAINTAIN-EXACT-THREE-DOCUMENT-HISTORY' || inputs.confirmation }}
          DOCUMENT_HISTORY_INDEX_SHA: ${{ inputs.index_sha }}
          DOCUMENT_HISTORY_PRUNE_LIMIT: ${{ (github.event_name == 'workflow_run' || steps.bot-handoff.outputs.proceed == 'true') && '25' || inputs.prune_limit }}
          AUTOMATIC_MAINTENANCE_ENABLED: ${{ vars.RAVRADAR_ADMIN_HISTORY_MAINTENANCE }}
          TRIGGER_ACTOR: ${{ github.event.workflow_run.actor.login }}
          TRIGGER_ACTION: ${{ github.event.action }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_RUN_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          TRIGGER_REPOSITORY_ID: ${{ github.event.workflow_run.repository.id }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_STATUS: ${{ github.event.workflow_run.status }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const env = process.env;
          const privacyStages = Object.freeze(["NOT_STARTED","CATALOGUE_REQUEST","HTTP_STATUS","RESPONSE_JSON","RESPONSE_FIELDS","SERVICE_ROLE_ACCESS","CURRENT_METADATA","HISTORY_POLICY_NAMES","HISTORY_METADATA","VERIFIED"]);
          let phase = 'AUTHORITY';
          function need(value, code) { if (!value) { const error = new Error(code); error.code = code; throw error; } }
          const expected = {
            plan: 'READ_ONLY_DRAFT',
            archive: 'FIXED_BUCKET_ARCHIVE_AND_READONLY_ROUNDTRIP_VERIFIED',
            'publish-locator': 'DURABLE_PRIVATE_LOCATOR_CAS_AND_RESTORE_VERIFIED',
            discover: 'DURABLE_PRIVATE_LOCATOR_DISCOVERED_AND_RESTORED',
            restore: 'CENTRAL_DISCOVERY_READONLY_FULL_ROW_RESTORE_VERIFIED',
            prune: 'EXACT_ARCHIVED_ROWS_ABSENT_AFTER_WRITE',
            maintain: 'AUTOMATIC_FIXED_DOCUMENT_HISTORY_MAINTAINED',
          };
          try {
            const botHandoff = Boolean(env.SOURCE_WEATHER_RUN_ID);
            if ((env.GITHUB_EVENT_NAME === 'workflow_run' || botHandoff) && env.AUTOMATIC_MAINTENANCE_ENABLED !== 'enabled')
              console.log(JSON.stringify({status:'DOCUMENT_HISTORY_SKIPPED_AUTOMATION_DISABLED',privateAccessStarted:false}));
            else {
            need(['workflow_dispatch','workflow_run'].includes(env.GITHUB_EVENT_NAME) && env.GITHUB_REF === 'refs/heads/main'
              && env.GITHUB_RUN_ATTEMPT === '1' && env.GITHUB_REPOSITORY === 'jakobjorgensen82-commits/RavRadar'
              && env.GITHUB_WORKFLOW === 'Maintain RavRadar admin document history'
              && /^[a-f0-9]{40}$/.test(env.EXPECTED_HEAD_SHA || '') && env.GITHUB_SHA === env.EXPECTED_HEAD_SHA,
              'DOCUMENT_HISTORY_AUTHORITY');
            const operation = env.DOCUMENT_HISTORY_OPERATION;
            const bucketOperation = ['bucket-readonly', 'bucket-create'].includes(operation);
            need(Object.hasOwn(expected, operation) || bucketOperation, 'DOCUMENT_HISTORY_OPERATION');
            const pruneLimit = env.DOCUMENT_HISTORY_PRUNE_LIMIT;
            need(['25', '100', '600'].includes(pruneLimit), 'DOCUMENT_HISTORY_PRUNE_LIMIT');
            need(operation === 'prune' || pruneLimit === '25', 'DOCUMENT_HISTORY_PRUNE_LIMIT_SCOPE');
            const confirmation = env.DOCUMENT_HISTORY_CONFIRMATION || '';
            need(operation === 'bucket-create' ? confirmation === 'CREATE-PRIVATE-EU-ADMIN-HISTORY-BUCKET'
              : operation === 'publish-locator' ? confirmation === 'PUBLISH-PRIVATE-ADMIN-HISTORY-LOCATOR'
              : operation === 'prune' ? confirmation === 'PRUNE-EXACT-THREE-DOCUMENT-HISTORY'
              : operation === 'maintain' ? confirmation === 'MAINTAIN-EXACT-THREE-DOCUMENT-HISTORY'
              : confirmation === '', 'DOCUMENT_HISTORY_CONFIRMATION');
            const selector = env.DOCUMENT_HISTORY_INDEX_SHA || '';
            need(selector === '' || (['discover', 'restore'].includes(operation) && /^[a-f0-9]{64}$/.test(selector)),
              'DOCUMENT_HISTORY_INDEX_SELECTOR');
            const triggered = env.GITHUB_EVENT_NAME === 'workflow_run', now = Date.now();
            let nextBase = Math.floor(now / 14400000) * 14400000 + 19 * 60000;
            let nextWeather = nextBase <= now ? nextBase + 14400000 : nextBase, created = null;
            if (triggered) {
              need(operation === 'maintain' && pruneLimit === '25' && !selector, 'DOCUMENT_HISTORY_TRIGGER_SCOPE');
              need(env.TRIGGER_ACTION === 'completed' && env.TRIGGER_ACTOR && env.TRIGGER_ACTOR !== 'github-actions[bot]'
                && /^[1-9][0-9]*$/.test(env.TRIGGER_RUN_ID || '')
                && env.TRIGGER_RUN_EVENT === 'workflow_dispatch' && env.TRIGGER_RUN_NAME === 'Run current RavRadar weather once'
                && env.TRIGGER_RUN_PATH === '.github/workflows/run-current-weather-once.yml'
                && env.TRIGGER_REPOSITORY === env.GITHUB_REPOSITORY && env.TRIGGER_HEAD_REPOSITORY === env.GITHUB_REPOSITORY
                && env.TRIGGER_REPOSITORY_ID === '1306858343' && env.TRIGGER_HEAD_REPOSITORY_ID === '1306858343'
                && env.TRIGGER_HEAD_BRANCH === 'main' && env.TRIGGER_HEAD_SHA === env.EXPECTED_HEAD_SHA
                && env.TRIGGER_STATUS === 'completed' && env.TRIGGER_CONCLUSION === 'success'
                && /^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(env.TRIGGER_CREATED_AT || ''),
                'DOCUMENT_HISTORY_TRIGGER_AUTHORITY');
              created = Date.parse(env.TRIGGER_CREATED_AT);
              need(Number.isFinite(created) && new Date(created).toISOString().slice(0,19) === env.TRIGGER_CREATED_AT.slice(0,19),
                'DOCUMENT_HISTORY_TRIGGER_TIME');
            }
            if (botHandoff) {
              need(!triggered && env.GITHUB_ACTOR === 'github-actions[bot]'
                && /^[1-9][0-9]{0,14}$/.test(env.SOURCE_WEATHER_RUN_ID)
                && operation === 'maintain' && pruneLimit === '25' && !selector,
                'DOCUMENT_HISTORY_TRIGGER_SCOPE');
              created = Date.parse(env.HANDOFF_SOURCE_CREATED_AT);
              need(Number.isFinite(created)
                && new Date(created).toISOString().replace('.000Z', 'Z') === env.HANDOFF_SOURCE_CREATED_AT,
                'DOCUMENT_HISTORY_TRIGGER_TIME');
            }
            if (created !== null) {
              // Bind to the triggering weather run, never a later boundary after queueing.
              nextBase = Math.floor(created / 14400000) * 14400000 + 19 * 60000;
              nextWeather = nextBase <= created ? nextBase + 14400000 : nextBase;
            }
            const noWindow = operation === 'maintain' && (nextWeather - now < 30 * 60000
              || (created !== null ? now < created : 14400000 - (nextWeather - now) < 180 * 60000));
            if (noWindow) console.log(JSON.stringify({status:'DOCUMENT_HISTORY_SKIPPED_NO_WEATHER_WINDOW',privateAccessStarted:false}));
            else {
            need(typeof env.RUNNER_TEMP === 'string' && path.isAbsolute(env.RUNNER_TEMP), 'DOCUMENT_HISTORY_TEMP');
            const deadline = Date.now() + 20 * 60 * 1000;
            const remaining = () => { const value = deadline - Date.now(); need(value > 0, 'DOCUMENT_HISTORY_DEADLINE'); return value; };
            const gitEnv = Object.fromEntries(['PATH', 'Path', 'HOME', 'USERPROFILE', 'SystemRoot', 'WINDIR',
              'TEMP', 'TMP', 'RUNNER_TEMP', 'LANG', 'LC_ALL'].filter(key => typeof env[key] === 'string').map(key => [key, env[key]]));
            Object.assign(gitEnv, { GIT_TERMINAL_PROMPT: '0' });
            function mainHead() {
              phase = 'MAIN_RECONFIRM';
              try {
                execFileSync('git', ['fetch', '--no-tags', 'origin', '+refs/heads/main:refs/remotes/origin/main'],
                  { env: gitEnv, stdio: ['ignore', 'pipe', 'pipe'], timeout: Math.min(60000, remaining()), maxBuffer: 65536 });
                for (const ref of ['HEAD^{commit}', 'origin/main^{commit}']) {
                  const value = execFileSync('git', ['rev-parse', ref],
                    { env: gitEnv, stdio: ['ignore', 'pipe', 'pipe'], timeout: Math.min(10000, remaining()), maxBuffer: 65536 }).toString().trim();
                  need(value === env.EXPECTED_HEAD_SHA, 'DOCUMENT_HISTORY_MAIN_CHANGED');
                }
              } catch (error) { if (['DOCUMENT_HISTORY_MAIN_CHANGED', 'DOCUMENT_HISTORY_DEADLINE'].includes(error.code)) throw error;
                const failure = new Error('DOCUMENT_HISTORY_MAIN_UNAVAILABLE'); failure.code = 'DOCUMENT_HISTORY_MAIN_UNAVAILABLE'; throw failure; }
            }
            mainHead();
            const workdir = fs.mkdtempSync(path.join(env.RUNNER_TEMP, 'rr-admin-document-history-'));
            fs.chmodSync(workdir, 0o700);
            const controllerEnv = Object.fromEntries([...Object.keys(gitEnv), 'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY',
              'SUPABASE_ACCESS_TOKEN', 'RAVRADAR_R2_ACCOUNT_ID', 'RAVRADAR_R2_ACCESS_KEY_ID', 'RAVRADAR_R2_SECRET_ACCESS_KEY']
              .filter(key => typeof env[key] === 'string').map(key => [key, env[key]]));
            const completed = [], measurements = [];
            const counterKeys = Object.freeze(['candidateRows','eligibleRowsBefore','confirmedAbsentAfterWrite',
              'remainingCandidates','previouslyAbsentCandidates','adminDecodedReadBytes',
              'declaredAdminContentLengthBytes','adminResponses','r2ReadBytes','wireWrites']);
            function measured(mode, result) {
              const row = {mode};
              for (const key of counterKeys) {
                const value = result[key];
                need(value === undefined || (Number.isSafeInteger(value) && value >= 0), 'DOCUMENT_HISTORY_MEASUREMENT');
                row[key] = value === undefined ? null : value;
              }
              need(result.archiveRequired === undefined || typeof result.archiveRequired === 'boolean',
                'DOCUMENT_HISTORY_MEASUREMENT');
              row.archiveRequired = result.archiveRequired === undefined ? null : result.archiveRequired;
              if (result.privacyHttpStatus !== undefined || result.privacyStage !== undefined) {
                need((result.privacyHttpStatus === null || (Number.isInteger(result.privacyHttpStatus)
