name: Warn before RavRadar credential expiry

on:
  workflow_dispatch:
  schedule:
    - cron: "11 7 * * *"

permissions:
  issues: write

concurrency:
  group: ravradar-credential-expiry-monitor
  cancel-in-progress: false

jobs:
  warn-supabase-pat-expiry:
    name: Notify owner before Supabase PAT expires
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create or update the assigned expiry issue
        uses: actions/github-script@v8
        with:
          script: |
            const expiryIso = '2027-08-25T00:00:00Z';
            const warningDays = 60;
            const dayMs = 24 * 60 * 60 * 1000;
            const daysRemaining = Math.ceil((Date.parse(expiryIso) - Date.now()) / dayMs);
            const marker = '<!-- ravradar-supabase-pat-expiry-2027-08-25 -->';
            const title = 'RavRadar: Supabase-token udløber 25. august 2027';

            if (daysRemaining > warningDays) {
              core.info(`Supabase PAT has ${daysRemaining} days remaining; warning starts at ${warningDays} days.`);
              return;
            }

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            let issue = issues.find((candidate) =>
              !candidate.pull_request && candidate.body?.includes(marker));

            const body = `${marker}
            Supabases GitHub Actions-token udløber **25. august 2027**.

            Brug Codex til den kontrollerede rotation senest inden datoen:

            1. Opret et nyt Supabase Personal Access Token med længst tilladte udløb.
            2. Opdatér GitHub-secretet \`SUPABASE_ACCESS_TOKEN\` uden at vise værdien.
            3. Verificér den normale D1-deploykæde og den offentlige drift.
            4. Tilbagekald først derefter det gamle token.
            5. Opdatér udløbsdatoen i workflow og driftsdokumentation.

            Et eksisterende PAT kan ikke blot forlænges i RavRadars driftskæde. Ingen tokenværdi må skrives i issue, log, artifact eller chat.`;

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: [owner],
              });
              issue = created.data;
              core.notice(`Created assigned Supabase PAT expiry issue #${issue.number}.`);
            } else if (issue.state !== 'open') {
              const reopened = await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'open',
                assignees: [owner],
              });
              issue = reopened.data;
              core.notice(`Reopened assigned Supabase PAT expiry issue #${issue.number}.`);
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            for (const threshold of [30, 14, 7, 3, 1, 0]) {
              if (daysRemaining > threshold) continue;
              const commentMarker = `<!-- ravradar-supabase-pat-expiry-${threshold}d -->`;
              if (comments.some((comment) => comment.body?.includes(commentMarker))) continue;
              const urgency = threshold === 0
                ? 'Tokenets udløbsdato er nået eller passeret. Rotér og verificér nu.'
                : `Der er højst ${threshold} dage til tokenets udløb.`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${commentMarker}\n${urgency}`,
              });
            }
