name: Read-only protected wave evidence (diagnostic branch only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "READ-ONLY-PROTECTED-WAVE-20260919"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ravradar-readonly-weather-evidence
  cancel-in-progress: false

# Diagnostic branch only: no provider requests, database/storage writes,
# cache saves, private uploads, production jobs or Pages permissions.
jobs:
  protected-wave-scope:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/readonly-weather-evidence-20260919' && inputs.confirmation == 'READ-ONLY-PROTECTED-WAVE-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned original GRIB reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt
      - name: Restore only the exact saved original GRIB cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-Linux-2026-W38-35416641052-1
          fail-on-cache-miss: true
      - name: Describe the exact protected current generation without changing it
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/protected-wave-evidence"
          node scripts/audit-protected-wave-scope.mjs describe \
            --private-root "$RUNNER_TEMP/protected-wave-evidence" \
            --descriptor "$RUNNER_TEMP/protected-wave-evidence/current-source.json" \
            --output "$RUNNER_TEMP/protected-wave-evidence/describe.json"
      - name: Load only the exact archived source for the old bundle validator
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(jq -r '.sourceHead' "$RUNNER_TEMP/protected-wave-evidence/current-source.json")"
          [[ "$source_head" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags --depth=1 origin "$source_head"
          test "$(git rev-parse "$source_head^{commit}")" = "$source_head"
          mkdir -m 700 "$RUNNER_TEMP/protected-wave-predecessor"
          git archive "$source_head" | tar -x -C "$RUNNER_TEMP/protected-wave-predecessor"
      - name: Read the verified old generation and report only wave-scope counters
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/audit-protected-wave-scope.mjs audit \
            --private-root "$RUNNER_TEMP/protected-wave-evidence" \
            --descriptor "$RUNNER_TEMP/protected-wave-evidence/current-source.json" \
            --predecessor-root "$RUNNER_TEMP/protected-wave-predecessor" \
            --raw-dir "$GITHUB_WORKSPACE/.cache/dmi-grib" \
            --output "$RUNNER_TEMP/protected-wave-evidence/wave-scope.json"
