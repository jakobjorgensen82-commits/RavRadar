name: Monitor RavRadar trip storage

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ravradar-trip-storage-monitor
  cancel-in-progress: true

jobs:
  monitor-trip-storage:
    name: Audit D1 capacity without reading trips
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check aggregate and largest-shard headroom
        run: node scripts/audit-cloudflare-trip-storage.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}

  monitor-database-backup-confirmation:
    name: Check recent database backup confirmation
    if: >-
      github.repository == 'jakobjorgensen82-commits/RavRadar' &&
      github.ref == 'refs/heads/main' && github.event_name == 'schedule' &&
      github.run_attempt == 1 && vars.RAVRADAR_SUPABASE_BACKUP_AUTOMATION == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require a recent positive backup confirmation from GitHub
        run: node scripts/monitor-database-backup-confirmation.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
