name: Read-only Supabase connection check
run-name: Read-only Supabase password verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravradar-supabase-auth-probe
  cancel-in-progress: false

jobs:
  verify-database-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0
      - name: Verify actual read-only database connections with the existing secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, sys, tempfile
          from pathlib import Path

          password = os.environ.get('SUPABASE_DB_PASSWORD', '')
          project = os.environ.get('SUPABASE_PROJECT_ID', '')
          if not password or project != 'afqhhdrkjfjtpadntdzo':
              print('DATABASE_PROBE_CONFIGURATION_MISSING', flush=True)
              sys.exit(1)

          def check(label, args, cwd, env=None):
              try:
                  result = subprocess.run(args, cwd=cwd, env=env, capture_output=True,
                                          text=True, timeout=45, stdin=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  print(json.dumps({'check': label, 'ok': False, 'reason': 'TIMEOUT'}), flush=True)
                  return False
              output = result.stdout + result.stderr
              sqlstates = sorted(set(re.findall(r'SQLSTATE ([0-9A-Z]{5})', output)))
              reason = ('PASSWORD_REJECTED' if '28P01' in sqlstates or 'password authentication failed' in output.lower()
                        else 'CONNECTION_FAILED' if result.returncode else 'OK')
              print(json.dumps({'check': label, 'ok': result.returncode == 0,
                                'reason': reason, 'sqlstates': sqlstates}), flush=True)
              return result.returncode == 0

          with tempfile.TemporaryDirectory(prefix='ravradar-auth-') as directory:
              if not check('local_init', ['supabase', 'init'], directory):
                  sys.exit(1)
              if not check('management_link', ['supabase', 'link', '--project-ref', project,
                                               '--password', password], directory):
                  sys.exit(1)
              first = check('database_same_as_production', ['supabase', 'migration', 'list', '--linked'], directory)
              second = check('database_explicit_same_password', ['supabase', 'migration', 'list', '--linked',
                                                                  '--password', password], directory)
              if not (first and second) and shutil.which('psql'):
                  pg_env = dict(os.environ, PGPASSWORD=password, PGCONNECT_TIMEOUT='15',
                                PGSSLMODE='require', PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=10000')
                  check('database_pooler_select_one', ['psql', '-X', '-w', '-qAt', '-v', 'ON_ERROR_STOP=1',
                        '-h', 'aws-0-eu-west-1.pooler.supabase.com', '-p', '5432',
                        '-U', 'postgres.' + project, '-d', 'postgres', '-c', 'SELECT 1'], directory, pg_env)
              if first and second:
                  print('DATABASE_PASSWORD_VERIFIED_TWO_READ_ONLY_CONNECTIONS', flush=True)
              else:
                  print('DATABASE_PASSWORD_NOT_YET_VERIFIED', flush=True)
              sys.exit(0 if first and second else 1)
          PY
