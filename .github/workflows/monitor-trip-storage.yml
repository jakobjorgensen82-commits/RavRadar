name: Monitor RavRadar trip storage

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read

concurrency:
  group: ravradar-trip-storage-monitor
  cancel-in-progress: true

jobs:
  monitor-trip-storage:
    name: Audit D1 capacity without reading trips
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check aggregate and largest-shard headroom
        run: node scripts/audit-cloudflare-trip-storage.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
