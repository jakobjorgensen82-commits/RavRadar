name: GitHub Pages microtest

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ravradar-pages-microtest
  cancel-in-progress: false

jobs:
  build-test-page:
    name: Build one-file test page
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages
    steps:
      - name: Create minimal Pages site
        run: |
          set -euo pipefail
          rm -rf _micro_site
          mkdir -p _micro_site
          cat > _micro_site/index.html <<'HTML'
          <!doctype html>
          <html lang="da">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>RavRadar Pages-mikrotest</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; line-height: 1.55; }
              code { background: #f2f2f2; padding: .15rem .35rem; border-radius: .25rem; }
            </style>
          </head>
          <body>
            <h1>GitHub Pages-mikrotest lykkedes</h1>
            <p>Denne side består kun af én <code>index.html</code>.</p>
            <p>Det beviser, at repositoryets GitHub Pages-miljø kan publicere et minimalt artifact.</p>
          </body>
          </html>
          HTML
          touch _micro_site/.nojekyll
          find _micro_site -maxdepth 2 -type f -printf '%P\n'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload minimal Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _micro_site

  deploy-test-page:
    name: Deploy one-file test page
    needs: build-test-page
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy minimal artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
