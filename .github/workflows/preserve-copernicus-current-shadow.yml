name: Preserve private Copernicus current shadow

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_run:
    workflows: ["Update weather and deploy RavRadar"]
    types: [requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-copernicus-current-pilot
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current_hour_present: ${{ steps.cache-state.outputs.current_hour_present }}
    steps:
      - name: Check out trusted default-branch helper
        uses: actions/checkout@v4

      - name: Restore and refresh private seven-day Copernicus shadow cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-keepalive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Inspect current-hour coverage without logging raw vectors
        id: cache-state
        run: python3 scripts/check-copernicus-current-hour.py --github-output "$GITHUB_OUTPUT"

  dispatch-pilot:
    needs: preserve
    if: github.event_name == 'workflow_run' && needs.preserve.outputs.current_hour_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch private current-hour pilot when production requests a missing hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/validate-copernicus-current-pilot.yml/dispatches" \
            -f ref=main
