name: Preserve private Copernicus current shadow

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_run:
    workflows: ["Update weather and deploy RavRadar"]
    types: [requested, completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      external_watchdog:
        description: "Kontrollér total GitHub-schedulerstilhed fra den eksterne, payloadfri vagthund"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-copernicus-current-pilot
  cancel-in-progress: false

jobs:
  preserve:
    if: github.event_name != 'workflow_run' || github.event.action == 'requested'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch helper
        uses: actions/checkout@v7

      - name: Restore and refresh the private sealed Copernicus range cache
        id: range-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-range-v2-keepalive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-range-v2-
            copernicus-current-shadow-v1-

      - name: Report cache keepalive without reading private payloads
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.range-cache.outputs.cache-matched-key }}
        run: |
          if test -n "$MATCHED_CACHE_KEY"; then
            echo "The existing private range cache was refreshed without reading its payload."
          else
            echo "No cache existed to refresh; the DMI-first production workflow will create an exact gap seal when needed."
          fi

  retry-failed-production:
    if: github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.event == 'schedule' && contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry one failed or timed-out scheduled production without forcing parallel work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/update-and-deploy.yml/dispatches" \
            -f ref=main \
            -F "inputs[force]=false"

  production-watchdog:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_watchdog == true)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Inspect production silence without reading private payloads
        id: watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          # Den eksterne plan skal kunne overtage efter ét manglende native
          # kvarter. GitHubs eget interne sikkerhedsnet beholder DEC-0085's
          # konservative 45-minuttersgrænse.
          MAXIMUM_SILENCE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.external_watchdog == true && '15' || '45' }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/update-and-deploy.yml/runs?branch=main&per_page=20" \
            > "$RUNNER_TEMP/ravradar-production-runs.json"
          node scripts/check-production-watchdog.mjs \
            --runs "$RUNNER_TEMP/ravradar-production-runs.json" \
            --manifest-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live/manifest.json" \
            --maximum-silence-minutes "$MAXIMUM_SILENCE_MINUTES" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch one production after verified silence
        if: steps.watchdog.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/actions/workflows/update-and-deploy.yml/dispatches" \
            -f ref=main \
            -F "inputs[force]=false"
