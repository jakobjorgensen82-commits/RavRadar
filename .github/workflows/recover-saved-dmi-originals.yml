name: Recover only authenticated missing historical DMI originals

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv RESTORE-EXACT-DMI-ORIGINALS"
        required: true
        type: string
      restore_current586_originals:
        description: "Separat lukket CURRENT586 B/S-plan; ingen progress-checkpoint"
        required: false
        type: boolean
        default: false
      expected_main_head:
        description: "Eksakt main-commit med faktisk grøn kildekontrol"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# Exact390663 post-H0 repair. Normal selection runs only in private scratch;
# no newer forecast, production calculation, SQL or deploy is performed.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  restore:
    name: Restore exact historical bytes and save the additive owned RAW cache
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the approved exact source and completed saved attempt
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
          CURRENT586: ${{ inputs.restore_current586_originals }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = RESTORE-EXACT-DMI-ORIGINALS
          [[ "$EXPECTED_MAIN_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_HEAD"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          [[ "$CURRENT586" = true || "$CURRENT586" = false ]]
          if test "$CURRENT586" = true; then
            node --input-type=module -e "import('./scripts/lib/current586-exact-original-plan.mjs').then(m=>m.requireCurrent586ExactOriginalExecution())"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/39666991481/attempts/1" > "$RUNNER_TEMP/current586-failed-run.json"
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .id == 39666991481 and .run_attempt == 1 and .status == "completed" and .conclusion == "failure"
              and .head_sha == "94b2b6173747b9d1f7d261c5110042a657af0cac"
              and .repository.full_name == $repo and .head_repository.full_name == $repo
              and .head_branch == "main" and .path == ".github/workflows/run-current-weather-once.yml"
            ' "$RUNNER_TEMP/current586-failed-run.json" >/dev/null
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
              -f key=dmi-grib-v4-Linux-2026-W43-39520623069-1 -f ref=refs/heads/main -f per_page=100 \
              > "$RUNNER_TEMP/current586-raw-metadata.json"
            jq -e '
              .total_count == 1 and (.actions_caches | length) == 1
              and .actions_caches[0].id == 9250979458
              and .actions_caches[0].key == "dmi-grib-v4-Linux-2026-W43-39520623069-1"
              and .actions_caches[0].ref == "refs/heads/main"
              and .actions_caches[0].version == "9d434ae81d3120176028232ea936fc3f9dc0ed030022ff6d98bec91aa9cf117a"
              and .actions_caches[0].size_in_bytes == 2729841089
            ' "$RUNNER_TEMP/current586-raw-metadata.json" >/dev/null
            echo "generation=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39066350748/attempts/1" \
            > "$RUNNER_TEMP/saved-input-source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .id == 39066350748 and .run_attempt == 1
            and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_branch == "main" and .event == "workflow_dispatch"
            and .path == ".github/workflows/run-current-weather-once.yml"
            and .status == "completed" and (.head_sha | test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/saved-input-source-run.json" >/dev/null
          source_head="$(jq -er '.head_sha' "$RUNNER_TEMP/saved-input-source-run.json")"
          git merge-base --is-ancestor "$source_head" "$GITHUB_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
            -f key=dmi-grib-v4-Linux-2026-W42-39066350748-1 \
            -f ref=refs/heads/main -f per_page=100 \
            > "$RUNNER_TEMP/saved-input-raw-cache-metadata.json"
          jq -e '
            .total_count == 1 and (.actions_caches | length) == 1
            and .actions_caches[0].key == "dmi-grib-v4-Linux-2026-W42-39066350748-1"
            and .actions_caches[0].ref == "refs/heads/main"
            and .actions_caches[0].version == "9d434ae81d3120176028232ea936fc3f9dc0ed030022ff6d98bec91aa9cf117a"
            and (.actions_caches[0].size_in_bytes | type == "number" and . > 0)
          ' "$RUNNER_TEMP/saved-input-raw-cache-metadata.json" >/dev/null
          echo "generation=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify live exact-content source validation
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require existing live green source proof before protected reads
        shell: bash
        env:
          SOURCE_REQUIRED: ${{ steps.source-proof.outputs.required }}
        run: |
          set -euo pipefail
          test "$SOURCE_REQUIRED" = false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the existing normal reader dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt -r requirements-geometry.txt -r requirements-copernicus.txt

      - name: Create the owned private audit directory for both restore modes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$RUNNER_TEMP/ravradar-saved-input-audit"
          test ! -L "$RUNNER_TEMP/ravradar-saved-input-audit"
          mkdir -m 0700 -- "$RUNNER_TEMP/ravradar-saved-input-audit"

      - name: Restore only the approved encrypted checkpoint
        if: inputs.restore_current586_originals != true
        id: progress
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-private-progress.encrypted
          key: weather-private-progress-encrypted-v2-Linux-main-39066350748-1
          fail-on-cache-miss: true

      - name: Require exact checkpoint hit and privately retain its original bytes
        if: inputs.restore_current586_originals != true
        shell: bash
        env:
          MATCHED_KEY: ${{ steps.progress.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.progress.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$MATCHED_KEY" = weather-private-progress-encrypted-v2-Linux-main-39066350748-1
          test -s .cache/weather-private-progress.encrypted
          test ! -L .cache/weather-private-progress.encrypted
          install -m 0600 .cache/weather-private-progress.encrypted \
            "$RUNNER_TEMP/ravradar-saved-input-audit/progress.encrypted"

      - name: Restore the same checkpoint's existing RAW cache without fallback
        id: raw-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-grib
          key: ${{ inputs.restore_current586_originals && 'dmi-grib-v4-Linux-2026-W43-39520623069-1' || 'dmi-grib-v4-Linux-2026-W42-39066350748-1' }}
          fail-on-cache-miss: true

      - name: Require the exact existing RAW cache before additive recovery
        shell: bash
        env:
          MATCHED_KEY: ${{ steps.raw-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.raw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          if test '${{ inputs.restore_current586_originals }}' = true; then
            test "$MATCHED_KEY" = dmi-grib-v4-Linux-2026-W43-39520623069-1
          else
            test "$MATCHED_KEY" = dmi-grib-v4-Linux-2026-W42-39066350748-1
          fi
          test -d .cache/dmi-grib
          test ! -L .cache
          test ! -L .cache/dmi-grib
          test ! -L .cache/dmi-grib/asset-manifest.json

      - name: Read the current protected source identity without remote writes
        run: >-
          node scripts/audit-saved-weather-inputs.mjs describe
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/describe-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Materialize the exact original producer without executing it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          producer_head="$(jq -er '.sourceHead' "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json")"
          [[ "$producer_head" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$producer_head" "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          git archive "$producer_head" | tar -x -C "$RUNNER_TEMP/ravradar-saved-input-predecessor"

      - name: Prepare the exact normal caller only inside private scratch
        if: inputs.restore_current586_originals != true
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ravradar-saved-input-audit"
          mkdir "$root/current-window-logs"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$root/current-window-source"
          git -C "$root/current-window-source" -c core.autocrlf=false checkout --detach "$GITHUB_SHA"
          cd "$root/current-window-source"
          if ! (python scripts/refine-coastlines-constrained-4.0.48.py &&
            python scripts/sync-admin-config.py &&
            python scripts/apply-central-zone-reviews.py &&
            node scripts/build-public-coastal-parts-v2.mjs) >"$root/current-window-logs/normal-admin-hydration.stdout" 2>"$root/current-window-logs/normal-admin-hydration.stderr"; then
            echo SAVED_CURRENT_WINDOW_CENTRAL_HYDRATION_UNAVAILABLE >&2
            exit 1
          fi
          test -s .cache/admin-config-sync.json
          test -s data/live/coastal-parts-v2.json

      - name: Authenticate the checkpoint and prepare only demanded exact originals
        if: inputs.restore_current586_originals != true
        id: plan
        run: >-
          node scripts/audit-saved-weather-inputs.mjs audit
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --progress-file "$RUNNER_TEMP/ravradar-saved-input-audit/progress.encrypted"
          --progress-source 39066350748-1
          --progress-cache-key weather-private-progress-encrypted-v2-Linux-main-39066350748-1
          --progress-baseline-target-hour 2026-10-17T20:00:00.000Z
          --include-current-window-diagnostic true
          --prepare-current-forward-originals true
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/summary-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
          WEATHER_PROGRESS_MASTER_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare the exact normal CURRENT586 source without central hydration
        if: inputs.restore_current586_originals == true
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ravradar-saved-input-audit"
          git clone --shared --no-checkout "$GITHUB_WORKSPACE" "$root/current586-source"
          git -C "$root/current586-source" -c core.autocrlf=false checkout --detach "$GITHUB_SHA"

      - name: Authenticate CURRENT586 B and actual S and prepare saved121 plus forward originals
        if: inputs.restore_current586_originals == true
        id: current586-plan
        run: >-
          node scripts/audit-saved-weather-inputs.mjs audit
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --predecessor-root "$RUNNER_TEMP/ravradar-saved-input-predecessor"
          --progress-source 39666991481-1
          --prepare-current586-originals true
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/current586-plan-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}

      - name: Reconfirm actual CURRENT586 B and S immediately before exact transport
        if: inputs.restore_current586_originals == true && steps.current586-plan.outputs.preparation_status == 'ORIGINAL_PLAN_PREPARED'
        run: >-
          node scripts/audit-saved-weather-inputs.mjs verify-current586-plan
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/current586-before-transport-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Inspect authenticated original metadata before transport
        if: steps.plan.outputs.preparation_status == 'ORIGINAL_PLAN_PREPARED' || steps.current586-plan.outputs.preparation_status == 'ORIGINAL_PLAN_PREPARED'
        run: python -B scripts/inspect-exact-dmi-original-plan.py
        env:
          DMI_EXACT_ORIGINAL_PLAN_SHA256: ${{ inputs.restore_current586_originals && steps.current586-plan.outputs.plan_sha256 || steps.plan.outputs.plan_sha256 }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Select the normal owned cache API runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare the locked cache API through its existing owned cohort
        id: cache-api
        run: node "$GITHUB_WORKSPACE/.github/actions/save-owned-dmi-grib/index.cjs" --prepare-distribution

      - name: Restore Node22 for the fixed recovery coordinator
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Recover exact originals without weather calculation or pruning
        id: originals
        run: node scripts/run-exact-dmi-original-restore.mjs
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_EXACT_ORIGINAL_PREPARATION_STATUS: ${{ inputs.restore_current586_originals && steps.current586-plan.outputs.preparation_status || steps.plan.outputs.preparation_status }}
          DMI_EXACT_ORIGINAL_COUNT: ${{ inputs.restore_current586_originals && steps.current586-plan.outputs.original_count || steps.plan.outputs.original_count }}
          DMI_EXACT_ORIGINAL_PLAN_BYTES: ${{ inputs.restore_current586_originals && steps.current586-plan.outputs.plan_bytes || steps.plan.outputs.plan_bytes }}
          DMI_EXACT_ORIGINAL_PLAN_SHA256: ${{ inputs.restore_current586_originals && steps.current586-plan.outputs.plan_sha256 || steps.plan.outputs.plan_sha256 }}
          DMI_BULK_MAX_DOWNLOAD_MB: 2048
          DMI_BULK_RAW_CACHE_MAX_MB: 4096
          DMI_BULK_MAX_RUNTIME_SECONDS: 780
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 180
          DMI_BULK_REQUEST_TIMEOUT_SECONDS: 90

      - name: Reconfirm actual CURRENT586 B and S after physical transport closure
        if: inputs.restore_current586_originals == true && steps.originals.outputs.originals_restored == 'true'
        run: >-
          node scripts/audit-saved-weather-inputs.mjs verify-current586-closed
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/current586-after-transport-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reconfirm the protected source before the sole cache SAVE
        run: >-
          node scripts/audit-saved-weather-inputs.mjs describe
          --private-root "$RUNNER_TEMP/ravradar-saved-input-audit"
          --descriptor "$RUNNER_TEMP/ravradar-saved-input-audit/current-source-before-save.json"
          --output "$RUNNER_TEMP/ravradar-saved-input-audit/describe-before-save-safe.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Require unchanged source, exact main and physically closed recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINALS_RESTORED: ${{ steps.originals.outputs.originals_restored }}
          CACHE_API_READY: ${{ steps.cache-api.outputs.distribution_ready }}
        run: |
          set -euo pipefail
          test "$ORIGINALS_RESTORED" = true
          test "$CACHE_API_READY" = true
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          cmp --silent "$RUNNER_TEMP/ravradar-saved-input-audit/current-source.json" \
            "$RUNNER_TEMP/ravradar-saved-input-audit/current-source-before-save.json"
          test ! -e .cache/weather-acquisition-writer.claim
          test ! -L .cache/weather-acquisition-writer.claim
          test ! -e .cache/dmi-grib/.original-recovery-plan.json
          test ! -L .cache/dmi-grib/.original-recovery-plan.json

      - name: Save only through the normal physically owned cache API
        id: save
        uses: ./.github/actions/save-owned-dmi-grib
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.authority.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require actual finalized SAVE, not a green skipped step
        shell: bash
        env:
          SAVED: ${{ steps.save.outputs.saved }}
        run: |
          set -euo pipefail
          test "$SAVED" = true
