name: Resume exact prepared operational checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false
jobs:
  resume:
    uses: ./.github/workflows/reusable-operational-reentry.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  require-completed-recovery:
    needs: resume
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require an actual completed checkpoint recovery
        env:
          RESULT: ${{ needs.resume.result }}
          ACTION: ${{ needs.resume.outputs.recovery_action }}
        run: |
          test "$RESULT" = success
          case "$ACTION" in
            EXACT_TARGET_REDEPLOY|TARGET_RECONCILE|COMPLETED_PRE_ACTIVATION|PRE_ACTIVATION_RESUME) ;;
            *) echo "No exact prepared target was publicly recovered." >&2; exit 1 ;;
          esac
