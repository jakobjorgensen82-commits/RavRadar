name: Reusable RavRadar Pages deployment

on:
  workflow_call:
    inputs:
      active_deployment_id:
        required: true
        type: string
      central_version:
        required: true
        type: string
      code_only_repair:
        required: true
        type: boolean
      deployment_model:
        required: true
        type: string
      integrated_implementation_closure_sha256:
        required: true
        type: string
      legacy_source_required:
        required: true
        type: string
      operational_action:
        required: true
        type: string
      source_repair_id:
        required: true
        type: string
    secrets:
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      SUPABASE_URL:
        required: true
    outputs:
      deployment_outcome:
        description: "Forwarded deploy-pages deployment_outcome contract"
        value: ${{ jobs.deploy-pages.outputs.deployment_outcome }}
      public_verification_outcome:
        description: "Forwarded deploy-pages public_verification_outcome contract"
        value: ${{ jobs.deploy-pages.outputs.public_verification_outcome }}
      deployed_verified:
        description: "Forwarded deploy-pages deployed_verified contract"
        value: ${{ jobs.deploy-pages.outputs.deployed_verified }}

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: Deploy prepared Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      deployment_outcome: ${{ steps.deployment.outcome }}
      public_verification_outcome: ${{ steps.public-verification.outcome }}
      deployed_verified: ${{ steps.deployment-terminal.outputs.deployed_verified }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RAVRADAR_OPERATIONAL_HANDOFF: /tmp/ravradar-operational-handoff
      RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE: /tmp/ravradar-operational-source-evidence
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch exact public Candidate G source commit for first cutover verification
        if: inputs.legacy_source_required == 'true' && (inputs.operational_action == 'integrated-cutover' || inputs.operational_action == 'candidate-legacy-maintenance')
        shell: bash
        run: |
          legacy_source_head="$(node --input-type=module -e "import { LEGACY_CANDIDATE_G_SOURCE_HEAD } from './scripts/lib/ravscore-legacy-candidate-g-source.mjs'; process.stdout.write(LEGACY_CANDIDATE_G_SOURCE_HEAD);")"
          [[ "$legacy_source_head" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$legacy_source_head"
          test "$(git rev-parse FETCH_HEAD)" = "$legacy_source_head"

      - name: Download sealed operational handoff
        uses: actions/download-artifact@v8
        with:
          name: ravscore-operational-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_HANDOFF }}

      - name: Verify exact privacy-safe handoff identity
        shell: bash
        run: |
          test "$(jq -r '.schemaVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "ravscore-operational-deploy-handoff-v2"
          test "$(jq -r '.sourceHead' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "$GITHUB_SHA"
          test "$(jq -r '.action' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ inputs.operational_action }}"
          test "$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ inputs.central_version }}"
          test "$(jq -r '.legacySourceRequired' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ inputs.legacy_source_required }}"
          test "$(jq -r '.privatePayloadIncluded' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "false"
          test "$(jq -r '.codeOnlyRepair // false' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ inputs.code_only_repair }}"
          test "$(jq -r '.sourceRepairId // ""' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ inputs.source_repair_id }}"
          if [ -n "${{ inputs.source_repair_id }}" ]; then
            test "${{ inputs.code_only_repair }}" = "true"
            case "${{ inputs.operational_action }}" in
              integrated|integrated-historical-maintenance) ;;
              *) echo "Known public source repair requires active integrated operation." >&2; exit 1 ;;
            esac
          fi
          if [ "${{ inputs.code_only_repair }}" = "true" ]; then
            test -f "$RAVRADAR_OPERATIONAL_HANDOFF/code-only-reuse.json"
            test "$(sha256sum "$RAVRADAR_OPERATIONAL_HANDOFF/code-only-reuse.json" | awk '{print $1}')" = "$(jq -er '.codeOnlyReuseReportSha256 | select(test("^[a-f0-9]{64}$"))' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")"
            jq -e '.providerRequestsPerformed == false and .weatherValuesChanged == false and .geometryChanged == false and .privatePayloadIncluded == false and .zoneCount == 210 and .coastalPartCount == 673 and ((.mode == "code-only-reuse" and .scoresChanged == false) or (.mode == "post-cutover-contract-rebind" and .scoresChanged == false and .savedProtectedRuntimeReused == true and .publicRuntimeAdvanced == false) or (.mode == "post-cutover-last-mile-repair" and .scoresChanged == true and .savedProtectedRuntimeReused == true and .publicRuntimeAdvanced == false))' "$RAVRADAR_OPERATIONAL_HANDOFF/code-only-reuse.json" >/dev/null
          fi

      - name: Require horizon-valid weather before any Pages begin CAS
        if: inputs.code_only_repair != true
        shell: bash
        run: |
          set -euo pipefail
          target="$(jq -er '.productionReferenceAt | select(type == "string")' "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json")"
          node scripts/check-production-target-freshness.mjs \
            --target "$target" \
            --maximum-age-minutes 240

      - name: Require monotonic public generation before durable begin
        run: >-
          node scripts/check-pages-generation-order.mjs
          --handoff "$RAVRADAR_OPERATIONAL_HANDOFF"
          --base-url "$RAVRADAR_PUBLIC_BASE_URL"

      - name: Validate checkpoint disposition before any Pages begin CAS
        id: checkpoint-disposition-begin
        shell: bash
        env:
          CHECKPOINT_VALIDATION_PHASE: begin
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs';

          const root = process.env.RAVRADAR_OPERATIONAL_HANDOFF;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const handoff = read('handoff.json');
          const manifest = read('manifest.json');
          const disposition = read('checkpoint-disposition.json');
          const runtimeAudit = read('checkpoint-runtime-audit.json');
          const expectedDispositionKeys = [
            'bindingSha256',
            'checkpointRequired',
            'datasetId',
            'disposition',
            'privatePayloadIncluded',
            'rollbackActivationReady',
            'rollbackStatus',
            'runtimeAuditSha256',
            'schemaVersion',
            'sourceHead',
          ].sort();
          const fail = (message) => { throw new Error(`Checkpoint disposition ${process.env.CHECKPOINT_VALIDATION_PHASE} validation failed: ${message}`); };
          if (disposition.schemaVersion !== 'ravscore-continuation-checkpoint-disposition-v1') fail('schema');
          if (JSON.stringify(Object.keys(disposition).sort()) !== JSON.stringify(expectedDispositionKeys)) fail('unexpected fields');
          if (disposition.sourceHead !== process.env.GITHUB_SHA || handoff.sourceHead !== process.env.GITHUB_SHA) fail('source head');
          if (!disposition.datasetId || disposition.datasetId !== manifest.datasetId || disposition.datasetId !== runtimeAudit.datasetId) fail('dataset binding');
          if (disposition.privatePayloadIncluded !== false || handoff.privatePayloadIncluded !== false) fail('privacy marker');
          const { bindingSha256, ...binding } = disposition;
          if (!/^[a-f0-9]{64}$/.test(bindingSha256) || sha256CanonicalJson(binding) !== bindingSha256) fail('canonical binding');
          if (!/^[a-f0-9]{64}$/.test(disposition.runtimeAuditSha256) || sha256CanonicalJson(runtimeAudit) !== disposition.runtimeAuditSha256) fail('runtime audit binding');
          if (
            handoff.checkpointDisposition !== disposition.disposition
            || handoff.checkpointDispositionSha256 !== bindingSha256
            || handoff.checkpointDatasetId !== disposition.datasetId
            || handoff.checkpointRuntimeAuditSha256 !== disposition.runtimeAuditSha256
          ) fail('handoff binding');
          if (disposition.disposition === 'READY_PUBLISHED') {
            if (disposition.rollbackStatus !== 'READY' || disposition.rollbackActivationReady !== true || disposition.checkpointRequired !== true) fail('READY disposition state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('READY result proof');
          } else if (disposition.disposition === 'MEASURED_WARMUP_PUBLISHED') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== true) fail('measured continuation state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('measured continuation result proof');
          } else if (disposition.disposition === 'NOT_APPLICABLE_DURING_MEASURED_WARMUP') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== false) fail('warm-up disposition state');
            if (handoff.checkpointBuildOutcome !== 'skipped' || handoff.checkpointSaveOutcome !== 'skipped' || handoff.checkpointPublishOutcome !== 'skipped') fail('warm-up result proof');
          } else {
            fail('unsupported disposition');
          }
          NODE

      - name: Reconfirm prepared SHA before any activation CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Observe and seal the currently public source manifest
        if: inputs.operational_action == 'candidate-execute' || inputs.operational_action == 'candidate-maintenance' || inputs.operational_action == 'candidate-historical-maintenance' || inputs.operational_action == 'candidate-legacy-maintenance' || inputs.operational_action == 'integrated-historical-maintenance' || inputs.operational_action == 'integrated' || inputs.operational_action == 'integrated-return' || inputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-source=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          expected_schema="4"
          if [ "${{ inputs.legacy_source_required }}" = "true" ]; then
            expected_schema="2"
          fi
          test "$(jq -r '.schemaVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json")" = "$expected_schema"
          test "$(jq -r '.complete' "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json")" = "true"
          source_digest="$(sha256sum "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" | cut -d' ' -f1)"
          if [ -n "${{ inputs.source_repair_id }}" ]; then
            printf '%s\n' "${{ inputs.active_deployment_id }}" \
              > "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt"
          else
            printf 'public-source-%s\n' "${source_digest:0:24}" \
              > "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt"
          fi

      - name: Restore the exact sealed active source implementation
        if: inputs.legacy_source_required != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_DEPLOYMENT_ID: ${{ inputs.active_deployment_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          rm -rf "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE"
          set +e
          node scripts/protected-operational-reentry-evidence.mjs --restore \
            --deployment-id "$ACTIVE_DEPLOYMENT_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --directory "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE" \
            --output /tmp/ravradar-protected-source-restore.json
          durable_status=$?
          set -e
          if [ "$durable_status" -ne 0 ]; then
            rm -rf "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE"
            source_manifest_sha256="$(SOURCE_MANIFEST="$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.SOURCE_MANIFEST, 'utf8'))));")"
            set +e
            node scripts/protected-operational-reentry-evidence.mjs --restore \
              --public-manifest-sha256 "$source_manifest_sha256" \
              --repository "$GITHUB_REPOSITORY" \
              --directory "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE" \
              --output /tmp/ravradar-protected-source-restore.json
            durable_status=$?
            set -e
          fi
          if [ "$durable_status" -eq 0 ]; then
            echo "Restored the active source from durable protected evidence."
            exit 0
          fi
          rm -rf "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE"
          echo "Durable source evidence is not available yet; using the bounded GitHub bootstrap copy."
          source_run_id=""
          source_attempt=""
          source_handoff_name=""
          if [[ "$ACTIVE_DEPLOYMENT_ID" =~ ^pages-([0-9]+)-([0-9]+)$ ]]; then
            source_run_id="${BASH_REMATCH[1]}"
            source_attempt="${BASH_REMATCH[2]}"
            source_handoff_name="ravscore-operational-handoff-$source_run_id-$source_attempt"
          elif [[ "$ACTIVE_DEPLOYMENT_ID" =~ ^pages-recovery-([0-9]+)-([0-9]+)$ ]]; then
            source_run_id="${BASH_REMATCH[1]}"
            source_attempt="${BASH_REMATCH[2]}"
            source_handoff_name="ravscore-operational-recovery-handoff-$source_run_id-$source_attempt"
          else
            echo "Active RavScore source lacks a recoverable sealed deployment id." >&2
            exit 1
          fi
          gh run download "$source_run_id" \
            --name "$source_handoff_name" \
            --dir "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE"

      - name: Verify the complete currently public source model before begin CAS
        if: inputs.operational_action == 'candidate-execute' || inputs.operational_action == 'candidate-maintenance' || inputs.operational_action == 'candidate-historical-maintenance' || inputs.operational_action == 'candidate-legacy-maintenance' || inputs.operational_action == 'integrated-historical-maintenance' || (inputs.operational_action == 'integrated' && inputs.source_repair_id != '') || inputs.operational_action == 'integrated-return' || inputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          case "${{ inputs.operational_action }}" in
            candidate-execute) source_model="integrated" ;;
            candidate-maintenance) source_model="candidate-g" ;;
            candidate-historical-maintenance) source_model="candidate-g" ;;
            candidate-legacy-maintenance)
              node scripts/verify-legacy-candidate-g-source.mjs verify \
                --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
                --source-head "$GITHUB_SHA" \
                --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
                --attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json" \
                --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
              exit 0
              ;;
            integrated-return) source_model="candidate-g" ;;
            integrated-historical-maintenance) source_model="integrated" ;;
            integrated) source_model="integrated" ;;
            integrated-cutover)
              if [ "${{ inputs.legacy_source_required }}" = "true" ]; then
                node scripts/verify-legacy-candidate-g-source.mjs verify \
                  --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
                  --source-head "$GITHUB_SHA" \
                  --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
                  --attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json" \
                  --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
                exit 0
              fi
              source_model="candidate-g"
              ;;
            *) exit 1 ;;
          esac
          repair_args=()
          if [ -n "${{ inputs.source_repair_id }}" ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs';
          import { RAVSCORE_KNOWN_PUBLIC_SOURCE_REPAIR_POLICY as policy } from './scripts/lib/ravscore-known-public-source-repair.mjs';
          const root = process.env.RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE;
          const seal = JSON.parse(fs.readFileSync(`${root}/pages-artifact-seal.json`, 'utf8'));
          if (process.env.SOURCE_REPAIR_ID !== policy.id
            || process.env.ACTIVE_DEPLOYMENT_ID !== policy.sourceDeploymentId
            || sha256CanonicalJson(seal) !== policy.sourceArtifactSealSha256
            || seal.runId !== policy.sourceRunId
            || seal.runAttempt !== policy.sourceRunAttempt
            || seal.headSha !== policy.sourceHead
            || seal.attemptId !== policy.sourceDeploymentId
            || seal.artifactId !== policy.sourceArtifactId
            || seal.artifactDigestSha256 !== policy.sourceArtifactDigestSha256
            || seal.targetPublicManifestSha256 !== policy.sourcePublicManifestSha256
            || seal.targetImplementationClosureSha256
              !== policy.sourceImplementationClosureSha256
            || seal.privatePayloadIncluded !== false) {
            throw new Error('Known public source repair artifact seal is not exact');
          }
          NODE
            repair_args=(--known-source-repair-id "${{ inputs.source_repair_id }}")
          fi
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
            --source-head "$GITHUB_SHA" \
            --model "$source_model" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
            --binding "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE/target-binding.json" \
            --contract "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE/target-contract.js" \
            --bundle "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE/target-bundle.generated.js" \
            --public-closure "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE/target-public-closure.json" \
            --observation-nonce "source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "${repair_args[@]}" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
        env:
          SOURCE_REPAIR_ID: ${{ inputs.source_repair_id }}
          ACTIVE_DEPLOYMENT_ID: ${{ inputs.active_deployment_id }}

      - name: Backfill the exact active source into durable protected evidence
        if: inputs.legacy_source_required != 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/protected-operational-reentry-evidence.mjs --publish
          --directory "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE"
          --deployment-id "$(jq -er '.attemptId' "$RAVRADAR_OPERATIONAL_SOURCE_EVIDENCE/pages-artifact-seal.json")"
          --repository "$GITHUB_REPOSITORY"
          --output /tmp/ravradar-protected-source-publish.json

      - name: Publish exact target reentry evidence before any activation CAS
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          retain_args=()
          if [ "${{ inputs.legacy_source_required }}" != "true" ]; then
            source_manifest_sha256="$(SOURCE_MANIFEST="$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.SOURCE_MANIFEST, 'utf8'))));")"
            retain_args=(
              --retain-public-manifest-sha256 "$source_manifest_sha256"
              --require-retained
            )
          fi
          node scripts/protected-operational-reentry-evidence.mjs --publish \
            --directory "$RAVRADAR_OPERATIONAL_HANDOFF" \
            --deployment-id "pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            "${retain_args[@]}" \
            --output /tmp/ravradar-protected-target-publish.json

      - name: Upload privacy-safe source evidence before any activation CAS
        if: inputs.operational_action == 'candidate-execute' || inputs.operational_action == 'candidate-maintenance' || inputs.operational_action == 'candidate-historical-maintenance' || inputs.operational_action == 'candidate-legacy-maintenance' || inputs.operational_action == 'integrated-historical-maintenance' || (inputs.operational_action == 'integrated' && inputs.source_repair_id != '') || inputs.operational_action == 'integrated-return' || inputs.operational_action == 'integrated-cutover'
        uses: actions/upload-artifact@v7
        with:
          name: ravscore-operational-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_HANDOFF }}
          retention-days: 14
          if-no-files-found: error

      - name: Begin manual Candidate G rollback with exact central CAS
        id: candidate-begin
        if: inputs.operational_action == 'candidate-execute'
        run: >-
          node scripts/ravscore-operational-activation.mjs begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin scheduled Candidate G refresh with exact central CAS
        id: candidate-refresh-begin
        if: inputs.operational_action == 'candidate-maintenance'
        run: >-
          node scripts/ravscore-operational-activation.mjs refresh-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin historical-to-current Candidate G maintenance with exact central CAS
        id: candidate-historical-refresh-begin
        if: inputs.operational_action == 'candidate-historical-maintenance'
        run: >-
          node scripts/ravscore-operational-activation.mjs historical-refresh-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin legacy-to-current Candidate G refresh with exact central CAS
        id: candidate-legacy-refresh-begin
        if: inputs.operational_action == 'candidate-legacy-maintenance'
        run: >-
          node scripts/ravscore-operational-activation.mjs legacy-refresh-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin integrated return or first cutover with exact central CAS
        id: integrated-transition-begin
        if: inputs.operational_action == 'integrated-return' || inputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          source_attestation=()
          if [ "${{ inputs.legacy_source_required }}" = "true" ]; then
            source_attestation=(
              --source-attestation
              "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
            )
          fi
          node scripts/ravscore-operational-activation.mjs return-begin \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "${{ inputs.central_version }}" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json" \
            --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
            --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json" \
            "${source_attestation[@]}" \
            --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Begin historical-to-current integrated maintenance with exact central CAS
        id: integrated-historical-maintenance-begin
        if: inputs.operational_action == 'integrated-historical-maintenance' && inputs.code_only_repair != true
        run: >-
          node scripts/ravscore-operational-activation.mjs integrated-historical-maintenance-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Begin code-only integrated maintenance with durable intent before Pages deployment
        id: code-only-integrated-historical-maintenance-begin
        if: inputs.code_only_repair == true && inputs.operational_action == 'integrated-historical-maintenance'
        run: >-
          node scripts/ravscore-operational-activation.mjs integrated-historical-maintenance-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ inputs.central_version }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reconfirm exact main immediately before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Require horizon-valid weather immediately before Pages deployment
        if: inputs.code_only_repair != true
        shell: bash
        run: |
          set -euo pipefail
          target="$(jq -er '.productionReferenceAt | select(type == "string")' "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json")"
          node scripts/check-production-target-freshness.mjs \
            --target "$target" \
            --maximum-age-minutes 240

      - name: Require monotonic public generation immediately before Pages
        run: >-
          node scripts/check-pages-generation-order.mjs
          --handoff "$RAVRADAR_OPERATIONAL_HANDOFF"
          --base-url "$RAVRADAR_PUBLIC_BASE_URL"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed exact model, implementation and 210/673 artifact
        id: public-verification
        run: >-
          node scripts/verify-ravscore-operational-pages-deployment.mjs
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --source-head "$GITHUB_SHA"
          --model "${{ inputs.deployment_model }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --binding "$RAVRADAR_OPERATIONAL_HANDOFF/target-binding.json"
          --contract "$RAVRADAR_OPERATIONAL_HANDOFF/target-contract.js"
          --bundle "$RAVRADAR_OPERATIONAL_HANDOFF/target-bundle.generated.js"
          --public-closure "$RAVRADAR_OPERATIONAL_HANDOFF/target-public-closure.json"
          --observation-nonce "target-${{ github.run_id }}-${{ github.run_attempt }}"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json"

      - name: Reconfirm exact main before activation completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Revalidate checkpoint disposition before Pages completion CAS
        id: checkpoint-disposition-complete
        shell: bash
        env:
          CHECKPOINT_VALIDATION_PHASE: complete
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs';

          const root = process.env.RAVRADAR_OPERATIONAL_HANDOFF;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const handoff = read('handoff.json');
          const manifest = read('manifest.json');
          const disposition = read('checkpoint-disposition.json');
          const runtimeAudit = read('checkpoint-runtime-audit.json');
          const expectedDispositionKeys = [
            'bindingSha256',
            'checkpointRequired',
            'datasetId',
            'disposition',
            'privatePayloadIncluded',
            'rollbackActivationReady',
            'rollbackStatus',
            'runtimeAuditSha256',
            'schemaVersion',
            'sourceHead',
          ].sort();
          const fail = (message) => { throw new Error(`Checkpoint disposition ${process.env.CHECKPOINT_VALIDATION_PHASE} validation failed: ${message}`); };
          if (disposition.schemaVersion !== 'ravscore-continuation-checkpoint-disposition-v1') fail('schema');
          if (JSON.stringify(Object.keys(disposition).sort()) !== JSON.stringify(expectedDispositionKeys)) fail('unexpected fields');
          if (disposition.sourceHead !== process.env.GITHUB_SHA || handoff.sourceHead !== process.env.GITHUB_SHA) fail('source head');
          if (!disposition.datasetId || disposition.datasetId !== manifest.datasetId || disposition.datasetId !== runtimeAudit.datasetId) fail('dataset binding');
          if (disposition.privatePayloadIncluded !== false || handoff.privatePayloadIncluded !== false) fail('privacy marker');
          const { bindingSha256, ...binding } = disposition;
          if (!/^[a-f0-9]{64}$/.test(bindingSha256) || sha256CanonicalJson(binding) !== bindingSha256) fail('canonical binding');
          if (!/^[a-f0-9]{64}$/.test(disposition.runtimeAuditSha256) || sha256CanonicalJson(runtimeAudit) !== disposition.runtimeAuditSha256) fail('runtime audit binding');
          if (
            handoff.checkpointDisposition !== disposition.disposition
            || handoff.checkpointDispositionSha256 !== bindingSha256
            || handoff.checkpointDatasetId !== disposition.datasetId
            || handoff.checkpointRuntimeAuditSha256 !== disposition.runtimeAuditSha256
          ) fail('handoff binding');
          if (disposition.disposition === 'READY_PUBLISHED') {
            if (disposition.rollbackStatus !== 'READY' || disposition.rollbackActivationReady !== true || disposition.checkpointRequired !== true) fail('READY disposition state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('READY result proof');
          } else if (disposition.disposition === 'MEASURED_WARMUP_PUBLISHED') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== true) fail('measured continuation state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('measured continuation result proof');
          } else if (disposition.disposition === 'NOT_APPLICABLE_DURING_MEASURED_WARMUP') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== false) fail('warm-up disposition state');
            if (handoff.checkpointBuildOutcome !== 'skipped' || handoff.checkpointSaveOutcome !== 'skipped' || handoff.checkpointPublishOutcome !== 'skipped') fail('warm-up result proof');
          } else {
            fail('unsupported disposition');
          }
          NODE

      - name: Complete Candidate G rollback only after public verification
        id: candidate-complete
        if: inputs.operational_action == 'candidate-execute'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh already active Candidate G central evidence after public verification
        id: candidate-refresh-complete
        if: inputs.operational_action == 'candidate-maintenance'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs refresh-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Complete historical-to-current Candidate G maintenance only after public verification
        id: candidate-historical-refresh-complete
        if: inputs.operational_action == 'candidate-historical-maintenance'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs historical-refresh-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/completed.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Complete legacy-to-current Candidate G refresh only after public verification
        id: candidate-legacy-refresh-complete
        if: inputs.operational_action == 'candidate-legacy-maintenance'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs legacy-refresh-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/completed.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Complete integrated return or first cutover only after public verification
        id: integrated-transition-complete
        if: inputs.operational_action == 'integrated-return' || inputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs return-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Complete historical-to-current integrated maintenance only after public verification
        continue-on-error: ${{ inputs.operational_action == 'integrated-cutover' || inputs.operational_action == 'integrated-historical-maintenance' }}
        id: integrated-historical-maintenance-complete
        if: inputs.operational_action == 'integrated-historical-maintenance'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs integrated-historical-maintenance-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/completed.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reseal ordinary integrated production without changing model identity
        id: integrated-maintenance-complete
        if: inputs.operational_action == 'integrated'
        run: >-
          node scripts/ravscore-operational-activation.mjs integrated-maintenance
          --expected-version "${{ inputs.central_version }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
          --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json"
          --requested-implementation-closure-sha256 "${{ inputs.integrated_implementation_closure_sha256 }}"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reconcile an ambiguous failed transition from observed public identity
        continue-on-error: ${{ inputs.operational_action == 'integrated-cutover' || inputs.operational_action == 'integrated-historical-maintenance' }}
        id: failure-reconciliation
        if: (failure() || (inputs.operational_action == 'integrated-cutover' && (steps.deployment.outcome != 'success' || steps.public-verification.outcome != 'success' || steps.integrated-transition-complete.outcome != 'success')) || ((steps.integrated-historical-maintenance-begin.outcome == 'success' || steps.code-only-integrated-historical-maintenance-begin.outcome == 'success') && steps.integrated-historical-maintenance-complete.outcome != 'success')) && (steps.candidate-begin.outcome == 'success' || steps.candidate-refresh-begin.outcome == 'success' || steps.candidate-historical-refresh-begin.outcome == 'success' || steps.candidate-legacy-refresh-begin.outcome == 'success' || steps.integrated-transition-begin.outcome == 'success' || steps.integrated-historical-maintenance-begin.outcome == 'success' || steps.code-only-integrated-historical-maintenance-begin.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          begin_file="$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
          pending_version="$(jq -r '.centralVersion' "$begin_file")"
          attempt_id="$(jq -r '.deploymentId' "$begin_file")"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json"
          test "$(jq -r '.pending' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json")" = "true"
          test "$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json")" = "$pending_version"
          test "$(jq -r '.deploymentId' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json")" = "$attempt_id"
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-failure-reconcile=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-1" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest-1.json"
          observed_at_1="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          sleep 2
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-failure-reconcile=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-2" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest-2.json"
          observed_at_2="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          jq -n --slurpfile manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest-1.json" \
            --arg observationNonce "failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-1" \
            --arg observedAt "$observed_at_1" \
            '{manifest:$manifest[0],observationNonce:$observationNonce,observedAt:$observedAt}' \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observation-1.json"
          jq -n --slurpfile manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest-2.json" \
            --arg observationNonce "failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-2" \
            --arg observedAt "$observed_at_2" \
            '{manifest:$manifest[0],observationNonce:$observationNonce,observedAt:$observedAt}' \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observation-2.json"
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observations.json"
          cp "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest-2.json" \
            "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json"
          node scripts/ravscore-operational-activation.mjs classify-pending \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json"
          classification="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json")"
          model="$(jq -r '.model' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json")"
          if [ "$classification" = "complete" ]; then
            node scripts/verify-ravscore-operational-pages-deployment.mjs \
              --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
              --source-head "$GITHUB_SHA" \
              --model "$model" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --binding "$RAVRADAR_OPERATIONAL_HANDOFF/target-binding.json" \
              --contract "$RAVRADAR_OPERATIONAL_HANDOFF/target-contract.js" \
              --bundle "$RAVRADAR_OPERATIONAL_HANDOFF/target-bundle.generated.js" \
              --public-closure "$RAVRADAR_OPERATIONAL_HANDOFF/target-public-closure.json" \
              --observation-nonce "failure-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-verification.json"
          elif [ "$classification" = "wait" ]; then
            if [ "${{ steps.deployment.outcome }}" != "skipped" ]; then
              echo "Source remains public after a Pages attempt that may have started; PENDING remains fail-closed." >&2
              exit 1
            fi
            jq --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
              '{schemaVersion:"ravscore-operational-pages-attempt-terminal-v1",transitionSourceHead:.sourceHead,requestedPublicManifestSha256:.requestedPublicManifestSha256,attemptId:.deploymentId,status:"FAILED_BEFORE_PAGES_ACCEPTANCE",pagesRequestAccepted:false,observedSourcePublicManifestSha256:.sourcePublicManifestSha256,checkedAt:$checkedAt,evidenceSource:"github-actions-pages-terminal-readback",privatePayloadRead:false}' \
              "$begin_file" \
              > "$RAVRADAR_OPERATIONAL_HANDOFF/terminal-evidence.json"
          else
            echo "Failed transition exposed neither its sealed source nor target; refusing reconciliation." >&2
            exit 1
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          if [ "$classification" = "complete" ]; then
            completion_args=()
            if [ "$model" = "integrated" ]; then
              completion_args=(
                --readiness "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-readiness.json"
                --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
                --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
              )
            else
              test "$model" = "candidate-g"
              completion_args=(--plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json")
            fi
            CHECKPOINT_TARGET_MANIFEST="$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs';

          const root = process.env.RAVRADAR_OPERATIONAL_HANDOFF;
          const read = (name) => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const handoff = read('handoff.json');
          const manifest = read('manifest.json');
          const observedManifest = JSON.parse(fs.readFileSync(process.env.CHECKPOINT_TARGET_MANIFEST, 'utf8'));
          const disposition = read('checkpoint-disposition.json');
          const runtimeAudit = read('checkpoint-runtime-audit.json');
          const expectedDispositionKeys = [
            'bindingSha256',
            'checkpointRequired',
            'datasetId',
            'disposition',
            'privatePayloadIncluded',
            'rollbackActivationReady',
            'rollbackStatus',
            'runtimeAuditSha256',
            'schemaVersion',
            'sourceHead',
          ].sort();
          const fail = (message) => { throw new Error(`Failure reconciliation checkpoint disposition validation failed: ${message}`); };
          if (disposition.schemaVersion !== 'ravscore-continuation-checkpoint-disposition-v1') fail('schema');
          if (JSON.stringify(Object.keys(disposition).sort()) !== JSON.stringify(expectedDispositionKeys)) fail('unexpected fields');
          if (disposition.sourceHead !== process.env.GITHUB_SHA || handoff.sourceHead !== process.env.GITHUB_SHA) fail('source head');
          if (!disposition.datasetId || disposition.datasetId !== manifest.datasetId || disposition.datasetId !== observedManifest.datasetId || disposition.datasetId !== runtimeAudit.datasetId) fail('dataset binding');
          if (disposition.privatePayloadIncluded !== false || handoff.privatePayloadIncluded !== false) fail('privacy marker');
          const { bindingSha256, ...binding } = disposition;
          if (!/^[a-f0-9]{64}$/.test(bindingSha256) || sha256CanonicalJson(binding) !== bindingSha256) fail('canonical binding');
          if (!/^[a-f0-9]{64}$/.test(disposition.runtimeAuditSha256) || sha256CanonicalJson(runtimeAudit) !== disposition.runtimeAuditSha256) fail('runtime audit binding');
          if (
            handoff.checkpointDisposition !== disposition.disposition
            || handoff.checkpointDispositionSha256 !== bindingSha256
            || handoff.checkpointDatasetId !== disposition.datasetId
            || handoff.checkpointRuntimeAuditSha256 !== disposition.runtimeAuditSha256
          ) fail('handoff binding');
          if (disposition.disposition === 'READY_PUBLISHED') {
            if (disposition.rollbackStatus !== 'READY' || disposition.rollbackActivationReady !== true || disposition.checkpointRequired !== true) fail('READY disposition state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('READY result proof');
          } else if (disposition.disposition === 'MEASURED_WARMUP_PUBLISHED') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== true) fail('measured continuation state');
            if (handoff.checkpointBuildOutcome !== 'success' || handoff.checkpointSaveOutcome !== 'success' || handoff.checkpointPublishOutcome !== 'success') fail('measured continuation result proof');
          } else if (disposition.disposition === 'NOT_APPLICABLE_DURING_MEASURED_WARMUP') {
            if (disposition.rollbackStatus !== 'BUILDING_MEASURED_ONLY' || disposition.rollbackActivationReady !== false || disposition.checkpointRequired !== false) fail('warm-up disposition state');
            if (handoff.checkpointBuildOutcome !== 'skipped' || handoff.checkpointSaveOutcome !== 'skipped' || handoff.checkpointPublishOutcome !== 'skipped') fail('warm-up result proof');
          } else {
            fail('unsupported disposition');
          }
          NODE
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --observations "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observations.json" \
              --verification "$RAVRADAR_OPERATIONAL_HANDOFF/failure-verification.json" \
              "${completion_args[@]}" \
              --deployment-id "$attempt_id" \
              --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-reconciled.json"
          else
            source_args=()
            if [ "$model" = "legacy-candidate-g" ]; then
              source_args=(
                --source-attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
              )
            fi
            if [ "$(jq -r '.requestedModel' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json")" = "integrated" ]; then
              source_args+=(--plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json")
            elif [ "$model" = "candidate-g" ] \
              && [ "$(jq -r '.bindingCurrent' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-current.json")" != "true" ]; then
              source_args+=(--plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json")
            fi
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --observations "$RAVRADAR_OPERATIONAL_HANDOFF/failure-observations.json" \
              --verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json" \
              "${source_args[@]}" \
              --terminal-evidence "$RAVRADAR_OPERATIONAL_HANDOFF/terminal-evidence.json" \
              --failure-code "FAILED_RUN_SOURCE_RECONCILED" \
              --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-reconciled.json"
          fi
          case "$(jq -r '.status' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-reconciled.json")" in
            CANDIDATE_G_PENDING|INTEGRATED_PENDING) exit 1 ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seal exact verified deployment terminal
        id: deployment-terminal
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.deployment.outcome }}" = "success"
          test "${{ steps.public-verification.outcome }}" = "success"
          test "${{ steps.checkpoint-disposition-complete.outcome }}" = "success"
          case "${{ inputs.operational_action }}" in
            candidate-execute)
              test "${{ steps.candidate-begin.outcome }}" = "success"
              test "${{ steps.candidate-complete.outcome }}" = "success"
              ;;
            candidate-maintenance)
              test "${{ steps.candidate-refresh-begin.outcome }}" = "success"
              test "${{ steps.candidate-refresh-complete.outcome }}" = "success"
              ;;
            candidate-historical-maintenance)
              test "${{ steps.candidate-historical-refresh-begin.outcome }}" = "success"
              test "${{ steps.candidate-historical-refresh-complete.outcome }}" = "success"
              ;;
            candidate-legacy-maintenance)
              test "${{ steps.candidate-legacy-refresh-begin.outcome }}" = "success"
              test "${{ steps.candidate-legacy-refresh-complete.outcome }}" = "success"
              ;;
            integrated-return)
              test "${{ steps.integrated-transition-begin.outcome }}" = "success"
              test "${{ steps.integrated-transition-complete.outcome }}" = "success"
              ;;
            integrated-cutover)
              test "${{ steps.integrated-transition-begin.outcome }}" = "success"
              if test "${{ steps.integrated-transition-complete.outcome }}" != "success"; then
                test "${{ steps.failure-reconciliation.outcome }}" = "success"
              fi
              ;;
            integrated-historical-maintenance)
              if test "${{ inputs.code_only_repair }}" = "true"; then
                test "${{ steps.code-only-integrated-historical-maintenance-begin.outcome }}" = "success"
              else
                test "${{ steps.integrated-historical-maintenance-begin.outcome }}" = "success"
              fi
              if test "${{ steps.integrated-historical-maintenance-complete.outcome }}" != "success"; then
                test "${{ steps.failure-reconciliation.outcome }}" = "success"
              fi
              ;;
            integrated)
              test "${{ steps.integrated-maintenance-complete.outcome }}" = "success"
              ;;
            *)
              echo "Unsupported operational action cannot be marked deployed." >&2
              exit 1
              ;;
          esac
          echo "deployed_verified=true" >> "$GITHUB_OUTPUT"
