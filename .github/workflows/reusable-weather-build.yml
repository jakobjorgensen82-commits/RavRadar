name: Reusable RavRadar weather build and preparation

on:
  workflow_call:
    inputs:
      production_target_hour:
        required: true
        type: string
      force:
        required: true
        type: boolean
      ravscore_candidate_g_rollback_mode:
        required: true
        type: string
      ravscore_candidate_g_rollback_confirmation:
        required: true
        type: string
      ravscore_integrated_first_cutover:
        required: true
        type: boolean
      ravscore_integrated_first_cutover_confirmation:
        required: true
        type: string
      ravscore_integrated_return:
        required: true
        type: boolean
      ravscore_integrated_return_confirmation:
        required: true
        type: string
    secrets:
      CLOUDFLARE_TRIP_GATEWAY_URL:
        required: true
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: true
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: true
      DMI_API_KEY:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      SUPABASE_URL:
        required: true
      TRIP_GATEWAY_SHARED_SECRET:
        required: true
    outputs:
      should_deploy:
        description: "Forwarded build-and-prepare should_deploy contract"
        value: ${{ jobs.build-and-prepare.outputs.should_deploy }}
      preflight_should_run:
        description: "Forwarded build-and-prepare preflight_should_run contract"
        value: ${{ jobs.build-and-prepare.outputs.preflight_should_run }}
      operational_action:
        description: "Forwarded build-and-prepare operational_action contract"
        value: ${{ jobs.build-and-prepare.outputs.operational_action }}
      operational_model:
        description: "Forwarded build-and-prepare operational_model contract"
        value: ${{ jobs.build-and-prepare.outputs.operational_model }}
      operational_binding_current:
        description: "Forwarded build-and-prepare operational_binding_current contract"
        value: ${{ jobs.build-and-prepare.outputs.operational_binding_current }}
      central_version:
        description: "Forwarded build-and-prepare central_version contract"
        value: ${{ jobs.build-and-prepare.outputs.central_version }}
      initial_cutover_required:
        description: "Forwarded build-and-prepare initial_cutover_required contract"
        value: ${{ jobs.build-and-prepare.outputs.initial_cutover_required }}
      legacy_source_required:
        description: "Forwarded build-and-prepare legacy_source_required contract"
        value: ${{ jobs.build-and-prepare.outputs.legacy_source_required }}
      deployment_model:
        description: "Forwarded build-and-prepare deployment_model contract"
        value: ${{ jobs.build-and-prepare.outputs.deployment_model }}
      integrated_implementation_closure_sha256:
        description: "Forwarded build-and-prepare integrated_implementation_closure_sha256 contract"
        value: ${{ jobs.build-and-prepare.outputs.integrated_implementation_closure_sha256 }}
      active_deployment_id:
        description: "Forwarded build-and-prepare active_deployment_id contract"
        value: ${{ jobs.build-and-prepare.outputs.active_deployment_id }}
      weather_outcome:
        description: "Forwarded build-and-prepare weather_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.weather_outcome }}
      full_validation_outcome:
        description: "Forwarded build-and-prepare full_validation_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.full_validation_outcome }}
      release_gate_outcome:
        description: "Forwarded build-and-prepare release_gate_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.release_gate_outcome }}
      pages_build_outcome:
        description: "Forwarded build-and-prepare pages_build_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.pages_build_outcome }}
      pages_privacy_outcome:
        description: "Forwarded build-and-prepare pages_privacy_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.pages_privacy_outcome }}
      pages_artifact_seal_outcome:
        description: "Forwarded build-and-prepare pages_artifact_seal_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.pages_artifact_seal_outcome }}
      handoff_upload_outcome:
        description: "Forwarded build-and-prepare handoff_upload_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.handoff_upload_outcome }}
      checkpoint_disposition:
        description: "Hash-bound checkpoint disposition for this built dataset"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_disposition }}
      checkpoint_disposition_sha256:
        description: "Canonical checkpoint disposition binding SHA-256"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_disposition_sha256 }}
      checkpoint_dataset_id:
        description: "Dataset bound by the checkpoint disposition"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_dataset_id }}
      checkpoint_runtime_audit_sha256:
        description: "Runtime audit SHA-256 bound by the checkpoint disposition"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_runtime_audit_sha256 }}
      checkpoint_build_outcome:
        description: "Checkpoint build step outcome"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_build_outcome }}
      checkpoint_save_outcome:
        description: "Checkpoint cache-save step outcome"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_save_outcome }}
      checkpoint_publish_outcome:
        description: "Protected checkpoint publish step outcome"
        value: ${{ jobs.build-and-prepare.outputs.checkpoint_publish_outcome }}
      pages_configure_outcome:
        description: "Forwarded build-and-prepare pages_configure_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.pages_configure_outcome }}
      pages_upload_outcome:
        description: "Forwarded build-and-prepare pages_upload_outcome contract"
        value: ${{ jobs.build-and-prepare.outputs.pages_upload_outcome }}
      artifact_built:
        description: "Forwarded build-and-prepare artifact_built contract"
        value: ${{ jobs.build-and-prepare.outputs.artifact_built }}

permissions:
  contents: read
  actions: read

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      # Every production build remains bound to the UTC hour resolved at
      # readiness, even if the job crosses an hour boundary. The authoritative
      # Copernicus target list is derived from fresh DMI for this exact hour.
      RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ inputs.production_target_hour }}
      RAVRADAR_PRIVATE_RUNTIME_ROOT: /tmp/ravradar-private-production-runtime
      RAVRADAR_PRIVATE_RUNTIME_BUNDLE: /tmp/ravradar-private-production-runtime/bundle
      RAVRADAR_PRIVATE_RUNTIME_RESTORE: /tmp/ravradar-private-production-runtime/restored
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-model
      RAVRADAR_LEGACY_SOURCE_ROOT: /tmp/ravradar-legacy-candidate-source
      RAVRADAR_CANDIDATE_STAGE: /tmp/ravradar-candidate-g-pages
      RAVRADAR_OPERATIONAL_HANDOFF: /tmp/ravradar-operational-handoff
      RAVRADAR_PREFLIGHT_WORK: .cache/weather-preflight-work
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    outputs:
      should_deploy: ${{ steps.deployment-decision.outputs.should_deploy }}
      preflight_should_run: ${{ steps.preflight.outputs.should_run }}
      operational_action: ${{ steps.operational-action.outputs.action }}
      operational_model: ${{ steps.operational-model.outputs.model }}
      operational_binding_current: ${{ steps.operational-model.outputs.binding_current }}
      central_version: ${{ steps.operational-model.outputs.central_version }}
      initial_cutover_required: ${{ steps.operational-model.outputs.initial_cutover_required }}
      legacy_source_required: ${{ steps.operational-model.outputs.legacy_source_required }}
      deployment_model: ${{ steps.deployment-decision.outputs.deployment_model }}
      integrated_implementation_closure_sha256: ${{ steps.integrated-implementation.outputs.closure_sha256 }}
      active_deployment_id: ${{ steps.operational-model.outputs.active_deployment_id }}
      weather_outcome: ${{ steps.weather.outcome }}
      full_validation_outcome: ${{ steps.full-validation.outcome }}
      release_gate_outcome: ${{ steps.release-gate.outcome }}
      pages_build_outcome: ${{ steps.pages-build.outcome }}
      pages_privacy_outcome: ${{ steps.pages-privacy.outcome }}
      pages_artifact_seal_outcome: ${{ steps.pages-artifact-seal.outcome }}
      handoff_upload_outcome: ${{ steps.handoff-upload.outcome }}
      checkpoint_disposition: ${{ steps.checkpoint-disposition.outputs.disposition }}
      checkpoint_disposition_sha256: ${{ steps.checkpoint-disposition.outputs.disposition_sha256 }}
      checkpoint_dataset_id: ${{ steps.checkpoint-disposition.outputs.dataset_id }}
      checkpoint_runtime_audit_sha256: ${{ steps.checkpoint-disposition.outputs.runtime_audit_sha256 }}
      checkpoint_build_outcome: ${{ steps.checkpoint-build.outcome }}
      checkpoint_save_outcome: ${{ steps.checkpoint-save.outcome }}
      checkpoint_publish_outcome: ${{ steps.checkpoint-publish.outcome }}
      pages_configure_outcome: ${{ steps.pages-configure.outcome }}
      pages_upload_outcome: ${{ steps.pages-upload.outcome }}
      artifact_built: ${{ steps.pages-build.outputs.built }}

    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read exact centrally active operational RavScore
        id: operational-model
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          echo "model=$(jq -r '.model' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "binding_current=$(jq -r '.bindingCurrent' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "central_version=$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "initial_cutover_required=$(jq -r '.initialCutoverRequired' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "legacy_source_required=$(jq -r '.legacySourceRequired' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "active_source_head=$(jq -r '.sourceHead // ""' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "active_implementation_closure_sha256=$(jq -r '.activeImplementationClosureSha256 // ""' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "active_deployment_id=$(jq -r '.deploymentId // ""' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Resolve one fail-closed operational model action
        id: operational-action
        shell: bash
        env:
          ACTIVE_MODEL: ${{ steps.operational-model.outputs.model }}
          BINDING_CURRENT: ${{ steps.operational-model.outputs.binding_current }}
          INITIAL_CUTOVER_REQUIRED: ${{ steps.operational-model.outputs.initial_cutover_required }}
          LEGACY_SOURCE_REQUIRED: ${{ steps.operational-model.outputs.legacy_source_required }}
          CENTRAL_VERSION: ${{ steps.operational-model.outputs.central_version }}
          ACTIVE_DEPLOYMENT_ID: ${{ steps.operational-model.outputs.active_deployment_id }}
          ACTIVE_SOURCE_HEAD: ${{ steps.operational-model.outputs.active_source_head }}
          ACTIVE_IMPLEMENTATION_CLOSURE_SHA256: ${{ steps.operational-model.outputs.active_implementation_closure_sha256 }}
          ROLLBACK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_candidate_g_rollback_mode || 'none' }}
          ROLLBACK_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_candidate_g_rollback_confirmation || '' }}
          FIRST_CUTOVER_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_first_cutover || false }}
          FIRST_CUTOVER_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_first_cutover_confirmation || '' }}
          RETURN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_return || false }}
          RETURN_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_return_confirmation || '' }}
        run: |
          transition_count=0
          if [ "$ROLLBACK_MODE" != "none" ]; then transition_count=$((transition_count + 1)); fi
          if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then transition_count=$((transition_count + 1)); fi
          if [ "$RETURN_REQUESTED" = "true" ]; then transition_count=$((transition_count + 1)); fi
          if [ "$transition_count" -gt 1 ]; then
            echo "Candidate G-rollback, integrated first cutover and integrated return are mutually exclusive."
            exit 1
          fi
          case "$FIRST_CUTOVER_REQUESTED" in true|false) ;; *) echo "Unknown integrated first cutover flag."; exit 1 ;; esac
          if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$FIRST_CUTOVER_CONFIRMATION" = "EXECUTE-INTEGRATED-RAVSCORE-FIRST-CUTOVER-AFTER-CAPACITY-GATE"
          elif [ -n "$FIRST_CUTOVER_CONFIRMATION" ]; then
            echo "Integrated first cutover confirmation requires its explicit manual flag."
            exit 1
          fi
          case "$ACTIVE_MODEL" in
            integrated)
              if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then
                echo "Integrated first cutover requires Candidate G to be active."
                exit 1
              fi
              if [ "$RETURN_REQUESTED" = "true" ]; then
                echo "Integrated return requires Candidate G to be active already."
                exit 1
              fi
              if [ "$BINDING_CURRENT" != "true" ]; then
                test "$BINDING_CURRENT" = "false"
                if [ "$ROLLBACK_MODE" != "none" ]; then
                  echo "Historical integrated binding must be upgraded before Candidate G rollback planning."
                  exit 1
                fi
                action="integrated-historical-maintenance"
              else
                case "$ROLLBACK_MODE" in
                  none) action="integrated" ;;
                  dry-run) action="candidate-dry-run" ;;
                  execute)
                    test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
                    test "$ROLLBACK_CONFIRMATION" = "EXECUTE-CANDIDATE-G-ROLLBACK"
                    action="candidate-execute"
                    ;;
                  *) echo "Unknown Candidate G rollback mode."; exit 1 ;;
                esac
              fi
              ;;
            candidate-g)
              if [ "$INITIAL_CUTOVER_REQUIRED" = "true" ]; then
                test "$ROLLBACK_MODE" = "none"
                test "$RETURN_REQUESTED" != "true"
                [[ "$CENTRAL_VERSION" =~ ^[1-9][0-9]*$ ]]
                [[ "$ACTIVE_DEPLOYMENT_ID" =~ ^pages(-recovery)?-[0-9]+-[0-9]+$ ]]
                [[ "$ACTIVE_IMPLEMENTATION_CLOSURE_SHA256" =~ ^[a-f0-9]{64}$ ]]
                if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then
                  test "$BINDING_CURRENT" = "true"
                  test "$LEGACY_SOURCE_REQUIRED" = "false"
                  [[ "$ACTIVE_SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
                  test "$ACTIVE_SOURCE_HEAD" = "$GITHUB_SHA"
                  action="integrated-cutover"
                elif [ "$BINDING_CURRENT" = "true" ]; then
                  action="candidate-maintenance"
                else
                  test "$BINDING_CURRENT" = "false"
                  action="candidate-historical-maintenance"
                fi
                echo "action=$action" >> "$GITHUB_OUTPUT"
                echo "Operational action: $action."
                exit 0
              fi
              if [ "$ROLLBACK_MODE" != "none" ]; then
                echo "Candidate G is already active; a new rollback may not be initiated."
                exit 1
              fi
              if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then
                echo "Integrated first cutover is accepted only while the initial cutover remains required."
                exit 1
              fi
              if [ "$RETURN_REQUESTED" = "true" ]; then
                test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
                test "$RETURN_CONFIRMATION" = "EXECUTE-INTEGRATED-RAVSCORE-RETURN"
                action="integrated-return"
              elif [ "$BINDING_CURRENT" = "true" ]; then
                action="candidate-maintenance"
              else
                test "$BINDING_CURRENT" = "false"
                action="candidate-historical-maintenance"
              fi
              ;;
            legacy-candidate-g)
              test "$INITIAL_CUTOVER_REQUIRED" = "true"
              test "$LEGACY_SOURCE_REQUIRED" = "true"
              test "$ROLLBACK_MODE" = "none"
              test "$RETURN_REQUESTED" != "true"
              test "$FIRST_CUTOVER_REQUESTED" != "true"
              action="candidate-legacy-maintenance"
              ;;
            *) echo "Unknown operational RavScore model; refusing production."; exit 1 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Operational action: $action."

      - name: Set up Python preflight
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore dataminimized weather preflight metadata
        id: weather-preflight-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-preflight-state
          key: weather-preflight-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weather-preflight-state-v1-${{ runner.os }}-

      - name: Fetch only the deployed public manifest for weather preflight
        id: public-preflight-manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RAVRADAR_PREFLIGHT_WORK"
          manifest="$RAVRADAR_PREFLIGHT_WORK/public-manifest.json"
          if curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 --max-filesize 131072 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?weather-preflight=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$manifest"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$manifest"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Weather preflight will build::The small deployed manifest could not be attested."
          fi

      - name: Decide whether weather needs updating before private runtime download
        id: preflight
        shell: bash
        env:
          RAVRADAR_FORCE_UPDATE: ${{ github.event_name == 'push' || inputs.force == true || steps.operational-action.outputs.action != 'integrated' }}
          RAVRADAR_MAX_STALE_MINUTES: 30
          RAVRADAR_PREFLIGHT_TIMEOUT_SECONDS: 20
          WEATHER_USER_AGENT: "RavRadar/4.0.322 (${{ github.server_url }}/${{ github.repository }})"
          PREFLIGHT_CACHE_KEY: ${{ steps.weather-preflight-cache.outputs.cache-matched-key }}
          PUBLIC_MANIFEST_AVAILABLE: ${{ steps.public-preflight-manifest.outputs.available }}
        run: |
          set -uo pipefail
          state=.cache/weather-preflight-state/state.json
          input_root="$RAVRADAR_PREFLIGHT_WORK/input"
          if test -n "$PREFLIGHT_CACHE_KEY" && test "$PUBLIC_MANIFEST_AVAILABLE" = "true" && test -f "$state"; then
            rm -rf "$input_root"
            mkdir -p "$input_root/scripts"
            if node scripts/private-production-runtime-workflow.mjs materialize-preflight \
              --repository-root "$GITHUB_WORKSPACE" \
              --state "$state" \
              --public-manifest "$RAVRADAR_PREFLIGHT_WORK/public-manifest.json" \
              --output-root "$input_root"; then
              cp scripts/check-weather-update.py "$input_root/scripts/check-weather-update.py"
              if (cd "$input_root" && python scripts/check-weather-update.py); then
                exit 0
              fi
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "dmi_changed=false" >> "$GITHUB_OUTPUT"
          echo "reason=verified-light-preflight-unavailable" >> "$GITHUB_OUTPUT"
          echo "age_minutes=unknown" >> "$GITHUB_OUTPUT"
          echo "Weather build required because no matching dataminimized preflight state was available."

      - name: Report skipped refresh
        if: steps.preflight.outputs.should_run != 'true'
        run: |
          echo "RavRadar weather is fresh and no newer DMI model run was found."
          echo "Reason: ${{ steps.preflight.outputs.reason }}"
          echo "Weather age: ${{ steps.preflight.outputs.age_minutes }} minutes"

      - name: Install production geometry tools
        if: steps.preflight.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Build constrained natural zone coastlines
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/refine-coastlines-constrained-4.0.48.py

      - name: Sync centrally saved admin configuration
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and deletions
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/apply-central-zone-reviews.py

      - name: Materialize the authoritative active coastal-part registry
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Restore the latest atomic schema-6 and Candidate G rollback checkpoint
        if: steps.preflight.outputs.should_run == 'true'
        id: ravscore-checkpoint-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ravscore-continuation-checkpoint
          key: ravscore-continuation-schema6-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ravscore-continuation-schema6-v2-

      - name: Restore protected atomic RavScore checkpoint when cache is absent
        if: steps.preflight.outputs.should_run == 'true' && steps.ravscore-checkpoint-cache.outputs.cache-matched-key == ''
        run: >-
          node scripts/protected-ravscore-continuation-checkpoint.mjs
          --restore
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build current private-runtime restore expectation
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          node scripts/private-production-runtime-workflow.mjs expected
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output .cache/private-production-runtime-expected.json

      - name: Restore newest compatible private runtime from protected storage
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          node scripts/protected-private-production-runtime.mjs
          --restore
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --repository-root "$GITHUB_WORKSPACE"
          --expected .cache/private-production-runtime-expected.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Inspect private production runtime availability
        if: steps.preflight.outputs.should_run == 'true'
        id: private-runtime-state
        shell: bash
        run: |
          if test -f "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "A private production runtime bundle is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No private production runtime bundle was restored."
          fi

      - name: Verify and restore the private production runtime bundle
        if: steps.preflight.outputs.should_run == 'true' && steps.private-runtime-state.outputs.available == 'true'
        run: >-
          node scripts/private-production-runtime-bundle.mjs restore
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --expected .cache/private-production-runtime-expected.json
          --output "$RAVRADAR_PRIVATE_RUNTIME_RESTORE"

      - name: Install only the allowlisted restored private runtime files
        if: steps.preflight.outputs.should_run == 'true' && steps.private-runtime-state.outputs.available == 'true'
        run: >-
          node scripts/private-production-runtime-workflow.mjs install
          --restored "$RAVRADAR_PRIVATE_RUNTIME_RESTORE"
          --repository-root "$GITHUB_WORKSPACE"

      - name: Resolve the one-time Candidate G bootstrap gate
        if: steps.preflight.outputs.should_run == 'true'
        id: legacy-bootstrap
        shell: bash
        env:
          PRIVATE_RUNTIME_AVAILABLE: ${{ steps.private-runtime-state.outputs.available }}
          OPERATIONAL_ACTION: ${{ steps.operational-action.outputs.action }}
        run: |
          if test "$PRIVATE_RUNTIME_AVAILABLE" = "true" || test -f .cache/ravscore-continuation-checkpoint/checkpoint.json; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "stateless_integrated_recovery=false" >> "$GITHUB_OUTPUT"
            echo "Private integrated continuation is available."
          elif test "$OPERATIONAL_ACTION" = "integrated-cutover"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "stateless_integrated_recovery=false" >> "$GITHUB_OUTPUT"
            echo "No integrated continuation exists; the exact one-time Candidate G bootstrap is required."
          elif test "$OPERATIONAL_ACTION" = "integrated"; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "stateless_integrated_recovery=true" >> "$GITHUB_OUTPUT"
            echo "No protected continuation exists; active integrated scoring will use measured state-less recovery."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "stateless_integrated_recovery=false" >> "$GITHUB_OUTPUT"
            echo "No protected continuation exists; this non-integrated action remains fail-closed."
          fi

      - name: Import exact public Candidate G runtime only for first integrated bootstrap
        if: steps.legacy-bootstrap.outputs.required == 'true'
        run: python scripts/hydrate-deployed-weather.py --legacy-candidate-g-bootstrap
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.322 (${{ github.server_url }}/${{ github.repository }})"

      - name: Resolve one aggregate Candidate G wave-bootstrap target
        if: steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true'
        id: ravscore-wave-bootstrap-target
        run: >-
          node scripts/resolve-candidate-g-wave-bootstrap-target.mjs
          --conditions data/live/conditions.json
          --source-registry .cache/ravscore-legacy-candidate-g-source/coastal-parts-v2.json
          --registry data/live/coastal-parts-v2.json
          --production-target "$RAVRADAR_PRODUCTION_TARGET_HOUR"

      - name: Import exact legacy Candidate G into an isolated first-cutover source root
        if: steps.operational-model.outputs.legacy_source_required == 'true' && (steps.operational-action.outputs.action == 'integrated-cutover' || steps.operational-action.outputs.action == 'candidate-legacy-maintenance')
        shell: bash
        run: |
          rm -rf "$RAVRADAR_LEGACY_SOURCE_ROOT"
          mkdir -p "$RAVRADAR_LEGACY_SOURCE_ROOT/data"
          cp data/zones.geojson "$RAVRADAR_LEGACY_SOURCE_ROOT/data/zones.geojson"
          python scripts/hydrate-deployed-weather.py \
            --legacy-candidate-g-bootstrap \
            --root "$RAVRADAR_LEGACY_SOURCE_ROOT"
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.322 (${{ github.server_url }}/${{ github.repository }})"

      - name: Fetch exact public Candidate G source commit for first cutover attestation
        if: steps.operational-model.outputs.legacy_source_required == 'true' && (steps.operational-action.outputs.action == 'integrated-cutover' || steps.operational-action.outputs.action == 'candidate-legacy-maintenance')
        shell: bash
        run: |
          legacy_source_head="$(node --input-type=module -e "import { LEGACY_CANDIDATE_G_SOURCE_HEAD } from './scripts/lib/ravscore-legacy-candidate-g-source.mjs'; process.stdout.write(LEGACY_CANDIDATE_G_SOURCE_HEAD);")"
          [[ "$legacy_source_head" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$legacy_source_head"
          test "$(git rev-parse FETCH_HEAD)" = "$legacy_source_head"

      - name: Seal privacy-safe local attestation of the legacy Candidate G source
        id: legacy-source
        if: steps.operational-model.outputs.legacy_source_required == 'true' && (steps.operational-action.outputs.action == 'integrated-cutover' || steps.operational-action.outputs.action == 'candidate-legacy-maintenance')
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          cp "$RAVRADAR_LEGACY_SOURCE_ROOT/data/live/manifest.json" \
            "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json"
          node scripts/verify-legacy-candidate-g-source.mjs attest \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json" \
            --conditions "$RAVRADAR_LEGACY_SOURCE_ROOT/data/live/conditions.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json"
          test "$(jq -r '.privatePayloadLogged' "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json")" = "false"
          implementation_closure_sha256="$(node --input-type=module -e "import { legacyCandidateGImplementationClosureSha256 } from './scripts/verify-legacy-candidate-g-source.mjs'; process.stdout.write(await legacyCandidateGImplementationClosureSha256());")"
          test "${#implementation_closure_sha256}" = "64"
          echo "implementation_closure_sha256=$implementation_closure_sha256" >> "$GITHUB_OUTPUT"

      - name: Preserve deployed DMI zone cache as safe fallback
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p .cache
          if test -f data/live/dmi-bulk-cache.json; then
            cp data/live/dmi-bulk-cache.json .cache/deployed-dmi-bulk-cache.json
          else
            echo "No previous private DMI bulk cache was available; the refresh must build it."
          fi

      - name: Test Supabase persistence roundtrip
        if: github.event_name == 'push' || inputs.force == true || steps.operational-action.outputs.action == 'integrated-cutover'
        run: node scripts/test-supabase-persistence.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Restore exact-main source validation locator
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            weather-source-proof-v1-${{ runner.os }}-${{ github.sha }}-

      - name: Verify previous exact-main source validation with GitHub
        id: source-proof
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install source-gate dependencies
        if: steps.preflight.outputs.should_run == 'true' && steps.source-proof.outputs.required != 'false'
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt

      - name: Run fast source gate before expensive data refresh
        id: source-gate
        if: steps.preflight.outputs.should_run == 'true' && steps.source-proof.outputs.required != 'false'
        run: npm run validate:source

      - name: Record actual source validation outcome
        id: source-record
        if: always() && github.ref == 'refs/heads/main' && (steps.source-gate.outcome == 'success' || steps.source-gate.outcome == 'failure' || steps.source-gate.outcome == 'cancelled')
        run: node scripts/weather-source-gate.mjs record
        env:
          SOURCE_GATE_OUTCOME: ${{ steps.source-gate.outcome }}

      - name: Preserve latest exact-main source validation outcome
        if: always() && steps.source-record.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore private staged coastal-point cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/coastal-point-staging
          key: coastal-point-staging-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coastal-point-staging-v1-${{ runner.os }}-

      - name: Prepare only an explicitly requested READY point activation
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/prepare-coastal-point-activation.mjs

      - name: Rebuild centrally reviewed coastal-part sampling points
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Refresh DMI water-source registry
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/update-water-source-registry.mjs
        env:
          WEATHER_USER_AGENT: "RavRadar water-source registry (${{ github.server_url }}/${{ github.repository }})"

      - name: Install DMI GRIB reader (eccodes)
        if: steps.preflight.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Smoke-test DMI GRIB reader API
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/smoke-test-eccodes.py

      - name: Resolve bounded DMI cache generation
        if: steps.preflight.outputs.should_run == 'true'
        id: dmi-cache-generation
        run: echo "generation=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Refresh private Copernicus cache before DMI cache churn
        if: steps.preflight.outputs.should_run == 'true'
        id: copernicus-shadow-refresh
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-pre-dmi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-progress-v3-
            copernicus-current-shadow-v1-
            copernicus-current-range-v2-

      - name: Report private Copernicus cache preservation
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.copernicus-shadow-refresh.outputs.cache-matched-key }}
        run: |
          if test -n "$MATCHED_CACHE_KEY"; then
            echo "Private Copernicus shadow cache was refreshed before DMI cache churn"
          else
            echo "::warning title=Private Copernicus cache absent::No private Copernicus shadow cache was available before DMI cache churn"
          fi

      - name: Restore bounded DMI GRIB download cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        id: dmi-grib-cache-restore
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-
            dmi-grib-v4-${{ runner.os }}-
            dmi-grib-v3-${{ runner.os }}-

      - name: Restore progressive private DMI zone cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-
            dmi-zone-cache-v1-${{ runner.os }}-

      - name: Restore private seven-day current-field research cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            current-field-shadow-v1-${{ runner.os }}-

      - name: Update DMI bulk model cache
        if: steps.preflight.outputs.should_run == 'true'
        id: dmi-bulk
        continue-on-error: true
        timeout-minutes: 55
        run: python -u scripts/run-dmi-bulk-supervised.py
        env:
          DMI_BULK_HOURS: 118
          DMI_BULK_MAX_DOWNLOAD_MB: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && '4096' || '2048' }}
          DMI_BULK_RAW_CACHE_MAX_MB: 4096
          DMI_BULK_MAX_RUNTIME_SECONDS: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && '3000' || '900' }}
          DMI_BULK_FINALIZE_RESERVE_SECONDS: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && '180' || '120' }}
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 130
          DMI_BULK_TIME_STRIDE_HOURS: 3
          DMI_BULK_COLLECTIONS_PER_RUN: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && '6' || '2' }}
          DMI_BULK_REQUEST_TIMEOUT_SECONDS: 90
          DMI_BULK_HARMONIE_ASSET_TIMEOUT_SECONDS: 180
          DMI_BULK_SUPERVISED_FINALIZE_TIMEOUT_SECONDS: 420
          DMI_BULK_REFRESH_MINUTES: 60
          DMI_BULK_COMPLETE_HORIZON_HOURS: 96
          DMI_BULK_FORCE_REFRESH: ${{ steps.preflight.outputs.dmi_changed == 'true' || (steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true') }}
          DMI_BULK_RAW_DIR: .cache/dmi-grib
          DMI_BULK_DEPLOYED_FALLBACK_PATH: .cache/deployed-dmi-bulk-cache.json
          DMI_BULK_PRIVATE_WAVE_BOOTSTRAP_MODE: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && steps.ravscore-wave-bootstrap-target.outputs.mode || 'none' }}
          DMI_BULK_PRIVATE_WAVE_BOOTSTRAP_TARGET_HOUR: ${{ steps.ravscore-wave-bootstrap-target.outputs.target_hour || env.RAVRADAR_PRODUCTION_TARGET_HOUR }}
          COASTAL_POINT_STAGE_PATH: .cache/coastal-point-staging/dmi.json
          CURRENT_FIELD_SHADOW_PATH: .cache/current-field-shadow.json
          CURRENT_FIELD_SHADOW_PARTS_PER_RUN: 15
          CURRENT_FIELD_SHADOW_REPLAY_ASSETS_PER_COLLECTION: 5
          CURRENT_FIELD_SHADOW_BOOTSTRAP_DOWNLOADS_PER_RUN: 3
          WEATHER_USER_AGENT: "RavRadar/4.0.322 (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Advance private point-candidate readiness without public score impact
        id: point-candidate-readiness
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome == 'success'
        continue-on-error: true
        run: node scripts/update-coastal-point-staging.mjs

      - name: Save private staged coastal-point cache
        if: always() && steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome == 'success' && steps.point-candidate-readiness.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/coastal-point-staging
          key: coastal-point-staging-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save progressed DMI GRIB download cache
        if: always() && steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save progressive private DMI zone cache
        if: always() && steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled' && hashFiles('data/live/dmi-bulk-cache.json') != ''
        uses: actions/cache/save@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save private seven-day current-field research cache
        if: always() && steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require successful DMI producer before current supplement
        id: dmi-terminal-gate
        if: always() && steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          PRODUCER_OUTCOME: ${{ steps.dmi-bulk.outcome || 'skipped' }}
          PRODUCER_STATUS: ${{ steps.dmi-bulk.outputs.status || 'unknown' }}
          PRODUCER_CODE: ${{ steps.dmi-bulk.outputs.terminal_code || 'DMI_UNCLASSIFIED' }}
          STRICT_CURRENT_ANCHOR_READY: ${{ steps.dmi-bulk.outputs.strict_current_anchor_ready || 'false' }}
        run: |
          code="$PRODUCER_CODE"
          if ! printf '%s\n' "$code" | grep -Eq '^[A-Z][A-Z0-9_]{2,63}$'; then
            code="DMI_UNCLASSIFIED"
          fi
          status_ready=false
          case "$PRODUCER_STATUS" in
            ok|partial|fresh-bulk-cache) status_ready=true ;;
          esac
          ready=false
          if test "$PRODUCER_OUTCOME" = "success" \
            && test "$code" = "DMI_READY" \
            && test "$STRICT_CURRENT_ANCHOR_READY" = "true" \
            && test "$status_ready" = "true"; then
            ready=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "strict_current_anchor_ready=$STRICT_CURRENT_ANCHOR_READY" >> "$GITHUB_OUTPUT"
          if test "$ready" != "true"; then
            echo "::error title=DMI terminal gate::$code"
            exit 1
          fi

      - name: Require complete operational WAM handoff before first integrated cutover
        id: wam-bootstrap-readiness
        if: always() && steps.preflight.outputs.should_run == 'true' && steps.dmi-terminal-gate.outputs.ready == 'true' && steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && steps.ravscore-wave-bootstrap-target.outcome == 'success'
        shell: bash
        run: |
          producer_outcome="${{ steps.dmi-bulk.outcome }}"
          set +e
          attestation="$(python -B scripts/validate_dmi_wave_history_bootstrap.py \
            --mode "${{ steps.ravscore-wave-bootstrap-target.outputs.mode }}" \
            --target-hour "${{ steps.ravscore-wave-bootstrap-target.outputs.target_hour }}" \
            --production-target-hour "$RAVRADAR_PRODUCTION_TARGET_HOUR" \
            --forecast-hour-count 118 \
            --cache data/live/dmi-bulk-cache.json \
            --registry data/live/coastal-parts-v2.json)"
          validator_status=$?
          set -e
          printf '%s\n' "$attestation"
          wam_code="$(printf '%s' "$attestation" | jq -r 'if .status == "invalid" then .code else "NONE" end')"
          history_incomplete="$(printf '%s' "$attestation" | jq -r 'if .status == "ok" and .historyIncomplete == true then "true" else "false" end')"
          if [ "$producer_outcome" != "success" ]; then
            wam_code="DMI_BULK_FAILED"
            history_incomplete="false"
            validator_status=1
          fi
          test "$wam_code" = "NONE" || printf '%s\n' "$wam_code" | grep -Eq '^[A-Z][A-Z0-9_]{2,63}$'
          echo "code=$wam_code" >> "$GITHUB_OUTPUT"
          echo "history_incomplete=$history_incomplete" >> "$GITHUB_OUTPUT"
          exit "$validator_status"

      - name: Report DMI bulk result
        if: steps.preflight.outputs.should_run == 'true' && always()
        run: |
          echo "DMI bulk status: ${{ steps.dmi-bulk.outputs.status || 'unknown' }}"
          echo "Fresh collections this run: ${{ steps.dmi-bulk.outputs.fresh_collections || '0' }}"
          echo "Partial collections this run: ${{ steps.dmi-bulk.outputs.partial_collections || '0' }}"
          echo "Zones in bulk cache: ${{ steps.dmi-bulk.outputs.zone_count || '0' }}"
          echo "DMI bulk error: ${{ steps.dmi-bulk.outputs.error || 'none' }}"
          echo "DMI terminal code: ${{ steps.dmi-terminal-gate.outputs.code || 'DMI_UNCLASSIFIED' }}"
          echo "Strict current anchor ready: ${{ steps.dmi-terminal-gate.outputs.strict_current_anchor_ready || 'false' }}"
          echo "WAM bootstrap code: ${{ steps.wam-bootstrap-readiness.outputs.code || 'unknown' }}"
          if [ "${{ steps.dmi-bulk.outputs.status }}" = "failed" ]; then
            echo "::warning::DMI bulk refresh failed. RavRadar preserves the previous DMI cache and uses fallback providers where necessary."
          fi

      - name: Refresh private Copernicus cache after DMI cache churn
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-terminal-gate.outputs.ready == 'true'
        id: copernicus-shadow-post-dmi
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-post-dmi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-progress-v3-
            copernicus-current-shadow-v1-
            copernicus-current-range-v2-

      - name: Select exact-hour DMI gaps for targeted Copernicus supplement
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-terminal-gate.outputs.ready == 'true'
        id: copernicus-targets
        run: >-
          python scripts/build-copernicus-target-registry.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output .cache/copernicus-current-targets.json
          --github-output "$GITHUB_OUTPUT"

      - name: Bind production to resolved DMI current hour
        if: steps.preflight.outputs.should_run == 'true'
        run: echo "RAVRADAR_PRODUCTION_TARGET_HOUR=${{ steps.copernicus-targets.outputs.target_hour }}" >> "$GITHUB_ENV"

      - name: Inspect target-bound Copernicus source stage after fresh DMI
        if: steps.preflight.outputs.should_run == 'true'
        id: targeted-copernicus-cache
        run: >-
          python scripts/check-copernicus-current-range.py
          --shadow .cache/copernicus-current-shadow.json
          --source-stage .cache/copernicus-current-source-stage.json
          --registry .cache/copernicus-current-targets.json
          --dmi data/live/dmi-bulk-cache.json
          --targets data/live/coastal-parts-v2.json
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --allow-nonmatching-seal
          --github-output "$GITHUB_OUTPUT"

      - name: Remove only invalid production Copernicus source disposition
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.source_stage_reusable != 'true'
        run: rm -f .cache/copernicus-current-source-stage.json

      - name: Install targeted Copernicus dependencies
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.source_stage_ready != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Verify targeted Copernicus credentials
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.source_stage_ready != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::error::Targeted Copernicus credentials are unavailable."
            exit 1
          fi

      - name: Fill only exact-hour DMI gaps from Copernicus
        id: copernicus-fill
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.source_stage_ready != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: >-
          python scripts/run-copernicus-current-pilot-with-retry.py
          --attempts 1
          --timeout-seconds 1200
          --backoff-seconds 20
          --
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --targets .cache/copernicus-current-targets.json
          --authoritative-targets data/live/coastal-parts-v2.json

      - name: Save non-cancelled private Copernicus source-stage progress
        if: always() && steps.copernicus-fill.outcome != 'cancelled' && steps.copernicus-fill.outcome != 'skipped' && hashFiles('.cache/copernicus-current-shadow.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-production-progress-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require completed Copernicus source stage before combined current closure
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          python scripts/check-copernicus-current-range.py
          --shadow .cache/copernicus-current-shadow.json
          --source-stage .cache/copernicus-current-source-stage.json
          --registry .cache/copernicus-current-targets.json
          --dmi data/live/dmi-bulk-cache.json
          --targets data/live/coastal-parts-v2.json
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --require-source-stage-ready

      - name: Save validated private Copernicus progress before downstream closure
        if: steps.preflight.outputs.should_run == 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-production-ready-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build exact DMI-first current operational closure
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          python scripts/build-current-operational-closure.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"

      - name: Build public seven-day current history and controlled live selection
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/build-live-current-pilot.py

      - name: Update central weather cache
        if: steps.preflight.outputs.should_run == 'true'
        id: weather
        timeout-minutes: 17
        run: npm run update:weather
        env:
          DMI_MAX_RETRIES: 0
          DMI_REQUEST_GAP_MS: 12000
          DMI_REQUEST_CONCURRENCY: 1
          DMI_LIVE_ZONE_BUDGET: 4
          DMI_REQUEST_BUDGET: 6
          DMI_CACHE_REFRESH_BELOW_HOURS: 24
          DMI_SCHEDULE_INTERVAL_MINUTES: 15
          DMI_RETRY_JITTER_MIN_MS: 30000
          DMI_RETRY_JITTER_MAX_MS: 180000
          DMI_OBSERVATION_INTERVAL_MINUTES: 60
          WEATHER_REQUEST_TIMEOUT_MS: 25000
          DMI_OCEAN_REQUEST_TIMEOUT_MS: 60000
          RAVSCORE_FIRST_CUTOVER_BOOTSTRAP_MODE: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && steps.ravscore-wave-bootstrap-target.outputs.mode || 'auto' }}
          RAVSCORE_FIRST_CUTOVER_SOURCE_VALIDATED: ${{ steps.operational-action.outputs.action == 'integrated-cutover' && steps.legacy-bootstrap.outputs.required == 'true' && steps.ravscore-wave-bootstrap-target.outputs.source_validated || 'false' }}
          RAVSCORE_STATELESS_INTEGRATED_COLD_START_ALLOWED: ${{ steps.operational-action.outputs.action == 'integrated' && steps.legacy-bootstrap.outputs.stateless_integrated_recovery == 'true' && 'true' || 'false' }}
          WEATHER_USER_AGENT: "RavRadar/4.0.322 (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Refuse a point activation without a successful exact-point weather rebuild
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          WEATHER_OUTCOME: ${{ steps.weather.outcome }}
        run: |
          if test -f .cache/coastal-point-staging/pending-promotion.json && test "$WEATHER_OUTCOME" != "success"; then
            echo "A READY point activation was prepared, but the exact-point weather rebuild failed."
            exit 1
          fi

      - name: Attach scientific current provenance and exact DMI grid points
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run build:current-provenance

      - name: Rebuild deterministic public weather runtime before validation and deploy
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/generate-public-conditions.mjs

      - name: Audit actual integrated RavScore public runtime before deploy
        id: ravscore-integrated-runtime-audit
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          audit_path=.geometry-v2-work/ravscore-integrated-public-runtime-audit.json
          node scripts/audit-ravscore-integrated-public-runtime.mjs \
            --input data/live/conditions.json \
            --output "$audit_path"
          rollback_status="$(jq -er '.rollback.status | select(. == "READY" or . == "BUILDING_MEASURED_ONLY")' "$audit_path")"
          rollback_activation_ready="$(jq -er '.rollback.activationReady | select(type == "boolean")' "$audit_path")"
          all_current_scores_full_history="$(jq -er '.history.allCurrentScoresFullHistory | select(type == "boolean")' "$audit_path")"
          if test "$rollback_status" = "READY"; then
            test "$rollback_activation_ready" = "true"
          else
            test "$rollback_activation_ready" = "false"
          fi
          echo "rollback_status=$rollback_status" >> "$GITHUB_OUTPUT"
          echo "rollback_activation_ready=$rollback_activation_ready" >> "$GITHUB_OUTPUT"
          echo "all_current_scores_full_history=$all_current_scores_full_history" >> "$GITHUB_OUTPUT"

      - name: Create and validate exactly one checkpoint disposition before release gate
        id: checkpoint-disposition
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          audit_path=.geometry-v2-work/ravscore-integrated-public-runtime-audit.json
          disposition_path=.geometry-v2-work/ravscore-continuation-checkpoint-disposition.json
          base_path="$disposition_path.base"
          rollback_status="$(jq -er '.rollback.status | select(. == "READY" or . == "BUILDING_MEASURED_ONLY")' "$audit_path")"
          rollback_activation_ready="$(jq -er '.rollback.activationReady | select(type == "boolean")' "$audit_path")"
          case "$rollback_status:$rollback_activation_ready" in
            READY:true)
              disposition="READY_PUBLISHED"
              checkpoint_required="true"
              ;;
            BUILDING_MEASURED_ONLY:false)
              disposition="NOT_APPLICABLE_DURING_MEASURED_WARMUP"
              checkpoint_required="false"
              ;;
            *)
              echo "Runtime audit cannot produce an allowed checkpoint disposition." >&2
              exit 1
              ;;
          esac
          dataset_id="$(jq -er '.datasetId | select(type == "string" and length > 0)' data/live/manifest.json)"
          test "$(jq -er '.datasetId' "$audit_path")" = "$dataset_id"
          runtime_audit_sha256="$(AUDIT_PATH="$audit_path" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.AUDIT_PATH, 'utf8'))));")"
          jq -n --arg disposition "$disposition" --arg sourceHead "$GITHUB_SHA" --arg datasetId "$dataset_id" --arg runtimeAuditSha256 "$runtime_audit_sha256" --arg rollbackStatus "$rollback_status" --argjson rollbackActivationReady "$rollback_activation_ready" --argjson checkpointRequired "$checkpoint_required" '{schemaVersion:"ravscore-continuation-checkpoint-disposition-v1",disposition:$disposition,sourceHead:$sourceHead,datasetId:$datasetId,runtimeAuditSha256:$runtimeAuditSha256,rollbackStatus:$rollbackStatus,rollbackActivationReady:$rollbackActivationReady,checkpointRequired:$checkpointRequired,privatePayloadIncluded:false}' > "$base_path"
          disposition_sha256="$(DISPOSITION_PATH="$base_path" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.DISPOSITION_PATH, 'utf8'))));")"
          jq --arg bindingSha256 "$disposition_sha256" '. + {bindingSha256:$bindingSha256}' "$base_path" > "$disposition_path"
          rm "$base_path"
          DISPOSITION_PATH="$disposition_path" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; const value=JSON.parse(fs.readFileSync(process.env.DISPOSITION_PATH,'utf8')); const expected=['bindingSha256','checkpointRequired','datasetId','disposition','privatePayloadIncluded','rollbackActivationReady','rollbackStatus','runtimeAuditSha256','schemaVersion','sourceHead'].sort(); if(JSON.stringify(Object.keys(value).sort())!==JSON.stringify(expected)) throw new Error('Unexpected checkpoint disposition fields'); const {bindingSha256,...binding}=value; if(!/^[a-f0-9]{64}$/.test(bindingSha256)||sha256CanonicalJson(binding)!==bindingSha256) throw new Error('Checkpoint disposition binding mismatch');"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          echo "disposition_sha256=$disposition_sha256" >> "$GITHUB_OUTPUT"
          echo "dataset_id=$dataset_id" >> "$GITHUB_OUTPUT"
          echo "runtime_audit_sha256=$runtime_audit_sha256" >> "$GITHUB_OUTPUT"

      - name: Generate and strictly validate production reference zones
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: node scripts/generate-state-reference-report-4.0.113.mjs --strict

      - name: Validate full project after fresh weather and current provenance
        id: full-validation
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run validate

      - name: Run release governance gate after refreshed data validation
        id: release-gate
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run release:gate

      - name: Seal exact integrated public implementation closure
        if: steps.preflight.outputs.should_run == 'true'
        id: integrated-implementation
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          node scripts/seal-ravscore-public-browser-closure.mjs \
            --root . \
            --output "$RAVRADAR_OPERATIONAL_WORK/integrated-public-closure.json" \
            --model integrated \
            --identity-output "$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json"
          closure_sha256="$(jq -r '.implementationClosureSha256' "$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json")"
          test "${#closure_sha256}" = "64"
          echo "closure_sha256=$closure_sha256" >> "$GITHUB_OUTPUT"

      - name: Require exact integrated backend and Edge readiness before integrated Pages
        if: steps.preflight.outputs.should_run == 'true' && (steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-historical-maintenance' || steps.operational-action.outputs.action == 'integrated-return' || steps.operational-action.outputs.action == 'integrated-cutover')
        run: >-
          node scripts/integrated-cutover-readiness.mjs check
          --public-implementation-closure-sha256 "${{ steps.integrated-implementation.outputs.closure_sha256 }}"
          --output "$RAVRADAR_OPERATIONAL_WORK/integrated-readiness.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate updated weather cache
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: npm run validate:data

      - name: Verify active trip-storage Edge and D1 read contracts without creating data
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          node scripts/verify-trip-storage-edge.mjs
          node scripts/verify-cloudflare-trip-gateway.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_TRIP_STORAGE_MODE: d1
          RAVRADAR_REQUIRE_INTEGRATED_BINDING: true
          CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
          TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}

      - name: Reconfirm current origin/main before protected writes and Pages artifact
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Atomically promote the validated point candidate in central admin storage
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: python scripts/promote-coastal-point-activation.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build atomic schema-6 and Candidate G rollback checkpoint after final gates
        id: checkpoint-build
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.ravscore-integrated-runtime-audit.outputs.rollback_activation_ready == 'true'
        run: >-
          node scripts/ravscore-continuation-checkpoint.mjs
          --save
          --source data/live/conditions.json
          --checkpoint .cache/ravscore-continuation-checkpoint/checkpoint.json

      - name: Save atomic schema-6 and Candidate G rollback checkpoint after final gates
        id: checkpoint-save
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.ravscore-integrated-runtime-audit.outputs.rollback_activation_ready == 'true' && steps.operational-action.outputs.action != 'candidate-dry-run'
        uses: actions/cache/save@v6
        with:
          path: .cache/ravscore-continuation-checkpoint
          key: ravscore-continuation-schema6-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reconfirm current main before protected RavScore write
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.ravscore-integrated-runtime-audit.outputs.rollback_activation_ready == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Publish atomic RavScore checkpoint to protected admin storage
        id: checkpoint-publish
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.ravscore-integrated-runtime-audit.outputs.rollback_activation_ready == 'true' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: >-
          node scripts/protected-ravscore-continuation-checkpoint.mjs
          --publish
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build dataminimized weather preflight state after final gates
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: >-
          node scripts/private-production-runtime-workflow.mjs create-preflight
          --repository-root "$GITHUB_WORKSPACE"
          --output .cache/weather-preflight-state/state.json

      - name: Save dataminimized weather preflight state
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        uses: actions/cache/save@v6
        with:
          path: .cache/weather-preflight-state
          key: weather-preflight-state-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build private production runtime bundle specification
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: >-
          node scripts/private-production-runtime-workflow.mjs create-spec
          --repository-root "$GITHUB_WORKSPACE"
          --output .cache/private-production-runtime-create-spec.json

      - name: Create the next private production runtime bundle atomically
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          rm -rf "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"
          if test -d "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"; then
            mv "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE" "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"
          fi
          node scripts/private-production-runtime-bundle.mjs create \
            --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT" \
            --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE" \
            --spec .cache/private-production-runtime-create-spec.json
          rm -rf "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"

      - name: Reconfirm current main before protected private-runtime write
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Publish bounded private runtime with one protected rollback generation
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: >-
          node scripts/protected-private-production-runtime.mjs
          --publish
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --repository-root "$GITHUB_WORKSPACE"
          --expected .cache/private-production-runtime-expected.json
          --source-head "$GITHUB_SHA"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prove the private runtime object is not anonymously readable
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: node scripts/protected-private-production-runtime.mjs --audit-anon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seal Candidate G rollback or maintenance plan from the fresh private runtime
        if: steps.preflight.outputs.should_run == 'true' && startsWith(steps.operational-action.outputs.action, 'candidate-')
        shell: bash
        env:
          RAVRADAR_CANDIDATE_G_ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
        run: |
          rm -rf "$RAVRADAR_CANDIDATE_STAGE"
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK" "$RAVRADAR_CANDIDATE_STAGE"
          rsync -a ./ "$RAVRADAR_CANDIDATE_STAGE/" \
            --exclude '.git/' \
            --exclude '_site/' \
            --exclude '_support/' \
            --exclude '.cache/' \
            --exclude 'node_modules/' \
            --exclude '.geometry-v2-work/'
          install -m 0644 scripts/rollback-assets/ravscore-model-contract.js \
            "$RAVRADAR_CANDIDATE_STAGE/js/core/ravscore-model-contract.js"
          install -m 0644 scripts/rollback-assets/ravscore-model-bundle.generated.js \
            "$RAVRADAR_CANDIDATE_STAGE/js/core/ravscore-model-bundle.generated.js"
          (cd "$RAVRADAR_CANDIDATE_STAGE" && node scripts/seal-ravscore-public-browser-closure.mjs \
            --root . \
            --output "$RAVRADAR_OPERATIONAL_WORK/candidate-public-closure.json" \
            --model candidate-g \
            --identity-output "$RAVRADAR_OPERATIONAL_WORK/candidate-implementation-identity.json")
          dataset_id="$(jq -r '.datasetId' data/live/conditions.json)"
          bundle_sha="$(jq -r '.bundleContentSha256' "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json")"
          requested_closure_sha256="$(jq -r '.implementationClosureSha256' "$RAVRADAR_OPERATIONAL_WORK/candidate-implementation-identity.json")"
          source_closure_sha256="${{ steps.operational-model.outputs.active_implementation_closure_sha256 }}"
          source_model="integrated"
          source_binding_args=()
          rollback_mode="dry-run"
          action="${{ steps.operational-action.outputs.action }}"
          if [ "$action" = "candidate-execute" ]; then
            rollback_mode="execute"
          elif [ "$action" = "candidate-maintenance" ]; then
            source_model="candidate-g"
          elif [ "$action" = "candidate-historical-maintenance" ]; then
            source_model="historical-candidate-g"
            jq -e '.activeModelBinding | type == "object"' "$RAVRADAR_OPERATIONAL_WORK/current.json" >/dev/null
            jq '.activeModelBinding' "$RAVRADAR_OPERATIONAL_WORK/current.json" > "$RAVRADAR_OPERATIONAL_WORK/source-binding.json"
            source_binding_args=(--source-binding "$RAVRADAR_OPERATIONAL_WORK/source-binding.json")
          elif [ "$action" = "candidate-legacy-maintenance" ]; then
            source_model="legacy-candidate-g"
            source_closure_sha256="${{ steps.legacy-source.outputs.implementation_closure_sha256 }}"
          fi
          if [ -z "$source_closure_sha256" ] && [ "$source_model" = "integrated" ]; then
            source_closure_sha256="${{ steps.integrated-implementation.outputs.closure_sha256 }}"
          fi
          test "${#source_closure_sha256}" = "64"
          test "${#requested_closure_sha256}" = "64"
          node scripts/prepare-candidate-g-operational-rollback.mjs \
            --input data/live/conditions.json \
            --output "$RAVRADAR_OPERATIONAL_WORK/candidate-full.json" \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --mode "$rollback_mode" \
            --expected-dataset-id "$dataset_id" \
            --source-head "$GITHUB_SHA" \
            --private-bundle-sha256 "$bundle_sha" \
            --source-model "$source_model" \
            "${source_binding_args[@]}" \
            --source-implementation-closure-sha256 "$source_closure_sha256" \
            --requested-implementation-closure-sha256 "$requested_closure_sha256" \
            --central-expected-version "${{ steps.operational-model.outputs.central_version }}"
          node scripts/install-candidate-g-rollback-stage.mjs \
            --stage-root "$RAVRADAR_CANDIDATE_STAGE" \
            --repository-root "$GITHUB_WORKSPACE" \
            --candidate-full "$RAVRADAR_OPERATIONAL_WORK/candidate-full.json" \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --expected-source-head "$GITHUB_SHA" \
            --expected-dataset-id "$dataset_id"
          (cd "$RAVRADAR_CANDIDATE_STAGE" && node scripts/generate-public-conditions.mjs)
          (cd "$RAVRADAR_CANDIDATE_STAGE" && node scripts/audit-candidate-g-rollback-public-runtime.mjs \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/public-audit.json" \
            --expected-source-head "$GITHUB_SHA" \
            --expected-dataset-id "$dataset_id")

      - name: Seal integrated return, initial cutover or historical maintenance plan after backend and public gates
        if: steps.preflight.outputs.should_run == 'true' && (steps.operational-action.outputs.action == 'integrated-return' || steps.operational-action.outputs.action == 'integrated-cutover' || steps.operational-action.outputs.action == 'integrated-historical-maintenance')
        shell: bash
        run: |
          action="${{ steps.operational-action.outputs.action }}"
          source_closure_sha256="${{ steps.operational-model.outputs.active_implementation_closure_sha256 }}"
          if [ "${{ steps.operational-model.outputs.legacy_source_required }}" = "true" ]; then
            source_closure_sha256="${{ steps.legacy-source.outputs.implementation_closure_sha256 }}"
          fi
          test "${#source_closure_sha256}" = "64"
          prepare_command="prepare-integrated-return"
          if [ "$action" = "integrated-historical-maintenance" ]; then
            prepare_command="prepare-integrated-historical-maintenance"
          fi
          node scripts/ravscore-operational-activation.mjs "$prepare_command" \
            --manifest data/live/manifest.json \
            --audit .geometry-v2-work/ravscore-integrated-public-runtime-audit.json \
            --source-implementation-closure-sha256 "$source_closure_sha256" \
            --requested-implementation-closure-sha256 "${{ steps.integrated-implementation.outputs.closure_sha256 }}" \
            --output "$RAVRADAR_OPERATIONAL_WORK/plan.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RAVRADAR_INTEGRATED_FIRST_CUTOVER_REQUESTED: ${{ inputs.ravscore_integrated_first_cutover }}
          RAVRADAR_INTEGRATED_FIRST_CUTOVER_CONFIRMATION: ${{ inputs.ravscore_integrated_first_cutover_confirmation }}
          RAVRADAR_INTEGRATED_RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}

      - name: Generate implementation and coverage audit
        if: steps.preflight.outputs.should_run == 'true'
        continue-on-error: true
        run: npm run audit:implementation-plan

      - name: Verify DMI station inventory for admin map
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('data/live/dmi-water-stations.json')
          if not path.exists():
              raise SystemExit('DMI station inventory was not generated')
          doc = json.loads(path.read_text('utf-8'))
          stations = doc.get('stations') or []
          valid = [s for s in stations if s.get('stationId') and isinstance(s.get('point'), list) and len(s['point']) == 2]
          if not valid:
              raise SystemExit('DMI station inventory contains no valid stations')

          names = ' '.join(str(s.get('name','')).lower() for s in valid)
          if 'hals' not in names:
              raise SystemExit('Critical station family Hals is missing from persistent inventory')
          print(f'{len(valid)} persistent DMI water-level stations ready for admin map')
          PY

      - name: Build RavRadar support package
        if: always()
        run: |
          rm -rf _support
          mkdir -p _support/project _support/run-metadata
          rsync -a ./ _support/project/ \
            --exclude '.git/' \
            --exclude '_site/' \
            --exclude '_support/' \
            --exclude '.cache/' \
            --exclude 'node_modules/' \
            --exclude 'data/live/' \
            --exclude 'data/diagnostics/' \
            --exclude 'data/admin/' \
            --exclude '.geometry-v2-work/'
          printf '%s\n' \
            "repository=${{ github.repository }}" \
            "run_number=${{ github.run_number }}" \
            "sha=${{ github.sha }}" \
            "ref=${{ github.ref }}" \
            "generated_at=$(date -u +%FT%TZ)" > _support/run-metadata/github-run.txt
          (cd _support && zip -qr ../RavRadar-support-${{ github.run_number }}.zip .)

      - name: Upload RavRadar support package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RavRadar-support-${{ github.run_number }}
          path: RavRadar-support-${{ github.run_number }}.zip
          retention-days: 14
          if-no-files-found: error

      - name: Reconfirm current origin/main immediately before protected admin sync
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Sync protected admin data to Supabase
        if: steps.preflight.outputs.should_run == 'true' && steps.operational-action.outputs.action != 'candidate-dry-run'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PREVIOUS_HANDBOOK_URL: https://raw.githubusercontent.com/${{ github.repository }}/fc13fb5ab326d8824ca55235ac454ac230e3db3e/docs/handbook/content.json
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY; refusing to publish protected admin files."
            exit 1
          fi
          node scripts/sync-protected-admin-assets.mjs

      - name: Build lean GitHub Pages artifact
        id: pages-build
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          build_pages_site() {
            local pages_source="$1"
            local pages_destination="$2"
            rm -rf "$pages_destination"
            mkdir "$pages_destination"
            rsync -a "$pages_source/" "$pages_destination/" \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site*/' \
              --exclude '_support/' \
              --exclude 'RavRadar-support-*.zip' \
              --exclude '.cache/' \
              --exclude 'node_modules/' \
              --exclude 'scripts/' \
              --exclude 'docs/' \
              --exclude 'data/diagnostics/' \
              --exclude 'data/geometry-v2/' \
              --exclude 'data/admin/' \
              --exclude 'data/live/' \
              --exclude 'handbook.html' \
              --exclude 'handbook.css' \
              --exclude 'documentation.html' \
              --exclude 'js/ui/handbook.js' \
              --exclude 'js/ui/admin-app.js' \
              --exclude 'js/core/rule-engine.js' \
              --exclude 'js/core/score-engine.js' \
              --exclude 'js/core/adaptive-model.js' \
              --exclude 'js/core/prediction-engine.js' \
              --exclude 'js/services/rule-service.js' \
              --exclude 'js/services/trip-service.js' \
              --exclude 'js/services/trip-evidence-legacy-bridge.js' \
              --exclude 'rules/' \
              --exclude 'schemas/' \
              --exclude 'supabase/' \
              --exclude 'requirements-dmi.txt' \
              --exclude 'requirements-geometry.txt' \
              --exclude '.geometry-v2-work/' \
              --exclude 'package.json' \
              --exclude 'package-lock.json' \
              --exclude 'CHANGELOG*.md' \
              --exclude 'DELIVERY*.md' \
              --exclude 'INSTALLATION-GUIDE*.md' \
              --exclude 'B02-PLACEMENT-AUDIT.md'
            mkdir -p "$pages_destination/data/live"
            install -m 0644 "$pages_source/data/live/manifest.json" "$pages_destination/data/live/manifest.json"
            install -m 0644 "$pages_source/data/live/public-conditions.json" "$pages_destination/data/live/public-conditions.json"
            install -m 0644 "$pages_source/data/live/public-condition-details.json" "$pages_destination/data/live/public-condition-details.json"
            install -m 0644 "$pages_source/data/live/coastal-parts-v2.json" "$pages_destination/data/live/coastal-parts-v2.json"
          }
          pages_source="$GITHUB_WORKSPACE"
          if [[ "${{ steps.operational-action.outputs.action }}" == candidate-* ]]; then
            pages_source="$RAVRADAR_CANDIDATE_STAGE"
          fi
          build_pages_site "$pages_source" _site
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Audit the complete Pages artifact for private runtime material
        id: pages-privacy
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          node scripts/audit-pages-artifact-privacy.mjs
          --site _site
          --private-manifest "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json"
          --require-private-manifest

      - name: Seal privacy-safe operational deploy handoff
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          rm -rf "$RAVRADAR_OPERATIONAL_HANDOFF"
          mkdir -p "$RAVRADAR_OPERATIONAL_HANDOFF"
          cp _site/data/live/manifest.json "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          if [ -f "$RAVRADAR_OPERATIONAL_WORK/plan.json" ]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/plan.json" "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          fi
          if [[ "${{ steps.operational-action.outputs.action }}" == candidate-* ]]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/public-audit.json" "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
            target_root="$RAVRADAR_CANDIDATE_STAGE"
            target_closure="$RAVRADAR_OPERATIONAL_WORK/candidate-public-closure.json"
            target_identity="$RAVRADAR_OPERATIONAL_WORK/candidate-implementation-identity.json"
          else
            cp .geometry-v2-work/ravscore-integrated-public-runtime-audit.json \
              "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
            target_root="$GITHUB_WORKSPACE"
            target_closure="$RAVRADAR_OPERATIONAL_WORK/integrated-public-closure.json"
            target_identity="$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json"
          fi
          cp .geometry-v2-work/ravscore-continuation-checkpoint-disposition.json "$RAVRADAR_OPERATIONAL_HANDOFF/checkpoint-disposition.json"
          cp .geometry-v2-work/ravscore-integrated-public-runtime-audit.json "$RAVRADAR_OPERATIONAL_HANDOFF/checkpoint-runtime-audit.json"
          cp "$target_root/js/core/ravscore-model-contract.js" \
            "$RAVRADAR_OPERATIONAL_HANDOFF/target-contract.js"
          cp "$target_root/js/core/ravscore-model-bundle.generated.js" \
            "$RAVRADAR_OPERATIONAL_HANDOFF/target-bundle.generated.js"
          cp "$target_closure" "$RAVRADAR_OPERATIONAL_HANDOFF/target-public-closure.json"
          jq '.modelBinding' "$target_identity" \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/target-binding.json"
          if [ -f "$RAVRADAR_OPERATIONAL_WORK/integrated-readiness.json" ]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/integrated-readiness.json" \
              "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-readiness.json"
          fi
          if [ "${{ steps.operational-model.outputs.legacy_source_required }}" = "true" ]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json" \
              "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-manifest.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json" \
              "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
          fi
          if [ "${{ steps.operational-action.outputs.action }}" = "integrated-cutover" ]; then
            test "$(jq -r '.legacySourceRequired' "$RAVRADAR_OPERATIONAL_WORK/plan.json")" = \
              "${{ steps.operational-model.outputs.legacy_source_required }}"
          fi
          checkpoint_disposition="${{ steps.checkpoint-disposition.outputs.disposition }}"
          checkpoint_disposition_sha256="${{ steps.checkpoint-disposition.outputs.disposition_sha256 }}"
          checkpoint_dataset_id="${{ steps.checkpoint-disposition.outputs.dataset_id }}"
          checkpoint_runtime_audit_sha256="${{ steps.checkpoint-disposition.outputs.runtime_audit_sha256 }}"
          checkpoint_build_outcome="${{ steps.checkpoint-build.outcome }}"
          checkpoint_save_outcome="${{ steps.checkpoint-save.outcome }}"
          checkpoint_publish_outcome="${{ steps.checkpoint-publish.outcome }}"
          disposition_path="$RAVRADAR_OPERATIONAL_HANDOFF/checkpoint-disposition.json"
          runtime_audit_path="$RAVRADAR_OPERATIONAL_HANDOFF/checkpoint-runtime-audit.json"
          test "$(jq -er '.schemaVersion' "$disposition_path")" = "ravscore-continuation-checkpoint-disposition-v1"
          test "$(jq -er '.sourceHead' "$disposition_path")" = "$GITHUB_SHA"
          test "$(jq -er '.datasetId' "$disposition_path")" = "$checkpoint_dataset_id"
          test "$(jq -er '.datasetId' "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json")" = "$checkpoint_dataset_id"
          test "$(jq -er '.datasetId' "$runtime_audit_path")" = "$checkpoint_dataset_id"
          test "$(jq -er '.disposition' "$disposition_path")" = "$checkpoint_disposition"
          test "$(jq -er '.bindingSha256' "$disposition_path")" = "$checkpoint_disposition_sha256"
          test "$(jq -er '.runtimeAuditSha256' "$disposition_path")" = "$checkpoint_runtime_audit_sha256"
          recomputed_runtime_audit_sha256="$(AUDIT_PATH="$runtime_audit_path" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.AUDIT_PATH,'utf8'))));")"
          test "$recomputed_runtime_audit_sha256" = "$checkpoint_runtime_audit_sha256"
          DISPOSITION_PATH="$disposition_path" node --input-type=module -e "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; const value=JSON.parse(fs.readFileSync(process.env.DISPOSITION_PATH,'utf8')); const {bindingSha256,...binding}=value; if(sha256CanonicalJson(binding)!==bindingSha256) throw new Error('Checkpoint disposition binding mismatch');"
          case "$checkpoint_disposition" in
            READY_PUBLISHED)
              test "$(jq -er '.rollbackStatus' "$disposition_path")" = "READY"
              test "$(jq -er '.rollbackActivationReady' "$disposition_path")" = "true"
              test "$(jq -er '.checkpointRequired' "$disposition_path")" = "true"
              test "$checkpoint_build_outcome" = "success"
              if [ "${{ steps.operational-action.outputs.action }}" = "candidate-dry-run" ]; then
                test "$checkpoint_save_outcome" = "skipped"
                test "$checkpoint_publish_outcome" = "skipped"
              else
                test "$checkpoint_save_outcome" = "success"
                test "$checkpoint_publish_outcome" = "success"
              fi
              ;;
            NOT_APPLICABLE_DURING_MEASURED_WARMUP)
              test "$(jq -er '.rollbackStatus' "$disposition_path")" = "BUILDING_MEASURED_ONLY"
              test "$(jq -er '.rollbackActivationReady' "$disposition_path")" = "false"
              test "$(jq -er '.checkpointRequired' "$disposition_path")" = "false"
              test "$checkpoint_build_outcome" = "skipped"
              test "$checkpoint_save_outcome" = "skipped"
              test "$checkpoint_publish_outcome" = "skipped"
              ;;
            *)
              echo "Missing or unsupported checkpoint disposition." >&2
              exit 1
              ;;
          esac
          jq -n --arg action "${{ steps.operational-action.outputs.action }}" --arg sourceHead "$GITHUB_SHA" --arg centralVersion "${{ steps.operational-model.outputs.central_version }}" --arg legacySourceRequired "${{ steps.operational-model.outputs.legacy_source_required }}" --arg checkpointDisposition "$checkpoint_disposition" --arg checkpointDispositionSha256 "$checkpoint_disposition_sha256" --arg checkpointDatasetId "$checkpoint_dataset_id" --arg checkpointRuntimeAuditSha256 "$checkpoint_runtime_audit_sha256" --arg checkpointBuildOutcome "$checkpoint_build_outcome" --arg checkpointSaveOutcome "$checkpoint_save_outcome" --arg checkpointPublishOutcome "$checkpoint_publish_outcome" '{schemaVersion:"ravscore-operational-deploy-handoff-v2",action:$action,sourceHead:$sourceHead,centralVersion:($centralVersion|tonumber),legacySourceRequired:($legacySourceRequired == "true"),checkpointDisposition:$checkpointDisposition,checkpointDispositionSha256:$checkpointDispositionSha256,checkpointDatasetId:$checkpointDatasetId,checkpointRuntimeAuditSha256:$checkpointRuntimeAuditSha256,checkpointBuildOutcome:$checkpointBuildOutcome,checkpointSaveOutcome:$checkpointSaveOutcome,checkpointPublishOutcome:$checkpointPublishOutcome,privatePayloadIncluded:false}' > "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json"
          if grep -R -E -i '"(waterPoint|landPoint|currentUMps|currentVMps|rawPayload|privatePayload)"' "$RAVRADAR_OPERATIONAL_HANDOFF"; then
            echo "Operational deploy handoff contains forbidden private fields."
            exit 1
          fi

      - name: Decide whether this sealed artifact may deploy
        if: steps.preflight.outputs.should_run == 'true'
        id: deployment-decision
        shell: bash
        run: |
          action="${{ steps.operational-action.outputs.action }}"
          if [ "$action" = "candidate-dry-run" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deployment_model=candidate-g" >> "$GITHUB_OUTPUT"
            echo "Candidate G dry-run completed without public or central activation."
            exit 0
          fi
          deployment_model="integrated"
          if [ "$action" = "candidate-execute" ] || [ "$action" = "candidate-maintenance" ] || [ "$action" = "candidate-historical-maintenance" ] || [ "$action" = "candidate-legacy-maintenance" ]; then
            deployment_model="candidate-g"
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "deployment_model=$deployment_model" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        id: pages-configure
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        id: pages-upload
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 14

      - name: Resolve and seal the exact uploaded Pages artifact
        id: pages-artifact-seal
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="${{ steps.pages-upload.outputs.artifact_id }}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json"
          jq -e \
            --argjson artifactId "$artifact_id" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg headSha "$GITHUB_SHA" \
            '.id == $artifactId and .name == "github-pages" and .expired == false and .workflow_run.id == $runId and .workflow_run.head_sha == $headSha' \
            "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json" >/dev/null
          artifact_digest="$(jq -er '.digest' "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json")"
          normalized_digest="$(ARTIFACT_DIGEST="$artifact_digest" node --input-type=module -e \
            "import { normalizeArtifactDigestSha256 } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(normalizeArtifactDigestSha256(process.env.ARTIFACT_DIGEST));")"
          artifact_size="$(jq -er '.size_in_bytes | select(type == "number" and . > 0 and floor == .)' \
            "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json")"
          created_at="$(ARTIFACT_CREATED_AT="$(jq -er '.created_at' "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json")" \
            node -e "process.stdout.write(new Date(process.env.ARTIFACT_CREATED_AT).toISOString())")"
          target_manifest_sha256="$(TARGET_MANIFEST="$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            node --input-type=module -e \
            "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
          target_identity="$RAVRADAR_OPERATIONAL_WORK/integrated-implementation-identity.json"
          if [[ "${{ steps.operational-action.outputs.action }}" == candidate-* ]]; then
            target_identity="$RAVRADAR_OPERATIONAL_WORK/candidate-implementation-identity.json"
          fi
          target_closure_sha256="$(jq -er '.implementationClosureSha256 | select(test("^[a-f0-9]{64}$"))' "$target_identity")"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg headSha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg attemptId "pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --argjson artifactId "$artifact_id" \
            --arg artifactDigestSha256 "$normalized_digest" \
            --argjson artifactSizeBytes "$artifact_size" \
            --arg targetPublicManifestSha256 "$target_manifest_sha256" \
            --arg targetImplementationClosureSha256 "$target_closure_sha256" \
            --slurpfile targetModelBinding "$RAVRADAR_OPERATIONAL_HANDOFF/target-binding.json" \
            --arg createdAt "$created_at" \
            '{schemaVersion:"ravscore-operational-pages-artifact-seal-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:$ref,attemptId:$attemptId,artifactId:$artifactId,artifactName:"github-pages",artifactDigestSha256:$artifactDigestSha256,artifactSizeBytes:$artifactSizeBytes,targetPublicManifestSha256:$targetPublicManifestSha256,targetImplementationClosureSha256:$targetImplementationClosureSha256,targetModelBinding:$targetModelBinding[0],createdAt:$createdAt,privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-seal.json"
          rm "$RAVRADAR_OPERATIONAL_HANDOFF/pages-artifact-rest.json"
          if grep -R -E -i '"(waterPoint|landPoint|currentUMps|currentVMps|rawPayload|privatePayload)"' "$RAVRADAR_OPERATIONAL_HANDOFF"; then
            echo "Operational deploy handoff contains forbidden private fields after artifact sealing." >&2
            exit 1
          fi

      - name: Upload privacy-safe operational handoff evidence after Pages artifact seal
        id: handoff-upload
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ravscore-operational-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_HANDOFF }}
          retention-days: 14
          if-no-files-found: error
