name: Run current RavRadar weather once

on:
  workflow_dispatch:
    inputs:
      current_family_cold_start:
        description: 'Archive authenticated current-family B/S and measure a new cold start without changing model/SQL; fresh one-off only'
        required: false
        type: boolean
        default: false
      completed_private_runtime:
        description: 'Reuse the exact newest authenticated completed private generation without providers or scoring'
        required: false
        type: boolean
        default: false
      completed_stage_source:
        description: 'Optional exact ordinary completed-stage run-attempt-producerhead; requires completed reuse and its original checkpoint target hint'
        required: false
        type: string
        default: ''
      quick_confirmation:
        description: 'Use short supplier budgets while verifying cache continuation and deployment'
        required: false
        type: boolean
        default: false
      quick_progress_source:
        description: 'Progress source: exact encrypted-progress run-attempt for a full or short run; protected-current is short-only'
        required: false
        type: string
        default: ''
      checkpoint_target_hour:
        description: 'Resume only stored weather at its original UTC hour; authenticated checkpoint must confirm this hint'
        required: false
        type: string
        default: ''
      weather_state_epoch_bootstrap:
        description: 'Archive original B/S and start one fresh forward-only weather history epoch'
        required: false
        type: boolean
        default: false
      weather_state_epoch_checkpoint_reentry:
        description: 'Resume an exact archived epoch checkpoint without providers or SQL installation'
        required: false
        type: boolean
        default: false
      weather_state_epoch_archive_key:
        description: 'Exact previously saved epoch archive ID; checkpoint reentry only'
        required: false
        type: string
        default: ''
      weather_state_epoch_archive_catalog_sha256:
        description: 'Exact saved epoch archive catalog SHA256; checkpoint reentry only'
        required: false
        type: string
        default: ''
      weather_state_epoch_raw_cache_key:
        description: 'Exact saved RAW cache key from the same checkpoint producer; reentry only'
        required: false
        type: string
        default: ''
      native_sampling_identity_original_recovery:
        description: 'Use only the fixed authenticated I71 checkpoint and append-only native-identity recovery route'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

# Current production entrances share a new queue, never the disabled historical
# queue. Reusable workflows do not acquire this caller-held lock.
concurrency:
  group: ravradar-weather-production-v2
  queue: max
  cancel-in-progress: false

jobs:
  operational-recovery-gate:
    if: inputs.current_family_cold_start != true
    name: Finish an interrupted generation before new work
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-operational-reentry.yml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  current-main-target:
    needs: operational-recovery-gate
    if: ${{ !cancelled() && ((inputs.current_family_cold_start == true && needs.operational-recovery-gate.result == 'skipped') || (inputs.current_family_cold_start != true && needs.operational-recovery-gate.result == 'success')) }}
    name: Lock one normal run to exact current main and UTC hour
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      target_hour: ${{ steps.completed-target.outputs.target_hour || steps.checkpoint-target.outputs.target_hour || steps.cache-state.outputs.target_hour }}
      completed_private_runtime_pin: ${{ steps.completed-target.outputs.completed_private_runtime_pin }}
    steps:
      - uses: actions/checkout@v7

      - name: Reject mixed caller-only cold-start modes before target selection
        if: inputs.current_family_cold_start == true
        shell: bash
        env:
          COMPLETED: ${{ inputs.completed_private_runtime }}
          QUICK: ${{ inputs.quick_confirmation }}
          PROGRESS: ${{ inputs.quick_progress_source }}
          TARGET: ${{ inputs.checkpoint_target_hour }}
          EPOCH: ${{ inputs.weather_state_epoch_bootstrap }}
          REENTRY: ${{ inputs.weather_state_epoch_checkpoint_reentry }}
          NATIVE: ${{ inputs.native_sampling_identity_original_recovery }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$COMPLETED" = false
          test "$QUICK" = false
          test -z "$PROGRESS"
          test -z "$TARGET"
          test "$EPOCH" = false
          test "$REENTRY" = false
          test "$NATIVE" = false

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Reject an orphaned completed-stage locator before target selection
        if: inputs.completed_stage_source != ''
        shell: bash
        env:
          COMPLETED: ${{ inputs.completed_private_runtime }}
        run: |
          set -euo pipefail
          test "$COMPLETED" = true

      - uses: actions/setup-node@v7
        if: inputs.completed_private_runtime == true
        with:
          node-version: 22

      - name: Pin the actual newest completed private generation before target selection
        id: completed-target
        if: inputs.completed_private_runtime == true
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$COMPLETED_STAGE_SOURCE"; then
            node scripts/ordinary-completed-stage-admission.mjs pin
          else
            node scripts/completed-private-runtime-admission.mjs pin
          fi
        env:
          COMPLETED_PRIVATE_RUNTIME: 'true'
          COMPLETED_STAGE_SOURCE: ${{ inputs.completed_stage_source }}
          CURRENT_FAMILY_COLD_START: ${{ inputs.current_family_cold_start }}
          QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
          QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
          CHECKPOINT_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
          CHECKPOINT_ONLY: 'false'
          EPOCH_BOOTSTRAP: ${{ inputs.weather_state_epoch_bootstrap }}
          EPOCH_REENTRY: ${{ inputs.weather_state_epoch_checkpoint_reentry }}
          NATIVE_IDENTITY_RECOVERY: ${{ inputs.native_sampling_identity_original_recovery }}
          EXTENDED_PROVIDER_BOOTSTRAP: 'false'
          PRODUCE_HANDOFF: 'false'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Require the explicit provider-free epoch checkpoint request
        if: inputs.weather_state_epoch_checkpoint_reentry == true
        shell: bash
        env:
          RAVRADAR_WEATHER_STATE_EPOCH_BOOTSTRAP: 'true'
          RAVRADAR_WEATHER_STATE_EPOCH_CHECKPOINT_REENTRY: 'true'
          QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
          QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
          CHECKPOINT_ONLY: 'true'
          CHECKPOINT_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
          RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
          NATIVE_IDENTITY_RECOVERY: ${{ inputs.native_sampling_identity_original_recovery }}
          RAVRADAR_WEATHER_STATE_EPOCH_ARCHIVE_ID: ${{ inputs.weather_state_epoch_archive_key }}
          RAVRADAR_WEATHER_STATE_EPOCH_ARCHIVE_CATALOG_SHA256: ${{ inputs.weather_state_epoch_archive_catalog_sha256 }}
          RAVRADAR_WEATHER_STATE_EPOCH_RAW_CACHE_KEY: ${{ inputs.weather_state_epoch_raw_cache_key }}
        run: |
          set -euo pipefail
          test "${{ inputs.weather_state_epoch_bootstrap }}" = false
          node scripts/weather-state-epoch-budget.mjs checkpoint-request

      - name: Reject unused epoch continuation locators
        if: inputs.weather_state_epoch_checkpoint_reentry != true
        shell: bash
        env:
          ARCHIVE_ID: ${{ inputs.weather_state_epoch_archive_key }}
          ARCHIVE_CATALOG: ${{ inputs.weather_state_epoch_archive_catalog_sha256 }}
          RAW_CACHE_KEY: ${{ inputs.weather_state_epoch_raw_cache_key }}
        run: |
          set -euo pipefail
          test -z "$ARCHIVE_ID"
          test -z "$ARCHIVE_CATALOG"
          test -z "$RAW_CACHE_KEY"

      - name: Reject mixed epoch and continuation modes before target selection
        if: inputs.weather_state_epoch_bootstrap == true
        shell: bash
        env:
          QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
          QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
          CHECKPOINT_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
          NATIVE_IDENTITY_RECOVERY: ${{ inputs.native_sampling_identity_original_recovery }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$QUICK_CONFIRMATION" = false
          test -z "$QUICK_PROGRESS_SOURCE"
          test -z "$CHECKPOINT_TARGET_HOUR"
          test "$NATIVE_IDENTITY_RECOVERY" = false

      - name: Lock the requested original checkpoint hour without provider work
        id: checkpoint-target
        if: inputs.checkpoint_target_hour != '' && inputs.completed_stage_source == ''
        shell: bash
        env:
          CHECKPOINT_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
          QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
          QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
        run: |
          set -euo pipefail
          test "$QUICK_CONFIRMATION" = false
          [[ "$QUICK_PROGRESS_SOURCE" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$CHECKPOINT_TARGET_HOUR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$ ]]
          node scripts/check-production-target-freshness.mjs \
            --target "$CHECKPOINT_TARGET_HOUR" --maximum-age-minutes 90
          # This is a request, not data authority. The exact encrypted progress
          # must authenticate and confirm the same ledger hour before use.
          printf 'target_hour=%s\n' "$CHECKPOINT_TARGET_HOUR" >> "$GITHUB_OUTPUT"

      - name: Require the fixed native-identity recovery scope before continuation
        if: inputs.native_sampling_identity_original_recovery == true
        shell: bash
        env:
          QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
          QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
          CHECKPOINT_TARGET_HOUR: ${{ inputs.checkpoint_target_hour }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { assertNativeIdentityRecoveryFrozen } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          import { NATIVE_IDENTITY_ORIGINAL_PROGRESS } from './scripts/native-sampling-identity-recovery-prewrite.mjs';
          assertNativeIdentityRecoveryFrozen();
          assert.equal(process.env.QUICK_CONFIRMATION, 'false');
          assert.equal(process.env.QUICK_PROGRESS_SOURCE, NATIVE_IDENTITY_ORIGINAL_PROGRESS.source);
          assert.equal(process.env.CHECKPOINT_TARGET_HOUR, NATIVE_IDENTITY_ORIGINAL_PROGRESS.target.replace('.000Z', 'Z'));
          NODE

      - name: Lock the canonical UTC production hour
        id: cache-state
        if: inputs.checkpoint_target_hour == '' && inputs.completed_private_runtime != true
        run: python3 scripts/check-copernicus-current-hour.py --invalid-cache-is-absent --github-output "$GITHUB_OUTPUT"

      - name: Require one canonical target hour
        shell: bash
        env:
          TARGET_HOUR: ${{ steps.completed-target.outputs.target_hour || steps.checkpoint-target.outputs.target_hour || steps.cache-state.outputs.target_hour }}
        run: |
          set -euo pipefail
          [[ "$TARGET_HOUR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$ ]]

  native-identity-prewrite:
    name: Authenticate originals and install only the two exact recovery phases
    needs: current-main-target
    if: ${{ !cancelled() && needs.current-main-target.result == 'success' && inputs.native_sampling_identity_original_recovery == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RAVRADAR_NATIVE_IDENTITY_RECOVERY_OPT_IN: 'true'
      RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ needs.current-main-target.outputs.target_hour }}
      QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
      QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require fixed scope, frozen sources and current main before private work
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { assertNativeIdentityRecoveryFrozen } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          import { NATIVE_IDENTITY_ORIGINAL_PROGRESS } from './scripts/native-sampling-identity-recovery-prewrite.mjs';
          assertNativeIdentityRecoveryFrozen();
          assert.equal(process.env.QUICK_CONFIRMATION, 'false');
          assert.equal(process.env.QUICK_PROGRESS_SOURCE, NATIVE_IDENTITY_ORIGINAL_PROGRESS.source);
          assert.equal(process.env.RAVRADAR_PRODUCTION_TARGET_HOUR, NATIVE_IDENTITY_ORIGINAL_PROGRESS.target.replace('.000Z', 'Z'));
          NODE

      - name: Reuse exact successful pull-request source proof before any database write
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require existing exact source proof without a duplicate gate
        shell: bash
        run: test "${{ steps.source-proof.outputs.required }}" = false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Install normal offline component verification and geometry tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-copernicus.txt
          python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Build constrained natural zone coastlines
        run: python scripts/refine-coastlines-constrained-4.0.48.py

      - name: Sync centrally saved admin configuration
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and deletions
        run: python scripts/apply-central-zone-reviews.py

      - name: Materialize the authoritative active coastal-part registry
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Restore only the fixed authenticated progress ciphertext
        id: original-progress
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-private-progress.encrypted
          key: weather-private-progress-encrypted-v2-Linux-main-38768040429-1
          fail-on-cache-miss: true

      - name: Require actual exact cipher cache match
        shell: bash
        env:
          MATCHED_KEY: ${{ steps.original-progress.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$MATCHED_KEY" = weather-private-progress-encrypted-v2-Linux-main-38768040429-1
          test -f .cache/weather-private-progress.encrypted
          test ! -L .cache/weather-private-progress.encrypted

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0

      - name: Prepare genuine frozen230 and exact new-binding migration views
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import { constants } from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { withFrozenI71Source } from './scripts/check-native-identity-frozen-i71-source.mjs';
          import { assertNativeIdentityRecoveryFrozen, nativeIdentityMigration, readNativeIdentityCanonicalSource,
            nativeIdentitySourceSha256, NATIVE_IDENTITY_OUTPUT_REVIEW } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          assertNativeIdentityRecoveryFrozen();
          await readNativeIdentityCanonicalSource();
          const parent = await fs.realpath(process.env.RUNNER_TEMP);
          const source = path.resolve('supabase/migrations', nativeIdentityMigration().filename);
          const bytes = await fs.readFile(source);
          assert.equal(nativeIdentitySourceSha256(bytes), NATIVE_IDENTITY_OUTPUT_REVIEW.migrationSha256);
          await withFrozenI71Source(async frozen => {
            const normal = await import(pathToFileURL(path.join(frozen, 'scripts/integrated-cutover-readiness.mjs')).href);
            for (const name of ['native-identity-230-view', 'native-identity-binding-view']) {
              const workdir = path.join(parent, name);
              await assert.rejects(fs.lstat(workdir), { code: 'ENOENT' });
              await normal.prepareTemporarySupabaseCutoverWorkdir({ workdir, includeStatisticsPreferenceRevisionSource: true });
            }
          });
          const destination = path.join(parent, 'native-identity-binding-view/supabase/migrations', nativeIdentityMigration().filename);
          await fs.copyFile(source, destination, constants.COPYFILE_EXCL);
          assert.deepEqual(await fs.readFile(source), bytes);
          assert.deepEqual(await fs.readFile(destination), bytes);
          NODE

      - name: Authenticate originals and serially verify sole230 then sole native-identity SQL
        shell: bash
        env:
          NATIVE_IDENTITY_PROGRESS_CACHE_MATCHED_KEY: ${{ steps.original-progress.outputs.cache-matched-key }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEATHER_PROGRESS_MASTER_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND: ${{ vars.RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND || 'supabase' }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          view230="$RUNNER_TEMP/native-identity-230-view"
          viewbinding="$RUNNER_TEMP/native-identity-binding-view"
          list="$RUNNER_TEMP/native-identity-migrations-list.txt"
          dryrun="$RUNNER_TEMP/native-identity-migrations-dry-run.txt"
          cli_report="$RUNNER_TEMP/native-identity-stage-report.json"
          # No raw CLI/database error or private authenticated document reaches logs.
          # A failed write is UNKNOWN and stops; never retry or continue to the next phase.
          db() {
            if supabase "$@" > "$RUNNER_TEMP/native-identity-db-command.txt" 2>&1; then
              return 0
            else
              status=$?
              # Keep the original complete output private and report only
              # fixed operational categories, exit status and SQLSTATE.
              DB_EXIT_STATUS="$status" DB_ACTION="$1" node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const text = await fs.readFile(path.join(process.env.RUNNER_TEMP, 'native-identity-db-command.txt'), 'utf8');
          const states = [...new Set([...text.matchAll(/\bSQLSTATE[ :=(]*([A-Z0-9]{5})\b/g)].map(match => match[1]))];
          const fixed = [...new Set([...text.matchAll(/\b(?:NATIVE_IDENTITY_[A-Z_]+|NATIVE_SAMPLING_IDENTITY_[A-Z_]+)\b/g)].map(match => match[0]))];
          console.error(JSON.stringify({kind:'NATIVE_IDENTITY_DATABASE_FAILURE',
            action:['link','migration','db'].includes(process.env.DB_ACTION)?process.env.DB_ACTION:'UNKNOWN',
            exitStatus:Number(process.env.DB_EXIT_STATUS),sqlStates:states.slice(0,4),codes:fixed.slice(0,4)}));
          NODE
              echo 'NATIVE_IDENTITY_DATABASE_COMMAND_FAILED_OR_OUTCOME_UNKNOWN_DO_NOT_RETRY' >&2
              return 1
            fi
          }
          history() {
            (cd "$1" && db migration list --linked)
            cp "$RUNNER_TEMP/native-identity-db-command.txt" "$list"
          }
          plan() {
            (cd "$1" && db db push --linked --dry-run --skip-vault)
            cp "$RUNNER_TEMP/native-identity-db-command.txt" "$dryrun"
          }
          hydrate_view() {
            VIEW_PHASE="$1" env -u SUPABASE_DB_PASSWORD node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { withFrozenI71Source } from './scripts/check-native-identity-frozen-i71-source.mjs';
          import { nativeIdentityMigration, readNativeIdentityCanonicalSource, nativeIdentitySourceSha256,
            NATIVE_IDENTITY_OUTPUT_REVIEW } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          const phase = process.env.VIEW_PHASE;
          assert(['230', 'binding'].includes(phase));
          const parent = await fs.realpath(process.env.RUNNER_TEMP);
          const workdir = path.join(parent, 'native-identity-' + phase + '-view');
          const migrationListText = await fs.readFile(path.join(parent, 'native-identity-migrations-list.txt'), 'utf8');
          await withFrozenI71Source(async frozen => {
            const normal = await import(pathToFileURL(path.join(frozen, 'scripts/integrated-cutover-readiness.mjs')).href);
            await normal.hydrateTemporaryRemoteMigrationHistory({ workdir, migrationListText });
            for (const filename of [...normal.REQUIRED_CUTOVER_MIGRATIONS.map(row => row.filename),
              '20261013230000_account_statistics_revision.sql']) {
              assert.deepEqual(await fs.readFile(path.join(workdir, 'supabase/migrations', filename)),
                await fs.readFile(path.join(frozen, 'supabase/migrations', filename)));
            }
          });
          const next = path.join(workdir, 'supabase/migrations', nativeIdentityMigration().filename);
          if (phase === '230') await assert.rejects(fs.lstat(next), { code: 'ENOENT' });
          else {
            await readNativeIdentityCanonicalSource();
            assert.equal(nativeIdentitySourceSha256(await fs.readFile(next)), NATIVE_IDENTITY_OUTPUT_REVIEW.migrationSha256);
          }
          NODE
          }
          stage() {
            # DB password is solely for the linked installer, never the original reader.
            env -u SUPABASE_DB_PASSWORD node scripts/native-sampling-identity-recovery-prewrite.mjs "$1" > "$cli_report"
            STAGE="$1" env -u SUPABASE_DB_PASSWORD node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const report = JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'native-identity-stage-report.json'), 'utf8'));
          assert.equal(report.status, 'NATIVE_IDENTITY_RECOVERY_PREWRITE_PASSED');
          assert.equal(report.stage, process.env.STAGE);
          assert.equal(report.partCount, 673);
          assert.equal(report.originalBytesUnchanged, true);
          assert.equal(report.oldI71ProgressAuthenticated, true);
          assert.equal(report.installationPerformed, false);
          assert.equal(report.numericAdmissionClaimed, false);
          assert.equal(report.privatePayloadIncluded, false);
          assert(['before-230', 'before-binding', 'after-binding'].includes(report.databasePhase));
          console.log(report.databasePhase);
          NODE
          }
          exact_main() {
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
            test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          }
          (cd "$viewbinding" && db link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD")
          history "$viewbinding"
          hydrate_view binding
          history "$viewbinding"
          phase="$(stage prepare)"
          case "$phase" in before-230|before-binding|after-binding) ;; *) exit 1 ;; esac
          if test "$phase" = before-230; then
            (cd "$view230" && db link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD")
            history "$view230"
            hydrate_view 230
            history "$view230"
            plan "$view230"
            stage verify-230-plan
            exact_main
            (cd "$view230" && db db push --linked --skip-vault)
            history "$view230"
            plan "$view230"
            stage verify-230-installed
          fi
          if test "$phase" != after-binding; then
            history "$viewbinding"
            hydrate_view binding
            history "$viewbinding"
            plan "$viewbinding"
            stage verify-binding-plan
            exact_main
            (cd "$viewbinding" && db db push --linked --skip-vault)
          fi
          history "$viewbinding"
          plan "$viewbinding"
          stage verify-binding-installed
          echo 'NATIVE_IDENTITY_TWO_PHASE_INSTALL_AND_READBACK_COMPLETE_NO_PUBLICATION'

  state-epoch-prewrite:
    name: Archive authentic originals before the one-off fresh epoch
    needs: current-main-target
    if: ${{ !cancelled() && needs.current-main-target.result == 'success' && inputs.weather_state_epoch_bootstrap == true }}
    runs-on: ubuntu-24.04
    # First archive + serial install only; bounded, not a performance guarantee.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RAVRADAR_WEATHER_STATE_EPOCH_BOOTSTRAP: 'true'
      CHECKPOINT_ONLY: 'false'
      NATIVE_IDENTITY_RECOVERY: 'false'
      CHECKPOINT_TARGET_HOUR: ''
      RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ needs.current-main-target.outputs.target_hour }}
      QUICK_PROGRESS_SOURCE: ${{ inputs.quick_progress_source }}
      QUICK_CONFIRMATION: ${{ inputs.quick_confirmation }}
    outputs:
      archive_key: ${{ steps.epoch-prewrite.outputs.archive_key }}
      archive_catalog_sha256: ${{ steps.epoch-prewrite.outputs.archive_catalog_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require fresh epoch scope, frozen sources and exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          node scripts/weather-state-epoch-budget.mjs request
          node --input-type=module <<'NODE'
          import { assertNativeIdentityBindingsFrozen, assertNativeIdentityOutputFrozen }
            from './scripts/lib/native-sampling-identity-successor-source.mjs';
          assertNativeIdentityBindingsFrozen(); assertNativeIdentityOutputFrozen();
          NODE

      - name: Reuse exact successful pull-request source proof before any database write
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require existing exact source proof without a duplicate gate
        shell: bash
        run: test "${{ steps.source-proof.outputs.required }}" = false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Install normal offline component verification and geometry tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-copernicus.txt
          python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Build constrained natural zone coastlines
        run: python scripts/refine-coastlines-constrained-4.0.48.py

      - name: Sync centrally saved admin configuration
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and deletions
        run: python scripts/apply-central-zone-reviews.py

      - name: Materialize the authoritative active coastal-part registry
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Capture the six actual public files for the immutable epoch archive
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { manifestBoundedPublicDetailsBytes } from './scripts/prepare-code-only-public-runtime.mjs';
          import { fstatSync } from 'node:fs';
          const parent = await fs.realpath(process.env.RUNNER_TEMP);
          const root = path.join(parent, 'ravradar-weather-state-epoch-public-snapshot');
          await fs.mkdir(root, { mode: 0o700 });
          const signal = AbortSignal.timeout(360000);
          const retainedHandles = new Set();
          const read = async (remote, local, cap) => {
            const response = await fetch('https://ravradar.dk/' + remote, {
              redirect: 'error', cache: 'no-store', credentials: 'omit', signal,
            });
            assert(response.status === 200 && !response.redirected && response.body);
            const declared = response.headers.get('content-length');
            if (declared !== null) assert(/^[0-9]+$/.test(declared) && Number(declared) <= cap);
            const file = await fs.open(path.join(root, local), 'wx', 0o600);
            const fd = file.fd;
            retainedHandles.add(file);
            let total = 0, first;
            try {
              for await (const bytes of response.body) {
                total += bytes.byteLength; assert(total <= cap);
                await file.writeFile(bytes);
              }
              assert(total > 0); await file.sync();
            } catch (error) { first = error; }
            try { await file.close(); } catch (error) { first ??= error; }
            let closed = false;
            try { fstatSync(fd); first ??= new Error('WEATHER_STATE_EPOCH_PUBLIC_CLOSE_UNPROVED'); }
            catch (error) { closed = error.code === 'EBADF'; if (!closed) first ??= error; }
            if (closed) retainedHandles.delete(file);
            if (first) throw first;
          };
          await read('data/live/manifest.json', 'manifest.json', 1048576);
          const manifest = JSON.parse(await fs.readFile(path.join(root, 'manifest.json'), 'utf8'));
          for (const [remote, local, cap] of [
            ['data/live/public-conditions.json', 'public-conditions.json', 33554432],
            ['data/live/public-condition-details.json', 'public-condition-details.json', manifestBoundedPublicDetailsBytes(manifest.publicConditionDetailsBytes)],
            ['data/live/coastal-parts-v2.json', 'coastal-parts-v2.json', 16777216],
            ['data/zones.geojson', 'zones.geojson', 33554432],
            ['data/water-level-station-routing.json', 'water-level-station-routing.json', 4194304],
          ]) await read(remote, local, cap);
          console.log('WEATHER_STATE_EPOCH_SIX_PUBLIC_FILES_CAPTURED_NO_ADMISSION');
          NODE

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0

      - name: Prepare genuine frozen230 and exact new-binding migration views
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import { constants } from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { withFrozenI71Source } from './scripts/check-native-identity-frozen-i71-source.mjs';
          import { assertNativeIdentityBindingsFrozen, assertNativeIdentityOutputFrozen, nativeIdentityMigration, readNativeIdentityCanonicalSource,
            nativeIdentitySourceSha256, NATIVE_IDENTITY_OUTPUT_REVIEW } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          assertNativeIdentityBindingsFrozen(); assertNativeIdentityOutputFrozen();
          await readNativeIdentityCanonicalSource();
          const parent = await fs.realpath(process.env.RUNNER_TEMP);
          const source = path.resolve('supabase/migrations', nativeIdentityMigration().filename);
          const bytes = await fs.readFile(source);
          assert.equal(nativeIdentitySourceSha256(bytes), NATIVE_IDENTITY_OUTPUT_REVIEW.migrationSha256);
          await withFrozenI71Source(async frozen => {
            const normal = await import(pathToFileURL(path.join(frozen, 'scripts/integrated-cutover-readiness.mjs')).href);
            for (const name of ['weather-state-epoch-230-view', 'weather-state-epoch-binding-view']) {
              const workdir = path.join(parent, name);
              await assert.rejects(fs.lstat(workdir), { code: 'ENOENT' });
              await normal.prepareTemporarySupabaseCutoverWorkdir({ workdir, includeStatisticsPreferenceRevisionSource: true });
            }
          });
          const destination = path.join(parent, 'weather-state-epoch-binding-view/supabase/migrations', nativeIdentityMigration().filename);
          await fs.copyFile(source, destination, constants.COPYFILE_EXCL);
          assert.deepEqual(await fs.readFile(source), bytes);
          assert.deepEqual(await fs.readFile(destination), bytes);
          NODE

      - name: Archive originals and serially install sole230 then sole new binding
        id: epoch-prewrite
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: afqhhdrkjfjtpadntdzo
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND: ${{ vars.RAVRADAR_PRIVATE_RUNTIME_STORAGE_BACKEND || 'supabase' }}
          RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
          RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
          RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          view230="$RUNNER_TEMP/weather-state-epoch-230-view"
          viewbinding="$RUNNER_TEMP/weather-state-epoch-binding-view"
          list="$RUNNER_TEMP/weather-state-epoch-migrations-list.txt"
          dryrun="$RUNNER_TEMP/weather-state-epoch-migrations-dry-run.txt"
          cli_report="$RUNNER_TEMP/weather-state-epoch-stage-report.json"
          # No raw CLI/database error or private authenticated document reaches logs.
          # A failed write is UNKNOWN and stops; never retry or continue to the next phase.
          db() {
            if supabase "$@" > "$RUNNER_TEMP/weather-state-epoch-db-command.txt" 2>&1; then
              return 0
            else
              status=$?
              # Keep the original complete output private and report only
              # fixed operational categories, exit status and SQLSTATE.
              DB_EXIT_STATUS="$status" DB_ACTION="$1" node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const text = await fs.readFile(path.join(process.env.RUNNER_TEMP, 'weather-state-epoch-db-command.txt'), 'utf8');
          const states = [...new Set([...text.matchAll(/\bSQLSTATE[ :=(]*([A-Z0-9]{5})\b/g)].map(match => match[1]))];
          const fixed = [...new Set([...text.matchAll(/\b(?:NATIVE_IDENTITY_[A-Z_]+|NATIVE_SAMPLING_IDENTITY_[A-Z_]+)\b/g)].map(match => match[0]))];
          console.error(JSON.stringify({kind:'WEATHER_STATE_EPOCH_DATABASE_FAILURE',
            action:['link','migration','db'].includes(process.env.DB_ACTION)?process.env.DB_ACTION:'UNKNOWN',
            exitStatus:Number(process.env.DB_EXIT_STATUS),sqlStates:states.slice(0,4),codes:fixed.slice(0,4)}));
          NODE
              echo 'WEATHER_STATE_EPOCH_DATABASE_COMMAND_FAILED_OR_OUTCOME_UNKNOWN_DO_NOT_RETRY' >&2
              return 1
            fi
          }
          history() {
            (cd "$1" && db migration list --linked)
            cp "$RUNNER_TEMP/weather-state-epoch-db-command.txt" "$list"
          }
          plan() {
            (cd "$1" && db db push --linked --dry-run --skip-vault)
            cp "$RUNNER_TEMP/weather-state-epoch-db-command.txt" "$dryrun"
          }
          hydrate_view() {
            VIEW_PHASE="$1" env -u SUPABASE_DB_PASSWORD node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { withFrozenI71Source } from './scripts/check-native-identity-frozen-i71-source.mjs';
          import { nativeIdentityMigration, readNativeIdentityCanonicalSource, nativeIdentitySourceSha256,
            NATIVE_IDENTITY_OUTPUT_REVIEW } from './scripts/lib/native-sampling-identity-successor-source.mjs';
          const phase = process.env.VIEW_PHASE;
          assert(['230', 'binding'].includes(phase));
          const parent = await fs.realpath(process.env.RUNNER_TEMP);
          const workdir = path.join(parent, 'weather-state-epoch-' + phase + '-view');
          const migrationListText = await fs.readFile(path.join(parent, 'weather-state-epoch-migrations-list.txt'), 'utf8');
          await withFrozenI71Source(async frozen => {
            const normal = await import(pathToFileURL(path.join(frozen, 'scripts/integrated-cutover-readiness.mjs')).href);
            await normal.hydrateTemporaryRemoteMigrationHistory({ workdir, migrationListText });
            for (const filename of [...normal.REQUIRED_CUTOVER_MIGRATIONS.map(row => row.filename),
              '20261013230000_account_statistics_revision.sql']) {
              assert.deepEqual(await fs.readFile(path.join(workdir, 'supabase/migrations', filename)),
                await fs.readFile(path.join(frozen, 'supabase/migrations', filename)));
            }
          });
          const next = path.join(workdir, 'supabase/migrations', nativeIdentityMigration().filename);
          if (phase === '230') await assert.rejects(fs.lstat(next), { code: 'ENOENT' });
          else {
            await readNativeIdentityCanonicalSource();
            assert.equal(nativeIdentitySourceSha256(await fs.readFile(next)), NATIVE_IDENTITY_OUTPUT_REVIEW.migrationSha256);
          }
          NODE
          }
          stage() {
            # DB password is solely for the linked installer, never the original reader.
            env -u SUPABASE_DB_PASSWORD node scripts/weather-state-epoch.mjs "$1" > "$cli_report"
            STAGE="$1" env -u SUPABASE_DB_PASSWORD node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const report = JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP, 'weather-state-epoch-stage-report.json'), 'utf8'));
          assert.equal(report.stage, process.env.STAGE);
          assert.equal(report.admission, 'NO_ADMISSION');
          if (process.env.STAGE === 'prepare') {
            assert.equal(report.archived, true);
            assert(['before-230', 'before-binding', 'after-binding'].includes(report.databasePhase));
            console.log(report.databasePhase);
          } else assert.equal(report.verified, true);
          NODE
          }
          exact_main() {
            node scripts/check-fixed-supabase-account-read-idle.mjs
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
            test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          }
          (cd "$viewbinding" && db link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD")
          history "$viewbinding"
          hydrate_view binding
          history "$viewbinding"
          exact_main
          phase="$(stage prepare)"
          case "$phase" in before-230|before-binding|after-binding) ;; *) exit 1 ;; esac
          if test "$phase" = before-230; then
            (cd "$view230" && db link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD")
            history "$view230"
            hydrate_view 230
            history "$view230"
            plan "$view230"
            stage verify-230-plan
            exact_main
            (cd "$view230" && db db push --linked --skip-vault)
            history "$view230"
            plan "$view230"
            stage verify-230-installed
          fi
          if test "$phase" != after-binding; then
            history "$viewbinding"
            hydrate_view binding
            history "$viewbinding"
            plan "$viewbinding"
            stage verify-binding-plan
            exact_main
            (cd "$viewbinding" && db db push --linked --skip-vault)
          fi
          history "$viewbinding"
          plan "$viewbinding"
          stage verify-binding-installed
          echo 'WEATHER_STATE_EPOCH_ARCHIVE_AND_DATABASE_READBACK_COMPLETE_NO_PUBLICATION'

  build-and-prepare:
    name: Build and prepare weather production through reusable workflow
    needs: [current-main-target, native-identity-prewrite, state-epoch-prewrite]
    if: >-
      !cancelled() && needs.current-main-target.result == 'success' &&
      ((inputs.native_sampling_identity_original_recovery == true && needs.native-identity-prewrite.result == 'success') ||
       (inputs.native_sampling_identity_original_recovery != true && needs.native-identity-prewrite.result == 'skipped')) &&
      ((inputs.weather_state_epoch_bootstrap == true && needs.state-epoch-prewrite.result == 'success') ||
       (inputs.weather_state_epoch_bootstrap != true && needs.state-epoch-prewrite.result == 'skipped'))
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/reusable-weather-build.yml
    with:
      production_target_hour: ${{ needs.current-main-target.outputs.target_hour }}
      completed_private_runtime: ${{ inputs.completed_private_runtime }}
      completed_private_runtime_pin: ${{ needs.current-main-target.outputs.completed_private_runtime_pin }}
      completed_stage_source: ${{ inputs.completed_stage_source }}
      force: true
      extended_provider_bootstrap: ${{ inputs.weather_state_epoch_bootstrap == true || inputs.current_family_cold_start == true }}
      current_family_cold_start: ${{ inputs.current_family_cold_start == true }}
      weather_state_epoch_bootstrap: ${{ inputs.weather_state_epoch_bootstrap == true || inputs.weather_state_epoch_checkpoint_reentry == true }}
      weather_state_epoch_checkpoint_reentry: ${{ inputs.weather_state_epoch_checkpoint_reentry }}
      weather_state_epoch_raw_cache_key: ${{ inputs.weather_state_epoch_raw_cache_key }}
      weather_state_epoch_archive_key: ${{ inputs.weather_state_epoch_checkpoint_reentry && inputs.weather_state_epoch_archive_key || needs.state-epoch-prewrite.outputs.archive_key }}
      weather_state_epoch_archive_catalog_sha256: ${{ inputs.weather_state_epoch_checkpoint_reentry && inputs.weather_state_epoch_archive_catalog_sha256 || needs.state-epoch-prewrite.outputs.archive_catalog_sha256 }}
      quick_confirmation: ${{ inputs.quick_confirmation }}
      quick_progress_source: ${{ inputs.quick_progress_source }}
      checkpoint_only: ${{ inputs.checkpoint_target_hour != '' && inputs.completed_stage_source == '' }}
      native_sampling_identity_original_recovery: ${{ inputs.native_sampling_identity_original_recovery }}
      produce_weather_handoff: false
      produce_weather_handoff_confirmation: ''
      ravscore_candidate_g_rollback_mode: ''
      ravscore_candidate_g_rollback_confirmation: ''
      ravscore_integrated_first_cutover: false
      ravscore_integrated_first_cutover_confirmation: ''
      ravscore_integrated_weather_handoff_run_id: ''
      ravscore_integrated_return: false
      ravscore_integrated_return_confirmation: ''
    secrets:
      RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
      CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
      RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
      RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}

  deploy-pages:
    name: Deploy prepared Pages artifact through reusable workflow
    needs: build-and-prepare
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build-and-prepare.result == 'success' && needs.build-and-prepare.outputs.should_deploy == 'true' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages-deploy.yml
    with:
      active_deployment_id: ${{ needs.build-and-prepare.outputs.active_deployment_id }}
      central_version: ${{ needs.build-and-prepare.outputs.central_version }}
      code_only_repair: false
      deployment_model: ${{ needs.build-and-prepare.outputs.deployment_model }}
      integrated_implementation_closure_sha256: ${{ needs.build-and-prepare.outputs.integrated_implementation_closure_sha256 }}
      legacy_source_required: ${{ needs.build-and-prepare.outputs.legacy_source_required }}
      operational_action: ${{ needs.build-and-prepare.outputs.operational_action }}
      source_repair_id: ''
      exact_public_recovery: false
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  terminal-outcome:
    name: Require a verified current-weather deployment
    needs: [current-main-target, native-identity-prewrite, state-epoch-prewrite, build-and-prepare, deploy-pages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Summarize and require the complete normal production path
        shell: bash
        env:
          TARGET_RESULT: ${{ needs.current-main-target.result }}
          EPOCH_REQUESTED: ${{ inputs.weather_state_epoch_bootstrap }}
          EPOCH_PREWRITE_RESULT: ${{ needs.state-epoch-prewrite.result }}
          NATIVE_IDENTITY_REQUESTED: ${{ inputs.native_sampling_identity_original_recovery }}
          NATIVE_IDENTITY_PREWRITE_RESULT: ${{ needs.native-identity-prewrite.result }}
          BUILD_RESULT: ${{ needs.build-and-prepare.result }}
          SHOULD_DEPLOY: ${{ needs.build-and-prepare.outputs.should_deploy }}
          WEATHER_OUTCOME: ${{ needs.build-and-prepare.outputs.weather_outcome }}
          COMPLETED_PRIVATE_RUNTIME: ${{ inputs.completed_private_runtime }}
          COMPLETED_RUNTIME_OUTCOME: ${{ needs.build-and-prepare.outputs.completed_runtime_outcome }}
          FULL_VALIDATION_OUTCOME: ${{ needs.build-and-prepare.outputs.full_validation_outcome }}
          RELEASE_GATE_OUTCOME: ${{ needs.build-and-prepare.outputs.release_gate_outcome }}
          PAGES_BUILD_OUTCOME: ${{ needs.build-and-prepare.outputs.pages_build_outcome }}
          PAGES_PRIVACY_OUTCOME: ${{ needs.build-and-prepare.outputs.pages_privacy_outcome }}
          PAGES_ARTIFACT_SEAL_OUTCOME: ${{ needs.build-and-prepare.outputs.pages_artifact_seal_outcome }}
          ARTIFACT_BUILT: ${{ needs.build-and-prepare.outputs.artifact_built }}
          DEPLOY_RESULT: ${{ needs.deploy-pages.result }}
          DEPLOYMENT_OUTCOME: ${{ needs.deploy-pages.outputs.deployment_outcome }}
          PUBLIC_VERIFICATION_OUTCOME: ${{ needs.deploy-pages.outputs.public_verification_outcome }}
          DEPLOYED_VERIFIED: ${{ needs.deploy-pages.outputs.deployed_verified }}
        run: |
          set -euo pipefail
          {
            echo "### Current weather production"
            echo ""
            echo "- Target lock: $TARGET_RESULT"
            echo "- Weather build: $BUILD_RESULT / $WEATHER_OUTCOME"
            echo "- Full validation: $FULL_VALIDATION_OUTCOME"
            echo "- Release gate: $RELEASE_GATE_OUTCOME"
            echo "- Artifact: $ARTIFACT_BUILT / $PAGES_BUILD_OUTCOME / $PAGES_PRIVACY_OUTCOME / $PAGES_ARTIFACT_SEAL_OUTCOME"
            echo "- Pages: $DEPLOY_RESULT / $DEPLOYMENT_OUTCOME / $PUBLIC_VERIFICATION_OUTCOME / verified=$DEPLOYED_VERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$NATIVE_IDENTITY_REQUESTED" = true; then
            test "$NATIVE_IDENTITY_PREWRITE_RESULT" = success
          else
            test "$NATIVE_IDENTITY_PREWRITE_RESULT" = skipped
          fi
          if test "$EPOCH_REQUESTED" = true; then
            test "$EPOCH_PREWRITE_RESULT" = success
          else
            test "$EPOCH_PREWRITE_RESULT" = skipped
          fi
          node scripts/lib/verified-weather-deployment-terminal.mjs

  notify-owner-failure:
    name: Hand off one bot-started ordinary failure to the existing owner alert
    needs: terminal-outcome
    if: >-
      always() && !cancelled() &&
      github.repository == 'jakobjorgensen82-commits/RavRadar' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'github-actions[bot]' &&
      needs.terminal-outcome.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # GITHUB_TOKEN completion events are not a reliable bot-origin trigger.
      # This one explicit workflow_dispatch is supported. The separate alert
      # observes actual run completion and revalidates main before any issue.
      - name: Dispatch the existing alert once, without retry or provider work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = jakobjorgensen82-commits/RavRadar
          test "$GITHUB_REF" = refs/heads/main
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          if ! timeout 20s gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/notify-weather-failure.yml/dispatches" \
            -f ref=main -f "inputs[failed_run_id]=$GITHUB_RUN_ID" \
            -f "inputs[source_run_attempt]=$GITHUB_RUN_ATTEMPT" \
            -F "inputs[wait_for_completion]=true" > /dev/null 2>&1; then
            echo 'WEATHER_FAILURE_ALERT_DISPATCH_OUTCOME_UNKNOWN_DO_NOT_RETRY' >&2
            exit 1
          fi
