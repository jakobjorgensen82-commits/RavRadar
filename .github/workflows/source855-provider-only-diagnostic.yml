name: Diagnose SOURCE current closure on synthetic data
on:
  push:
    branches: [codex/source610-full-provider-after856-20261110]

permissions:
  contents: read

concurrency:
  group: source610-full-provider-after856-diagnostic
  cancel-in-progress: false

jobs:
  provider-only-no-admission:
    if: github.repository_id == '1306858343' && github.ref == 'refs/heads/codex/source610-full-provider-after856-20261110' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact public synthetic fixture source
        uses: actions/checkout@v7
        with:
          ref: 4fd88315823a4afd41372d08093ae244d401edb3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up the exact existing source test dependencies
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check --no-input --timeout 15 --retries 0
          --only-binary=:all: -r requirements-dmi.txt -r requirements-geometry.txt -r requirements-copernicus.txt
      - name: Probe the unchanged normal current closure without scalar and WAM setup
        timeout-minutes: 25
        shell: bash
        run: |
          unset GITHUB_TOKEN GH_TOKEN GITHUB_EVENT_PATH
          PYTHON312=$(command -v python)
          NODE24=$(command -v node)
          unset RR855_H0
          set -eu
          umask 077
          repo=$(pwd -P)
          head=4fd88315823a4afd41372d08093ae244d401edb3
          tree=bce356d1d4c950eca0abd98ea7d08b2b463090ee
          export GIT_NO_LAZY_FETCH=1 GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          actual_head=$(git -c protocol.allow=never rev-parse HEAD^{commit})
          actual_tree=$(git -c protocol.allow=never rev-parse HEAD^{tree})
          physical_top=$(git -c protocol.allow=never rev-parse --show-toplevel)
          shallow=$(git -c protocol.allow=never rev-parse --is-shallow-repository)
          dirty=$(git -c protocol.allow=never status --porcelain=v1 --untracked-files=all)
          test "$actual_head" = "$head" && test "$actual_tree" = "$tree" &&
            test "$physical_top" = "$repo" && test "$shallow" = false && test -z "$dirty" || exit 1
          if git config --local --get-regexp '^(extensions\.partialclone|remote\..*\.promisor)$' >/dev/null 2>&1; then exit 1; fi
          library_path=$(printenv LD_LIBRARY_PATH || true)
          actual_h0=$(printenv RR855_H0 || true)
          env -i PATH="$PATH" LANG=C.UTF-8 LD_LIBRARY_PATH="$library_path" \
            "$PYTHON312" -I -B - "$NODE24" "$actual_h0" "$head" 3>&1 >/dev/null 2>&1 <<'PY'
          import ast
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          import time

          phase = 'ENVIRONMENT'
          started = time.monotonic()
          result = {'kind': 'CURRENT_PROVIDER_ONLY_DIAGNOSTIC', 'outcome': 'REFUSED',
                    'phase': phase, 'exitCode': None, 'referenceMode': 'UNSET',
                    'providerFailure': None, 'initialWeatherLine': None,
                    'privatePayloadIncluded': False, 'producerFrame': None, 'terminalFamily': None}
          try:
              import eccodes
              import requests.adapters
              import urllib3.util.retry
              node, captured_h0, head = sys.argv[1:]
              node = Path(node)
              assert sys.platform == 'linux' and sys.version_info[:2] == (3, 12)
              assert eccodes.codes_get_api_version() == '2.48.2'
              assert node.is_absolute() and node.is_file()
              assert subprocess.check_output([str(node), '-p', "process.versions.node.split('.')[0]"],
                                             stdin=subprocess.DEVNULL, timeout=30) == b'24\n'
              assert not captured_h0 or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:00:00\.000Z', captured_h0)
              phase = 'OWNED_HOST'
              observer_path = Path.cwd() / 'scripts/test-source598-current-native-profile.py'
              spec = importlib.util.spec_from_file_location('source855_provider_only_observer', observer_path)
              observer = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(observer)
              observer.NODE = node
              assert observer.CURRENT_NATIVE_CONTEXT is None
              test = observer.SourceCurrentNative()
              phase = 'PROFILE'
              profile = test.current598_profile()
              phase = 'OWNED_HOST'
              own, root, environment, normal_h0 = test.owned_current_host(head, with_sdk=False, input_profile=profile)
              owner = own.lstat()
              assert own.parent == Path(tempfile.gettempdir()).resolve(strict=True)
              assert owner.st_uid == os.getuid() == os.geteuid()
              assert stat.S_ISDIR(owner.st_mode) and stat.S_IMODE(owner.st_mode) == 0o700
              (own / 'fixture-current598').mkdir(mode=0o700)

              # Owned test copy only. Keep real current GRIB manufacture, canonical
              # ledger, Copernicus registry, no-network fallback, and closure intact.
              fixture = root / 'scripts/fixtures/source19-current-native-providers.py'
              before = fixture.read_bytes()
              assert hashlib.sha256(before).hexdigest() == 'c36ff0fdeab148aa99cb438074dc9063e7cf9779d2459ab04216e31501052a01'
              lines = before.decode().splitlines(keepends=True)
              lines.insert(485, '    return  # Focused diagnostic ends after the unchanged closure CLI.\n')
              del lines[385:392]
              focused = ''.join(lines).encode()
              assert hashlib.sha256(focused).hexdigest() == '7bbb69921769bb0363b91962aa2dedce35ac2e4ca89f01e4cf96fc5d926d4e5b'
              compile(focused, str(fixture), 'exec')
              fixture.write_bytes(focused)
              result['scope'] = 'CURRENT_ONLY_NO_SCALAR_WAM'
              phase = 'PROVIDERS'
              result['referenceMode'] = 'CAPTURED_HOUR' if captured_h0 else 'NEW_NORMAL_HOUR'
              command = [sys.executable, '-I', '-B',
                         str(root / 'scripts/fixtures/source19-current-native-providers.py'),
                         str(node), captured_h0 or normal_h0, '--current598']
              with (own / 'current598-providers-whole.stdout').open('xb') as stdout, \
                   (own / 'current598-providers-whole.stderr').open('xb') as stderr:
                  child = subprocess.run(command, cwd=root, env=environment, stdin=subprocess.DEVNULL,
                                         stdout=stdout, stderr=stderr, check=False)
                  for stream in (stdout, stderr):
                      stream.flush()
                      os.fsync(stream.fileno())
              result['exitCode'] = child.returncode
              result['outcome'] = 'REFUSED' if child.returncode == 0 else 'CHILD_FAILED'
              result['providerFailure'] = observer.current_provider_failure(own, root) if child.returncode else None
              stdout = observer.source_current_cohort_read(own, 'current598-providers-whole.stdout', 1024 * 1024)
              code = re.findall(rb'^Current operational closure failed: ([A-Z][A-Z0-9_]{1,79})\r?$', stdout, re.M)
              completed = re.findall(rb'^Current operational closure READY: pairs=79414; dmi=79414; copernicus=0; regional=0; openMeteo=0; missing=0; closure=[0-9a-f]{64}\.\r?$', stdout, re.M)
              allowed = {'UNEXPECTED_CLOSURE_ERROR'}
              for relative, names in (
                  ('scripts/build-current-operational-closure.py', {'RuntimeError'}),
                  ('scripts/lib/current_operational_closure.py', {'_fail'}),
                  ('scripts/lib/current_regional_operational_evidence.py', {'_fail'}),
              ):
                  source = root / relative
                  if not source.is_file():
                      continue
                  tree = ast.parse(source.read_text(encoding='utf-8'))
                  for call in ast.walk(tree):
                      if (isinstance(call, ast.Call) and isinstance(call.func, ast.Name) and call.func.id in names
                              and call.args and isinstance(call.args[0], ast.Constant) and isinstance(call.args[0].value, str)
                              and re.fullmatch(r'[A-Z][A-Z0-9_]{1,79}', call.args[0].value)):
                          allowed.add(call.args[0].value)
              result['closureOutcome'] = 'UNOBSERVED'
              result['closureCode'] = None
              if len(code) == 1 and not completed and child.returncode != 0:
                  result['closureOutcome'] = 'CLOSURE_FAILED'
                  reason = code[0].decode('ascii')
                  result['closureCode'] = reason if reason in allowed else 'UNCLASSIFIED'
              if len(completed) == 1 and not code and child.returncode == 0:
                  result['closureOutcome'] = 'CLOSURE_READY'
                  result['outcome'] = 'CHILD_SUCCESS'
          except Exception:
              # Preserve refusal or the observed child failure. No exception content.
              pass
          result['phase'] = phase
          result['elapsedSeconds'] = round(time.monotonic() - started, 1)
          with os.fdopen(3, 'w') as report:
              print(json.dumps(result, separators=(',', ':')), file=report, flush=True)
          raise SystemExit(0 if result['outcome'] == 'CHILD_SUCCESS' else 1)
          PY
