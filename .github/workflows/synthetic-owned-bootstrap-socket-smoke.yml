name: Verify local Supabase bootstrap socket smoke
on:
  push:
    branches: [codex/backup856-bootstrap-socket-smoke-20261110]
permissions:
  contents: read
concurrency:
  group: ravradar-synthetic-standard-local-restore
  cancel-in-progress: false
jobs:
  bootstrap-socket-smoke:
    if: github.repository_id == '1306858343' && github.event_name == 'push' && github.ref == 'refs/heads/codex/backup856-bootstrap-socket-smoke-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require exact hosted diagnostic source
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/backup856-bootstrap-socket-smoke-20261110
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        timeout-minutes: 2
        with:
          version: 2.117.0
      - name: Check only owned PostgreSQL bootstrap socket and transaction roles
        timeout-minutes: 23
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: node scripts/test-supabase-cli-local-restore.mjs --run-bootstrap-socket-smoke
