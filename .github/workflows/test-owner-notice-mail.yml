name: Test one RavRadar owner notice
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: One approved owner probe; no automatic user notices or deletion
        type: choice
        required: true
        options: [TEST-EXISTING-OWNER-MAIL-ONCE]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ravradar-weather-production-v2
  cancel-in-progress: false
jobs:
  owner-probe:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0
      - name: Qualify pinned CLI help without private credentials
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {qualifyOwnerProbeCli} from './scripts/owner-notice-probe-ci.mjs';
          const env=Object.fromEntries(['PATH','HOME','RUNNER_TEMP','TMPDIR'].filter(k=>process.env[k]).map(k=>[k,process.env[k]]));
          qualifyOwnerProbeCli(args=>execFileSync('supabase',args,{env,encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:15000}));
          execFileSync('gh',['--version'],{env,stdio:['ignore','pipe','pipe'],timeout:15000});
          NODE
      - name: Test the fixed caller and inactive probe without network
        run: node --test scripts/test-owner-notice-probe-ci.mjs
      - name: Restore exact-content source locator
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-owner-notice
          restore-keys: |
            weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-
      - name: Require actual qualified source before private access
        id: source-proof
        timeout-minutes: 2
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reject missing actual source qualification
        run: test "${{ steps.source-proof.outputs.required }}" = false
      - name: Open one fixed temporary owner window and remove only that probe
        run: node scripts/owner-notice-probe-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_NOTICE_CONFIRMATION: ${{ inputs.confirmation }}
