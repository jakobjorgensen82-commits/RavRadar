name: Update weather and deploy RavRadar

on:
  schedule:
    # GitHub-ejet 15-minutterskadence. Minutterne ligger forskudt fra
    # timeskiftet, så den private Copernicus-pilot normalt er færdig først.
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Kør hele vejrpipelinen, også når data stadig er friske"
        required: false
        default: false
        type: boolean
      geometry_v2_pilot:
        description: "Kør den private, score-neutrale GeoDanmark-pilot (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      geometry_v2_national:
        description: "Kør privat national GeoDanmark-kildeplan og -hentning (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      ravscore_candidate_g_rollback_mode:
        description: "Candidate G-rollback: sikker dry-run eller eksplicit samlet execute"
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - execute
      ravscore_candidate_g_rollback_confirmation:
        description: "Kun execute: skriv EXECUTE-CANDIDATE-G-ROLLBACK"
        required: false
        default: ""
        type: string
      ravscore_integrated_return:
        description: "Eksplicit samlet retur fra aktiv Candidate G til integreret RavScore"
        required: false
        default: false
        type: boolean
      ravscore_integrated_return_confirmation:
        description: "Kun retur: skriv EXECUTE-INTEGRATED-RAVSCORE-RETURN"
        required: false
        default: ""
        type: string
      ravscore_active_shadow:
        description: "Kør privat A-G-/rollbackaudit på de aktive 210/673-punkter (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      candidate_g_gap_reconstruction_mode:
        description: "Engangsrekonstruktion RRGAP-2026-08-29: none, inspect, apply, rollback eller cleanup"
        required: true
        default: none
        type: choice
        options:
          - none
          - inspect
          - apply
          - rollback
          - cleanup
      candidate_g_gap_inspection_run_id:
        description: "Eksakt run-id fra den forseglede inspect-kørsel (kun apply/rollback/cleanup)"
        required: false
        default: ""
        type: string
      candidate_g_gap_inspection_artifact_id:
        description: "Eksakt artifact-id fra den forseglede inspect-kørsel (kun apply/rollback/cleanup)"
        required: false
        default: ""
        type: string
      candidate_g_gap_descriptor_sha256:
        description: "Eksakt SHA-256 fra den forseglede inspect-kørsel (kun apply/rollback/cleanup)"
        required: false
        default: ""
        type: string
      candidate_g_gap_apply_run_id:
        description: "Eksakt succesfuldt apply-run med privat rollbackcheckpoint (kun rollback)"
        required: false
        default: ""
        type: string
      candidate_g_gap_rollback_artifact_id:
        description: "Eksakt privat rollback-artifact fra apply-run (kun rollback)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/rdks/**'
      - 'docs/research/**'
      - 'CHANGELOG.md'
      - 'CHANGELOG-*.md'
      - 'HANDBOOK-RAVRADAR.md'
      - 'AGENTS.md'
      - 'release/RELEASE-REPORT.json'
      - 'release/RELEASE-REPORT.md'

permissions:
  contents: read

# GitHub starter den normale vejropdatering hvert 15. minut. En særskilt
# current-hour-gate låser den eksakte UTC-time. Den endelige Copernicus-målliste
# dannes først efter frisk DMI, så normal produktion aldrig kræver landsdækkende
# Copernicus-data som forhåndsbetingelse. Der må højst være én tung kørsel.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode != 'none' && 'ravradar-weather-production' || github.event_name == 'workflow_dispatch' && inputs.ravscore_active_shadow == true && 'ravradar-active-ravscore-shadow' || github.event_name == 'workflow_dispatch' && inputs.geometry_v2_national == true && 'ravradar-geometry-v2-national' || github.event_name == 'workflow_dispatch' && inputs.geometry_v2_pilot == true && 'ravradar-geometry-v2-pilot' || 'ravradar-weather-production' }}
  # Recovery and normal weather share one production group. An incoming push,
  # schedule or force run must never cancel a descriptor-bound apply between
  # its local mutation, rollback artifact, full gates and Pages deployment.
  # Queued normal runs re-check freshness and become cheap no-ops as needed.
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate mutually exclusive manual operation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject ambiguous or insufficiently authorized dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          ROLLBACK_MODE: ${{ inputs.ravscore_candidate_g_rollback_mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
          RETURN_REQUESTED: ${{ inputs.ravscore_integrated_return }}
          RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}
        run: |
          geometry=false
          if [ "$GEOMETRY_PILOT" = "true" ] || [ "$GEOMETRY_NATIONAL" = "true" ]; then geometry=true; fi
          if [ "$GEOMETRY_PILOT" = "true" ] && [ "$GEOMETRY_NATIONAL" = "true" ]; then
            echo "Only one geometry workflow may be dispatched at a time."
            exit 1
          fi
          if [ "$ROLLBACK_MODE" != "none" ] && { [ "$geometry" = "true" ] || [ "$RETURN_REQUESTED" = "true" ]; }; then
            echo "Candidate G rollback cannot be combined with geometry or integrated return."
            exit 1
          fi
          if [ "$RETURN_REQUESTED" = "true" ] && [ "$geometry" = "true" ]; then
            echo "Integrated return cannot be combined with geometry."
            exit 1
          fi
          if [ "$ROLLBACK_MODE" = "execute" ] && [ "$ROLLBACK_CONFIRMATION" != "EXECUTE-CANDIDATE-G-ROLLBACK" ]; then
            echo "Candidate G execute confirmation is not exact."
            exit 1
          fi
          if [ "$RETURN_REQUESTED" = "true" ] && [ "$RETURN_CONFIRMATION" != "EXECUTE-INTEGRATED-RAVSCORE-RETURN" ]; then
            echo "Integrated return confirmation is not exact."
            exit 1
          fi

  reconcile-operational-pending:
    name: Reconcile any durable RavScore transition before production
    needs: validate-dispatch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-reconcile
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind reconciliation runner to newest exact main
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Read durable operation and reconcile from public identity
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          if [ "$(jq -r '.pending' "$RAVRADAR_OPERATIONAL_WORK/current.json")" != "true" ]; then
            echo "No durable RavScore transition requires reconciliation."
            exit 0
          fi
          pending_head="$(jq -r '.sourceHead' "$RAVRADAR_OPERATIONAL_WORK/current.json")"
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_WORK/current.json")"
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-reconcile=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json"
          node scripts/ravscore-operational-activation.mjs classify-pending \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/classification.json"
          classification="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/classification.json")"
          model="$(jq -r '.model' "$RAVRADAR_OPERATIONAL_WORK/classification.json")"
          if [ "$classification" = "complete" ]; then
            node scripts/verify-ravscore-operational-pages-deployment.mjs \
              --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
              --source-head "$pending_head" \
              --model "$model" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --output "$RAVRADAR_OPERATIONAL_WORK/verification.json"
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ "$classification" = "complete" ]; then
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --verification "$RAVRADAR_OPERATIONAL_WORK/verification.json" \
              --deployment-id "pages-reconciled-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --output "$RAVRADAR_OPERATIONAL_WORK/reconciled.json"
          else
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --failure-code "PENDING_SOURCE_RECONCILED" \
              --output "$RAVRADAR_OPERATIONAL_WORK/reconciled.json"
          fi
          case "$(jq -r '.status' "$RAVRADAR_OPERATIONAL_WORK/reconciled.json")" in
            LEGACY_CANDIDATE_G_NORMALIZATION_PENDING|CANDIDATE_G_PENDING|INTEGRATED_PENDING) exit 1 ;;
          esac

  current-hour-readiness:
    name: Check timed current-hour readiness
    needs: reconcile-operational-pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      target_hour: ${{ steps.cache-state.outputs.target_hour }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Validate one-time Candidate G reconstruction dispatch contract
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RECONSTRUCTION_MODE: ${{ inputs.candidate_g_gap_reconstruction_mode }}
          FORCE: ${{ inputs.force }}
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          RAVSCORE_SHADOW: ${{ inputs.ravscore_active_shadow }}
          INSPECTION_RUN_ID: ${{ inputs.candidate_g_gap_inspection_run_id }}
          INSPECTION_ARTIFACT_ID: ${{ inputs.candidate_g_gap_inspection_artifact_id }}
          DESCRIPTOR_SHA256: ${{ inputs.candidate_g_gap_descriptor_sha256 }}
          APPLY_RUN_ID: ${{ inputs.candidate_g_gap_apply_run_id }}
          ROLLBACK_ARTIFACT_ID: ${{ inputs.candidate_g_gap_rollback_artifact_id }}
        run: |
          set -euo pipefail
          case "$RECONSTRUCTION_MODE" in
            none|inspect|apply|rollback|cleanup) ;;
            *) echo "Unsupported reconstruction mode." >&2; exit 1 ;;
          esac
          if [ "$RECONSTRUCTION_MODE" != "none" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || { echo "Reconstruction is allowed only on main." >&2; exit 1; }
            if [ "$FORCE" != "false" ] || [ "$GEOMETRY_PILOT" != "false" ] || [ "$GEOMETRY_NATIONAL" != "false" ] || [ "$RAVSCORE_SHADOW" != "false" ]; then
              echo "Reconstruction cannot be combined with force, geometry or shadow modes." >&2
              exit 1
            fi
          fi
          if [ "$RECONSTRUCTION_MODE" = "apply" ] || [ "$RECONSTRUCTION_MODE" = "rollback" ] || [ "$RECONSTRUCTION_MODE" = "cleanup" ]; then
            [[ "$INSPECTION_RUN_ID" =~ ^[1-9][0-9]{8,}$ ]] || { echo "A numeric inspection run-id is required." >&2; exit 1; }
            [[ "$INSPECTION_ARTIFACT_ID" =~ ^[1-9][0-9]{8,}$ ]] || { echo "A numeric inspection artifact-id is required." >&2; exit 1; }
            [[ "$DESCRIPTOR_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "A lowercase SHA-256 descriptor seal is required." >&2; exit 1; }
          elif [ -n "$INSPECTION_RUN_ID" ] || [ -n "$INSPECTION_ARTIFACT_ID" ] || [ -n "$DESCRIPTOR_SHA256" ]; then
            echo "Inspection bindings are accepted only by apply, rollback or cleanup." >&2
            exit 1
          fi
          if [ "$RECONSTRUCTION_MODE" = "rollback" ]; then
            [[ "$APPLY_RUN_ID" =~ ^[1-9][0-9]{8,}$ ]] || { echo "A numeric successful apply run-id is required." >&2; exit 1; }
            [[ "$ROLLBACK_ARTIFACT_ID" =~ ^[1-9][0-9]{8,}$ ]] || { echo "A numeric private rollback artifact-id is required." >&2; exit 1; }
          elif [ -n "$APPLY_RUN_ID" ] || [ -n "$ROLLBACK_ARTIFACT_ID" ]; then
            echo "Apply-run rollback bindings are accepted only by rollback." >&2
            exit 1
          fi

      - name: Restore private Copernicus current cache for timed gate
        if: github.event_name != 'workflow_dispatch' || (inputs.candidate_g_gap_reconstruction_mode != 'inspect' && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true && inputs.ravscore_active_shadow != true)
        uses: actions/cache/restore@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-production-gate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Inspect timed UTC hour without exposing raw vectors
        if: github.event_name != 'workflow_dispatch' || (inputs.candidate_g_gap_reconstruction_mode != 'inspect' && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true && inputs.ravscore_active_shadow != true)
        id: cache-state
        run: python3 scripts/check-copernicus-current-hour.py --github-output "$GITHUB_OUTPUT"

      - name: Decide whether production may start
        id: readiness
        shell: bash
        env:
          CHECK_CURRENT_HOUR: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'none' && inputs.force != true && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true && inputs.ravscore_active_shadow != true) }}
          CURRENT_HOUR_PRESENT: ${{ steps.cache-state.outputs.current_hour_present }}
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Production trigger may continue."
          if [ "$CHECK_CURRENT_HOUR" = "true" ] && [ "$CURRENT_HOUR_PRESENT" != "true" ]; then
            echo "::notice title=Targeted supplement pending::The exact Copernicus supplement will be resolved after fresh DMI gap selection; nationwide Copernicus coverage is not required."
          fi

  trip-storage-readiness:
    name: Check exact-head D1 trip-storage readiness
    needs: current-hour-readiness
    if: needs.current-hour-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Determine exact-head D1 trip-storage readiness without failing the run
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          RECONSTRUCTION_MODE: ${{ inputs.candidate_g_gap_reconstruction_mode }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_TRIP_STORAGE_MODE: d1
          CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
          TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}
        run: |
          set -uo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if ! release_version="$(jq -er '.version | select(type == "string" and test("^4\\.0\\.[0-9]+$"))' version.json 2>/dev/null)"; then
            echo "::notice title=Pages production deferred::version.json could not be validated; this run remains a green no-op."
            exit 0
          fi
          requires_exact_d1=false
          if [ "$release_version" = "4.0.311" ] || [ "$release_version" = "4.0.312" ] || [ "$release_version" = "4.0.313" ] || [ "$release_version" = "4.0.314" ] || [ "$RECONSTRUCTION_MODE" = "apply" ] || [ "$RECONSTRUCTION_MODE" = "rollback" ] || [ "$RECONSTRUCTION_MODE" = "cleanup" ]; then
            requires_exact_d1=true
          fi
          if [ "$requires_exact_d1" != "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "The one-time Candidate G exact-D1 release interlock is not required for version $release_version."
            exit 0
          fi
          if ! runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-trip-storage.yml/runs?branch=main&status=completed&event=workflow_dispatch&per_page=100")"; then
            echo "::notice title=Pages production deferred::Could not verify the exact-head D1 trip-storage deployment; this run remains a green no-op."
            exit 0
          fi
          if ! matching_count="$(jq --arg sha "$EXPECTED_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event == "workflow_dispatch" and .display_title == "Deploy RavRadar trip storage [d1]")] | length' <<< "$runs_json")"; then
            echo "::notice title=Pages production deferred::The D1 readiness response could not be validated; this run remains a green no-op."
            exit 0
          fi
          if [ "$matching_count" -lt 1 ]; then
            echo "::notice title=Pages production deferred::Deploy and verify trip storage in D1 mode on this exact main head, then dispatch normal production."
            exit 0
          fi
          if ! node scripts/verify-trip-storage-edge.mjs; then
            echo "::notice title=Pages production deferred::The live Edge contract is not the required Candidate G D1 mode; this run remains a green no-op."
            exit 0
          fi
          if ! node scripts/verify-cloudflare-trip-gateway.mjs; then
            echo "::notice title=Pages production deferred::The live Worker/registry contract could not be attested; this run remains a green no-op."
            exit 0
          fi
          if [ "$release_version" = "4.0.314" ] && { [ -z "$RECONSTRUCTION_MODE" ] || [ "$RECONSTRUCTION_MODE" = "none" ]; }; then
            if ! recovery_runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/update-and-deploy.yml/runs?branch=main&status=completed&event=workflow_dispatch&per_page=100")"; then
              echo "::notice title=Pages production deferred::Could not verify the exact-head reconstruction release; this run remains a green no-op."
              exit 0
            fi
            if ! recovery_run_ids_json="$(jq -ce --arg sha "$EXPECTED_HEAD_SHA" '
              if ((.workflow_runs | type) != "array")
                or ((all(.workflow_runs[];
                  (type == "object")
                  and ((.id | type) == "number")
                  and ((.head_sha | type) == "string")
                  and ((.head_branch | type) == "string")
                  and ((.conclusion | type) == "string")
                  and ((.event | type) == "string")
                )) | not)
              then error("invalid workflow-runs response")
              else [.workflow_runs[]
                | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event == "workflow_dispatch")
                | .id]
              end
            ' <<< "$recovery_runs_json")"; then
              echo "::notice title=Pages production deferred::The reconstruction release response could not be validated; this run remains a green no-op."
              exit 0
            fi
            apply_release_proven=false
            recovery_metadata_valid=true
            while IFS= read -r recovery_run_id; do
              if ! [[ "$recovery_run_id" =~ ^[1-9][0-9]{8,}$ ]]; then
                recovery_metadata_valid=false
                break
              fi
              if ! recovery_jobs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${recovery_run_id}/jobs?per_page=100")"; then
                recovery_metadata_valid=false
                break
              fi
              if ! recovery_jobs_array="$(jq -ce '
                if ((.jobs | type) != "array")
                  or ((all(.jobs[];
                    (type == "object")
                    and ((.name | type) == "string")
                    and ((.conclusion | type) == "string")
                    and (((.steps == null) or ((.steps | type) == "array")))
                    and (all(.steps[]?;
                      (type == "object")
                      and ((.name | type) == "string")
                      and ((.conclusion | type) == "string")
                    ))
                  )) | not)
                then error("invalid jobs response")
                else .jobs
                end
              ' <<< "$recovery_jobs_json")"; then
                recovery_metadata_valid=false
                break
              fi
              if jq -e '
                ([.[].steps[]? | select(.name == "Apply the descriptor-bound one-time Candidate G reconstruction" and .conclusion == "success")] | length) == 1
                and ([.[] | select(.name == "Deploy prepared Pages artifact" and .conclusion == "success")] | length) == 1
              ' <<< "$recovery_jobs_array" >/dev/null; then
                apply_release_proven=true
                break
              fi
            done < <(jq -r '.[] | tostring' <<< "$recovery_run_ids_json")
            if [ "$recovery_metadata_valid" != "true" ]; then
              echo "::notice title=Pages production deferred::The reconstruction release jobs could not be validated; this run remains a green no-op."
              exit 0
            fi
            if [ "$apply_release_proven" != "true" ]; then
              echo "::notice title=Pages production deferred::Apply and deploy the sealed one-time reconstruction on this exact main head before normal 4.0.314 production."
              exit 0
            fi
            echo "The exact 4.0.314 reconstruction apply and Pages release have been attested."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "The exact source head and the live Edge/Worker backend have the required D1 contract."

  inspect-candidate-g-one-time-gap:
    name: Inspect and seal the one-time Candidate G gap reconstruction
    needs: [current-hour-readiness, trip-storage-readiness]
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'inspect' && needs.current-hour-readiness.outputs.ready == 'true' && needs.trip-storage-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      descriptor_sha256: ${{ steps.inspect.outputs.descriptor_sha256 }}
      descriptor_artifact_id: ${{ steps.upload-descriptor.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Set up Python for deployed-state hydration
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js for sealed reconstruction inspection
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Hydrate the exact current public Candidate G target
        run: python scripts/hydrate-deployed-weather.py
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.314 one-time-gap-inspect (${{ github.server_url }}/${{ github.repository }})"

      - name: Download exact bound pre-gap support artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9707010150
          run-id: 33225493339
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/source-before

      - name: Download exact post-gap support artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9709446092
          run-id: 33233545688
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/source-after

      - name: Extract only the bound source bundles
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip
          test -s .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip
          mkdir -p \
            .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live \
            .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata \
            .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live \
            .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata
          unzip -p .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip \
            project/data/live/conditions.json \
            > .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          unzip -p .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip \
            run-metadata/github-run.txt \
            > .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          unzip -p .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip \
            project/data/live/conditions.json \
            > .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          unzip -p .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip \
            run-metadata/github-run.txt \
            > .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          test -s .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          test -s .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          test -s .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          test -s .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          test "$(find .cache/candidate-g-gap-reconstruction/extracted-before -type f | wc -l)" -eq 2
          test "$(find .cache/candidate-g-gap-reconstruction/extracted-after -type f | wc -l)" -eq 2

      - name: Inspect, verify and seal the one-time reconstruction plan
        id: inspect
        run: >-
          node scripts/one-time-candidate-g-gap-reconstruction.mjs
          --inspect
          --before .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          --after .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          --target data/live/conditions.json
          --cadence-policy data/current-regional-proxy-policy.json
          --descriptor .cache/candidate-g-gap-reconstruction/sealed-descriptor.json
          --before-attestation .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          --after-attestation .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          --before-bundle .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip
          --after-bundle .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse any non-descriptor inspection output
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/sealed-descriptor.json
          test "$(find .cache/candidate-g-gap-reconstruction -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload only the sanitized sealed inspection descriptor
        id: upload-descriptor
        uses: actions/upload-artifact@v7
        with:
          name: candidate-g-gap-reconstruction-inspection-${{ github.run_id }}
          path: .cache/candidate-g-gap-reconstruction/sealed-descriptor.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  build-and-prepare:
    needs: [current-hour-readiness, trip-storage-readiness]
    if: (github.event_name != 'workflow_dispatch' || (inputs.candidate_g_gap_reconstruction_mode != 'inspect' && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true && inputs.ravscore_active_shadow != true)) && needs.current-hour-readiness.outputs.ready == 'true' && needs.trip-storage-readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      # Every production build remains bound to the UTC hour resolved at
      # readiness, even if the job crosses an hour boundary. The authoritative
      # Copernicus target list is derived from fresh DMI for this exact hour.
      RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ needs.current-hour-readiness.outputs.target_hour }}
      RAVRADAR_PRIVATE_RUNTIME_ROOT: /tmp/ravradar-private-production-runtime
      RAVRADAR_PRIVATE_RUNTIME_BUNDLE: /tmp/ravradar-private-production-runtime/bundle
      RAVRADAR_PRIVATE_RUNTIME_RESTORE: /tmp/ravradar-private-production-runtime/restored
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-model
      RAVRADAR_LEGACY_SOURCE_ROOT: /tmp/ravradar-legacy-candidate-source
      RAVRADAR_CANDIDATE_STAGE: /tmp/ravradar-candidate-g-pages
      RAVRADAR_OPERATIONAL_HANDOFF: /tmp/ravradar-operational-handoff
    outputs:
      should_deploy: ${{ steps.deployment-decision.outputs.should_deploy }}
      operational_action: ${{ steps.operational-action.outputs.action }}
      operational_model: ${{ steps.operational-model.outputs.model }}
      central_version: ${{ steps.operational-model.outputs.central_version }}
      normalization_required: ${{ steps.operational-model.outputs.normalization_required }}
      initial_cutover_required: ${{ steps.operational-model.outputs.initial_cutover_required }}
      deployment_model: ${{ steps.deployment-decision.outputs.deployment_model }}

    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Read exact centrally active operational RavScore
        id: operational-model
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          echo "model=$(jq -r '.model' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "central_version=$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "normalization_required=$(jq -r '.normalizationRequired' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
          echo "initial_cutover_required=$(jq -r '.initialCutoverRequired' "$RAVRADAR_OPERATIONAL_WORK/current.json")" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Resolve one fail-closed operational model action
        id: operational-action
        shell: bash
        env:
          ACTIVE_MODEL: ${{ steps.operational-model.outputs.model }}
          NORMALIZATION_REQUIRED: ${{ steps.operational-model.outputs.normalization_required }}
          INITIAL_CUTOVER_REQUIRED: ${{ steps.operational-model.outputs.initial_cutover_required }}
          ROLLBACK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_candidate_g_rollback_mode || 'none' }}
          ROLLBACK_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_candidate_g_rollback_confirmation || '' }}
          RETURN_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_return || false }}
          RETURN_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.ravscore_integrated_return_confirmation || '' }}
        run: |
          if [ "$ROLLBACK_MODE" != "none" ] && [ "$RETURN_REQUESTED" = "true" ]; then
            echo "Candidate G-rollback and integrated return are mutually exclusive."
            exit 1
          fi
          case "$ACTIVE_MODEL" in
            integrated)
              if [ "$RETURN_REQUESTED" = "true" ]; then
                echo "Integrated return requires Candidate G to be active already."
                exit 1
              fi
              case "$ROLLBACK_MODE" in
                none) action="integrated" ;;
                dry-run) action="candidate-dry-run" ;;
                execute)
                  test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
                  test "$ROLLBACK_CONFIRMATION" = "EXECUTE-CANDIDATE-G-ROLLBACK"
                  action="candidate-execute"
                  ;;
                *) echo "Unknown Candidate G rollback mode."; exit 1 ;;
              esac
              ;;
            candidate-g)
              if [ "$INITIAL_CUTOVER_REQUIRED" = "true" ]; then
                test "$GITHUB_EVENT_NAME" = "push"
                test "$ROLLBACK_MODE" = "none"
                test "$RETURN_REQUESTED" != "true"
                action="integrated-cutover"
                echo "action=$action" >> "$GITHUB_OUTPUT"
                echo "Operational action: $action."
                exit 0
              fi
              if [ "$ROLLBACK_MODE" != "none" ]; then
                echo "Candidate G is already active; a new rollback may not be initiated."
                exit 1
              fi
              if [ "$RETURN_REQUESTED" = "true" ]; then
                test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
                test "$RETURN_CONFIRMATION" = "EXECUTE-INTEGRATED-RAVSCORE-RETURN"
                action="integrated-return"
              else
                action="candidate-maintenance"
              fi
              ;;
            legacy-candidate-g)
              test "$NORMALIZATION_REQUIRED" = "true"
              test "$GITHUB_EVENT_NAME" = "push"
              test "$ROLLBACK_MODE" = "none"
              test "$RETURN_REQUESTED" != "true"
              action="candidate-normalization"
              ;;
            *) echo "Unknown operational RavScore model; refusing production."; exit 1 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Operational action: $action."

      - name: Set up Python preflight
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production geometry tools
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Build constrained natural zone coastlines
        run: python scripts/refine-coastlines-constrained-4.0.48.py

      - name: Sync centrally saved admin configuration
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and deletions
        run: python scripts/apply-central-zone-reviews.py

      - name: Build current private-runtime restore expectation
        run: >-
          node scripts/private-production-runtime-workflow.mjs expected
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output .cache/private-production-runtime-expected.json

      - name: Restore newest compatible private runtime from protected storage
        run: >-
          node scripts/protected-private-production-runtime.mjs
          --restore
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --repository-root "$GITHUB_WORKSPACE"
          --expected .cache/private-production-runtime-expected.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Inspect private production runtime availability
        id: private-runtime-state
        shell: bash
        run: |
          if test -f "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "A private production runtime bundle is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No private production runtime bundle was restored."
          fi

      - name: Verify and restore the private production runtime bundle
        if: steps.private-runtime-state.outputs.available == 'true'
        run: >-
          node scripts/private-production-runtime-bundle.mjs restore
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --expected .cache/private-production-runtime-expected.json
          --output "$RAVRADAR_PRIVATE_RUNTIME_RESTORE"

      - name: Install only the allowlisted restored private runtime files
        if: steps.private-runtime-state.outputs.available == 'true'
        run: >-
          node scripts/private-production-runtime-workflow.mjs install
          --restored "$RAVRADAR_PRIVATE_RUNTIME_RESTORE"
          --repository-root "$GITHUB_WORKSPACE"

      - name: Restore the latest compact schema-4 RavScore checkpoint
        if: steps.private-runtime-state.outputs.available != 'true'
        id: ravscore-checkpoint-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ravscore-continuation-checkpoint
          key: ravscore-continuation-schema4-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ravscore-continuation-schema4-v2-

      - name: Restore protected compact RavScore checkpoint when cache is absent
        if: steps.private-runtime-state.outputs.available != 'true' && steps.ravscore-checkpoint-cache.outputs.cache-matched-key == ''
        run: >-
          node scripts/protected-ravscore-continuation-checkpoint.mjs
          --restore
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Resolve the one-time Candidate G bootstrap gate
        id: legacy-bootstrap
        shell: bash
        env:
          PRIVATE_RUNTIME_AVAILABLE: ${{ steps.private-runtime-state.outputs.available }}
        run: |
          if test "$PRIVATE_RUNTIME_AVAILABLE" = "true" || test -f .cache/ravscore-continuation-checkpoint/checkpoint.json; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Private integrated continuation is available."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "No integrated continuation exists; the exact one-time Candidate G bootstrap is required."
          fi

      - name: Import exact public Candidate G runtime only for first integrated bootstrap
        if: steps.legacy-bootstrap.outputs.required == 'true'
        run: python scripts/hydrate-deployed-weather.py --legacy-candidate-g-bootstrap
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.314 (${{ github.server_url }}/${{ github.repository }})"

      - name: Set up Node.js for one-time reconstruction mutation
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify exact sealed inspection artifact identity
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECONSTRUCTION_MODE: ${{ inputs.candidate_g_gap_reconstruction_mode }}
          INSPECTION_RUN_ID: ${{ inputs.candidate_g_gap_inspection_run_id }}
          INSPECTION_ARTIFACT_ID: ${{ inputs.candidate_g_gap_inspection_artifact_id }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INSPECTION_ARTIFACT_ID}")"
          test "$(jq -r '.id | tostring' <<< "$artifact_json")" = "$INSPECTION_ARTIFACT_ID"
          test "$(jq -r '.name' <<< "$artifact_json")" = "candidate-g-gap-reconstruction-inspection-${INSPECTION_RUN_ID}"
          test "$(jq -r '.expired | tostring' <<< "$artifact_json")" = "false"
          test "$(jq -r '.workflow_run.id | tostring' <<< "$artifact_json")" = "$INSPECTION_RUN_ID"
          test "$(jq -r '.workflow_run.head_branch' <<< "$artifact_json")" = "main"
          inspection_head_sha="$(jq -r '.workflow_run.head_sha' <<< "$artifact_json")"
          [[ "$inspection_head_sha" =~ ^[a-f0-9]{40}$ ]]
          if [ "$RECONSTRUCTION_MODE" = "apply" ] || [ "$RECONSTRUCTION_MODE" = "rollback" ]; then
            test "$inspection_head_sha" = "$EXPECTED_HEAD_SHA"
          fi

      - name: Download the exact sealed reconstruction descriptor
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.candidate_g_gap_inspection_artifact_id }}
          run-id: ${{ inputs.candidate_g_gap_inspection_run_id }}
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/inspection

      - name: Verify the downloaded inspection artifact is descriptor-only
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/inspection/sealed-descriptor.json
          test "$(find .cache/candidate-g-gap-reconstruction/inspection -type f | wc -l)" -eq 1

      - name: Verify exact successful apply rollback artifact identity
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'rollback'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_RUN_ID: ${{ inputs.candidate_g_gap_apply_run_id }}
          ROLLBACK_ARTIFACT_ID: ${{ inputs.candidate_g_gap_rollback_artifact_id }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROLLBACK_ARTIFACT_ID}")"
          test "$(jq -r '.id | tostring' <<< "$artifact_json")" = "$ROLLBACK_ARTIFACT_ID"
          test "$(jq -r '.name' <<< "$artifact_json")" = "candidate-g-gap-reconstruction-rollback-${APPLY_RUN_ID}"
          test "$(jq -r '.expired | tostring' <<< "$artifact_json")" = "false"
          test "$(jq -r '.workflow_run.id | tostring' <<< "$artifact_json")" = "$APPLY_RUN_ID"
          test "$(jq -r '.workflow_run.head_branch' <<< "$artifact_json")" = "main"
          test "$(jq -r '.workflow_run.head_sha' <<< "$artifact_json")" = "$EXPECTED_HEAD_SHA"
          run_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}")"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "main"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.event' <<< "$run_json")" = "workflow_dispatch"
          test "$(jq -r '.status' <<< "$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"

      - name: Download the exact private apply rollback checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'rollback'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.candidate_g_gap_rollback_artifact_id }}
          run-id: ${{ inputs.candidate_g_gap_apply_run_id }}
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/rollback-operation

      - name: Verify the downloaded rollback artifact is checkpoint-only
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/rollback-operation/compact-rollback.json
          test "$(find .cache/candidate-g-gap-reconstruction/rollback-operation -type f | wc -l)" -eq 1

      - name: Reconfirm current origin/main immediately before reconstruction mutation
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode != 'none'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Download exact bound pre-gap support artifact for apply
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9707010150
          run-id: 33225493339
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/source-before

      - name: Download exact post-gap support artifact for apply
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9709446092
          run-id: 33233545688
          github-token: ${{ github.token }}
          path: .cache/candidate-g-gap-reconstruction/source-after

      - name: Extract only the bound source bundles for apply
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip
          test -s .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip
          mkdir -p \
            .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live \
            .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata \
            .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live \
            .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata
          unzip -p .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip \
            project/data/live/conditions.json \
            > .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          unzip -p .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip \
            run-metadata/github-run.txt \
            > .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          unzip -p .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip \
            project/data/live/conditions.json \
            > .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          unzip -p .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip \
            run-metadata/github-run.txt \
            > .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          test -s .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          test -s .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          test -s .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          test -s .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          test "$(find .cache/candidate-g-gap-reconstruction/extracted-before -type f | wc -l)" -eq 2
          test "$(find .cache/candidate-g-gap-reconstruction/extracted-after -type f | wc -l)" -eq 2

      - name: Capture the exact pre-apply target for isolated rollback proof
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/candidate-g-gap-reconstruction/transaction-proof
          cp data/live/conditions.json .cache/candidate-g-gap-reconstruction/transaction-proof/pre-apply-conditions.json

      - name: Apply the descriptor-bound one-time Candidate G reconstruction
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        run: >-
          node scripts/one-time-candidate-g-gap-reconstruction.mjs
          --apply
          --before .cache/candidate-g-gap-reconstruction/extracted-before/project/data/live/conditions.json
          --after .cache/candidate-g-gap-reconstruction/extracted-after/project/data/live/conditions.json
          --target data/live/conditions.json
          --cadence-policy data/current-regional-proxy-policy.json
          --descriptor .cache/candidate-g-gap-reconstruction/inspection/sealed-descriptor.json
          --descriptor-sha256 "${{ inputs.candidate_g_gap_descriptor_sha256 }}"
          --rollback-checkpoint .cache/candidate-g-gap-reconstruction/rollback/compact-rollback.json
          --before-attestation .cache/candidate-g-gap-reconstruction/extracted-before/run-metadata/github-run.txt
          --after-attestation .cache/candidate-g-gap-reconstruction/extracted-after/run-metadata/github-run.txt
          --before-bundle .cache/candidate-g-gap-reconstruction/source-before/RavRadar-support-3675.zip
          --after-bundle .cache/candidate-g-gap-reconstruction/source-after/RavRadar-support-3676.zip

      - name: Refuse a missing or non-isolated rollback checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          test -s .cache/candidate-g-gap-reconstruction/rollback/compact-rollback.json
          test "$(find .cache/candidate-g-gap-reconstruction/rollback -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Prove apply then direct rollback is exact on an isolated copy
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          applied_target_sha256="$(sha256sum data/live/conditions.json | cut -d ' ' -f1)"
          cp data/live/conditions.json .cache/candidate-g-gap-reconstruction/transaction-proof/isolated-applied-conditions.json
          node scripts/one-time-candidate-g-gap-reconstruction.mjs \
            --rollback \
            --target .cache/candidate-g-gap-reconstruction/transaction-proof/isolated-applied-conditions.json \
            --descriptor .cache/candidate-g-gap-reconstruction/inspection/sealed-descriptor.json \
            --descriptor-sha256 "${{ inputs.candidate_g_gap_descriptor_sha256 }}" \
            --rollback-checkpoint .cache/candidate-g-gap-reconstruction/rollback/compact-rollback.json
          cmp --silent \
            .cache/candidate-g-gap-reconstruction/transaction-proof/pre-apply-conditions.json \
            .cache/candidate-g-gap-reconstruction/transaction-proof/isolated-applied-conditions.json
          test "$(sha256sum data/live/conditions.json | cut -d ' ' -f1)" = "$applied_target_sha256"

      - name: Upload compact private rollback before continuing production
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'apply'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-g-gap-reconstruction-rollback-${{ github.run_id }}
          path: .cache/candidate-g-gap-reconstruction/rollback/compact-rollback.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Roll back exact post-apply state or causally clean the deployed descendant
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'rollback'
        run: >-
          node scripts/one-time-candidate-g-gap-reconstruction.mjs
          --rollback-dispatch
          --target data/live/conditions.json
          --descriptor .cache/candidate-g-gap-reconstruction/inspection/sealed-descriptor.json
          --descriptor-sha256 "${{ inputs.candidate_g_gap_descriptor_sha256 }}"
          --rollback-checkpoint .cache/candidate-g-gap-reconstruction/rollback-operation/compact-rollback.json

      - name: Causally remove only the descriptor-bound reconstructed evidence
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'cleanup'
        run: >-
          node scripts/one-time-candidate-g-gap-reconstruction.mjs
          --cleanup
          --target data/live/conditions.json
          --descriptor .cache/candidate-g-gap-reconstruction/inspection/sealed-descriptor.json
          --descriptor-sha256 "${{ inputs.candidate_g_gap_descriptor_sha256 }}"

      - name: Import exact legacy Candidate G into an isolated normalization root
        if: steps.operational-action.outputs.action == 'candidate-normalization'
        shell: bash
        run: |
          rm -rf "$RAVRADAR_LEGACY_SOURCE_ROOT"
          mkdir -p "$RAVRADAR_LEGACY_SOURCE_ROOT/data"
          cp data/zones.geojson "$RAVRADAR_LEGACY_SOURCE_ROOT/data/zones.geojson"
          python scripts/hydrate-deployed-weather.py \
            --legacy-candidate-g-bootstrap \
            --root "$RAVRADAR_LEGACY_SOURCE_ROOT"
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.308 (${{ github.server_url }}/${{ github.repository }})"

      - name: Seal privacy-safe local attestation of the legacy Candidate G source
        if: steps.operational-action.outputs.action == 'candidate-normalization'
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK"
          cp "$RAVRADAR_LEGACY_SOURCE_ROOT/data/live/manifest.json" \
            "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json"
          node scripts/verify-legacy-candidate-g-source.mjs attest \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json" \
            --conditions "$RAVRADAR_LEGACY_SOURCE_ROOT/data/live/conditions.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json"
          test "$(jq -r '.privatePayloadLogged' "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json")" = "false"

      - name: Preserve deployed DMI zone cache as safe fallback
        shell: bash
        run: |
          mkdir -p .cache
          if test -f data/live/dmi-bulk-cache.json; then
            cp data/live/dmi-bulk-cache.json .cache/deployed-dmi-bulk-cache.json
          else
            echo "No previous private DMI bulk cache was available; the refresh must build it."
          fi

      - name: Test Supabase persistence roundtrip
        if: github.event_name == 'push' || inputs.force == true || (github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup'))
        run: node scripts/test-supabase-persistence.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Decide whether weather needs updating
        id: preflight
        run: python scripts/check-weather-update.py
        env:
          RAVRADAR_FORCE_UPDATE: ${{ github.event_name == 'push' || inputs.force == true || steps.operational-action.outputs.action != 'integrated' || (github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')) }}
          RAVRADAR_MAX_STALE_MINUTES: 30
          RAVRADAR_PREFLIGHT_TIMEOUT_SECONDS: 20
          WEATHER_USER_AGENT: "RavRadar/4.0.314 (${{ github.server_url }}/${{ github.repository }})"

      - name: Report skipped refresh
        if: steps.preflight.outputs.should_run != 'true'
        run: |
          echo "RavRadar weather is fresh and no newer DMI model run was found."
          echo "Reason: ${{ steps.preflight.outputs.reason }}"
          echo "Weather age: ${{ steps.preflight.outputs.age_minutes }} minutes"

      - name: Run fast source gate before expensive data refresh
        if: steps.preflight.outputs.should_run == 'true' && github.event_name != 'schedule'
        run: npm run validate:source

      - name: Restore private staged coastal-point cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/coastal-point-staging
          key: coastal-point-staging-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coastal-point-staging-v1-${{ runner.os }}-

      - name: Prepare only an explicitly requested READY point activation
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/prepare-coastal-point-activation.mjs

      - name: Rebuild centrally reviewed coastal-part sampling points
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Refresh DMI water-source registry
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/update-water-source-registry.mjs
        env:
          WEATHER_USER_AGENT: "RavRadar water-source registry (${{ github.server_url }}/${{ github.repository }})"

      - name: Install DMI GRIB reader (eccodes)
        if: steps.preflight.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Smoke-test DMI GRIB reader API
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/smoke-test-eccodes.py

      - name: Resolve bounded DMI cache generation
        if: steps.preflight.outputs.should_run == 'true'
        id: dmi-cache-generation
        run: echo "generation=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Refresh private Copernicus cache before DMI cache churn
        if: steps.preflight.outputs.should_run == 'true'
        id: copernicus-shadow-refresh
        uses: actions/cache/restore@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-pre-dmi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Report private Copernicus cache preservation
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.copernicus-shadow-refresh.outputs.cache-matched-key }}
        run: |
          if test -n "$MATCHED_CACHE_KEY"; then
            echo "Private Copernicus shadow cache was refreshed before DMI cache churn"
          else
            echo "::warning title=Private Copernicus cache absent::No private Copernicus shadow cache was available before DMI cache churn"
          fi

      - name: Restore bounded DMI GRIB download cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        id: dmi-grib-cache-restore
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-
            dmi-grib-v4-${{ runner.os }}-
            dmi-grib-v3-${{ runner.os }}-

      - name: Restore progressive private DMI zone cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-
            dmi-zone-cache-v1-${{ runner.os }}-

      - name: Restore private seven-day current-field research cache
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            current-field-shadow-v1-${{ runner.os }}-

      - name: Update DMI bulk model cache
        if: steps.preflight.outputs.should_run == 'true'
        id: dmi-bulk
        continue-on-error: true
        timeout-minutes: 18
        run: python -u scripts/update-dmi-bulk.py
        env:
          DMI_BULK_HOURS: 118
          DMI_BULK_MAX_DOWNLOAD_MB: 2048
          DMI_BULK_RAW_CACHE_MAX_MB: 4096
          DMI_BULK_MAX_RUNTIME_SECONDS: 900
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 120
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 130
          DMI_BULK_TIME_STRIDE_HOURS: 3
          DMI_BULK_COLLECTIONS_PER_RUN: 2
          DMI_BULK_REQUEST_TIMEOUT_SECONDS: 90
          DMI_BULK_REFRESH_MINUTES: 60
          DMI_BULK_COMPLETE_HORIZON_HOURS: 96
          DMI_BULK_FORCE_REFRESH: ${{ steps.preflight.outputs.dmi_changed }}
          DMI_BULK_RAW_DIR: .cache/dmi-grib
          DMI_BULK_DEPLOYED_FALLBACK_PATH: .cache/deployed-dmi-bulk-cache.json
          COASTAL_POINT_STAGE_PATH: .cache/coastal-point-staging/dmi.json
          CURRENT_FIELD_SHADOW_PATH: .cache/current-field-shadow.json
          CURRENT_FIELD_SHADOW_PARTS_PER_RUN: 15
          CURRENT_FIELD_SHADOW_REPLAY_ASSETS_PER_COLLECTION: 5
          CURRENT_FIELD_SHADOW_BOOTSTRAP_DOWNLOADS_PER_RUN: 3
          WEATHER_USER_AGENT: "RavRadar/4.0.314 (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Advance private point-candidate readiness without public score impact
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        run: node scripts/update-coastal-point-staging.mjs

      - name: Save private staged coastal-point cache
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .cache/coastal-point-staging
          key: coastal-point-staging-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save progressed DMI GRIB download cache
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save progressive private DMI zone cache
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: dmi-zone-cache-v1-${{ runner.os }}-${{ steps.dmi-cache-generation.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save private seven-day current-field research cache
        if: steps.preflight.outputs.should_run == 'true' && steps.dmi-bulk.outcome != 'cancelled'
        uses: actions/cache/save@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report DMI bulk result
        if: steps.preflight.outputs.should_run == 'true' && always()
        run: |
          echo "DMI bulk status: ${{ steps.dmi-bulk.outputs.status || 'unknown' }}"
          echo "Fresh collections this run: ${{ steps.dmi-bulk.outputs.fresh_collections || '0' }}"
          echo "Partial collections this run: ${{ steps.dmi-bulk.outputs.partial_collections || '0' }}"
          echo "Zones in bulk cache: ${{ steps.dmi-bulk.outputs.zone_count || '0' }}"
          echo "DMI bulk error: ${{ steps.dmi-bulk.outputs.error || 'none' }}"
          if [ "${{ steps.dmi-bulk.outputs.status }}" = "failed" ]; then
            echo "::warning::DMI bulk refresh failed. RavRadar preserves the previous DMI cache and uses fallback providers where necessary."
          fi

      - name: Refresh private Copernicus cache after DMI cache churn
        if: steps.preflight.outputs.should_run == 'true'
        id: copernicus-shadow-post-dmi
        uses: actions/cache/restore@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-post-dmi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Select exact-hour DMI gaps for targeted Copernicus supplement
        if: steps.preflight.outputs.should_run == 'true'
        id: copernicus-targets
        run: >-
          python scripts/build-copernicus-target-registry.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --output .cache/copernicus-current-targets.json
          --nearest-dmi-hour
          --github-output "$GITHUB_OUTPUT"

      - name: Bind production to resolved DMI current hour
        if: steps.preflight.outputs.should_run == 'true'
        run: echo "RAVRADAR_PRODUCTION_TARGET_HOUR=${{ steps.copernicus-targets.outputs.target_hour }}" >> "$GITHUB_ENV"

      - name: Inspect targeted Copernicus coverage after fresh DMI
        if: steps.preflight.outputs.should_run == 'true'
        id: targeted-copernicus-cache
        run: >-
          python scripts/check-copernicus-current-hour.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --targets .cache/copernicus-current-targets.json
          --github-output "$GITHUB_OUTPUT"

      - name: Install targeted Copernicus dependencies
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.current_hour_present != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Verify targeted Copernicus credentials
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.current_hour_present != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::error::Targeted Copernicus credentials are unavailable."
            exit 1
          fi

      - name: Fill only exact-hour DMI gaps from Copernicus
        if: steps.preflight.outputs.should_run == 'true' && steps.targeted-copernicus-cache.outputs.current_hour_present != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: >-
          python scripts/run-copernicus-current-pilot-with-retry.py
          --attempts 2
          --timeout-seconds 360
          --backoff-seconds 20
          --
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --targets .cache/copernicus-current-targets.json
          --authoritative-targets data/live/coastal-parts-v2.json

      - name: Save targeted private Copernicus supplement
        if: steps.preflight.outputs.should_run == 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-production-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build public seven-day current history and controlled live selection
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/build-live-current-pilot.py

      - name: Update central weather cache
        if: steps.preflight.outputs.should_run == 'true'
        id: weather
        timeout-minutes: 17
        run: npm run update:weather
        env:
          DMI_MAX_RETRIES: 0
          DMI_REQUEST_GAP_MS: 12000
          DMI_REQUEST_CONCURRENCY: 1
          DMI_LIVE_ZONE_BUDGET: 4
          DMI_REQUEST_BUDGET: 6
          DMI_CACHE_REFRESH_BELOW_HOURS: 24
          DMI_SCHEDULE_INTERVAL_MINUTES: 15
          DMI_RETRY_JITTER_MIN_MS: 30000
          DMI_RETRY_JITTER_MAX_MS: 180000
          DMI_OBSERVATION_INTERVAL_MINUTES: 60
          WEATHER_REQUEST_TIMEOUT_MS: 25000
          DMI_OCEAN_REQUEST_TIMEOUT_MS: 60000
          WEATHER_USER_AGENT: "RavRadar/4.0.314 (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Refuse reconstruction deploy without a successful fresh weather rebuild
        if: steps.preflight.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && (inputs.candidate_g_gap_reconstruction_mode == 'apply' || inputs.candidate_g_gap_reconstruction_mode == 'rollback' || inputs.candidate_g_gap_reconstruction_mode == 'cleanup')
        shell: bash
        env:
          WEATHER_OUTCOME: ${{ steps.weather.outcome }}
        run: |
          if [ "$WEATHER_OUTCOME" != "success" ]; then
            echo "The one-time reconstruction requires a successful fresh weather rebuild; hydrated fallback deployment is forbidden."
            exit 1
          fi

      - name: Refuse a point activation without a successful exact-point weather rebuild
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          WEATHER_OUTCOME: ${{ steps.weather.outcome }}
        run: |
          if test -f .cache/coastal-point-staging/pending-promotion.json && test "$WEATHER_OUTCOME" != "success"; then
            echo "A READY point activation was prepared, but the exact-point weather rebuild failed."
            exit 1
          fi

      - name: Attach scientific current provenance and exact DMI grid points
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run build:current-provenance

      - name: Rebuild deterministic public weather runtime before validation and deploy
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/generate-public-conditions.mjs

      - name: Audit actual integrated RavScore public runtime before deploy
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          node scripts/audit-ravscore-integrated-public-runtime.mjs
          --input data/live/conditions.json
          --output .geometry-v2-work/ravscore-integrated-public-runtime-audit.json

      - name: Generate and strictly validate production reference zones
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: node scripts/generate-state-reference-report-4.0.113.mjs --strict

      - name: Validate full project after fresh weather and current provenance
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run validate

      - name: Run release governance gate after refreshed data validation
        if: steps.preflight.outputs.should_run == 'true'
        run: npm run release:gate

      - name: Require exact integrated backend and Edge readiness before integrated Pages
        if: steps.preflight.outputs.should_run == 'true' && (steps.operational-action.outputs.action == 'integrated' || steps.operational-action.outputs.action == 'integrated-return' || steps.operational-action.outputs.action == 'integrated-cutover' || steps.operational-action.outputs.action == 'candidate-normalization')
        run: node scripts/integrated-cutover-readiness.mjs check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate updated weather cache
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: npm run validate:data

      - name: Verify active trip-storage quality contract without creating data
        if: steps.preflight.outputs.should_run == 'true'
        run: node scripts/verify-trip-storage-edge.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_TRIP_STORAGE_MODE: d1
          RAVRADAR_REQUIRE_INTEGRATED_BINDING: true

      - name: Reconfirm current origin/main before protected writes and Pages artifact
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Atomically promote the validated point candidate in central admin storage
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: python scripts/promote-coastal-point-activation.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build compact schema-4 RavScore continuation checkpoint after final gates
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: >-
          node scripts/ravscore-continuation-checkpoint.mjs
          --save
          --source data/live/conditions.json
          --checkpoint .cache/ravscore-continuation-checkpoint/checkpoint.json

      - name: Save compact schema-4 RavScore continuation checkpoint after final gates
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        uses: actions/cache/save@v6
        with:
          path: .cache/ravscore-continuation-checkpoint
          key: ravscore-continuation-schema4-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reconfirm current main before protected RavScore write
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Publish compact RavScore checkpoint to protected admin storage
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: >-
          node scripts/protected-ravscore-continuation-checkpoint.mjs
          --publish
          --target-reference "$RAVRADAR_PRODUCTION_TARGET_HOUR"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build private production runtime bundle specification
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: >-
          node scripts/private-production-runtime-workflow.mjs create-spec
          --repository-root "$GITHUB_WORKSPACE"
          --output .cache/private-production-runtime-create-spec.json

      - name: Create the next private production runtime bundle atomically
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          rm -rf "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"
          if test -d "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"; then
            mv "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE" "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"
          fi
          node scripts/private-production-runtime-bundle.mjs create \
            --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT" \
            --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE" \
            --spec .cache/private-production-runtime-create-spec.json
          rm -rf "$RAVRADAR_PRIVATE_RUNTIME_ROOT/bundle-prior"

      - name: Reconfirm current main before protected private-runtime write
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Publish bounded private runtime with one protected rollback generation
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: >-
          node scripts/protected-private-production-runtime.mjs
          --publish
          --private-root "$RAVRADAR_PRIVATE_RUNTIME_ROOT"
          --bundle "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE"
          --repository-root "$GITHUB_WORKSPACE"
          --expected .cache/private-production-runtime-expected.json
          --source-head "$GITHUB_SHA"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prove the private runtime object is not anonymously readable
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: node scripts/protected-private-production-runtime.mjs --audit-anon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seal Candidate G rollback or maintenance plan from the fresh private runtime
        if: steps.preflight.outputs.should_run == 'true' && startsWith(steps.operational-action.outputs.action, 'candidate-')
        shell: bash
        env:
          RAVRADAR_CANDIDATE_G_ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
        run: |
          rm -rf "$RAVRADAR_CANDIDATE_STAGE"
          mkdir -p "$RAVRADAR_OPERATIONAL_WORK" "$RAVRADAR_CANDIDATE_STAGE"
          dataset_id="$(jq -r '.datasetId' data/live/conditions.json)"
          bundle_sha="$(jq -r '.bundleContentSha256' "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json")"
          rollback_mode="dry-run"
          if [ "${{ steps.operational-action.outputs.action }}" = "candidate-execute" ]; then
            rollback_mode="execute"
          fi
          node scripts/prepare-candidate-g-operational-rollback.mjs \
            --input data/live/conditions.json \
            --output "$RAVRADAR_OPERATIONAL_WORK/candidate-full.json" \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --mode "$rollback_mode" \
            --expected-dataset-id "$dataset_id" \
            --source-head "$GITHUB_SHA" \
            --private-bundle-sha256 "$bundle_sha" \
            --central-expected-version "${{ steps.operational-model.outputs.central_version }}"
          rsync -a ./ "$RAVRADAR_CANDIDATE_STAGE/" \
            --exclude '.git/' \
            --exclude '_site/' \
            --exclude '_support/' \
            --exclude '.cache/' \
            --exclude 'node_modules/' \
            --exclude '.geometry-v2-work/'
          node scripts/install-candidate-g-rollback-stage.mjs \
            --stage-root "$RAVRADAR_CANDIDATE_STAGE" \
            --repository-root "$GITHUB_WORKSPACE" \
            --candidate-full "$RAVRADAR_OPERATIONAL_WORK/candidate-full.json" \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --expected-source-head "$GITHUB_SHA" \
            --expected-dataset-id "$dataset_id"
          (cd "$RAVRADAR_CANDIDATE_STAGE" && node scripts/generate-public-conditions.mjs)
          (cd "$RAVRADAR_CANDIDATE_STAGE" && node scripts/audit-candidate-g-rollback-public-runtime.mjs \
            --plan "$RAVRADAR_OPERATIONAL_WORK/plan.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/public-audit.json" \
            --expected-source-head "$GITHUB_SHA" \
            --expected-dataset-id "$dataset_id")

      - name: Seal integrated return or initial cutover plan after backend and public gates
        if: steps.preflight.outputs.should_run == 'true' && (steps.operational-action.outputs.action == 'integrated-return' || steps.operational-action.outputs.action == 'integrated-cutover')
        run: >-
          node scripts/ravscore-operational-activation.mjs prepare-integrated-return
          --manifest data/live/manifest.json
          --audit .geometry-v2-work/ravscore-integrated-public-runtime-audit.json
          --output "$RAVRADAR_OPERATIONAL_WORK/plan.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          RAVRADAR_INTEGRATED_RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}

      - name: Atomically promote the validated point candidate in central admin storage
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success' && steps.operational-action.outputs.action != 'candidate-dry-run'
        run: python scripts/promote-coastal-point-activation.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate implementation and coverage audit
        if: steps.preflight.outputs.should_run == 'true'
        continue-on-error: true
        run: npm run audit:implementation-plan

      - name: Verify DMI station inventory for admin map
        if: steps.preflight.outputs.should_run == 'true' && steps.weather.outcome == 'success'
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path('data/live/dmi-water-stations.json')
          if not path.exists():
              raise SystemExit('DMI station inventory was not generated')
          doc = json.loads(path.read_text('utf-8'))
          stations = doc.get('stations') or []
          valid = [s for s in stations if s.get('stationId') and isinstance(s.get('point'), list) and len(s['point']) == 2]
          if not valid:
              raise SystemExit('DMI station inventory contains no valid stations')
          
          names = ' '.join(str(s.get('name','')).lower() for s in valid)
          if 'hals' not in names:
              raise SystemExit('Critical station family Hals is missing from persistent inventory')
          print(f'{len(valid)} persistent DMI water-level stations ready for admin map')
          PY

      - name: Build RavRadar support package
        if: always()
        run: |
          rm -rf _support
          mkdir -p _support/project _support/run-metadata
          rsync -a ./ _support/project/ \
            --exclude '.git/' \
            --exclude '_site/' \
            --exclude '_support/' \
            --exclude '.cache/' \
            --exclude 'node_modules/' \
            --exclude 'data/live/' \
            --exclude 'data/diagnostics/' \
            --exclude 'data/admin/' \
            --exclude '.geometry-v2-work/'
          printf '%s\n' \
            "repository=${{ github.repository }}" \
            "run_number=${{ github.run_number }}" \
            "sha=${{ github.sha }}" \
            "ref=${{ github.ref }}" \
            "generated_at=$(date -u +%FT%TZ)" > _support/run-metadata/github-run.txt
          (cd _support && zip -qr ../RavRadar-support-${{ github.run_number }}.zip .)

      - name: Upload RavRadar support package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RavRadar-support-${{ github.run_number }}
          path: RavRadar-support-${{ github.run_number }}.zip
          retention-days: 14
          if-no-files-found: error

      - name: Reconfirm current origin/main immediately before protected admin sync
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Sync protected admin data to Supabase
        if: steps.preflight.outputs.should_run == 'true' && steps.operational-action.outputs.action != 'candidate-dry-run'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAVRADAR_PREVIOUS_HANDBOOK_URL: https://raw.githubusercontent.com/${{ github.repository }}/fc13fb5ab326d8824ca55235ac454ac230e3db3e/docs/handbook/content.json
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY; refusing to publish protected admin files."
            exit 1
          fi
          node scripts/sync-protected-admin-assets.mjs

      - name: Build lean GitHub Pages artifact
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          build_pages_site() {
            local pages_source="$1"
            local pages_destination="$2"
            rm -rf "$pages_destination"
            mkdir "$pages_destination"
            rsync -a "$pages_source/" "$pages_destination/" \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '_site*/' \
              --exclude '_support/' \
              --exclude 'RavRadar-support-*.zip' \
              --exclude '.cache/' \
              --exclude 'node_modules/' \
              --exclude 'scripts/' \
              --exclude 'docs/' \
              --exclude 'data/diagnostics/' \
              --exclude 'data/geometry-v2/' \
              --exclude 'data/admin/' \
              --exclude 'data/live/' \
              --exclude 'handbook.html' \
              --exclude 'handbook.css' \
              --exclude 'documentation.html' \
              --exclude 'js/ui/handbook.js' \
              --exclude 'js/ui/admin-app.js' \
              --exclude 'js/core/rule-engine.js' \
              --exclude 'js/core/score-engine.js' \
              --exclude 'js/core/adaptive-model.js' \
              --exclude 'js/core/prediction-engine.js' \
              --exclude 'js/services/rule-service.js' \
              --exclude 'js/services/trip-service.js' \
              --exclude 'js/services/trip-evidence-legacy-bridge.js' \
              --exclude 'rules/' \
              --exclude 'schemas/' \
              --exclude 'supabase/' \
              --exclude 'requirements-dmi.txt' \
              --exclude 'requirements-geometry.txt' \
              --exclude '.geometry-v2-work/' \
              --exclude 'package.json' \
              --exclude 'package-lock.json' \
              --exclude 'CHANGELOG*.md' \
              --exclude 'DELIVERY*.md' \
              --exclude 'INSTALLATION-GUIDE*.md' \
              --exclude 'B02-PLACEMENT-AUDIT.md'
            mkdir -p "$pages_destination/data/live"
            install -m 0644 "$pages_source/data/live/manifest.json" "$pages_destination/data/live/manifest.json"
            install -m 0644 "$pages_source/data/live/public-conditions.json" "$pages_destination/data/live/public-conditions.json"
            install -m 0644 "$pages_source/data/live/public-condition-details.json" "$pages_destination/data/live/public-condition-details.json"
            install -m 0644 "$pages_source/data/live/coastal-parts-v2.json" "$pages_destination/data/live/coastal-parts-v2.json"
          }
          pages_source="$GITHUB_WORKSPACE"
          if [[ "${{ steps.operational-action.outputs.action }}" == candidate-* ]]; then
            pages_source="$RAVRADAR_CANDIDATE_STAGE"
          fi
          build_pages_site "$pages_source" _site
          if [ "${{ steps.operational-action.outputs.action }}" = "candidate-normalization" ]; then
            build_pages_site "$GITHUB_WORKSPACE" _site-integrated
          fi

      - name: Audit the complete Pages artifact for private runtime material
        if: steps.preflight.outputs.should_run == 'true'
        run: >-
          node scripts/audit-pages-artifact-privacy.mjs
          --site _site
          --private-manifest "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json"
          --require-private-manifest

      - name: Audit the integrated follow-up artifact for source normalization
        if: steps.preflight.outputs.should_run == 'true' && steps.operational-action.outputs.action == 'candidate-normalization'
        run: >-
          node scripts/audit-pages-artifact-privacy.mjs
          --site _site-integrated
          --private-manifest "$RAVRADAR_PRIVATE_RUNTIME_BUNDLE/manifest.json"
          --require-private-manifest

      - name: Seal privacy-safe operational deploy handoff
        if: steps.preflight.outputs.should_run == 'true'
        shell: bash
        run: |
          rm -rf "$RAVRADAR_OPERATIONAL_HANDOFF"
          mkdir -p "$RAVRADAR_OPERATIONAL_HANDOFF"
          cp _site/data/live/manifest.json "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          if [ -f "$RAVRADAR_OPERATIONAL_WORK/plan.json" ]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/plan.json" "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          fi
          if [[ "${{ steps.operational-action.outputs.action }}" == candidate-* ]]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/public-audit.json" "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
          else
            cp .geometry-v2-work/ravscore-integrated-public-runtime-audit.json \
              "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json"
          fi
          if [ "${{ steps.operational-action.outputs.action }}" = "candidate-normalization" ]; then
            cp "$RAVRADAR_OPERATIONAL_WORK/legacy-source-manifest.json" \
              "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-manifest.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/legacy-source-attestation.json" \
              "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
            cp _site-integrated/data/live/manifest.json \
              "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-manifest.json"
            cp .geometry-v2-work/ravscore-integrated-public-runtime-audit.json \
              "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-public-audit.json"
          fi
          jq -n \
            --arg action "${{ steps.operational-action.outputs.action }}" \
            --arg sourceHead "$GITHUB_SHA" \
            --arg centralVersion "${{ steps.operational-model.outputs.central_version }}" \
            '{schemaVersion:"ravscore-operational-deploy-handoff-v1",action:$action,sourceHead:$sourceHead,centralVersion:($centralVersion|tonumber),privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json"
          if grep -R -E -i '"(waterPoint|landPoint|currentUMps|currentVMps|rawPayload|privatePayload)"' "$RAVRADAR_OPERATIONAL_HANDOFF"; then
            echo "Operational deploy handoff contains forbidden private fields."
            exit 1
          fi

      - name: Decide whether this sealed artifact may deploy
        if: steps.preflight.outputs.should_run == 'true'
        id: deployment-decision
        shell: bash
        run: |
          action="${{ steps.operational-action.outputs.action }}"
          if [ "$action" = "candidate-dry-run" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deployment_model=candidate-g" >> "$GITHUB_OUTPUT"
            echo "Candidate G dry-run completed without public or central activation."
            exit 0
          fi
          deployment_model="integrated"
          if [ "$action" = "candidate-execute" ] || [ "$action" = "candidate-maintenance" ] || [ "$action" = "candidate-normalization" ]; then
            deployment_model="candidate-g"
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "deployment_model=$deployment_model" >> "$GITHUB_OUTPUT"

      - name: Upload privacy-safe operational handoff evidence
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ravscore-operational-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_HANDOFF }}
          retention-days: 14
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.deployment-decision.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload sealed integrated artifact after Candidate source normalization
        if: steps.deployment-decision.outputs.should_deploy == 'true' && steps.operational-action.outputs.action == 'candidate-normalization'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ravscore-integrated-after-normalization
          path: _site-integrated


  geometry-v2-national:
    name: Acquire private national GeoDanmark geometry-v2 source
    needs: current-hour-readiness
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'none' && inputs.geometry_v2_national == true && inputs.geometry_v2_pilot != true && inputs.ravscore_active_shadow != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private national geometry acquisition
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark geometry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI native-grid reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zones before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for national input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved geometry and tombstones to national input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national read-only work plan
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Fetch and deduplicate private national official source layers
        run: python scripts/fetch-geodanmark-national.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private national source completeness and safety
        run: python scripts/validate-geodanmark-national-source.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze indexed national source against all effective zones
        run: python scripts/analyze-geodanmark-national.py

      - name: Fetch official national fjord and nor exclusions
        run: python scripts/fetch-national-water-exclusions.py

      - name: Analyze national coastal topology and exclusion evidence
        run: python scripts/analyze-national-coastal-topology.py

      - name: Validate national topology audit completeness and isolation
        run: python scripts/validate-national-topology-audit.py

      - name: Audit precise public-coast coverage under stable main zones
        run: python scripts/audit-national-public-coast-coverage.py

      - name: Build private national coastal part review proposals
        run: python scripts/build-national-coastal-parts.py

      - name: Validate private national coastal parts and no invented links
        run: python scripts/validate-national-coastal-parts.py

      - name: Fetch official place-name candidates for actual national coastal parts
        run: python scripts/audit-national-coastal-part-names.py

      - name: Validate official place-name candidates without automatic naming
        run: python scripts/validate-national-coastal-part-names.py

      - name: Build private locality partitions for flagged national coastal parts
        run: python scripts/build-national-locality-partitions.py

      - name: Validate locality partitions remain on source geometry
        run: python scripts/validate-national-locality-partitions.py

      - name: Build private official name suggestions for final local coastal parts
        run: python scripts/build-national-local-part-names.py

      - name: Validate final local part names remain review-only and evidence-backed
        run: python scripts/validate-national-local-part-names.py

      - name: Build private land and water point pairs from opposite-side evidence
        run: python scripts/build-national-local-part-points.py

      - name: Apply independent 10 m land and water side evidence
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-initial-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/national-local-part-point-pairs.json
          --output .geometry-v2-work/national-local-part-point-pairs.json

      - name: Validate ambiguous point pairs remain fail-closed
        run: python scripts/validate-national-local-part-points.py

      - name: Validate all private water candidates on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py

      - name: Build isolated private weather identities for validated coastal parts
        run: python scripts/build-national-weather-shadow-contract.py

      - name: Validate isolated private national multi-step weather series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py

      - name: Validate isolated private national state and history
        run: node scripts/validate-national-state-history.mjs

      - name: Validate isolated private native wind series for coastal parts
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py

      - name: Validate private national local-part shadow score and coverage
        run: node scripts/validate-national-shadow-score.mjs

      - name: Build private national score-neutral owner review
        run: node scripts/build-national-score-neutral-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-coastal-zone-review

      - name: Fetch all official water areas for private inner-water follow-up
        run: python scripts/fetch-national-official-waters.py --output .geometry-v2-work/national-official-waters.geojson

      - name: Audit national inner-water candidates against owner decisions
        run: python scripts/audit-national-inner-water-candidates.py --work .geometry-v2-work --owner-review data/geometry-v2/national-owner-coastal-review-2026-08-11.json

      - name: Audit physical duplicates of owner-reviewed parts
        run: python scripts/audit-national-owner-review-duplicates.py --work .geometry-v2-work --output .geometry-v2-work/national-owner-review-duplicate-audit.json

      - name: Verify exact official fjord and nor overlap
        run: python scripts/audit-national-official-inner-water-overlap.py --work .geometry-v2-work --output .owner-review/national-official-inner-water-overlap-audit.json

      - name: Build private owner correction proposal
        run: python scripts/apply-national-owner-coastal-review.py --work .geometry-v2-work --duplicate-audit .geometry-v2-work/national-owner-review-duplicate-audit.json --output-dir .owner-review/national-owner-corrections

      - name: Build private visual control of owner corrections
        run: node scripts/build-national-owner-correction-review.mjs --proposal .owner-review/national-owner-corrections/owner-correction-proposal.geojson --output .owner-review/national-owner-corrections/index.html

      - name: Build targeted private inner-water follow-up review
        run: node scripts/build-national-inner-water-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-inner-water-follow-up

      - name: Assemble reviewed coast exactly once across neighboring zones
        run: python scripts/assemble-national-owner-final-coast.py --work .geometry-v2-work --corrections .owner-review/national-owner-corrections --zones data/zones.geojson --output-dir .owner-review/national-owner-final

      - name: Rebuild final land and water points after owner corrections and deduplication
        run: python scripts/build-national-local-part-points.py --work-dir .geometry-v2-work --zones data/zones.geojson --final-coast .owner-review/national-owner-final/national-owner-final-coast.geojson --final-names .owner-review/national-owner-final/national-owner-final-part-names.json --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Apply independent 10 m land and water side evidence to final points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-final-land-water-evidence-2026-08-14.json
          --input .owner-review/national-owner-final/national-local-part-point-pairs.json
          --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Validate final land and water point contract
        run: python scripts/validate-national-local-part-points.py --work-dir .owner-review/national-owner-final

      - name: Validate final water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py --input .owner-review/national-owner-final/national-local-part-point-pairs.json --report .owner-review/national-owner-final/national-local-part-dmi-grid.json

      - name: Build final isolated weather identities
        run: python scripts/build-national-weather-shadow-contract.py --points .owner-review/national-owner-final/national-local-part-point-pairs.json --grid .owner-review/national-owner-final/national-local-part-dmi-grid.json --output .owner-review/national-owner-final/national-weather-shadow-contract.json

      - name: Validate final native marine series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-multi-step-series-validation.json --state-input .cache/national-final-state-replay-input.json --score-input .cache/national-final-shadow-score-marine-input.json

      - name: Validate final state and history isolation
        run: node scripts/validate-national-state-history.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --series .owner-review/national-owner-final/national-multi-step-series-validation.json --input .cache/national-final-state-replay-input.json --output .owner-review/national-owner-final/national-state-history-validation.json

      - name: Validate final native wind series
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json

      - name: Validate final score-neutral shadow score
        run: node scripts/validate-national-shadow-score.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --multi .owner-review/national-owner-final/national-multi-step-series-validation.json --state .owner-review/national-owner-final/national-state-history-validation.json --wind .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json --output .owner-review/national-owner-final/national-shadow-score-validation.json

      - name: Validate private national central admin roundtrip and rollback
        run: node scripts/validate-national-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build private fallback-zone recovery from the fetched official coast
        run: >-
          python scripts/build-fallback-zone-recovery-review.py
          --official .geometry-v2-work/national-source/national-Kyst.geojson
          --output .owner-review/fallback-zone-recovery/index.html
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.geojson
          --bundle .geometry-v2-work/fallback-zone-recovery-candidate.json
          --report .geometry-v2-work/fallback-zone-recovery-report.json

      - name: Build private fallback-zone land and water points
        run: >-
          python scripts/build-approved-public-coast-points.py
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.json
          --evidence data/live/coastal-parts-v2.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Apply exact independent land and water evidence to fallback points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-fallback-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-input .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Validate fallback geometry ownership, point pairs and zero overlap
        run: python scripts/validate-fallback-zone-recovery.py

      - name: Validate fallback water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --report .geometry-v2-work/fallback-zone-recovery-dmi-grid.json

      - name: Upload compact national geometry-v2 QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-national-qa-${{ github.run_id }}
          path: |
            .geometry-v2-work/national-work-plan.json
            .geometry-v2-work/national-source-manifest.json
            .geometry-v2-work/national-source-qa.json
            .geometry-v2-work/national-source-qa.geojson
            .geometry-v2-work/national-water-exclusions.geojson
            .geometry-v2-work/national-topology-audit.json
            .geometry-v2-work/national-topology-audit.geojson
            .geometry-v2-work/national-public-coast-coverage-audit.json
            .geometry-v2-work/national-public-coast-coverage-gaps.geojson
            .geometry-v2-work/national-coastal-parts.json
            .geometry-v2-work/national-coastal-parts.geojson
            .geometry-v2-work/national-coastal-part-name-audit.json
            .geometry-v2-work/national-locality-partitions.json
            .geometry-v2-work/national-locality-partitions.geojson
            .geometry-v2-work/national-local-part-name-suggestions.json
            .geometry-v2-work/national-local-part-point-pairs.json
            .geometry-v2-work/national-local-part-dmi-grid.json
            .geometry-v2-work/national-weather-shadow-contract.json
            .geometry-v2-work/national-multi-step-series-validation.json
            .geometry-v2-work/national-state-history-validation.json
            .geometry-v2-work/national-local-part-wind-series.json
            .geometry-v2-work/national-shadow-score-validation.json
            .geometry-v2-work/national-owner-review-duplicate-audit.json
            .owner-review/national-coastal-zone-review/index.html
            .owner-review/national-coastal-zone-review/review-report.json
            .owner-review/national-official-inner-water-overlap-audit.json
            .owner-review/national-owner-corrections/owner-correction-proposal.json
            .owner-review/national-owner-corrections/owner-correction-proposal.geojson
            .owner-review/national-owner-corrections/index.html
            .owner-review/national-inner-water-follow-up/index.html
            .owner-review/national-inner-water-follow-up/review-report.json
            .owner-review/national-owner-final/national-owner-final-coast-audit.json
            .owner-review/national-owner-final/national-owner-final-coast.geojson
            .owner-review/national-owner-final/national-owner-final-part-names.json
            .owner-review/national-owner-final/national-local-part-point-pairs.json
            .owner-review/national-owner-final/national-local-part-dmi-grid.json
            .owner-review/national-owner-final/national-weather-shadow-contract.json
            .owner-review/national-owner-final/national-multi-step-series-validation.json
            .owner-review/national-owner-final/national-state-history-validation.json
            .owner-review/national-owner-final/national-local-part-wind-series.json
            .owner-review/national-owner-final/national-shadow-score-validation.json
            .geometry-v2-work/fallback-zone-recovery-report.json
            .geometry-v2-work/fallback-zone-recovery-validation.json
            .geometry-v2-work/fallback-zone-recovery-point-pairs.json
            .geometry-v2-work/fallback-zone-recovery-dmi-grid.json
            .owner-review/fallback-zone-recovery/index.html
            .owner-review/national-admin-roundtrip-validation.json
          retention-days: 14
