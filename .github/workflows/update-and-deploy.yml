name: Update weather and deploy RavRadar

on:
  schedule:
    # GitHub-ejet 15-minutterskadence. Minutterne ligger forskudt fra
    # timeskiftet, så den private Copernicus-pilot normalt er færdig først.
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Kør hele vejrpipelinen, også når data stadig er friske"
        required: false
        default: false
        type: boolean
      geometry_v2_pilot:
        description: "Kør den private, score-neutrale GeoDanmark-pilot (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      geometry_v2_national:
        description: "Kør privat national GeoDanmark-kildeplan og -hentning (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      ravscore_candidate_g_rollback_mode:
        description: "Candidate G-rollback: sikker dry-run eller eksplicit samlet execute"
        required: false
        default: none
        type: choice
        options:
          - none
          - dry-run
          - execute
      ravscore_candidate_g_rollback_confirmation:
        description: "Kun execute: skriv EXECUTE-CANDIDATE-G-ROLLBACK"
        required: false
        default: ""
        type: string
      ravscore_integrated_return:
        description: "Eksplicit samlet retur fra aktiv Candidate G til integreret RavScore"
        required: false
        default: false
        type: boolean
      ravscore_integrated_return_confirmation:
        description: "Kun retur: skriv EXECUTE-INTEGRATED-RAVSCORE-RETURN"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths-ignore:
      - 'docs/ai/**'
      - 'docs/rdks/**'
      - 'docs/research/**'
      - 'CHANGELOG.md'
      - 'CHANGELOG-*.md'
      - 'HANDBOOK-RAVRADAR.md'
      - 'AGENTS.md'
      - 'release/RELEASE-REPORT.json'
      - 'release/RELEASE-REPORT.md'

permissions:
  contents: read

# GitHub starter den normale vejropdatering hvert 15. minut. En særskilt
# current-hour-gate låser den eksakte UTC-time. Den endelige Copernicus-målliste
# dannes først efter frisk DMI, så normal produktion aldrig kræver landsdækkende
# Copernicus-data som forhåndsbetingelse. Der må højst være én tung kørsel.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.geometry_v2_national == true && 'ravradar-geometry-v2-national' || github.event_name == 'workflow_dispatch' && inputs.geometry_v2_pilot == true && 'ravradar-geometry-v2-pilot' || 'ravradar-weather-production' }}
  # RavScore transitions and normal weather share one production group. An
  # incoming push, schedule or force run must never cancel an atomic model
  # transition between preparation, full gates and Pages deployment. Queued
  # normal runs re-check freshness and become cheap no-ops as needed.
  queue: max
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate mutually exclusive manual operation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      force: ${{ steps.validated-dispatch.outputs.force || steps.dispatch-defaults.outputs.force }}
      geometry_v2_pilot: ${{ steps.validated-dispatch.outputs.geometry_v2_pilot || steps.dispatch-defaults.outputs.geometry_v2_pilot }}
      geometry_v2_national: ${{ steps.validated-dispatch.outputs.geometry_v2_national || steps.dispatch-defaults.outputs.geometry_v2_national }}
      ravscore_candidate_g_rollback_mode: ${{ steps.validated-dispatch.outputs.ravscore_candidate_g_rollback_mode || steps.dispatch-defaults.outputs.ravscore_candidate_g_rollback_mode }}
      ravscore_candidate_g_rollback_confirmation: ${{ steps.validated-dispatch.outputs.ravscore_candidate_g_rollback_confirmation || steps.dispatch-defaults.outputs.ravscore_candidate_g_rollback_confirmation }}
      ravscore_integrated_return: ${{ steps.validated-dispatch.outputs.ravscore_integrated_return || steps.dispatch-defaults.outputs.ravscore_integrated_return }}
      ravscore_integrated_return_confirmation: ${{ steps.validated-dispatch.outputs.ravscore_integrated_return_confirmation || steps.dispatch-defaults.outputs.ravscore_integrated_return_confirmation }}
    steps:
      - name: Publish safe non-manual dispatch defaults
        id: dispatch-defaults
        shell: bash
        run: |
          echo "force=false" >> "$GITHUB_OUTPUT"
          echo "geometry_v2_pilot=false" >> "$GITHUB_OUTPUT"
          echo "geometry_v2_national=false" >> "$GITHUB_OUTPUT"
          echo "ravscore_candidate_g_rollback_mode=none" >> "$GITHUB_OUTPUT"
          echo "ravscore_candidate_g_rollback_confirmation=" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_return=false" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_return_confirmation=" >> "$GITHUB_OUTPUT"

      - name: Checkout manual dispatch contract
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
      - name: Set up Node for manual dispatch contract
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject ambiguous or insufficiently authorized dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          ROLLBACK_MODE: ${{ inputs.ravscore_candidate_g_rollback_mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
          RETURN_REQUESTED: ${{ inputs.ravscore_integrated_return }}
          RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}
        run: |
          set -euo pipefail
          node scripts/validate-ravscore-dispatch.mjs
          case "$ROLLBACK_MODE" in none|dry-run|execute) ;; *) echo "Unsupported Candidate G rollback mode." >&2; exit 1 ;; esac
          geometry=false
          if [ "$GEOMETRY_PILOT" = "true" ] || [ "$GEOMETRY_NATIONAL" = "true" ]; then geometry=true; fi
          operation_count=0
          if [ "$FORCE" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$GEOMETRY_PILOT" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$GEOMETRY_NATIONAL" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$ROLLBACK_MODE" != "none" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$RETURN_REQUESTED" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$operation_count" -gt 1 ]; then
            echo "Exactly one force, geometry, rollback or return operation may be dispatched." >&2
            exit 1
          fi
          if { [ "$ROLLBACK_MODE" != "none" ] || [ "$RETURN_REQUESTED" = "true" ]; } && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "RavScore transitions are allowed only on main." >&2
            exit 1
          fi
          if [ "$ROLLBACK_MODE" = "execute" ] && [ "$ROLLBACK_CONFIRMATION" != "EXECUTE-CANDIDATE-G-ROLLBACK" ]; then
            echo "Candidate G execute confirmation is not exact."
            exit 1
          fi
          if [ "$ROLLBACK_MODE" != "execute" ] && [ -n "$ROLLBACK_CONFIRMATION" ]; then
            echo "Candidate G execute confirmation is accepted only by execute mode." >&2
            exit 1
          fi
          if [ "$RETURN_REQUESTED" = "true" ] && [ "$RETURN_CONFIRMATION" != "EXECUTE-INTEGRATED-RAVSCORE-RETURN" ]; then
            echo "Integrated return confirmation is not exact."
            exit 1
          fi
          if [ "$RETURN_REQUESTED" != "true" ] && [ -n "$RETURN_CONFIRMATION" ]; then
            echo "Integrated return confirmation is accepted only by an integrated return." >&2
            exit 1
          fi

      - name: Publish validated manual dispatch values
        id: validated-dispatch
        if: success() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          ROLLBACK_MODE: ${{ inputs.ravscore_candidate_g_rollback_mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
          RETURN_REQUESTED: ${{ inputs.ravscore_integrated_return }}
          RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}
        run: |
          printf '%s\n' "force=$FORCE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "geometry_v2_pilot=$GEOMETRY_PILOT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "geometry_v2_national=$GEOMETRY_NATIONAL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_candidate_g_rollback_mode=$ROLLBACK_MODE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_candidate_g_rollback_confirmation=$ROLLBACK_CONFIRMATION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_return=$RETURN_REQUESTED" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_return_confirmation=$RETURN_CONFIRMATION" >> "$GITHUB_OUTPUT"

  reconcile-operational-pending:
    name: Reconcile any durable RavScore transition before production
    needs: validate-dispatch
    if: github.ref == 'refs/heads/main' && needs.validate-dispatch.outputs.geometry_v2_pilot != 'true' && needs.validate-dispatch.outputs.geometry_v2_national != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      recovery_action: ${{ steps.reconcile.outputs.recovery_action }}
      recovery_bundle_name: ${{ steps.reconcile.outputs.recovery_bundle_name }}
    env:
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-reconcile
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bind reconciliation runner to newest exact main
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Read, prove and classify the exact historical Pages attempt
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          recovery_bundle_name="ravscore-operational-pages-redeploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "recovery_action=NONE" >> "$GITHUB_OUTPUT"
          echo "recovery_bundle_name=$recovery_bundle_name" >> "$GITHUB_OUTPUT"
          mkdir -p \
            "$RAVRADAR_OPERATIONAL_WORK/handoff" \
            "$RAVRADAR_OPERATIONAL_WORK/recovery" \
            "$RAVRADAR_OPERATIONAL_WORK/artifact-archive" \
            "$RAVRADAR_OPERATIONAL_WORK/target-site"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          if [ "$(jq -r '.pending' "$RAVRADAR_OPERATIONAL_WORK/current.json")" != "true" ]; then
            echo "No durable RavScore transition requires reconciliation."
            exit 0
          fi
          pending_head="$(jq -r '.sourceHead' "$RAVRADAR_OPERATIONAL_WORK/current.json")"
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_WORK/current.json")"
          attempt_id="$(jq -r '.deploymentId' "$RAVRADAR_OPERATIONAL_WORK/current.json")"
          if [[ ! "$attempt_id" =~ ^pages-([0-9]+)-([0-9]+)$ ]]; then
            echo "Pending RavScore transition lacks a recoverable Pages attempt id." >&2
            exit 1
          fi
          attempt_run_id="${BASH_REMATCH[1]}"
          attempt_number="${BASH_REMATCH[2]}"
          gh run download "$attempt_run_id" \
            --name "ravscore-operational-handoff-$attempt_run_id-$attempt_number" \
            --dir "$RAVRADAR_OPERATIONAL_WORK/handoff"
          gh run download "$attempt_run_id" \
            --name "ravscore-operational-recovery-$attempt_run_id-$attempt_number" \
            --dir "$RAVRADAR_OPERATIONAL_WORK/recovery"

          artifact_seal="$RAVRADAR_OPERATIONAL_WORK/handoff/pages-artifact-seal.json"
          test -f "$artifact_seal"
          artifact_id="$(jq -er '.artifactId | select(type == "number" and . > 0 and floor == .)' "$artifact_seal")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
            > "$RAVRADAR_OPERATIONAL_WORK/pages-artifact-rest.json"
          jq -e \
            --argjson artifactId "$artifact_id" \
            --argjson runId "$attempt_run_id" \
            --arg headSha "$pending_head" \
            '.id == $artifactId and .name == "github-pages" and .expired == false and .workflow_run.id == $runId and .workflow_run.head_sha == $headSha' \
            "$RAVRADAR_OPERATIONAL_WORK/pages-artifact-rest.json" >/dev/null
          artifact_digest_raw="$(jq -er '.digest' "$RAVRADAR_OPERATIONAL_WORK/pages-artifact-rest.json")"
          artifact_digest_sha256="$(ARTIFACT_DIGEST="$artifact_digest_raw" node --input-type=module -e \
            "import { normalizeArtifactDigestSha256 } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(normalizeArtifactDigestSha256(process.env.ARTIFACT_DIGEST));")"
          artifact_size="$(jq -er '.size_in_bytes | select(type == "number" and . > 0 and floor == .)' \
            "$RAVRADAR_OPERATIONAL_WORK/pages-artifact-rest.json")"
          sealed_artifact_digest_raw="$(jq -er '.artifactDigestSha256' "$artifact_seal")"
          sealed_artifact_digest_sha256="$(ARTIFACT_DIGEST="$sealed_artifact_digest_raw" node --input-type=module -e \
            "import { normalizeArtifactDigestSha256 } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(normalizeArtifactDigestSha256(process.env.ARTIFACT_DIGEST));")"
          sealed_artifact_size="$(jq -er '.artifactSizeBytes | select(type == "number" and . > 0 and floor == .)' "$artifact_seal")"
          test "$artifact_digest_sha256" = "$sealed_artifact_digest_sha256"
          test "$artifact_size" = "$sealed_artifact_size"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip"
          downloaded_zip_size="$(stat --format='%s' "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip")"
          test "$downloaded_zip_size" = "$artifact_size"
          test "$downloaded_zip_size" = "$sealed_artifact_size"
          downloaded_zip_sha256="$(sha256sum "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip" | awk '{print $1}')"
          test "$downloaded_zip_sha256" = "$artifact_digest_sha256"
          test "$downloaded_zip_sha256" = "$sealed_artifact_digest_sha256"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            --arg attemptId "$attempt_id" \
            --slurpfile current "$RAVRADAR_OPERATIONAL_WORK/current.json" \
            '{schemaVersion:"ravscore-operational-pages-pending-identity-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,requestedAt:$current[0].requestedAt,datasetId:$current[0].datasetId,productionReferenceAt:$current[0].productionReferenceAt,sourcePublicManifestSha256:$current[0].sourcePublicManifestSha256,requestedPublicManifestSha256:$current[0].requestedPublicManifestSha256,requestedImplementationClosureSha256:$current[0].requestedImplementationClosureSha256,requestedModelBinding:$current[0].requestedModelBinding,privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/pending-identity.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            --arg attemptId "$attempt_id" \
            --argjson artifactId "$artifact_id" \
            --arg artifactDigestSha256 "$artifact_digest_sha256" \
            --argjson artifactSizeBytes "$artifact_size" \
            --arg downloadedZipSha256 "$downloaded_zip_sha256" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            '{schemaVersion:"ravscore-operational-pages-artifact-evidence-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,artifactId:$artifactId,artifactName:"github-pages",artifactDigestSha256:$artifactDigestSha256,artifactSizeBytes:$artifactSizeBytes,downloadedZipSha256:$downloadedZipSha256,zipHashedBeforeExtraction:true,expired:false,checkedAt:$checkedAt,privatePayloadRead:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/artifact-evidence.json"

          test "$(unzip -Z1 "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip")" = "artifact.tar"
          unzip -q "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip" \
            -d "$RAVRADAR_OPERATIONAL_WORK/artifact-archive"
          test -f "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar"
          test ! -L "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar"
          test "$(find "$RAVRADAR_OPERATIONAL_WORK/artifact-archive" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          python3 - "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive_path = sys.argv[1]
          with tarfile.open(archive_path, 'r:') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe path in sealed Pages tar')
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit('Link or device entry in sealed Pages tar')
          PY
          tar --extract \
            --file "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar" \
            --directory "$RAVRADAR_OPERATIONAL_WORK/target-site" \
            --no-same-owner --no-same-permissions
          test -f "$RAVRADAR_OPERATIONAL_WORK/target-site/data/live/manifest.json"
          cp "$RAVRADAR_OPERATIONAL_WORK/target-site/data/live/manifest.json" \
            "$RAVRADAR_OPERATIONAL_WORK/target-manifest.json"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$attempt_run_id/attempts/$attempt_number" \
            > "$RAVRADAR_OPERATIONAL_WORK/attempt-run.json"
          jq -e \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            '.id == $runId and .run_attempt == $runAttempt and .head_sha == $headSha and .status == "completed"' \
            "$RAVRADAR_OPERATIONAL_WORK/attempt-run.json" >/dev/null
          run_conclusion="$(jq -er '.conclusion' "$RAVRADAR_OPERATIONAL_WORK/attempt-run.json")"
          case "$run_conclusion" in
            success|failure|cancelled|timed_out|action_required|stale|neutral|skipped) ;;
            *) echo "The original run has an unsupported terminal conclusion." >&2; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$attempt_run_id/attempts/$attempt_number/jobs?per_page=100" \
            > "$RAVRADAR_OPERATIONAL_WORK/attempt-jobs.json"
          deploy_job_count="$(jq \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            '[.jobs[]? | select(.name == "Deploy prepared Pages artifact" and .run_id == $runId and .run_attempt == $runAttempt and .head_sha == $headSha)] | length' \
            "$RAVRADAR_OPERATIONAL_WORK/attempt-jobs.json")"
          test "$deploy_job_count" -eq 1
          deploy_step_count="$(jq \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            '[.jobs[]? | select(.name == "Deploy prepared Pages artifact" and .run_id == $runId and .run_attempt == $runAttempt and .head_sha == $headSha) | .steps[]? | select(.name == "Deploy to GitHub Pages")] | length' \
            "$RAVRADAR_OPERATIONAL_WORK/attempt-jobs.json")"
          test "$deploy_step_count" -eq 1
          deploy_step_conclusion="$(jq -r \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            '[.jobs[]? | select(.name == "Deploy prepared Pages artifact" and .run_id == $runId and .run_attempt == $runAttempt and .head_sha == $headSha) | .steps[]? | select(.name == "Deploy to GitHub Pages")][0].conclusion // ""' \
            "$RAVRADAR_OPERATIONAL_WORK/attempt-jobs.json")"
          terminal_status="AMBIGUOUS"
          pages_request_accepted_json="null"
          deploy_step_conclusion_json="null"
          case "$deploy_step_conclusion" in
            skipped)
              terminal_status="NOT_STARTED"
              pages_request_accepted_json="false"
              deploy_step_conclusion_json='"skipped"'
              ;;
            success)
              pages_request_accepted_json="true"
              deploy_step_conclusion_json='"success"'
              ;;
            failure|cancelled)
              deploy_step_conclusion_json="\"$deploy_step_conclusion\""
              ;;
            *) echo "The original deploy step has an unsupported conclusion." >&2; exit 1 ;;
          esac
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$attempt_run_id" \
            --argjson runAttempt "$attempt_number" \
            --arg headSha "$pending_head" \
            --arg attemptId "$attempt_id" \
            --arg status "$terminal_status" \
            --arg runConclusion "$run_conclusion" \
            --argjson deployStepConclusion "$deploy_step_conclusion_json" \
            --argjson pagesRequestAccepted "$pages_request_accepted_json" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            '{schemaVersion:"ravscore-operational-pages-terminal-evidence-v2",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,status:$status,runStatus:"completed",runConclusion:$runConclusion,deployStepConclusion:$deployStepConclusion,pagesRequestAccepted:$pagesRequestAccepted,checkedAt:$checkedAt,evidenceSource:"github-actions-pages-terminal-readback",privatePayloadRead:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v2.json"

          for observation_number in 1 2; do
            curl --fail --silent --show-error --location --retry 3 \
              --header 'Cache-Control: no-cache' \
              "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-reconcile=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --output "$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json"
            observed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            manifest_sha256="$(TARGET_MANIFEST="$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json" \
              node --input-type=module -e \
              "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson runId "$attempt_run_id" \
              --argjson runAttempt "$attempt_number" \
              --arg headSha "$pending_head" \
              --arg attemptId "$attempt_id" \
              --arg publicManifestSha256 "$manifest_sha256" \
              --arg observedAt "$observed_at" \
              --arg observationNonce "reconcile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              '{schemaVersion:"ravscore-operational-pages-public-observation-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,publicManifestSha256:$publicManifestSha256,observedAt:$observedAt,observationNonce:$observationNonce,privatePayloadRead:false}' \
              > "$RAVRADAR_OPERATIONAL_WORK/helper-observation-$observation_number.json"
            jq -n \
              --slurpfile manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json" \
              --arg observationNonce "reconcile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --arg observedAt "$observed_at" \
              '{manifest:$manifest[0],observationNonce:$observationNonce,observedAt:$observedAt}' \
              > "$RAVRADAR_OPERATIONAL_WORK/activation-observation-$observation_number.json"
            if [ "$observation_number" -eq 1 ]; then sleep 2; fi
          done
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_WORK/helper-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/helper-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/helper-observations.json"
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_WORK/activation-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/activation-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/activation-observations.json"
          cp "$RAVRADAR_OPERATIONAL_WORK/public-manifest-2.json" \
            "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json"

          node scripts/ravscore-operational-pages-recovery.mjs \
            --pending "$RAVRADAR_OPERATIONAL_WORK/pending-identity.json" \
            --artifact-seal "$artifact_seal" \
            --artifact-evidence "$RAVRADAR_OPERATIONAL_WORK/artifact-evidence.json" \
            --terminal-evidence "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v2.json" \
            --observations "$RAVRADAR_OPERATIONAL_WORK/helper-observations.json" \
            --target-manifest "$RAVRADAR_OPERATIONAL_WORK/target-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/pages-recovery-classification.json"
          recovery_action="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/pages-recovery-classification.json")"
          node scripts/ravscore-operational-activation.mjs classify-pending \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json"
          activation_action="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json")"
          model="$(jq -r '.model' "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json")"

          if [ "$recovery_action" = "EXACT_TARGET_REDEPLOY" ]; then
            test "$activation_action" = "wait"
            mkdir -p "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle"
            cp "$RAVRADAR_OPERATIONAL_WORK/original-pages.zip" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/original-pages.zip"
            cp "$RAVRADAR_OPERATIONAL_WORK/pending-identity.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/pending-identity.json"
            cp "$artifact_seal" "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/pages-artifact-seal.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/artifact-evidence.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/artifact-evidence.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v2.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/terminal-evidence-v2.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/helper-observations.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/helper-observations.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/pages-recovery-classification.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/pages-recovery-classification.json"
            cp "$RAVRADAR_OPERATIONAL_WORK/target-manifest.json" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/target-manifest.json"
            cp -R "$RAVRADAR_OPERATIONAL_WORK/handoff" \
              "$RAVRADAR_OPERATIONAL_WORK/redeploy-bundle/handoff"
            echo "recovery_action=EXACT_TARGET_REDEPLOY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if [ "$recovery_action" = "TARGET_RECONCILE" ]; then
            test "$activation_action" = "complete"
            node scripts/verify-ravscore-operational-pages-deployment.mjs \
              --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
              --source-head "$pending_head" \
              --model "$model" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --binding "$RAVRADAR_OPERATIONAL_WORK/handoff/target-binding.json" \
              --contract "$RAVRADAR_OPERATIONAL_WORK/handoff/target-contract.js" \
              --bundle "$RAVRADAR_OPERATIONAL_WORK/handoff/target-bundle.generated.js" \
              --public-closure "$RAVRADAR_OPERATIONAL_WORK/handoff/target-public-closure.json" \
              --observation-nonce "reconcile-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --output "$RAVRADAR_OPERATIONAL_WORK/verification.json"
            completion_args=()
            if [ "$model" = "integrated" ]; then
              completion_args=(
                --readiness "$RAVRADAR_OPERATIONAL_WORK/handoff/integrated-readiness.json"
                --audit "$RAVRADAR_OPERATIONAL_WORK/handoff/public-audit.json"
              )
              if [ "$(jq -r '.requestedModel' "$RAVRADAR_OPERATIONAL_WORK/current.json")" = "integrated" ]; then
                completion_args+=(--plan "$RAVRADAR_OPERATIONAL_WORK/handoff/plan.json")
              fi
            else
              test "$model" = "candidate-g"
              completion_args=(
                --plan "$RAVRADAR_OPERATIONAL_WORK/handoff/plan.json"
              )
            fi
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --observations "$RAVRADAR_OPERATIONAL_WORK/activation-observations.json" \
              --verification "$RAVRADAR_OPERATIONAL_WORK/verification.json" \
              "${completion_args[@]}" \
              --deployment-id "$attempt_id" \
              --output "$RAVRADAR_OPERATIONAL_WORK/reconciled.json"
          elif [ "$recovery_action" = "SAFE_SOURCE_ABORT" ]; then
            test "$activation_action" = "wait"
            jq -n \
              --slurpfile current "$RAVRADAR_OPERATIONAL_WORK/current.json" \
              --slurpfile terminal "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v2.json" \
              '{schemaVersion:"ravscore-operational-pages-attempt-terminal-v1",transitionSourceHead:$current[0].sourceHead,requestedPublicManifestSha256:$current[0].requestedPublicManifestSha256,attemptId:$current[0].deploymentId,status:"NOT_STARTED",pagesRequestAccepted:false,observedSourcePublicManifestSha256:$current[0].sourcePublicManifestSha256,checkedAt:$terminal[0].checkedAt,evidenceSource:"github-actions-pages-terminal-readback",privatePayloadRead:false}' \
              > "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v1.json"
            source_args=()
            if [ "$model" = "legacy-candidate-g" ]; then
              source_args=(
                --source-attestation "$RAVRADAR_OPERATIONAL_WORK/recovery/legacy-source-attestation.json"
              )
            fi
            if [ "$model" = "candidate-g" ] && [ "$(jq -r '.bindingCurrent' "$RAVRADAR_OPERATIONAL_WORK/current.json")" != "true" ]; then
              source_args+=(--plan "$RAVRADAR_OPERATIONAL_WORK/handoff/plan.json")
            fi
            if [ "$model" = "integrated" ] \
              && [ "$(jq -r '.requestedModel' "$RAVRADAR_OPERATIONAL_WORK/current.json")" = "integrated" ] \
              && [ "$(jq -r '.bindingCurrent' "$RAVRADAR_OPERATIONAL_WORK/current.json")" != "true" ]; then
              source_args+=(--plan "$RAVRADAR_OPERATIONAL_WORK/handoff/plan.json")
            fi
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
              --observations "$RAVRADAR_OPERATIONAL_WORK/activation-observations.json" \
              --verification "$RAVRADAR_OPERATIONAL_WORK/recovery/source-verification.json" \
              "${source_args[@]}" \
              --terminal-evidence "$RAVRADAR_OPERATIONAL_WORK/terminal-evidence-v1.json" \
              --failure-code "PENDING_SOURCE_RECONCILED" \
              --output "$RAVRADAR_OPERATIONAL_WORK/reconciled.json"
          else
            echo "Unsupported Pages recovery classification; PENDING remains fail-closed." >&2
            exit 1
          fi
          case "$(jq -r '.status' "$RAVRADAR_OPERATIONAL_WORK/reconciled.json")" in
            CANDIDATE_G_PENDING|INTEGRATED_PENDING) exit 1 ;;
          esac
          echo "recovery_action=$recovery_action" >> "$GITHUB_OUTPUT"

      - name: Upload only helper-proven exact-target recovery material
        if: steps.reconcile.outputs.recovery_action == 'EXACT_TARGET_REDEPLOY'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reconcile.outputs.recovery_bundle_name }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/redeploy-bundle
          retention-days: 14
          if-no-files-found: error

  recover-operational-pages-target:
    name: Redeploy only a helper-proven exact sealed Pages target
    needs: reconcile-operational-pending
    if: needs.reconcile-operational-pending.result == 'success' && needs.reconcile-operational-pending.outputs.recovery_action == 'EXACT_TARGET_REDEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.recovery-deployment.outputs.page_url }}
    env:
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-pages-recovery
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the helper-proven exact-target recovery bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reconcile-operational-pending.outputs.recovery_bundle_name }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/bundle

      - name: Revalidate immutable target bytes and current public endpoint before Pages write
        id: prepare-recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$RAVRADAR_OPERATIONAL_WORK/bundle"
          test "$(jq -r '.action' "$bundle/pages-recovery-classification.json")" = "EXACT_TARGET_REDEPLOY"
          test "$(jq -r '.exactTargetRedeployAllowed' "$bundle/pages-recovery-classification.json")" = "true"
          test "$(jq -r '.centralMutationAllowed' "$bundle/pages-recovery-classification.json")" = "false"
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"

          mkdir -p "$RAVRADAR_OPERATIONAL_WORK/artifact-archive" "$RAVRADAR_OPERATIONAL_WORK/target-site"
          downloaded_zip_sha256="$(sha256sum "$bundle/original-pages.zip" | awk '{print $1}')"
          sealed_artifact_digest_raw="$(jq -er '.artifactDigestSha256' "$bundle/pages-artifact-seal.json")"
          sealed_artifact_digest_sha256="$(ARTIFACT_DIGEST="$sealed_artifact_digest_raw" node --input-type=module -e \
            "import { normalizeArtifactDigestSha256 } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(normalizeArtifactDigestSha256(process.env.ARTIFACT_DIGEST));")"
          test "$downloaded_zip_sha256" = "$sealed_artifact_digest_sha256"
          test "$(stat --format='%s' "$bundle/original-pages.zip")" = \
            "$(jq -er '.artifactSizeBytes | select(type == "number" and . > 0 and floor == .)' "$bundle/pages-artifact-seal.json")"
          test "$downloaded_zip_sha256" = "$(jq -r '.downloadedZipSha256' "$bundle/artifact-evidence.json")"
          test "$(stat --format='%s' "$bundle/original-pages.zip")" = \
            "$(jq -r '.artifactSizeBytes' "$bundle/artifact-evidence.json")"
          test "$(unzip -Z1 "$bundle/original-pages.zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "$bundle/original-pages.zip")" = "artifact.tar"
          unzip -q "$bundle/original-pages.zip" -d "$RAVRADAR_OPERATIONAL_WORK/artifact-archive"
          test -f "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar"
          test ! -L "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar"
          test "$(find "$RAVRADAR_OPERATIONAL_WORK/artifact-archive" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1
          python3 - "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive_path = sys.argv[1]
          with tarfile.open(archive_path, 'r:') as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe path in sealed Pages tar')
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit('Link or device entry in sealed Pages tar')
          PY
          tar --extract \
            --file "$RAVRADAR_OPERATIONAL_WORK/artifact-archive/artifact.tar" \
            --directory "$RAVRADAR_OPERATIONAL_WORK/target-site" \
            --no-same-owner --no-same-permissions
          test -f "$RAVRADAR_OPERATIONAL_WORK/target-site/data/live/manifest.json"

          attempt_run_id="$(jq -r '.runId' "$bundle/pending-identity.json")"
          attempt_number="$(jq -r '.runAttempt' "$bundle/pending-identity.json")"
          pending_head="$(jq -r '.headSha' "$bundle/pending-identity.json")"
          attempt_id="$(jq -r '.attemptId' "$bundle/pending-identity.json")"
          for observation_number in 1 2; do
            curl --fail --silent --show-error --location --retry 3 \
              --header 'Cache-Control: no-cache' \
              "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-recovery-predeploy=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --output "$RAVRADAR_OPERATIONAL_WORK/predeploy-manifest-$observation_number.json"
            observed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            manifest_sha256="$(TARGET_MANIFEST="$RAVRADAR_OPERATIONAL_WORK/predeploy-manifest-$observation_number.json" \
              node --input-type=module -e \
              "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson runId "$attempt_run_id" \
              --argjson runAttempt "$attempt_number" \
              --arg headSha "$pending_head" \
              --arg attemptId "$attempt_id" \
              --arg publicManifestSha256 "$manifest_sha256" \
              --arg observedAt "$observed_at" \
              --arg observationNonce "recovery-predeploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              '{schemaVersion:"ravscore-operational-pages-public-observation-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,publicManifestSha256:$publicManifestSha256,observedAt:$observedAt,observationNonce:$observationNonce,privatePayloadRead:false}' \
              > "$RAVRADAR_OPERATIONAL_WORK/predeploy-helper-observation-$observation_number.json"
            if [ "$observation_number" -eq 1 ]; then sleep 2; fi
          done
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_WORK/predeploy-helper-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/predeploy-helper-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/predeploy-helper-observations.json"
          node scripts/ravscore-operational-pages-recovery.mjs \
            --pending "$bundle/pending-identity.json" \
            --artifact-seal "$bundle/pages-artifact-seal.json" \
            --artifact-evidence "$bundle/artifact-evidence.json" \
            --terminal-evidence "$bundle/terminal-evidence-v2.json" \
            --observations "$RAVRADAR_OPERATIONAL_WORK/predeploy-helper-observations.json" \
            --target-manifest "$RAVRADAR_OPERATIONAL_WORK/target-site/data/live/manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/predeploy-classification.json"
          recovery_action="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/predeploy-classification.json")"
          case "$recovery_action" in
            EXACT_TARGET_REDEPLOY|TARGET_RECONCILE) ;;
            *) echo "The exact-target recovery is no longer safe to execute." >&2; exit 1 ;;
          esac
          echo "action=$recovery_action" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages for exact-target recovery
        if: steps.prepare-recovery.outputs.action == 'EXACT_TARGET_REDEPLOY'
        uses: actions/configure-pages@v6

      - name: Upload the revalidated exact site under a unique recovery name
        id: recovery-pages-upload
        if: steps.prepare-recovery.outputs.action == 'EXACT_TARGET_REDEPLOY'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/target-site
          retention-days: 14

      - name: Redeploy the exact sealed Pages target
        id: recovery-deployment
        if: steps.prepare-recovery.outputs.action == 'EXACT_TARGET_REDEPLOY'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-recovery-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the stable exact target and seal recovery lineage
        if: steps.prepare-recovery.outputs.action == 'EXACT_TARGET_REDEPLOY' || steps.prepare-recovery.outputs.action == 'TARGET_RECONCILE'
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RAVRADAR_OPERATIONAL_WORK/bundle"
          attempt_run_id="$(jq -r '.runId' "$bundle/pending-identity.json")"
          attempt_number="$(jq -r '.runAttempt' "$bundle/pending-identity.json")"
          pending_head="$(jq -r '.headSha' "$bundle/pending-identity.json")"
          attempt_id="$(jq -r '.attemptId' "$bundle/pending-identity.json")"
          source_manifest_sha256="$(jq -r '.sourcePublicManifestSha256' "$bundle/pending-identity.json")"
          requested_manifest_sha256="$(jq -r '.requestedPublicManifestSha256' "$bundle/pending-identity.json")"

          first_manifest="$RAVRADAR_OPERATIONAL_WORK/target-manifest-1.json"
          if [ "${{ steps.prepare-recovery.outputs.action }}" = "EXACT_TARGET_REDEPLOY" ]; then
            for poll_number in $(seq 1 10); do
              curl --fail --silent --show-error --location --retry 3 \
                --header 'Cache-Control: no-cache' \
                "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-recovery-target=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$poll_number" \
                --output "$first_manifest"
              observed_sha256="$(TARGET_MANIFEST="$first_manifest" node --input-type=module -e \
                "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
              if [ "$observed_sha256" = "$requested_manifest_sha256" ]; then break; fi
              if [ "$observed_sha256" != "$source_manifest_sha256" ]; then
                echo "A third public manifest appeared during exact-target recovery." >&2
                exit 1
              fi
              if [ "$poll_number" -eq 10 ]; then
                echo "The exact target did not become public after bounded recovery polling." >&2
                exit 1
              fi
              sleep 3
            done
          else
            curl --fail --silent --show-error --location --retry 3 \
              --header 'Cache-Control: no-cache' \
              "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-recovery-target=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-1" \
              --output "$first_manifest"
          fi
          observed_at_1="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          sleep 2
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-recovery-target=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final" \
            --output "$RAVRADAR_OPERATIONAL_WORK/target-manifest-2.json"
          observed_at_2="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"

          for observation_number in 1 2; do
            manifest_file="$RAVRADAR_OPERATIONAL_WORK/target-manifest-$observation_number.json"
            observed_at="$observed_at_1"
            if [ "$observation_number" -eq 2 ]; then observed_at="$observed_at_2"; fi
            manifest_sha256="$(TARGET_MANIFEST="$manifest_file" node --input-type=module -e \
              "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson runId "$attempt_run_id" \
              --argjson runAttempt "$attempt_number" \
              --arg headSha "$pending_head" \
              --arg attemptId "$attempt_id" \
              --arg publicManifestSha256 "$manifest_sha256" \
              --arg observedAt "$observed_at" \
              --arg observationNonce "recovery-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              '{schemaVersion:"ravscore-operational-pages-public-observation-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,publicManifestSha256:$publicManifestSha256,observedAt:$observedAt,observationNonce:$observationNonce,privatePayloadRead:false}' \
              > "$RAVRADAR_OPERATIONAL_WORK/target-helper-observation-$observation_number.json"
            jq -n \
              --slurpfile manifest "$manifest_file" \
              --arg observationNonce "recovery-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --arg observedAt "$observed_at" \
              '{manifest:$manifest[0],observationNonce:$observationNonce,observedAt:$observedAt}' \
              > "$RAVRADAR_OPERATIONAL_WORK/target-activation-observation-$observation_number.json"
          done
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_WORK/target-helper-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/target-helper-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/target-helper-observations.json"
          jq -s '.' \
            "$RAVRADAR_OPERATIONAL_WORK/target-activation-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/target-activation-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/target-activation-observations.json"
          node scripts/ravscore-operational-pages-recovery.mjs \
            --pending "$bundle/pending-identity.json" \
            --artifact-seal "$bundle/pages-artifact-seal.json" \
            --artifact-evidence "$bundle/artifact-evidence.json" \
            --terminal-evidence "$bundle/terminal-evidence-v2.json" \
            --observations "$RAVRADAR_OPERATIONAL_WORK/target-helper-observations.json" \
            --target-manifest "$RAVRADAR_OPERATIONAL_WORK/target-site/data/live/manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/target-classification.json"
          test "$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/target-classification.json")" = "TARGET_RECONCILE"

          cp "$RAVRADAR_OPERATIONAL_WORK/target-manifest-2.json" \
            "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json"
          handoff_action="$(jq -r '.action' "$bundle/handoff/handoff.json")"
          case "$handoff_action" in
            candidate-execute|candidate-maintenance|candidate-historical-maintenance|candidate-legacy-maintenance) model="candidate-g" ;;
            integrated|integrated-historical-maintenance|integrated-return|integrated-cutover) model="integrated" ;;
            *) echo "The sealed recovery handoff has an unsupported target action." >&2; exit 1 ;;
          esac
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
            --source-head "$pending_head" \
            --model "$model" \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --binding "$bundle/handoff/target-binding.json" \
            --contract "$bundle/handoff/target-contract.js" \
            --bundle "$bundle/handoff/target-bundle.generated.js" \
            --public-closure "$bundle/handoff/target-public-closure.json" \
            --observation-nonce "recovery-verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_WORK/verification.json"

          mkdir -p "$RAVRADAR_OPERATIONAL_WORK/recovery-handoff"
          cp -R "$bundle/handoff/." "$RAVRADAR_OPERATIONAL_WORK/recovery-handoff/"
          cp "$RAVRADAR_OPERATIONAL_WORK/verification.json" \
            "$RAVRADAR_OPERATIONAL_WORK/recovery-handoff/recovery-verification.json"
          cp "$RAVRADAR_OPERATIONAL_WORK/target-classification.json" \
            "$RAVRADAR_OPERATIONAL_WORK/recovery-handoff/recovery-classification.json"
          jq -n \
            --arg deploymentId "pages-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg originalAttemptId "$attempt_id" \
            --arg sourceHead "$pending_head" \
            '{schemaVersion:"ravscore-operational-recovery-handoff-v1",deploymentId:$deploymentId,originalAttemptId:$originalAttemptId,sourceHead:$sourceHead,targetClassification:"TARGET_RECONCILE",privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/recovery-handoff/recovery-handoff.json"

      - name: Upload bounded recovery handoff for future exact source restore
        if: steps.prepare-recovery.outputs.action == 'EXACT_TARGET_REDEPLOY' || steps.prepare-recovery.outputs.action == 'TARGET_RECONCILE'
        uses: actions/upload-artifact@v7
        with:
          name: ravscore-operational-recovery-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/recovery-handoff
          retention-days: 14
          if-no-files-found: error

  finalize-operational-pages-recovery:
    name: Finalize exact recovered target without Pages privileges
    needs:
      - reconcile-operational-pending
      - recover-operational-pages-target
    if: needs.reconcile-operational-pending.result == 'success' && needs.reconcile-operational-pending.outputs.recovery_action == 'EXACT_TARGET_REDEPLOY' && needs.recover-operational-pages-target.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RAVRADAR_OPERATIONAL_WORK: /tmp/ravradar-operational-pages-finalize
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download sealed original recovery evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reconcile-operational-pending.outputs.recovery_bundle_name }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/bundle

      - name: Download recovered source lineage handoff
        uses: actions/download-artifact@v8
        with:
          name: ravscore-operational-recovery-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_WORK }}/recovery-handoff

      - name: Reobserve exact target and complete central CAS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          bundle="$RAVRADAR_OPERATIONAL_WORK/bundle"
          handoff="$RAVRADAR_OPERATIONAL_WORK/recovery-handoff"
          test -f "$bundle/pending-identity.json"
          test -f "$handoff/recovery-handoff.json"
          test "$(jq -r '.deploymentId' "$handoff/recovery-handoff.json")" = \
            "pages-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current.json"
          test "$(jq -r '.pending' "$RAVRADAR_OPERATIONAL_WORK/current.json")" = "true"
          jq -n \
            --slurpfile sealed "$bundle/pending-identity.json" \
            --slurpfile current "$RAVRADAR_OPERATIONAL_WORK/current.json" \
            '{schemaVersion:"ravscore-operational-pages-pending-identity-v1",repository:$sealed[0].repository,runId:$sealed[0].runId,runAttempt:$sealed[0].runAttempt,headSha:$current[0].sourceHead,ref:"refs/heads/main",attemptId:$current[0].deploymentId,requestedAt:$current[0].requestedAt,datasetId:$current[0].datasetId,productionReferenceAt:$current[0].productionReferenceAt,sourcePublicManifestSha256:$current[0].sourcePublicManifestSha256,requestedPublicManifestSha256:$current[0].requestedPublicManifestSha256,requestedImplementationClosureSha256:$current[0].requestedImplementationClosureSha256,requestedModelBinding:$current[0].requestedModelBinding,privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/current-pending-identity.json"
          test "$(jq -S -c . "$RAVRADAR_OPERATIONAL_WORK/current-pending-identity.json")" = \
            "$(jq -S -c . "$bundle/pending-identity.json")"

          attempt_run_id="$(jq -r '.runId' "$bundle/pending-identity.json")"
          attempt_number="$(jq -r '.runAttempt' "$bundle/pending-identity.json")"
          pending_head="$(jq -r '.headSha' "$bundle/pending-identity.json")"
          attempt_id="$(jq -r '.attemptId' "$bundle/pending-identity.json")"
          for observation_number in 1 2; do
            curl --fail --silent --show-error --location --retry 3 \
              --header 'Cache-Control: no-cache' \
              "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-recovery-finalize=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --output "$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json"
            observed_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            manifest_sha256="$(TARGET_MANIFEST="$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json" \
              node --input-type=module -e \
              "import fs from 'node:fs'; import { sha256CanonicalJson } from './scripts/ravscore-operational-pages-recovery.mjs'; process.stdout.write(sha256CanonicalJson(JSON.parse(fs.readFileSync(process.env.TARGET_MANIFEST, 'utf8'))));")"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson runId "$attempt_run_id" \
              --argjson runAttempt "$attempt_number" \
              --arg headSha "$pending_head" \
              --arg attemptId "$attempt_id" \
              --arg publicManifestSha256 "$manifest_sha256" \
              --arg observedAt "$observed_at" \
              --arg observationNonce "recovery-finalize-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              '{schemaVersion:"ravscore-operational-pages-public-observation-v1",repository:$repository,runId:$runId,runAttempt:$runAttempt,headSha:$headSha,ref:"refs/heads/main",attemptId:$attemptId,publicManifestSha256:$publicManifestSha256,observedAt:$observedAt,observationNonce:$observationNonce,privatePayloadRead:false}' \
              > "$RAVRADAR_OPERATIONAL_WORK/helper-observation-$observation_number.json"
            jq -n \
              --slurpfile manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest-$observation_number.json" \
              --arg observationNonce "recovery-finalize-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$observation_number" \
              --arg observedAt "$observed_at" \
              '{manifest:$manifest[0],observationNonce:$observationNonce,observedAt:$observedAt}' \
              > "$RAVRADAR_OPERATIONAL_WORK/activation-observation-$observation_number.json"
            if [ "$observation_number" -eq 1 ]; then sleep 2; fi
          done
          jq -s '.' "$RAVRADAR_OPERATIONAL_WORK/helper-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/helper-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/helper-observations.json"
          jq -s '.' "$RAVRADAR_OPERATIONAL_WORK/activation-observation-1.json" \
            "$RAVRADAR_OPERATIONAL_WORK/activation-observation-2.json" \
            > "$RAVRADAR_OPERATIONAL_WORK/activation-observations.json"

          node scripts/ravscore-operational-pages-recovery.mjs \
            --pending "$RAVRADAR_OPERATIONAL_WORK/current-pending-identity.json" \
            --artifact-seal "$bundle/pages-artifact-seal.json" \
            --artifact-evidence "$bundle/artifact-evidence.json" \
            --terminal-evidence "$bundle/terminal-evidence-v2.json" \
            --observations "$RAVRADAR_OPERATIONAL_WORK/helper-observations.json" \
            --target-manifest "$bundle/target-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/target-classification.json"
          test "$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/target-classification.json")" = "TARGET_RECONCILE"
          cp "$RAVRADAR_OPERATIONAL_WORK/public-manifest-2.json" \
            "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json"
          node scripts/ravscore-operational-activation.mjs classify-pending \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json"
          test "$(jq -r '.action' "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json")" = "complete"
          model="$(jq -r '.model' "$RAVRADAR_OPERATIONAL_WORK/activation-classification.json")"
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
            --source-head "$pending_head" \
            --model "$model" \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --binding "$handoff/target-binding.json" \
            --contract "$handoff/target-contract.js" \
            --bundle "$handoff/target-bundle.generated.js" \
            --public-closure "$handoff/target-public-closure.json" \
            --observation-nonce "recovery-finalize-verified-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_WORK/verification.json"

          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$GITHUB_SHA"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          node scripts/ravscore-operational-activation.mjs read \
            --output "$RAVRADAR_OPERATIONAL_WORK/current-before-cas.json"
          test "$(jq -r '.pending' "$RAVRADAR_OPERATIONAL_WORK/current-before-cas.json")" = "true"
          jq -n \
            --slurpfile sealed "$bundle/pending-identity.json" \
            --slurpfile current "$RAVRADAR_OPERATIONAL_WORK/current-before-cas.json" \
            '{schemaVersion:"ravscore-operational-pages-pending-identity-v1",repository:$sealed[0].repository,runId:$sealed[0].runId,runAttempt:$sealed[0].runAttempt,headSha:$current[0].sourceHead,ref:"refs/heads/main",attemptId:$current[0].deploymentId,requestedAt:$current[0].requestedAt,datasetId:$current[0].datasetId,productionReferenceAt:$current[0].productionReferenceAt,sourcePublicManifestSha256:$current[0].sourcePublicManifestSha256,requestedPublicManifestSha256:$current[0].requestedPublicManifestSha256,requestedImplementationClosureSha256:$current[0].requestedImplementationClosureSha256,requestedModelBinding:$current[0].requestedModelBinding,privatePayloadIncluded:false}' \
            > "$RAVRADAR_OPERATIONAL_WORK/current-before-cas-identity.json"
          test "$(jq -S -c . "$RAVRADAR_OPERATIONAL_WORK/current-before-cas-identity.json")" = \
            "$(jq -S -c . "$bundle/pending-identity.json")"
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_WORK/current-before-cas.json")"
          completion_args=()
          if [ "$model" = "candidate-g" ]; then
            completion_args=(--plan "$handoff/plan.json")
          elif [ "$model" = "integrated" ]; then
            completion_args=(
              --readiness "$handoff/integrated-readiness.json"
              --audit "$handoff/public-audit.json"
            )
            if [ "$(jq -r '.requestedModel' "$RAVRADAR_OPERATIONAL_WORK/current-before-cas.json")" = "integrated" ]; then
              completion_args+=(--plan "$handoff/plan.json")
            fi
          else
            echo "Recovered target has an unsupported model." >&2
            exit 1
          fi
          node scripts/ravscore-operational-activation.mjs reconcile \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_WORK/public-manifest.json" \
            --observations "$RAVRADAR_OPERATIONAL_WORK/activation-observations.json" \
            --verification "$RAVRADAR_OPERATIONAL_WORK/verification.json" \
            "${completion_args[@]}" \
            --deployment-id "pages-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_WORK/reconciled.json"
          case "$(jq -r '.status' "$RAVRADAR_OPERATIONAL_WORK/reconciled.json")" in
            CANDIDATE_G_PENDING|INTEGRATED_PENDING) exit 1 ;;
          esac

  operational-recovery-gate:
    name: Require terminal operational recovery before production
    needs:
      - reconcile-operational-pending
      - recover-operational-pages-target
      - finalize-operational-pages-recovery
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Prove reconciliation or exact-target redeploy completed
        shell: bash
        env:
          RECONCILE_RESULT: ${{ needs.reconcile-operational-pending.result }}
          RECOVERY_ACTION: ${{ needs.reconcile-operational-pending.outputs.recovery_action }}
          EXACT_TARGET_RESULT: ${{ needs.recover-operational-pages-target.result }}
          FINALIZE_RESULT: ${{ needs.finalize-operational-pages-recovery.result }}
          GEOMETRY_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.geometry_v2_pilot == true || inputs.geometry_v2_national == true) }}
        run: |
          set -euo pipefail
          if [ "$GEOMETRY_ONLY" = "true" ]; then
            test "$RECONCILE_RESULT" = "skipped"
            test "$EXACT_TARGET_RESULT" = "skipped"
            test "$FINALIZE_RESULT" = "skipped"
            test -z "$RECOVERY_ACTION"
            exit 0
          fi
          test "$RECONCILE_RESULT" = "success"
          case "$RECOVERY_ACTION" in
            EXACT_TARGET_REDEPLOY)
              test "$EXACT_TARGET_RESULT" = "success"
              test "$FINALIZE_RESULT" = "success"
              ;;
            NONE|SAFE_SOURCE_ABORT|TARGET_RECONCILE)
              test "$EXACT_TARGET_RESULT" = "skipped"
              test "$FINALIZE_RESULT" = "skipped"
              ;;
            *) echo "Unknown operational recovery result." >&2; exit 1 ;;
          esac

  current-hour-readiness:
    name: Check timed current-hour readiness
    needs: operational-recovery-gate
    if: ${{ !cancelled() && needs.operational-recovery-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      target_hour: ${{ steps.cache-state.outputs.target_hour }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Restore private Copernicus current cache for timed gate
        if: github.event_name != 'workflow_dispatch' || (inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true)
        uses: actions/cache/restore@v6
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-production-gate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Inspect timed UTC hour without exposing raw vectors
        if: github.event_name != 'workflow_dispatch' || (inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true)
        id: cache-state
        run: python3 scripts/check-copernicus-current-hour.py --github-output "$GITHUB_OUTPUT"

      - name: Decide whether production may start
        id: readiness
        shell: bash
        env:
          CHECK_CURRENT_HOUR: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force != true && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true) }}
          CURRENT_HOUR_PRESENT: ${{ steps.cache-state.outputs.current_hour_present }}
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Production trigger may continue."
          if [ "$CHECK_CURRENT_HOUR" = "true" ] && [ "$CURRENT_HOUR_PRESENT" != "true" ]; then
            echo "::notice title=Targeted supplement pending::The exact Copernicus supplement will be resolved after fresh DMI gap selection; nationwide Copernicus coverage is not required."
          fi

  trip-storage-readiness:
    name: Check exact-head D1 trip-storage readiness
    needs: current-hour-readiness
    if: ${{ !cancelled() && needs.current-hour-readiness.result == 'success' && needs.current-hour-readiness.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Determine exact-head D1 trip-storage readiness without failing the run
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_TRIP_STORAGE_MODE: d1
          CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
          TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}
        run: |
          set -uo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if ! release_version="$(jq -er '.version | select(type == "string" and test("^4\\.0\\.[0-9]+$"))' version.json 2>/dev/null)"; then
            echo "::notice title=Pages production deferred::version.json could not be validated; this run remains a green no-op."
            exit 0
          fi
          requires_exact_d1=false
          if [ "$release_version" = "4.0.311" ] || [ "$release_version" = "4.0.312" ] || [ "$release_version" = "4.0.313" ] || [ "$release_version" = "4.0.314" ]; then
            requires_exact_d1=true
          fi
          if [ "$requires_exact_d1" != "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "The historical 4.0.311-4.0.314 exact-D1 release interlock is not required for version $release_version."
            exit 0
          fi
          if ! runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-trip-storage.yml/runs?branch=main&status=completed&event=workflow_dispatch&per_page=100")"; then
            echo "::notice title=Pages production deferred::Could not verify the exact-head D1 trip-storage deployment; this run remains a green no-op."
            exit 0
          fi
          if ! matching_count="$(jq --arg sha "$EXPECTED_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event == "workflow_dispatch" and .display_title == "Deploy RavRadar trip storage [d1]")] | length' <<< "$runs_json")"; then
            echo "::notice title=Pages production deferred::The D1 readiness response could not be validated; this run remains a green no-op."
            exit 0
          fi
          if [ "$matching_count" -lt 1 ]; then
            echo "::notice title=Pages production deferred::Deploy and verify trip storage in D1 mode on this exact main head, then dispatch normal production."
            exit 0
          fi
          if ! node scripts/verify-trip-storage-edge.mjs; then
            echo "::notice title=Pages production deferred::The live Edge contract is not the required Candidate G D1 mode; this run remains a green no-op."
            exit 0
          fi
          if ! node scripts/verify-cloudflare-trip-gateway.mjs; then
            echo "::notice title=Pages production deferred::The live Worker/registry contract could not be attested; this run remains a green no-op."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "The exact source head and the live Edge/Worker backend have the required D1 contract."

  build-and-prepare:
    name: Build and prepare weather production through reusable workflow
    needs: [validate-dispatch, current-hour-readiness, trip-storage-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && needs.trip-storage-readiness.result == 'success' && needs.validate-dispatch.outputs.geometry_v2_pilot != 'true' && needs.validate-dispatch.outputs.geometry_v2_national != 'true' && needs.current-hour-readiness.outputs.ready == 'true' && needs.trip-storage-readiness.outputs.ready == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-weather-build.yml
    with:
      production_target_hour: ${{ needs.current-hour-readiness.outputs.target_hour }}
      force: ${{ needs.validate-dispatch.outputs.force == 'true' }}
      ravscore_candidate_g_rollback_mode: ${{ needs.validate-dispatch.outputs.ravscore_candidate_g_rollback_mode }}
      ravscore_candidate_g_rollback_confirmation: ${{ needs.validate-dispatch.outputs.ravscore_candidate_g_rollback_confirmation }}
      ravscore_integrated_return: ${{ needs.validate-dispatch.outputs.ravscore_integrated_return == 'true' }}
      ravscore_integrated_return_confirmation: ${{ needs.validate-dispatch.outputs.ravscore_integrated_return_confirmation }}
    secrets:
      CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}

  geometry-v2-national:
    name: Acquire private national GeoDanmark geometry-v2 source
    needs: [validate-dispatch, current-hour-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && github.event_name == 'workflow_dispatch' && needs.validate-dispatch.outputs.geometry_v2_national == 'true' && needs.validate-dispatch.outputs.geometry_v2_pilot != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private national geometry acquisition
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark geometry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI native-grid reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zones before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for national input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved geometry and tombstones to national input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national read-only work plan
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Fetch and deduplicate private national official source layers
        run: python scripts/fetch-geodanmark-national.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private national source completeness and safety
        run: python scripts/validate-geodanmark-national-source.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze indexed national source against all effective zones
        run: python scripts/analyze-geodanmark-national.py

      - name: Fetch official national fjord and nor exclusions
        run: python scripts/fetch-national-water-exclusions.py

      - name: Analyze national coastal topology and exclusion evidence
        run: python scripts/analyze-national-coastal-topology.py

      - name: Validate national topology audit completeness and isolation
        run: python scripts/validate-national-topology-audit.py

      - name: Audit precise public-coast coverage under stable main zones
        run: python scripts/audit-national-public-coast-coverage.py

      - name: Build private national coastal part review proposals
        run: python scripts/build-national-coastal-parts.py

      - name: Validate private national coastal parts and no invented links
        run: python scripts/validate-national-coastal-parts.py

      - name: Fetch official place-name candidates for actual national coastal parts
        run: python scripts/audit-national-coastal-part-names.py

      - name: Validate official place-name candidates without automatic naming
        run: python scripts/validate-national-coastal-part-names.py

      - name: Build private locality partitions for flagged national coastal parts
        run: python scripts/build-national-locality-partitions.py

      - name: Validate locality partitions remain on source geometry
        run: python scripts/validate-national-locality-partitions.py

      - name: Build private official name suggestions for final local coastal parts
        run: python scripts/build-national-local-part-names.py

      - name: Validate final local part names remain review-only and evidence-backed
        run: python scripts/validate-national-local-part-names.py

      - name: Build private land and water point pairs from opposite-side evidence
        run: python scripts/build-national-local-part-points.py

      - name: Apply independent 10 m land and water side evidence
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-initial-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/national-local-part-point-pairs.json
          --output .geometry-v2-work/national-local-part-point-pairs.json

      - name: Validate ambiguous point pairs remain fail-closed
        run: python scripts/validate-national-local-part-points.py

      - name: Validate all private water candidates on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py

      - name: Build isolated private weather identities for validated coastal parts
        run: python scripts/build-national-weather-shadow-contract.py

      - name: Validate isolated private national multi-step weather series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py

      - name: Validate isolated private national state and history
        run: node scripts/validate-national-state-history.mjs

      - name: Validate isolated private native wind series for coastal parts
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py

      - name: Validate private national local-part shadow score and coverage
        run: node scripts/validate-national-shadow-score.mjs

      - name: Build private national score-neutral owner review
        run: node scripts/build-national-score-neutral-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-coastal-zone-review

      - name: Fetch all official water areas for private inner-water follow-up
        run: python scripts/fetch-national-official-waters.py --output .geometry-v2-work/national-official-waters.geojson

      - name: Audit national inner-water candidates against owner decisions
        run: python scripts/audit-national-inner-water-candidates.py --work .geometry-v2-work --owner-review data/geometry-v2/national-owner-coastal-review-2026-08-11.json

      - name: Audit physical duplicates of owner-reviewed parts
        run: python scripts/audit-national-owner-review-duplicates.py --work .geometry-v2-work --output .geometry-v2-work/national-owner-review-duplicate-audit.json

      - name: Verify exact official fjord and nor overlap
        run: python scripts/audit-national-official-inner-water-overlap.py --work .geometry-v2-work --output .owner-review/national-official-inner-water-overlap-audit.json

      - name: Build private owner correction proposal
        run: python scripts/apply-national-owner-coastal-review.py --work .geometry-v2-work --duplicate-audit .geometry-v2-work/national-owner-review-duplicate-audit.json --output-dir .owner-review/national-owner-corrections

      - name: Build private visual control of owner corrections
        run: node scripts/build-national-owner-correction-review.mjs --proposal .owner-review/national-owner-corrections/owner-correction-proposal.geojson --output .owner-review/national-owner-corrections/index.html

      - name: Build targeted private inner-water follow-up review
        run: node scripts/build-national-inner-water-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-inner-water-follow-up

      - name: Assemble reviewed coast exactly once across neighboring zones
        run: python scripts/assemble-national-owner-final-coast.py --work .geometry-v2-work --corrections .owner-review/national-owner-corrections --zones data/zones.geojson --output-dir .owner-review/national-owner-final

      - name: Rebuild final land and water points after owner corrections and deduplication
        run: python scripts/build-national-local-part-points.py --work-dir .geometry-v2-work --zones data/zones.geojson --final-coast .owner-review/national-owner-final/national-owner-final-coast.geojson --final-names .owner-review/national-owner-final/national-owner-final-part-names.json --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Apply independent 10 m land and water side evidence to final points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-final-land-water-evidence-2026-08-14.json
          --input .owner-review/national-owner-final/national-local-part-point-pairs.json
          --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Validate final land and water point contract
        run: python scripts/validate-national-local-part-points.py --work-dir .owner-review/national-owner-final

      - name: Validate final water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py --input .owner-review/national-owner-final/national-local-part-point-pairs.json --report .owner-review/national-owner-final/national-local-part-dmi-grid.json

      - name: Build final isolated weather identities
        run: python scripts/build-national-weather-shadow-contract.py --points .owner-review/national-owner-final/national-local-part-point-pairs.json --grid .owner-review/national-owner-final/national-local-part-dmi-grid.json --output .owner-review/national-owner-final/national-weather-shadow-contract.json

      - name: Validate final native marine series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-multi-step-series-validation.json --state-input .cache/national-final-state-replay-input.json --score-input .cache/national-final-shadow-score-marine-input.json

      - name: Validate final state and history isolation
        run: node scripts/validate-national-state-history.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --series .owner-review/national-owner-final/national-multi-step-series-validation.json --input .cache/national-final-state-replay-input.json --output .owner-review/national-owner-final/national-state-history-validation.json

      - name: Validate final native wind series
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json

      - name: Validate final score-neutral shadow score
        run: node scripts/validate-national-shadow-score.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --multi .owner-review/national-owner-final/national-multi-step-series-validation.json --state .owner-review/national-owner-final/national-state-history-validation.json --wind .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json --output .owner-review/national-owner-final/national-shadow-score-validation.json

      - name: Validate private national central admin roundtrip and rollback
        run: node scripts/validate-national-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build private fallback-zone recovery from the fetched official coast
        run: >-
          python scripts/build-fallback-zone-recovery-review.py
          --official .geometry-v2-work/national-source/national-Kyst.geojson
          --output .owner-review/fallback-zone-recovery/index.html
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.geojson
          --bundle .geometry-v2-work/fallback-zone-recovery-candidate.json
          --report .geometry-v2-work/fallback-zone-recovery-report.json

      - name: Build private fallback-zone land and water points
        run: >-
          python scripts/build-approved-public-coast-points.py
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.json
          --evidence data/live/coastal-parts-v2.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Apply exact independent land and water evidence to fallback points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-fallback-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-input .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Validate fallback geometry ownership, point pairs and zero overlap
        run: python scripts/validate-fallback-zone-recovery.py

      - name: Validate fallback water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --report .geometry-v2-work/fallback-zone-recovery-dmi-grid.json

      - name: Upload compact national geometry-v2 QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-national-qa-${{ github.run_id }}
          path: |
            .geometry-v2-work/national-work-plan.json
            .geometry-v2-work/national-source-manifest.json
            .geometry-v2-work/national-source-qa.json
            .geometry-v2-work/national-source-qa.geojson
            .geometry-v2-work/national-water-exclusions.geojson
            .geometry-v2-work/national-topology-audit.json
            .geometry-v2-work/national-topology-audit.geojson
            .geometry-v2-work/national-public-coast-coverage-audit.json
            .geometry-v2-work/national-public-coast-coverage-gaps.geojson
            .geometry-v2-work/national-coastal-parts.json
            .geometry-v2-work/national-coastal-parts.geojson
            .geometry-v2-work/national-coastal-part-name-audit.json
            .geometry-v2-work/national-locality-partitions.json
            .geometry-v2-work/national-locality-partitions.geojson
            .geometry-v2-work/national-local-part-name-suggestions.json
            .geometry-v2-work/national-local-part-point-pairs.json
            .geometry-v2-work/national-local-part-dmi-grid.json
            .geometry-v2-work/national-weather-shadow-contract.json
            .geometry-v2-work/national-multi-step-series-validation.json
            .geometry-v2-work/national-state-history-validation.json
            .geometry-v2-work/national-local-part-wind-series.json
            .geometry-v2-work/national-shadow-score-validation.json
            .geometry-v2-work/national-owner-review-duplicate-audit.json
            .owner-review/national-coastal-zone-review/index.html
            .owner-review/national-coastal-zone-review/review-report.json
            .owner-review/national-official-inner-water-overlap-audit.json
            .owner-review/national-owner-corrections/owner-correction-proposal.json
            .owner-review/national-owner-corrections/owner-correction-proposal.geojson
            .owner-review/national-owner-corrections/index.html
            .owner-review/national-inner-water-follow-up/index.html
            .owner-review/national-inner-water-follow-up/review-report.json
            .owner-review/national-owner-final/national-owner-final-coast-audit.json
            .owner-review/national-owner-final/national-owner-final-coast.geojson
            .owner-review/national-owner-final/national-owner-final-part-names.json
            .owner-review/national-owner-final/national-local-part-point-pairs.json
            .owner-review/national-owner-final/national-local-part-dmi-grid.json
            .owner-review/national-owner-final/national-weather-shadow-contract.json
            .owner-review/national-owner-final/national-multi-step-series-validation.json
            .owner-review/national-owner-final/national-state-history-validation.json
            .owner-review/national-owner-final/national-local-part-wind-series.json
            .owner-review/national-owner-final/national-shadow-score-validation.json
            .geometry-v2-work/fallback-zone-recovery-report.json
            .geometry-v2-work/fallback-zone-recovery-validation.json
            .geometry-v2-work/fallback-zone-recovery-point-pairs.json
            .geometry-v2-work/fallback-zone-recovery-dmi-grid.json
            .owner-review/fallback-zone-recovery/index.html
            .owner-review/national-admin-roundtrip-validation.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload private national geometry-v2 source artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-national-${{ github.run_id }}
          path: .geometry-v2-work/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  geometry-v2-pilot:
    name: Run GeoDanmark geometry-v2 pilot
    needs: [validate-dispatch, current-hour-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && github.event_name == 'workflow_dispatch' && needs.validate-dispatch.outputs.geometry_v2_pilot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private geometry pilot
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark pilot dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI GRIB reader for private grid validation
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zone baseline before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for pilot input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and tombstones for pilot input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national geometry-v2 work plan from effective zones
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Run GeoDanmark geometry-v2 pilot
        run: python scripts/fetch-geodanmark-pilot.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze GeoDanmark source against centrally hydrated pilot zones
        run: python scripts/analyze-geodanmark-pilot.py

      - name: Audit official place names and migration classes
        run: python scripts/audit-pilot-place-names.py

      - name: Fetch official private fjord and nor exclusion polygons
        run: python scripts/fetch-official-water-exclusions.py

      - name: Assemble conservative private coastal-part proposals
        run: python scripts/assemble-geodanmark-coastal-parts.py

      - name: Build private Blåvand detail proposal
        run: python scripts/build-blaavand-detail-proposal.py

      - name: Build private official orthophoto review overlays
        run: python scripts/build-blaavand-ortho-review.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private Blåvand water points on native DMI grids
        run: python scripts/validate-blaavand-dmi-grid.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 600
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Build private score-neutral Blåvand weather shadow contract
        run: python scripts/build-blaavand-weather-shadow-contract.py

      - name: Validate private isolated Blåvand multi-step weather series
        run: python scripts/validate-blaavand-multi-step-series.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          BLAAVAND_MULTI_STEP_MAX_ASSETS: 6
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 900
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Validate private isolated Blåvand state and history replay
        run: node scripts/validate-blaavand-state-history.mjs

      - name: Build private score-neutral Blåvand UI review
        run: node scripts/build-blaavand-score-neutral-ui-review.mjs

      - name: Validate private Blåvand central admin roundtrip and rollback
        run: node scripts/validate-blaavand-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Render private GeoDanmark source review maps
        run: python scripts/render-geodanmark-pilot-maps.py

      - name: Upload private GeoDanmark pilot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-pilot-${{ github.run_id }}
          path: |
            .geometry-v2-work/
            data/diagnostics/geodanmark-pilot-report.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  deploy-pages:
    name: Deploy prepared Pages artifact through reusable workflow
    needs: build-and-prepare
    if: ${{ !cancelled() && needs.build-and-prepare.result == 'success' && github.ref == 'refs/heads/main' && needs.build-and-prepare.outputs.should_deploy == 'true' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages-deploy.yml
    with:
      active_deployment_id: ${{ needs.build-and-prepare.outputs.active_deployment_id }}
      central_version: ${{ needs.build-and-prepare.outputs.central_version }}
      deployment_model: ${{ needs.build-and-prepare.outputs.deployment_model }}
      integrated_implementation_closure_sha256: ${{ needs.build-and-prepare.outputs.integrated_implementation_closure_sha256 }}
      legacy_source_required: ${{ needs.build-and-prepare.outputs.legacy_source_required }}
      operational_action: ${{ needs.build-and-prepare.outputs.operational_action }}
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  production-outcome:
    name: Classify exact weather production outcome
    needs:
      - validate-dispatch
      - reconcile-operational-pending
      - recover-operational-pages-target
      - finalize-operational-pages-recovery
      - operational-recovery-gate
      - current-hour-readiness
      - trip-storage-readiness
      - build-and-prepare
      - geometry-v2-national
      - geometry-v2-pilot
      - deploy-pages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      status: ${{ steps.classify.outputs.status }}
      reason_code: ${{ steps.classify.outputs.reason_code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Classify one privacy-safe machine-readable terminal outcome
        id: classify
        env:
          RAVRADAR_OUTCOME_SOURCE_HEAD: ${{ github.sha }}
          RAVRADAR_OUTCOME_RUN_ID: ${{ github.run_id }}
          RAVRADAR_OUTCOME_RUN_ATTEMPT: ${{ github.run_attempt }}
          RAVRADAR_OUTCOME_EVENT_NAME: ${{ github.event_name }}
          RAVRADAR_OUTCOME_REF_IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          RAVRADAR_OUTCOME_GEOMETRY_PILOT: ${{ needs.validate-dispatch.outputs.geometry_v2_pilot == 'true' }}
          RAVRADAR_OUTCOME_GEOMETRY_NATIONAL: ${{ needs.validate-dispatch.outputs.geometry_v2_national == 'true' }}
          RAVRADAR_OUTCOME_JOB_VALIDATE_DISPATCH: ${{ needs.validate-dispatch.result }}
          RAVRADAR_OUTCOME_JOB_RECONCILE: ${{ needs.reconcile-operational-pending.result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_WRITER: ${{ needs.recover-operational-pages-target.result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_FINALIZER: ${{ needs.finalize-operational-pages-recovery.result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_GATE: ${{ needs.operational-recovery-gate.result }}
          RAVRADAR_OUTCOME_RECOVERY_ACTION: ${{ needs.reconcile-operational-pending.outputs.recovery_action }}
          RAVRADAR_OUTCOME_JOB_CURRENT_READINESS: ${{ needs.current-hour-readiness.result }}
          RAVRADAR_OUTCOME_JOB_TRIP_READINESS: ${{ needs.trip-storage-readiness.result }}
          RAVRADAR_OUTCOME_JOB_BUILD: ${{ needs.build-and-prepare.result }}
          RAVRADAR_OUTCOME_JOB_GEOMETRY_NATIONAL: ${{ needs.geometry-v2-national.result }}
          RAVRADAR_OUTCOME_JOB_GEOMETRY_PILOT: ${{ needs.geometry-v2-pilot.result }}
          RAVRADAR_OUTCOME_JOB_DEPLOY: ${{ needs.deploy-pages.result }}
          RAVRADAR_OUTCOME_CURRENT_READY: ${{ needs.current-hour-readiness.outputs.ready }}
          RAVRADAR_OUTCOME_TRIP_READY: ${{ needs.trip-storage-readiness.outputs.ready }}
          RAVRADAR_OUTCOME_PREFLIGHT_SHOULD_RUN: ${{ needs.build-and-prepare.outputs.preflight_should_run }}
          RAVRADAR_OUTCOME_OPERATIONAL_ACTION: ${{ needs.build-and-prepare.outputs.operational_action }}
          RAVRADAR_OUTCOME_SHOULD_DEPLOY: ${{ needs.build-and-prepare.outputs.should_deploy }}
          RAVRADAR_OUTCOME_WEATHER: ${{ needs.build-and-prepare.outputs.weather_outcome }}
          RAVRADAR_OUTCOME_FULL_VALIDATION: ${{ needs.build-and-prepare.outputs.full_validation_outcome }}
          RAVRADAR_OUTCOME_RELEASE_GATE: ${{ needs.build-and-prepare.outputs.release_gate_outcome }}
          RAVRADAR_OUTCOME_PAGES_BUILD: ${{ needs.build-and-prepare.outputs.pages_build_outcome }}
          RAVRADAR_OUTCOME_PAGES_PRIVACY: ${{ needs.build-and-prepare.outputs.pages_privacy_outcome }}
          RAVRADAR_OUTCOME_HANDOFF_UPLOAD: ${{ needs.build-and-prepare.outputs.handoff_upload_outcome }}
          RAVRADAR_OUTCOME_PAGES_CONFIGURE: ${{ needs.build-and-prepare.outputs.pages_configure_outcome }}
          RAVRADAR_OUTCOME_PAGES_UPLOAD: ${{ needs.build-and-prepare.outputs.pages_upload_outcome }}
          RAVRADAR_OUTCOME_ARTIFACT_BUILT: ${{ needs.build-and-prepare.outputs.artifact_built }}
          RAVRADAR_OUTCOME_DEPLOYMENT: ${{ needs.deploy-pages.outputs.deployment_outcome }}
          RAVRADAR_OUTCOME_PUBLIC_VERIFICATION: ${{ needs.deploy-pages.outputs.public_verification_outcome }}
          RAVRADAR_OUTCOME_DEPLOYED_VERIFIED: ${{ needs.deploy-pages.outputs.deployed_verified }}
        run: >-
          node scripts/production-workflow-outcome.mjs
          --output .workflow-outcome/production-outcome.json
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the payload-free terminal outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ravradar-production-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workflow-outcome/production-outcome.json
          retention-days: 30
          if-no-files-found: error

      - name: Preserve failed production as a red workflow
        if: always() && steps.classify.outputs.status == 'FAILED'
        shell: bash
        run: |
          echo "The exact production outcome is FAILED; see the payload-free outcome artifact." >&2
          exit 1

