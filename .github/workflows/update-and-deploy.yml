  geometry-v2-pilot:
    name: Run GeoDanmark geometry-v2 pilot
    needs: [validate-dispatch, current-hour-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && github.event_name == 'workflow_dispatch' && needs.validate-dispatch.outputs.geometry_v2_pilot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private geometry pilot
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark pilot dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI GRIB reader for private grid validation
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zone baseline before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for pilot input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and tombstones for pilot input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national geometry-v2 work plan from effective zones
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Run GeoDanmark geometry-v2 pilot
        run: python scripts/fetch-geodanmark-pilot.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze GeoDanmark source against centrally hydrated pilot zones
        run: python scripts/analyze-geodanmark-pilot.py

      - name: Audit official place names and migration classes
        run: python scripts/audit-pilot-place-names.py

      - name: Fetch official private fjord and nor exclusion polygons
        run: python scripts/fetch-official-water-exclusions.py

      - name: Assemble conservative private coastal-part proposals
        run: python scripts/assemble-geodanmark-coastal-parts.py

      - name: Build private Blåvand detail proposal
        run: python scripts/build-blaavand-detail-proposal.py

      - name: Build private official orthophoto review overlays
        run: python scripts/build-blaavand-ortho-review.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private Blåvand water points on native DMI grids
        run: python scripts/validate-blaavand-dmi-grid.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 600
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Build private score-neutral Blåvand weather shadow contract
        run: python scripts/build-blaavand-weather-shadow-contract.py

      - name: Validate private isolated Blåvand multi-step weather series
        run: python scripts/validate-blaavand-multi-step-series.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          BLAAVAND_MULTI_STEP_MAX_ASSETS: 6
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 900
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Validate private isolated Blåvand state and history replay
        run: node scripts/validate-blaavand-state-history.mjs

      - name: Build private score-neutral Blåvand UI review
        run: node scripts/build-blaavand-score-neutral-ui-review.mjs

      - name: Validate private Blåvand central admin roundtrip and rollback
        run: node scripts/validate-blaavand-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Render private GeoDanmark source review maps
        run: python scripts/render-geodanmark-pilot-maps.py

      - name: Upload private GeoDanmark pilot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-pilot-${{ github.run_id }}
          path: |
            .geometry-v2-work/
            data/diagnostics/geodanmark-pilot-report.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  copernicus-post-build-refresh:
    # Permanently retired: private provider progress now has one authenticated,
    # encrypted path inside the reusable build. Keeping this job disabled also
    # prevents old plaintext cache families from being refreshed accidentally.
    name: Retired plaintext Copernicus post-build cache
    needs: build-and-prepare
    if: ${{ !cancelled() && needs.build-and-prepare.result == 'success' && needs.build-and-prepare.outputs.preflight_should_run == 'true' && github.ref == 'refs/heads/main' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Require refresh HEAD to equal GITHUB_SHA and current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Restore exact private Copernicus post-build refresh input
        id: copernicus-refresh-input
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
            .cache/copernicus-current-targets.json
            .cache/copernicus-post-build-authoritative-targets.json
            .cache/copernicus-post-build-refresh-manifest.json
            .cache/weather-source-validation.json
          key: copernicus-current-post-build-input-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Verify exact private Copernicus post-build refresh input
        id: verified-copernicus-refresh-input
        shell: bash
        env:
          EXPECTED_CACHE_KEY: copernicus-current-post-build-input-v1-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          MATCHED_CACHE_KEY: ${{ steps.copernicus-refresh-input.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          manifest=.cache/copernicus-post-build-refresh-manifest.json
          test "$MATCHED_CACHE_KEY" = "$EXPECTED_CACHE_KEY"
          test "$(jq -er '.schemaVersion' "$manifest")" = "1"
          test "$(jq -er '.kind' "$manifest")" = "RAVRADAR_PRIVATE_COPERNICUS_POST_BUILD_REFRESH_INPUT"
          test "$(jq -er '.sourceHead' "$manifest")" = "$GITHUB_SHA"
          test "$(jq -er '.privacyClass' "$manifest")" = "PRIVATE_WEATHER_CACHE"
          test "$(jq -er '.containsPrivatePayload' "$manifest")" = "true"
          target_hour="$(jq -er '.productionReferenceAt | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$"))' "$manifest")"
          test "$(sha256sum .cache/copernicus-current-shadow.json | awk '{print $1}')" = "$(jq -er '.shadowSha256' "$manifest")"
          test "$(sha256sum .cache/copernicus-current-source-stage.json | awk '{print $1}')" = "$(jq -er '.sourceStageSha256' "$manifest")"
          test "$(sha256sum .cache/copernicus-current-targets.json | awk '{print $1}')" = "$(jq -er '.targetRegistrySha256' "$manifest")"
          test "$(sha256sum .cache/copernicus-post-build-authoritative-targets.json | awk '{print $1}')" = "$(jq -er '.authoritativeTargetsSha256' "$manifest")"
          test "$(sha256sum .cache/weather-source-validation.json | awk '{print $1}')" = "$(jq -er '.sourceProofSha256' "$manifest")"
          test "$(jq -er '.productionReferenceAt' .cache/copernicus-current-targets.json)" = "$target_hour"
          echo "target_hour=$target_hour" >> "$GITHUB_OUTPUT"

      - name: Restore shared private Copernicus donor bank for post-build maintenance
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-post-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-donor-bank-v1-${{ runner.os }}-

      - name: Revalidate packaged exact-content source proof before maintenance acquisition
        id: copernicus-refresh-source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require reusable exact-content source proof for advisory maintenance
        shell: bash
        env:
          SOURCE_GATE_REQUIRED: ${{ steps.copernicus-refresh-source-proof.outputs.required }}
        run: test "$SOURCE_GATE_REQUIRED" = "false"

      - name: Install private Copernicus maintenance dependency
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Refresh only the next-run private Copernicus cache
        id: copernicus-refresh
        continue-on-error: true
        timeout-minutes: 10
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: >-
          python scripts/run-copernicus-current-pilot-with-retry.py
          --attempts 1
          --timeout-seconds 540
          --backoff-seconds 0
          --
          --refresh-only
          --donor-bank .cache/copernicus-current-donor-bank.json
          --segment-journal .cache/copernicus-current-segment-journal.json
          --at "${{ steps.verified-copernicus-refresh-input.outputs.target_hour }}"
          --targets .cache/copernicus-current-targets.json
          --authoritative-targets .cache/copernicus-post-build-authoritative-targets.json

      - name: Reconfirm exact main before post-build donor bank cache save
        id: copernicus-refresh-bank-write-authority
        if: always() && steps.copernicus-refresh.outcome != 'cancelled' && steps.copernicus-refresh.outcome != 'skipped' && (steps.copernicus-refresh.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save post-build Copernicus donor bank before projection validation
        if: always() && steps.copernicus-refresh-bank-write-authority.outcome == 'success' && (steps.copernicus-refresh.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-post-build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate refreshed private Copernicus package without changing artifact outcome
        if: steps.copernicus-refresh.outcome == 'success' && steps.copernicus-refresh.outputs.maintenance_completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from lib.copernicus_current import file_sha256, load_targets, validate_shadow, validate_target_registry
          from lib.copernicus_current_source_stage import validate_reusable_source_stage

          registry = validate_target_registry(json.loads(Path('.cache/copernicus-current-targets.json').read_text(encoding='utf-8')))
          targets = load_targets(Path('.cache/copernicus-post-build-authoritative-targets.json'))
          identities = {row['partId']: row for row in targets}
          shadow_path = Path('.cache/copernicus-current-shadow.json')
          shadow = validate_shadow(json.loads(shadow_path.read_text(encoding='utf-8')), identities, require_collection=False)
          reference = datetime.fromisoformat(registry['productionReferenceAt'].replace('Z', '+00:00'))
          if reference.isoformat().replace('+00:00', 'Z') != registry['productionReferenceAt']:
              raise SystemExit('Non-canonical Copernicus refresh reference')
          validate_reusable_source_stage(
              json.loads(Path('.cache/copernicus-current-source-stage.json').read_text(encoding='utf-8')),
              registry=registry,
              shadow=shadow,
              target_identities=identities,
              shadow_sha256=file_sha256(shadow_path),
              allow_rebase=False,
          )
          PY

      - name: Reconfirm exact main immediately before refreshed Copernicus cache save
        id: copernicus-refresh-write-authority
        if: steps.copernicus-refresh.outcome == 'success' && steps.copernicus-refresh.outputs.maintenance_completed == 'true' && success()
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save successful post-build Copernicus maintenance under shared progress prefix
        if: steps.copernicus-refresh-write-authority.outcome == 'success' && steps.copernicus-refresh.outcome == 'success' && steps.copernicus-refresh.outputs.maintenance_completed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-post-build-refresh-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-pages:
    name: Deploy prepared Pages artifact through reusable workflow
    needs: build-and-prepare
    if: ${{ !cancelled() && needs.build-and-prepare.result == 'success' && github.ref == 'refs/heads/main' && needs.build-and-prepare.outputs.should_deploy == 'true' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages-deploy.yml
    with:
      active_deployment_id: ${{ needs.build-and-prepare.outputs.active_deployment_id }}
      central_version: ${{ needs.build-and-prepare.outputs.central_version }}
      code_only_repair: false
      deployment_model: ${{ needs.build-and-prepare.outputs.deployment_model }}
      integrated_implementation_closure_sha256: ${{ needs.build-and-prepare.outputs.integrated_implementation_closure_sha256 }}
      legacy_source_required: ${{ needs.build-and-prepare.outputs.legacy_source_required }}
      operational_action: ${{ needs.build-and-prepare.outputs.operational_action }}
      source_repair_id: ''
      exact_public_recovery: false
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  production-outcome:
    name: Classify exact weather production outcome
    needs:
      - validate-dispatch
      - operational-recovery-gate
      - current-hour-readiness
      - trip-storage-readiness
      - build-and-prepare
      - geometry-v2-national
      - geometry-v2-pilot
      - deploy-pages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      status: ${{ steps.classify.outputs.status }}
      reason_code: ${{ steps.classify.outputs.reason_code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Classify one privacy-safe machine-readable terminal outcome
        id: classify
        env:
          RAVRADAR_OUTCOME_SOURCE_HEAD: ${{ github.sha }}
          RAVRADAR_OUTCOME_RUN_ID: ${{ github.run_id }}
          RAVRADAR_OUTCOME_RUN_ATTEMPT: ${{ github.run_attempt }}
          RAVRADAR_OUTCOME_EVENT_NAME: ${{ github.event_name }}
          RAVRADAR_OUTCOME_REF_IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          RAVRADAR_OUTCOME_GEOMETRY_PILOT: ${{ needs.validate-dispatch.outputs.geometry_v2_pilot == 'true' }}
          RAVRADAR_OUTCOME_GEOMETRY_NATIONAL: ${{ needs.validate-dispatch.outputs.geometry_v2_national == 'true' }}
          RAVRADAR_OUTCOME_JOB_VALIDATE_DISPATCH: ${{ needs.validate-dispatch.result }}
          RAVRADAR_OUTCOME_JOB_RECONCILE: ${{ needs.operational-recovery-gate.outputs.reconcile_result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_WRITER: ${{ needs.operational-recovery-gate.outputs.writer_result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_FINALIZER: ${{ needs.operational-recovery-gate.outputs.finalize_result }}
          RAVRADAR_OUTCOME_JOB_RECOVERY_GATE: ${{ needs.operational-recovery-gate.result }}
          RAVRADAR_OUTCOME_RECOVERY_ACTION: ${{ needs.operational-recovery-gate.outputs.recovery_action }}
          RAVRADAR_OUTCOME_JOB_CURRENT_READINESS: ${{ needs.current-hour-readiness.result }}
          RAVRADAR_OUTCOME_JOB_TRIP_READINESS: ${{ needs.trip-storage-readiness.result }}
          RAVRADAR_OUTCOME_JOB_BUILD: ${{ needs.build-and-prepare.result }}
          RAVRADAR_OUTCOME_JOB_GEOMETRY_NATIONAL: ${{ needs.geometry-v2-national.result }}
          RAVRADAR_OUTCOME_JOB_GEOMETRY_PILOT: ${{ needs.geometry-v2-pilot.result }}
          RAVRADAR_OUTCOME_JOB_DEPLOY: ${{ needs.deploy-pages.result }}
          RAVRADAR_OUTCOME_CURRENT_READY: ${{ needs.current-hour-readiness.outputs.ready }}
          RAVRADAR_OUTCOME_TRIP_READY: ${{ needs.trip-storage-readiness.outputs.ready }}
          RAVRADAR_OUTCOME_PREFLIGHT_SHOULD_RUN: ${{ needs.build-and-prepare.outputs.preflight_should_run }}
          RAVRADAR_OUTCOME_OPERATIONAL_ACTION: ${{ needs.build-and-prepare.outputs.operational_action }}
          RAVRADAR_OUTCOME_SHOULD_DEPLOY: ${{ needs.build-and-prepare.outputs.should_deploy }}
          RAVRADAR_OUTCOME_WEATHER: ${{ needs.build-and-prepare.outputs.weather_outcome }}
          RAVRADAR_OUTCOME_FULL_VALIDATION: ${{ needs.build-and-prepare.outputs.full_validation_outcome }}
          RAVRADAR_OUTCOME_RELEASE_GATE: ${{ needs.build-and-prepare.outputs.release_gate_outcome }}
          RAVRADAR_OUTCOME_PAGES_BUILD: ${{ needs.build-and-prepare.outputs.pages_build_outcome }}
          RAVRADAR_OUTCOME_PAGES_PRIVACY: ${{ needs.build-and-prepare.outputs.pages_privacy_outcome }}
          RAVRADAR_OUTCOME_PAGES_ARTIFACT_SEAL: ${{ needs.build-and-prepare.outputs.pages_artifact_seal_outcome }}
          RAVRADAR_OUTCOME_HANDOFF_UPLOAD: ${{ needs.build-and-prepare.outputs.handoff_upload_outcome }}
          RAVRADAR_OUTCOME_CHECKPOINT_DISPOSITION: ${{ needs.build-and-prepare.outputs.checkpoint_disposition || needs.operational-recovery-gate.outputs.checkpoint_disposition }}
          RAVRADAR_OUTCOME_CHECKPOINT_DISPOSITION_SHA256: ${{ needs.build-and-prepare.outputs.checkpoint_disposition_sha256 || needs.operational-recovery-gate.outputs.checkpoint_disposition_sha256 }}
          RAVRADAR_OUTCOME_CHECKPOINT_DATASET_ID: ${{ needs.build-and-prepare.outputs.checkpoint_dataset_id || needs.operational-recovery-gate.outputs.checkpoint_dataset_id }}
          RAVRADAR_OUTCOME_CHECKPOINT_RUNTIME_AUDIT_SHA256: ${{ needs.build-and-prepare.outputs.checkpoint_runtime_audit_sha256 || needs.operational-recovery-gate.outputs.checkpoint_runtime_audit_sha256 }}
          RAVRADAR_OUTCOME_CHECKPOINT_BUILD: ${{ needs.build-and-prepare.outputs.checkpoint_build_outcome || needs.operational-recovery-gate.outputs.checkpoint_build_outcome }}
          RAVRADAR_OUTCOME_CHECKPOINT_SAVE: ${{ needs.build-and-prepare.outputs.checkpoint_save_outcome || needs.operational-recovery-gate.outputs.checkpoint_save_outcome }}
          RAVRADAR_OUTCOME_CHECKPOINT_PUBLISH: ${{ needs.build-and-prepare.outputs.checkpoint_publish_outcome || needs.operational-recovery-gate.outputs.checkpoint_publish_outcome }}
          RAVRADAR_OUTCOME_PAGES_CONFIGURE: ${{ needs.build-and-prepare.outputs.pages_configure_outcome }}
          RAVRADAR_OUTCOME_PAGES_UPLOAD: ${{ needs.build-and-prepare.outputs.pages_upload_outcome }}
          RAVRADAR_OUTCOME_ARTIFACT_BUILT: ${{ needs.build-and-prepare.outputs.artifact_built }}
          RAVRADAR_OUTCOME_DEPLOYMENT: ${{ needs.deploy-pages.outputs.deployment_outcome }}
          RAVRADAR_OUTCOME_PUBLIC_VERIFICATION: ${{ needs.deploy-pages.outputs.public_verification_outcome }}
          RAVRADAR_OUTCOME_DEPLOYED_VERIFIED: ${{ needs.deploy-pages.outputs.deployed_verified }}
        run: >-
          node scripts/production-workflow-outcome.mjs
          --output .workflow-outcome/production-outcome.json
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the payload-free terminal outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ravradar-production-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workflow-outcome/production-outcome.json
          retention-days: 30
          if-no-files-found: error

      - name: Preserve failed production as a red workflow
        if: always() && steps.classify.outputs.status == 'FAILED'
        shell: bash
        run: |
          echo "The exact production outcome is FAILED; see the payload-free outcome artifact." >&2
          exit 1
