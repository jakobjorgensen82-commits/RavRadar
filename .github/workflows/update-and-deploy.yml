name: Update weather and deploy RavRadar

on:
  schedule:
    # Ekstern cron-dispatch er den primære 15-minutterskadence.
    # GitHub schedule er reserve, hvis den eksterne dispatcher er forsinket eller nede.
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Kør hele vejrpipelinen, også når data stadig er friske"
        required: false
        default: false
        type: boolean
      extended_provider_bootstrap:
        description: "Giv DMI og Copernicus udvidet tid til at lukke reelle post-cutover-huller"
        required: false
        default: false
        type: boolean
      produce_weather_handoff:
        description: "Forsegl denne komplette almindelige vejrkørsel til første integrerede cutover"
        required: false
        default: false
        type: boolean
      produce_weather_handoff_confirmation:
        description: "Kun handoff-producent: skriv PRODUCE-VERIFIED-WEATHER-SOURCE-HANDOFF"
        required: false
        default: ""
        type: string
      geometry_v2_pilot:
        description: "Kør den private, score-neutrale GeoDanmark-pilot (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      geometry_v2_national:
        description: "Kør privat national GeoDanmark-kildeplan og -hentning (ingen produktion/deploy)"
        required: false
        default: false
        type: boolean
      ravscore_candidate_g_rollback_mode:
        description: "Candidate G er pensioneret; rollback kan ikke vælges"
        required: false
        default: none
        type: choice
        options:
          - none
      ravscore_candidate_g_rollback_confirmation:
        description: "Pensioneret; skal være tom"
        required: false
        default: ""
        type: string
      ravscore_integrated_first_cutover:
        description: "Første integrerede cutover efter kapacitetsgate (kun eksplicit manual)"
        required: false
        default: false
        type: boolean
      ravscore_integrated_first_cutover_confirmation:
        description: "Kun første cutover: skriv EXECUTE-INTEGRATED-RAVSCORE-FIRST-CUTOVER-AFTER-CAPACITY-GATE"
        required: false
        default: ""
        type: string
      ravscore_integrated_weather_handoff_run_id:
        description: "Kun første cutover: eksakt grønt 118h-preflight run-id på samme main-commit"
        required: false
        default: ""
        type: string
      ravscore_integrated_return:
        description: "Eksplicit samlet retur fra aktiv Candidate G til integreret RavScore"
        required: false
        default: false
        type: boolean
      ravscore_integrated_return_confirmation:
        description: "Kun retur: skriv EXECUTE-INTEGRATED-RAVSCORE-RETURN"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read

# GitHub starter den normale vejropdatering hvert 15. minut. En særskilt
# current-hour-gate låser den eksakte UTC-time. Den endelige Copernicus-målliste
# dannes først efter frisk DMI, så normal produktion aldrig kræver landsdækkende
# Copernicus-data som forhåndsbetingelse. Der må højst være én tung kørsel.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.geometry_v2_national == true && 'ravradar-geometry-v2-national' || github.event_name == 'workflow_dispatch' && inputs.geometry_v2_pilot == true && 'ravradar-geometry-v2-pilot' || 'ravradar-weather-production-v2' }}
  # RavScore transitions and normal weather share one production group. An
  # incoming push, schedule or force run must never cancel an atomic model
  # transition between preparation, full gates and Pages deployment. Queued
  # normal runs re-check freshness and become cheap no-ops as needed.
  queue: max
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate mutually exclusive manual operation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      force: ${{ steps.validated-dispatch.outputs.force || steps.dispatch-defaults.outputs.force }}
      extended_provider_bootstrap: ${{ steps.validated-dispatch.outputs.extended_provider_bootstrap || steps.dispatch-defaults.outputs.extended_provider_bootstrap }}
      produce_weather_handoff: ${{ steps.validated-dispatch.outputs.produce_weather_handoff || steps.dispatch-defaults.outputs.produce_weather_handoff }}
      produce_weather_handoff_confirmation: ${{ steps.validated-dispatch.outputs.produce_weather_handoff_confirmation || steps.dispatch-defaults.outputs.produce_weather_handoff_confirmation }}
      geometry_v2_pilot: ${{ steps.validated-dispatch.outputs.geometry_v2_pilot || steps.dispatch-defaults.outputs.geometry_v2_pilot }}
      geometry_v2_national: ${{ steps.validated-dispatch.outputs.geometry_v2_national || steps.dispatch-defaults.outputs.geometry_v2_national }}
      ravscore_candidate_g_rollback_mode: ${{ steps.validated-dispatch.outputs.ravscore_candidate_g_rollback_mode || steps.dispatch-defaults.outputs.ravscore_candidate_g_rollback_mode }}
      ravscore_candidate_g_rollback_confirmation: ${{ steps.validated-dispatch.outputs.ravscore_candidate_g_rollback_confirmation || steps.dispatch-defaults.outputs.ravscore_candidate_g_rollback_confirmation }}
      ravscore_integrated_first_cutover: ${{ steps.validated-dispatch.outputs.ravscore_integrated_first_cutover || steps.dispatch-defaults.outputs.ravscore_integrated_first_cutover }}
      ravscore_integrated_first_cutover_confirmation: ${{ steps.validated-dispatch.outputs.ravscore_integrated_first_cutover_confirmation || steps.dispatch-defaults.outputs.ravscore_integrated_first_cutover_confirmation }}
      ravscore_integrated_weather_handoff_run_id: ${{ steps.validated-dispatch.outputs.ravscore_integrated_weather_handoff_run_id || steps.dispatch-defaults.outputs.ravscore_integrated_weather_handoff_run_id }}
      ravscore_integrated_return: ${{ steps.validated-dispatch.outputs.ravscore_integrated_return || steps.dispatch-defaults.outputs.ravscore_integrated_return }}
      ravscore_integrated_return_confirmation: ${{ steps.validated-dispatch.outputs.ravscore_integrated_return_confirmation || steps.dispatch-defaults.outputs.ravscore_integrated_return_confirmation }}
    steps:
      - name: Publish safe non-manual dispatch defaults
        id: dispatch-defaults
        shell: bash
        run: |
          echo "force=false" >> "$GITHUB_OUTPUT"
          echo "extended_provider_bootstrap=false" >> "$GITHUB_OUTPUT"
          echo "produce_weather_handoff=false" >> "$GITHUB_OUTPUT"
          echo "produce_weather_handoff_confirmation=" >> "$GITHUB_OUTPUT"
          echo "geometry_v2_pilot=false" >> "$GITHUB_OUTPUT"
          echo "geometry_v2_national=false" >> "$GITHUB_OUTPUT"
          echo "ravscore_candidate_g_rollback_mode=none" >> "$GITHUB_OUTPUT"
          echo "ravscore_candidate_g_rollback_confirmation=" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_first_cutover=false" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_first_cutover_confirmation=" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_weather_handoff_run_id=" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_return=false" >> "$GITHUB_OUTPUT"
          echo "ravscore_integrated_return_confirmation=" >> "$GITHUB_OUTPUT"

      - name: Checkout manual dispatch contract
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
      - name: Set up Node for manual dispatch contract
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reject ambiguous or insufficiently authorized dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          EXTENDED_PROVIDER_BOOTSTRAP: ${{ inputs.extended_provider_bootstrap }}
          PRODUCE_WEATHER_HANDOFF: ${{ inputs.produce_weather_handoff }}
          PRODUCE_WEATHER_HANDOFF_CONFIRMATION: ${{ inputs.produce_weather_handoff_confirmation }}
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          ROLLBACK_MODE: ${{ inputs.ravscore_candidate_g_rollback_mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
          FIRST_CUTOVER_REQUESTED: ${{ inputs.ravscore_integrated_first_cutover }}
          FIRST_CUTOVER_CONFIRMATION: ${{ inputs.ravscore_integrated_first_cutover_confirmation }}
          WEATHER_HANDOFF_RUN_ID: ${{ inputs.ravscore_integrated_weather_handoff_run_id }}
          RETURN_REQUESTED: ${{ inputs.ravscore_integrated_return }}
          RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}
        run: |
          set -euo pipefail
          node scripts/validate-ravscore-dispatch.mjs
          case "$ROLLBACK_MODE" in none) ;; *) echo "Candidate G rollback is retired." >&2; exit 1 ;; esac
          geometry=false
          if [ "$GEOMETRY_PILOT" = "true" ] || [ "$GEOMETRY_NATIONAL" = "true" ]; then geometry=true; fi
          operation_count=0
          if [ "$FORCE" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$PRODUCE_WEATHER_HANDOFF" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$GEOMETRY_PILOT" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$GEOMETRY_NATIONAL" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$ROLLBACK_MODE" != "none" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$RETURN_REQUESTED" = "true" ]; then operation_count=$((operation_count + 1)); fi
          if [ "$operation_count" -gt 1 ]; then
            echo "Exactly one force, weather handoff, geometry, rollback, first cutover or return operation may be dispatched." >&2
            exit 1
          fi
          if [ "$EXTENDED_PROVIDER_BOOTSTRAP" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "Extended provider bootstrap requires an explicit force run." >&2
            exit 1
          fi
          if [ "$EXTENDED_PROVIDER_BOOTSTRAP" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Extended provider bootstrap is allowed only on main." >&2
            exit 1
          fi
          if { [ "$PRODUCE_WEATHER_HANDOFF" = "true" ] || [ "$ROLLBACK_MODE" != "none" ] || [ "$FIRST_CUTOVER_REQUESTED" = "true" ] || [ "$RETURN_REQUESTED" = "true" ]; } && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "RavScore transitions are allowed only on main." >&2
            exit 1
          fi
          if [ "$PRODUCE_WEATHER_HANDOFF" = "true" ] && [ "$PRODUCE_WEATHER_HANDOFF_CONFIRMATION" != "PRODUCE-VERIFIED-WEATHER-SOURCE-HANDOFF" ]; then
            echo "Verified weather handoff producer confirmation is not exact." >&2
            exit 1
          fi
          if [ "$PRODUCE_WEATHER_HANDOFF" != "true" ] && [ -n "$PRODUCE_WEATHER_HANDOFF_CONFIRMATION" ]; then
            echo "Verified weather handoff producer confirmation requires its explicit producer flag." >&2
            exit 1
          fi
          if [ "$ROLLBACK_MODE" = "execute" ] && [ "$ROLLBACK_CONFIRMATION" != "EXECUTE-CANDIDATE-G-ROLLBACK" ]; then
            echo "Candidate G execute confirmation is not exact."
            exit 1
          fi
          if [ "$ROLLBACK_MODE" != "execute" ] && [ -n "$ROLLBACK_CONFIRMATION" ]; then
            echo "Candidate G execute confirmation is accepted only by execute mode." >&2
            exit 1
          fi
          if [ "$FIRST_CUTOVER_REQUESTED" = "true" ] && [ "$FIRST_CUTOVER_CONFIRMATION" != "EXECUTE-INTEGRATED-RAVSCORE-FIRST-CUTOVER-AFTER-CAPACITY-GATE" ]; then
            echo "Integrated first cutover confirmation is not exact."
            exit 1
          fi
          if [ "$FIRST_CUTOVER_REQUESTED" != "true" ] && [ -n "$FIRST_CUTOVER_CONFIRMATION" ]; then
            echo "Integrated first cutover confirmation is accepted only by an integrated first cutover." >&2
            exit 1
          fi
          if [ "$FIRST_CUTOVER_REQUESTED" = "true" ]; then
            if [[ ! "$WEATHER_HANDOFF_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
              echo "Verified weather handoff run id is malformed." >&2
              exit 1
            fi
          elif [ -n "$WEATHER_HANDOFF_RUN_ID" ]; then
            echo "A verified weather handoff is accepted only by an integrated first cutover." >&2
            exit 1
          fi
          if [ "$RETURN_REQUESTED" = "true" ] && [ "$RETURN_CONFIRMATION" != "EXECUTE-INTEGRATED-RAVSCORE-RETURN" ]; then
            echo "Integrated return confirmation is not exact."
            exit 1
          fi
          if [ "$RETURN_REQUESTED" != "true" ] && [ -n "$RETURN_CONFIRMATION" ]; then
            echo "Integrated return confirmation is accepted only by an integrated return." >&2
            exit 1
          fi

      - name: Publish validated manual dispatch values
        id: validated-dispatch
        if: success() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          EXTENDED_PROVIDER_BOOTSTRAP: ${{ inputs.extended_provider_bootstrap }}
          PRODUCE_WEATHER_HANDOFF: ${{ inputs.produce_weather_handoff }}
          PRODUCE_WEATHER_HANDOFF_CONFIRMATION: ${{ inputs.produce_weather_handoff_confirmation }}
          GEOMETRY_PILOT: ${{ inputs.geometry_v2_pilot }}
          GEOMETRY_NATIONAL: ${{ inputs.geometry_v2_national }}
          ROLLBACK_MODE: ${{ inputs.ravscore_candidate_g_rollback_mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.ravscore_candidate_g_rollback_confirmation }}
          FIRST_CUTOVER_REQUESTED: ${{ inputs.ravscore_integrated_first_cutover }}
          FIRST_CUTOVER_CONFIRMATION: ${{ inputs.ravscore_integrated_first_cutover_confirmation }}
          WEATHER_HANDOFF_RUN_ID: ${{ inputs.ravscore_integrated_weather_handoff_run_id }}
          RETURN_REQUESTED: ${{ inputs.ravscore_integrated_return }}
          RETURN_CONFIRMATION: ${{ inputs.ravscore_integrated_return_confirmation }}
        run: |
          printf '%s\n' "force=$FORCE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "extended_provider_bootstrap=$EXTENDED_PROVIDER_BOOTSTRAP" >> "$GITHUB_OUTPUT"
          printf '%s\n' "produce_weather_handoff=$PRODUCE_WEATHER_HANDOFF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "produce_weather_handoff_confirmation=$PRODUCE_WEATHER_HANDOFF_CONFIRMATION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "geometry_v2_pilot=$GEOMETRY_PILOT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "geometry_v2_national=$GEOMETRY_NATIONAL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_candidate_g_rollback_mode=$ROLLBACK_MODE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_candidate_g_rollback_confirmation=$ROLLBACK_CONFIRMATION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_first_cutover=$FIRST_CUTOVER_REQUESTED" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_first_cutover_confirmation=$FIRST_CUTOVER_CONFIRMATION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_weather_handoff_run_id=$WEATHER_HANDOFF_RUN_ID" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_return=$RETURN_REQUESTED" >> "$GITHUB_OUTPUT"
          printf '%s\n' "ravscore_integrated_return_confirmation=$RETURN_CONFIRMATION" >> "$GITHUB_OUTPUT"

  operational-recovery-gate:
    name: Require terminal operational recovery before production
    needs: validate-dispatch
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-operational-reentry.yml
    with:
      geometry_only: ${{ needs.validate-dispatch.outputs.geometry_v2_pilot == 'true' || needs.validate-dispatch.outputs.geometry_v2_national == 'true' }}
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

  current-hour-readiness:
    name: Check timed current-hour readiness
    needs: operational-recovery-gate
    if: ${{ !cancelled() && needs.operational-recovery-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      target_hour: ${{ steps.cache-state.outputs.target_hour }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Inspect timed UTC hour without exposing raw vectors
        if: github.event_name != 'workflow_dispatch' || (inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true)
        id: cache-state
        run: python3 scripts/check-copernicus-current-hour.py --invalid-cache-is-absent --github-output "$GITHUB_OUTPUT"

      - name: Decide whether production may start
        id: readiness
        shell: bash
        env:
          CHECK_CURRENT_HOUR: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force != true && inputs.geometry_v2_pilot != true && inputs.geometry_v2_national != true) }}
          CURRENT_HOUR_PRESENT: ${{ steps.cache-state.outputs.current_hour_present }}
        run: |
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Production trigger may continue."
          if [ "$CHECK_CURRENT_HOUR" = "true" ] && [ "$CURRENT_HOUR_PRESENT" != "true" ]; then
            echo "::notice title=Targeted supplement pending::The exact Copernicus supplement will be resolved after fresh DMI gap selection; nationwide Copernicus coverage is not required."
          fi

  trip-storage-readiness:
    name: Check exact-head D1 trip-storage readiness
    needs: current-hour-readiness
    if: ${{ !cancelled() && needs.current-hour-readiness.result == 'success' && needs.current-hour-readiness.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Determine exact-head D1 trip-storage readiness without failing the run
        id: readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPECTED_TRIP_STORAGE_MODE: d1
          CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
          TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}
        run: |
          set -uo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if ! release_version="$(jq -er '.version | select(type == "string" and test("^4\\.0\\.[0-9]+$"))' version.json 2>/dev/null)"; then
            echo "::notice title=Pages production deferred::version.json could not be validated; this run remains a green no-op."
            exit 0
          fi
          requires_exact_d1=false
          if [ "$release_version" = "4.0.311" ] || [ "$release_version" = "4.0.312" ] || [ "$release_version" = "4.0.313" ] || [ "$release_version" = "4.0.314" ]; then
            requires_exact_d1=true
          fi
          if [ "$requires_exact_d1" != "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "The historical 4.0.311-4.0.314 exact-D1 release interlock is not required for version $release_version."
            exit 0
          fi
          if ! runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-trip-storage.yml/runs?branch=main&status=completed&event=workflow_dispatch&per_page=100")"; then
            echo "::notice title=Pages production deferred::Could not verify the exact-head D1 trip-storage deployment; this run remains a green no-op."
            exit 0
          fi
          if ! matching_count="$(jq --arg sha "$EXPECTED_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event == "workflow_dispatch" and .display_title == "Deploy RavRadar trip storage [d1]")] | length' <<< "$runs_json")"; then
            echo "::notice title=Pages production deferred::The D1 readiness response could not be validated; this run remains a green no-op."
            exit 0
          fi
          if [ "$matching_count" -lt 1 ]; then
            echo "::notice title=Pages production deferred::Deploy and verify trip storage in D1 mode on this exact main head, then dispatch normal production."
            exit 0
          fi
          if ! node scripts/verify-trip-storage-edge.mjs; then
            echo "::notice title=Pages production deferred::The live Edge contract is not the required Candidate G D1 mode; this run remains a green no-op."
            exit 0
          fi
          if ! node scripts/verify-cloudflare-trip-gateway.mjs; then
            echo "::notice title=Pages production deferred::The live Worker/registry contract could not be attested; this run remains a green no-op."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "The exact source head and the live Edge/Worker backend have the required D1 contract."

  build-and-prepare:
    name: Build and prepare weather production through reusable workflow
    needs: [validate-dispatch, current-hour-readiness, trip-storage-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && needs.trip-storage-readiness.result == 'success' && needs.validate-dispatch.outputs.geometry_v2_pilot != 'true' && needs.validate-dispatch.outputs.geometry_v2_national != 'true' && needs.current-hour-readiness.outputs.ready == 'true' && needs.trip-storage-readiness.outputs.ready == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/reusable-weather-build.yml
    with:
      production_target_hour: ${{ needs.current-hour-readiness.outputs.target_hour }}
      force: ${{ needs.validate-dispatch.outputs.force == 'true' }}
      extended_provider_bootstrap: ${{ needs.validate-dispatch.outputs.extended_provider_bootstrap == 'true' }}
      quick_confirmation: false
      quick_progress_source: ''
      produce_weather_handoff: ${{ needs.validate-dispatch.outputs.produce_weather_handoff == 'true' }}
      produce_weather_handoff_confirmation: ${{ needs.validate-dispatch.outputs.produce_weather_handoff_confirmation }}
      ravscore_candidate_g_rollback_mode: ${{ needs.validate-dispatch.outputs.ravscore_candidate_g_rollback_mode }}
      ravscore_candidate_g_rollback_confirmation: ${{ needs.validate-dispatch.outputs.ravscore_candidate_g_rollback_confirmation }}
      ravscore_integrated_first_cutover: ${{ needs.validate-dispatch.outputs.ravscore_integrated_first_cutover == 'true' }}
      ravscore_integrated_first_cutover_confirmation: ${{ needs.validate-dispatch.outputs.ravscore_integrated_first_cutover_confirmation }}
      ravscore_integrated_weather_handoff_run_id: ${{ needs.validate-dispatch.outputs.ravscore_integrated_weather_handoff_run_id }}
      ravscore_integrated_return: ${{ needs.validate-dispatch.outputs.ravscore_integrated_return == 'true' }}
      ravscore_integrated_return_confirmation: ${{ needs.validate-dispatch.outputs.ravscore_integrated_return_confirmation }}
    secrets:
      RAVRADAR_R2_ACCOUNT_ID: ${{ secrets.RAVRADAR_R2_ACCOUNT_ID }}
      CLOUDFLARE_TRIP_GATEWAY_URL: ${{ secrets.CLOUDFLARE_TRIP_GATEWAY_URL }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
      RAVRADAR_R2_ACCESS_KEY_ID: ${{ secrets.RAVRADAR_R2_ACCESS_KEY_ID }}
      RAVRADAR_R2_SECRET_ACCESS_KEY: ${{ secrets.RAVRADAR_R2_SECRET_ACCESS_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TRIP_GATEWAY_SHARED_SECRET: ${{ secrets.TRIP_GATEWAY_SHARED_SECRET }}

  geometry-v2-national:
    name: Acquire private national GeoDanmark geometry-v2 source
    needs: [validate-dispatch, current-hour-readiness]
    if: ${{ !cancelled() && needs.validate-dispatch.result == 'success' && needs.current-hour-readiness.result == 'success' && github.event_name == 'workflow_dispatch' && needs.validate-dispatch.outputs.geometry_v2_national == 'true' && needs.validate-dispatch.outputs.geometry_v2_pilot != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private national geometry acquisition
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark geometry dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI native-grid reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zones before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for national input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved geometry and tombstones to national input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national read-only work plan
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Fetch and deduplicate private national official source layers
        run: python scripts/fetch-geodanmark-national.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private national source completeness and safety
        run: python scripts/validate-geodanmark-national-source.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze indexed national source against all effective zones
        run: python scripts/analyze-geodanmark-national.py

      - name: Fetch official national fjord and nor exclusions
        run: python scripts/fetch-national-water-exclusions.py

      - name: Analyze national coastal topology and exclusion evidence
        run: python scripts/analyze-national-coastal-topology.py

      - name: Validate national topology audit completeness and isolation
        run: python scripts/validate-national-topology-audit.py

      - name: Audit precise public-coast coverage under stable main zones
        run: python scripts/audit-national-public-coast-coverage.py

      - name: Build private national coastal part review proposals
        run: python scripts/build-national-coastal-parts.py

      - name: Validate private national coastal parts and no invented links
        run: python scripts/validate-national-coastal-parts.py

      - name: Fetch official place-name candidates for actual national coastal parts
        run: python scripts/audit-national-coastal-part-names.py

      - name: Validate official place-name candidates without automatic naming
        run: python scripts/validate-national-coastal-part-names.py

      - name: Build private locality partitions for flagged national coastal parts
        run: python scripts/build-national-locality-partitions.py

      - name: Validate locality partitions remain on source geometry
        run: python scripts/validate-national-locality-partitions.py

      - name: Build private official name suggestions for final local coastal parts
        run: python scripts/build-national-local-part-names.py

      - name: Validate final local part names remain review-only and evidence-backed
        run: python scripts/validate-national-local-part-names.py

      - name: Build private land and water point pairs from opposite-side evidence
        run: python scripts/build-national-local-part-points.py

      - name: Apply independent 10 m land and water side evidence
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-initial-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/national-local-part-point-pairs.json
          --output .geometry-v2-work/national-local-part-point-pairs.json

      - name: Validate ambiguous point pairs remain fail-closed
        run: python scripts/validate-national-local-part-points.py

      - name: Validate all private water candidates on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py

      - name: Build isolated private weather identities for validated coastal parts
        run: python scripts/build-national-weather-shadow-contract.py

      - name: Validate isolated private national multi-step weather series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py

      - name: Validate isolated private national state and history
        run: node scripts/validate-national-state-history.mjs

      - name: Validate isolated private native wind series for coastal parts
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py

      - name: Validate private national local-part shadow score and coverage
        run: node scripts/validate-national-shadow-score.mjs

      - name: Build private national score-neutral owner review
        run: node scripts/build-national-score-neutral-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-coastal-zone-review

      - name: Fetch all official water areas for private inner-water follow-up
        run: python scripts/fetch-national-official-waters.py --output .geometry-v2-work/national-official-waters.geojson

      - name: Audit national inner-water candidates against owner decisions
        run: python scripts/audit-national-inner-water-candidates.py --work .geometry-v2-work --owner-review data/geometry-v2/national-owner-coastal-review-2026-08-11.json

      - name: Audit physical duplicates of owner-reviewed parts
        run: python scripts/audit-national-owner-review-duplicates.py --work .geometry-v2-work --output .geometry-v2-work/national-owner-review-duplicate-audit.json

      - name: Verify exact official fjord and nor overlap
        run: python scripts/audit-national-official-inner-water-overlap.py --work .geometry-v2-work --output .owner-review/national-official-inner-water-overlap-audit.json

      - name: Build private owner correction proposal
        run: python scripts/apply-national-owner-coastal-review.py --work .geometry-v2-work --duplicate-audit .geometry-v2-work/national-owner-review-duplicate-audit.json --output-dir .owner-review/national-owner-corrections

      - name: Build private visual control of owner corrections
        run: node scripts/build-national-owner-correction-review.mjs --proposal .owner-review/national-owner-corrections/owner-correction-proposal.geojson --output .owner-review/national-owner-corrections/index.html

      - name: Build targeted private inner-water follow-up review
        run: node scripts/build-national-inner-water-owner-review.mjs --work .geometry-v2-work --output-dir .owner-review/national-inner-water-follow-up

      - name: Assemble reviewed coast exactly once across neighboring zones
        run: python scripts/assemble-national-owner-final-coast.py --work .geometry-v2-work --corrections .owner-review/national-owner-corrections --zones data/zones.geojson --output-dir .owner-review/national-owner-final

      - name: Rebuild final land and water points after owner corrections and deduplication
        run: python scripts/build-national-local-part-points.py --work-dir .geometry-v2-work --zones data/zones.geojson --final-coast .owner-review/national-owner-final/national-owner-final-coast.geojson --final-names .owner-review/national-owner-final/national-owner-final-part-names.json --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Apply independent 10 m land and water side evidence to final points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-final-land-water-evidence-2026-08-14.json
          --input .owner-review/national-owner-final/national-local-part-point-pairs.json
          --output .owner-review/national-owner-final/national-local-part-point-pairs.json

      - name: Validate final land and water point contract
        run: python scripts/validate-national-local-part-points.py --work-dir .owner-review/national-owner-final

      - name: Validate final water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-dmi-grid.py --input .owner-review/national-owner-final/national-local-part-point-pairs.json --report .owner-review/national-owner-final/national-local-part-dmi-grid.json

      - name: Build final isolated weather identities
        run: python scripts/build-national-weather-shadow-contract.py --points .owner-review/national-owner-final/national-local-part-point-pairs.json --grid .owner-review/national-owner-final/national-local-part-dmi-grid.json --output .owner-review/national-owner-final/national-weather-shadow-contract.json

      - name: Validate final native marine series
        env:
          NATIONAL_MULTI_STEP_MAX_ASSETS: "4"
        run: python scripts/validate-national-multi-step-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-multi-step-series-validation.json --state-input .cache/national-final-state-replay-input.json --score-input .cache/national-final-shadow-score-marine-input.json

      - name: Validate final state and history isolation
        run: node scripts/validate-national-state-history.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --series .owner-review/national-owner-final/national-multi-step-series-validation.json --input .cache/national-final-state-replay-input.json --output .owner-review/national-owner-final/national-state-history-validation.json

      - name: Validate final native wind series
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: python scripts/validate-national-local-part-wind-series.py --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --report .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json

      - name: Validate final score-neutral shadow score
        run: node scripts/validate-national-shadow-score.mjs --contract .owner-review/national-owner-final/national-weather-shadow-contract.json --multi .owner-review/national-owner-final/national-multi-step-series-validation.json --state .owner-review/national-owner-final/national-state-history-validation.json --wind .owner-review/national-owner-final/national-local-part-wind-series.json --marine-input .cache/national-final-shadow-score-marine-input.json --wind-input .cache/national-final-shadow-score-wind-input.json --output .owner-review/national-owner-final/national-shadow-score-validation.json

      - name: Validate private national central admin roundtrip and rollback
        run: node scripts/validate-national-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build private fallback-zone recovery from the fetched official coast
        run: >-
          python scripts/build-fallback-zone-recovery-review.py
          --official .geometry-v2-work/national-source/national-Kyst.geojson
          --output .owner-review/fallback-zone-recovery/index.html
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.geojson
          --bundle .geometry-v2-work/fallback-zone-recovery-candidate.json
          --report .geometry-v2-work/fallback-zone-recovery-report.json

      - name: Build private fallback-zone land and water points
        run: >-
          python scripts/build-approved-public-coast-points.py
          --candidate .geometry-v2-work/fallback-zone-recovery-candidate.json
          --evidence data/live/coastal-parts-v2.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Apply exact independent land and water evidence to fallback points
        run: >-
          python scripts/apply-national-land-water-corrections.py
          --require-exact-evidence
          --decisions data/geometry-v2/national-private-fallback-land-water-evidence-2026-08-14.json
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --output .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --candidate-input .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json
          --candidate-output .geometry-v2-work/fallback-zone-recovery-candidate-with-points.json

      - name: Validate fallback geometry ownership, point pairs and zero overlap
        run: python scripts/validate-fallback-zone-recovery.py

      - name: Validate fallback water points on native DMI grids
        env:
          DMI_BULK_MAX_RUNTIME_SECONDS: "3000"
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input .geometry-v2-work/fallback-zone-recovery-point-pairs.json
          --report .geometry-v2-work/fallback-zone-recovery-dmi-grid.json

      - name: Upload compact national geometry-v2 QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
