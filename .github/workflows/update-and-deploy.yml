name: Update weather and deploy RavRadar

on:
  workflow_dispatch:
  schedule:
    # To-faset DMI-opbygning: først havdata, derefter vind og bølger.
    # Open-Meteo holder alle zoner udfyldt, mens DMI-cachen varmes op.
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ravradar-pages
  # En igangværende vejrkørsel må ikke afbrydes før dens cache er gemt.
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore persistent weather state
        id: weather-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live/dmi-forecast-cache.json
            data/live/dmi-bulk-cache.json
            /tmp/ravradar-dmi-grib
            data/live/conditions.json
            data/live/weather-health.json
          key: ravradar-weather-${{ github.run_id }}
          restore-keys: |
            ravradar-weather-

      - name: Set up Python for DMI GRIB processing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DMI GRIB reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests eccodes

      - name: Validate project
        run: npm run validate

      - name: Update DMI bulk model cache
        id: dmi-bulk
        continue-on-error: true
        timeout-minutes: 14
        run: python scripts/update-dmi-bulk.py
        env:
          DMI_BULK_HOURS: 120
          DMI_BULK_MAX_DOWNLOAD_MB: 1400
          DMI_BULK_MAX_RUNTIME_SECONDS: 780
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 130
          DMI_BULK_REQUEST_TIMEOUT_SECONDS: 90
          DMI_BULK_REFRESH_MINUTES: 60
          DMI_BULK_RAW_DIR: /tmp/ravradar-dmi-grib
          WEATHER_USER_AGENT: "RavRadar/3.1.17 (${{ github.server_url }}/${{ github.repository }})"

      - name: Update central weather cache
        id: weather
        continue-on-error: true
        timeout-minutes: 17
        run: npm run update:weather
        env:
          DMI_MAX_RETRIES: 0
          DMI_REQUEST_GAP_MS: 12000
          DMI_REQUEST_CONCURRENCY: 1
          DMI_LIVE_ZONE_BUDGET: 4
          DMI_REQUEST_BUDGET: 6
          DMI_CACHE_REFRESH_BELOW_HOURS: 24
          DMI_SCHEDULE_INTERVAL_MINUTES: 10
          DMI_OBSERVATION_INTERVAL_MINUTES: 60
          DMI_DEPLOYED_CACHE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/live/dmi-forecast-cache.json"
          WEATHER_REQUEST_TIMEOUT_MS: 25000
          WEATHER_USER_AGENT: "RavRadar/3.1.17 (${{ github.server_url }}/${{ github.repository }})"

      - name: Validate updated weather cache
        if: steps.weather.outcome == 'success'
        run: npm run validate:data

      - name: Report cached fallback
        if: steps.weather.outcome != 'success'
        run: echo "Weather updater failed or timed out. Deploying the last valid cached conditions.json."

      - name: Save persistent weather state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/live/dmi-forecast-cache.json
            data/live/dmi-bulk-cache.json
            /tmp/ravradar-dmi-grib
            data/live/conditions.json
            data/live/weather-health.json
          key: ravradar-weather-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
