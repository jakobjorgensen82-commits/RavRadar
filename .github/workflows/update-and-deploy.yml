      - name: Upload private national geometry-v2 source artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-national-${{ github.run_id }}
          path: .geometry-v2-work/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  ravscore-active-shadow:
    name: Audit fallback-compatible 210/673 Candidate G public shadow
    needs: current-hour-readiness
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'none' && inputs.ravscore_active_shadow == true && inputs.geometry_v2_national != true && inputs.geometry_v2_pilot != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js for Candidate G public shadow audit
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download read-only fallback-compatible 210/673 runtime
        run: |
          mkdir -p .cache .geometry-v2-work
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 \
            --output .cache/active-public-condition-details.json \
            https://jakobjorgensen82-commits.github.io/RavRadar/data/live/public-condition-details.json

      - name: Audit centrally derived Candidate G state and score
        run: node scripts/audit-ravscore-candidate-g-public-shadow.mjs

      - name: Upload dataminimized Candidate G public shadow audit
        uses: actions/upload-artifact@v7
        with:
          name: ravradar-active-ravscore-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .geometry-v2-work/candidate-g-public-shadow-audit.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  geometry-v2-pilot:
    name: Run GeoDanmark geometry-v2 pilot
    needs: current-hour-readiness
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_g_gap_reconstruction_mode == 'none' && inputs.geometry_v2_pilot == true && inputs.ravscore_active_shadow != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for private geometry pilot
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install free GeoDanmark pilot dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-geometry.txt

      - name: Install DMI GRIB reader for private grid validation
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Snapshot repository zone baseline before central hydration
        run: |
          mkdir -p .geometry-v2-work
          cp data/zones.geojson .geometry-v2-work/repository-zone-baseline.geojson

      - name: Sync centrally saved admin configuration for pilot input
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone geometry and tombstones for pilot input
        run: python scripts/apply-central-zone-reviews.py

      - name: Build national geometry-v2 work plan from effective zones
        run: >-
          python scripts/build-national-geometry-v2-plan.py
          --baseline-zones .geometry-v2-work/repository-zone-baseline.geojson

      - name: Run GeoDanmark geometry-v2 pilot
        run: python scripts/fetch-geodanmark-pilot.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Analyze GeoDanmark source against centrally hydrated pilot zones
        run: python scripts/analyze-geodanmark-pilot.py

      - name: Audit official place names and migration classes
        run: python scripts/audit-pilot-place-names.py

      - name: Fetch official private fjord and nor exclusion polygons
        run: python scripts/fetch-official-water-exclusions.py

      - name: Assemble conservative private coastal-part proposals
        run: python scripts/assemble-geodanmark-coastal-parts.py

      - name: Build private Blåvand detail proposal
        run: python scripts/build-blaavand-detail-proposal.py

      - name: Build private official orthophoto review overlays
        run: python scripts/build-blaavand-ortho-review.py
        env:
          DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}

      - name: Validate private Blåvand water points on native DMI grids
        run: python scripts/validate-blaavand-dmi-grid.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 600
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Build private score-neutral Blåvand weather shadow contract
        run: python scripts/build-blaavand-weather-shadow-contract.py

      - name: Validate private isolated Blåvand multi-step weather series
        run: python scripts/validate-blaavand-multi-step-series.py
        env:
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}
          DMI_BULK_HOURS: 24
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 8
          BLAAVAND_MULTI_STEP_MAX_ASSETS: 6
          DMI_BULK_MAX_DOWNLOAD_MB: 512
          DMI_BULK_MAX_RUNTIME_SECONDS: 900
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 60
          DMI_BULK_RAW_DIR: .cache/dmi-grid-validation

      - name: Validate private isolated Blåvand state and history replay
        run: node scripts/validate-blaavand-state-history.mjs

      - name: Build private score-neutral Blåvand UI review
        run: node scripts/build-blaavand-score-neutral-ui-review.mjs

      - name: Validate private Blåvand central admin roundtrip and rollback
        run: node scripts/validate-blaavand-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Render private GeoDanmark source review maps
        run: python scripts/render-geodanmark-pilot-maps.py

      - name: Upload private GeoDanmark pilot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geodanmark-geometry-v2-pilot-${{ github.run_id }}
          path: |
            .geometry-v2-work/
            data/diagnostics/geodanmark-pilot-report.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  deploy-pages:
    name: Deploy prepared Pages artifact
    needs: build-and-prepare
    if: github.ref == 'refs/heads/main' && needs.build-and-prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.integrated-normalization-deployment.outputs.page_url || steps.deployment.outputs.page_url }}
    env:
      RAVRADAR_OPERATIONAL_HANDOFF: /tmp/ravradar-operational-handoff
      RAVRADAR_PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download sealed operational handoff
        uses: actions/download-artifact@v8
        with:
          name: ravscore-operational-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RAVRADAR_OPERATIONAL_HANDOFF }}

      - name: Verify exact privacy-safe handoff identity
        shell: bash
        run: |
          test "$(jq -r '.schemaVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "ravscore-operational-deploy-handoff-v1"
          test "$(jq -r '.sourceHead' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "$GITHUB_SHA"
          test "$(jq -r '.action' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ needs.build-and-prepare.outputs.operational_action }}"
          test "$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "${{ needs.build-and-prepare.outputs.central_version }}"
          test "$(jq -r '.privatePayloadIncluded' "$RAVRADAR_OPERATIONAL_HANDOFF/handoff.json")" = "false"

      - name: Reconfirm prepared SHA before any activation CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Observe and seal the currently public source manifest
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-execute' || needs.build-and-prepare.outputs.operational_action == 'integrated-return' || needs.build-and-prepare.outputs.operational_action == 'integrated-cutover' || needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-source=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          expected_schema="4"
          if [ "${{ needs.build-and-prepare.outputs.operational_action }}" = "candidate-normalization" ]; then
            expected_schema="2"
          fi
          test "$(jq -r '.schemaVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json")" = "$expected_schema"
          test "$(jq -r '.complete' "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json")" = "true"
          source_digest="$(sha256sum "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" | cut -d' ' -f1)"
          printf 'public-source-%s\n' "${source_digest:0:24}" \
            > "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt"

      - name: Verify the complete currently public source model before begin CAS
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-execute' || needs.build-and-prepare.outputs.operational_action == 'integrated-return' || needs.build-and-prepare.outputs.operational_action == 'integrated-cutover' || needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        shell: bash
        run: |
          case "${{ needs.build-and-prepare.outputs.operational_action }}" in
            candidate-execute) source_model="integrated" ;;
            integrated-return|integrated-cutover) source_model="candidate-g" ;;
            candidate-normalization)
              node scripts/verify-legacy-candidate-g-source.mjs verify \
                --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
                --source-head "$GITHUB_SHA" \
                --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
                --attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json" \
                --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
              exit 0
              ;;
            *) exit 1 ;;
          esac
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
            --source-head "$GITHUB_SHA" \
            --model "$source_model" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"

      - name: Begin atomic legacy Candidate G source normalization
        id: normalization-begin
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        run: >-
          node scripts/ravscore-operational-activation.mjs normalization-begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ needs.build-and-prepare.outputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-attestation "$RAVRADAR_OPERATIONAL_HANDOFF/legacy-source-attestation.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin manual Candidate G rollback with exact central CAS
        id: candidate-begin
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-execute'
        run: >-
          node scripts/ravscore-operational-activation.mjs begin
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ needs.build-and-prepare.outputs.central_version }}"
          --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json"
          --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Begin integrated return or first cutover with exact central CAS
        id: integrated-transition-begin
        if: needs.build-and-prepare.outputs.operational_action == 'integrated-return' || needs.build-and-prepare.outputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          node scripts/ravscore-operational-activation.mjs return-begin \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "${{ needs.build-and-prepare.outputs.central_version }}" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json" \
            --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/source-manifest.json" \
            --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/source-verification.json" \
            --source-deployment-id "$(cat "$RAVRADAR_OPERATIONAL_HANDOFF/source-deployment-id.txt")" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reconfirm exact main immediately before Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Require checked-out HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        if: needs.build-and-prepare.outputs.operational_action != 'candidate-normalization'
        uses: actions/deploy-pages@v5

      - name: Deploy the sealed Candidate G normalization artifact
        id: normalization-deployment
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        uses: actions/deploy-pages@v5

      - name: Verify and atomically complete Candidate G source normalization
        id: normalization-complete
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        shell: bash
        run: |
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "${{ steps.normalization-deployment.outputs.page_url }}" \
            --source-head "$GITHUB_SHA" \
            --model "candidate-g" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-verification.json"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-begin.json")"
          node scripts/ravscore-operational-activation.mjs normalization-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-verification.json" \
            --deployment-id "pages-normalized-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-complete.json"
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Seal integrated first-cutover plan after normalized Candidate activation
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        run: >-
          node scripts/ravscore-operational-activation.mjs prepare-integrated-return
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-manifest.json"
          --audit "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-public-audit.json"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-plan.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Begin integrated first cutover from the exact normalized Candidate source
        id: integrated-normalization-begin
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        shell: bash
        run: |
          normalized_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-complete.json")"
          node scripts/ravscore-operational-activation.mjs return-begin \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-plan.json" \
            --expected-version "$normalized_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-public-audit.json" \
            --source-manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --source-verification "$RAVRADAR_OPERATIONAL_HANDOFF/normalization-verification.json" \
            --source-deployment-id "pages-normalized-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-begin.json"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reconfirm exact main before integrated post-normalization deployment
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Deploy integrated artifact after source normalization
        id: integrated-normalization-deployment
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ravscore-integrated-after-normalization

      - name: Verify and atomically complete integrated first cutover
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-normalization'
        shell: bash
        run: |
          node scripts/verify-ravscore-operational-pages-deployment.mjs \
            --base-url "${{ steps.integrated-normalization-deployment.outputs.page_url }}" \
            --source-head "$GITHUB_SHA" \
            --model "integrated" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-verification.json"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-begin.json")"
          node scripts/ravscore-operational-activation.mjs return-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-public-audit.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/integrated-verification.json" \
            --deployment-id "pages-integrated-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify deployed exact model, implementation and 210/673 artifact
        id: public-verification
        if: needs.build-and-prepare.outputs.operational_action != 'candidate-normalization'
        run: >-
          node scripts/verify-ravscore-operational-pages-deployment.mjs
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --source-head "$GITHUB_SHA"
          --model "${{ needs.build-and-prepare.outputs.deployment_model }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --output "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json"

      - name: Reconfirm exact main before activation completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"

      - name: Complete Candidate G rollback only after public verification
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-execute'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh already active Candidate G central evidence after public verification
        if: needs.build-and-prepare.outputs.operational_action == 'candidate-maintenance'
        run: >-
          node scripts/ravscore-operational-activation.mjs refresh-complete
          --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json"
          --expected-version "${{ needs.build-and-prepare.outputs.central_version }}"
          --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json"
          --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json"
          --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Complete integrated return or first cutover only after public verification
        if: needs.build-and-prepare.outputs.operational_action == 'integrated-return' || needs.build-and-prepare.outputs.operational_action == 'integrated-cutover'
        shell: bash
        run: |
          pending_version="$(jq -r '.centralVersion' "$RAVRADAR_OPERATIONAL_HANDOFF/begin.json")"
          node scripts/ravscore-operational-activation.mjs return-complete \
            --plan "$RAVRADAR_OPERATIONAL_HANDOFF/plan.json" \
            --expected-version "$pending_version" \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/manifest.json" \
            --audit "$RAVRADAR_OPERATIONAL_HANDOFF/public-audit.json" \
            --verification "$RAVRADAR_OPERATIONAL_HANDOFF/verification.json" \
            --deployment-id "pages-${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Reconcile an ambiguous failed transition from observed public identity
        if: failure() && (steps.candidate-begin.outcome == 'success' || steps.integrated-transition-begin.outcome == 'success' || steps.integrated-normalization-begin.outcome == 'success' || (steps.normalization-begin.outcome == 'success' && steps.normalization-complete.outcome != 'success'))
        shell: bash
        run: |
          set -euo pipefail
          begin_file="$RAVRADAR_OPERATIONAL_HANDOFF/begin.json"
          if [ "${{ steps.integrated-normalization-begin.outcome }}" = "success" ]; then
            begin_file="$RAVRADAR_OPERATIONAL_HANDOFF/integrated-begin.json"
          elif [ "${{ steps.normalization-begin.outcome }}" = "success" ] && [ "${{ steps.normalization-complete.outcome }}" != "success" ]; then
            begin_file="$RAVRADAR_OPERATIONAL_HANDOFF/normalization-begin.json"
          fi
          pending_version="$(jq -r '.centralVersion' "$begin_file")"
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Cache-Control: no-cache' \
            "$RAVRADAR_PUBLIC_BASE_URL/data/live/manifest.json?ravscore-failure-reconcile=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json"
          node scripts/ravscore-operational-activation.mjs classify-pending \
            --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
            --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json"
          classification="$(jq -r '.action' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json")"
          model="$(jq -r '.model' "$RAVRADAR_OPERATIONAL_HANDOFF/failure-classification.json")"
          if [ "$classification" = "complete" ]; then
            node scripts/verify-ravscore-operational-pages-deployment.mjs \
              --base-url "$RAVRADAR_PUBLIC_BASE_URL" \
              --source-head "$GITHUB_SHA" \
              --model "$model" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --output "$RAVRADAR_OPERATIONAL_HANDOFF/failure-verification.json"
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$current_main"
          if [ "$classification" = "complete" ]; then
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --verification "$RAVRADAR_OPERATIONAL_HANDOFF/failure-verification.json" \
              --deployment-id "pages-reconciled-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            node scripts/ravscore-operational-activation.mjs reconcile \
              --expected-version "$pending_version" \
              --manifest "$RAVRADAR_OPERATIONAL_HANDOFF/observed-manifest.json" \
              --failure-code "FAILED_RUN_SOURCE_RECONCILED"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

