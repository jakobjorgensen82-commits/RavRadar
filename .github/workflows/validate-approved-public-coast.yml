name: Validate approved public coast points

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravradar-approved-public-coast-validation
  cancel-in-progress: true

jobs:
  validate-approved-public-coast:
    name: Validate owner-approved coast water points on DMI grids
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DMI native-grid reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Validate the 50 new water points on native DMI grids
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input data/geometry-v2/approved-public-coast-point-pairs-2026-08-11.json
          --report approved-public-coast-dmi-grid.json

      - name: Upload private validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-public-coast-dmi-grid-${{ github.run_id }}
          path: approved-public-coast-dmi-grid.json
          if-no-files-found: warn
          retention-days: 7
