name: Validate approved public coast points

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravradar-approved-public-coast-validation
  cancel-in-progress: true

jobs:
  validate-approved-public-coast:
    name: Validate owner-approved coast water points on DMI grids
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install DMI native-grid reader
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt

      - name: Validate the new water points on native DMI grids
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input data/geometry-v2/approved-public-coast-point-pairs-2026-08-11.json
          --report approved-public-coast-dmi-grid.json

      - name: Build disabled 643-part runtime bundle
        run: >-
          python scripts/build-approved-public-coast-runtime-bundle.py
          --new-grid approved-public-coast-dmi-grid.json

      - name: Validate disabled public runtime contract
        run: >-
          node --input-type=module -e
          "import path from 'node:path'; import {build} from './scripts/build-public-coastal-parts-v2.mjs';
          const result=await build({source:path.resolve('.geometry-v2-work/approved-public-coast-runtime-bundle'),output:path.resolve('.geometry-v2-work/approved-public-coastal-parts-v2.json')});
          if(result.enabled||result.partCount!==643||result.zoneCount!==206) throw new Error('Privat kyst-runtimekontrakt matcher ikke 643/206 eller er fejlagtigt aktiveret');"

      - name: Validate central admin draft roundtrip and rollback
        run: node scripts/validate-approved-public-coast-admin-roundtrip.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload private validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: approved-public-coast-dmi-grid-${{ github.run_id }}
          path: |
            approved-public-coast-dmi-grid.json
            .geometry-v2-work/approved-public-coast-runtime-bundle/manifest.json
            .geometry-v2-work/approved-public-coast-admin-roundtrip.json
          if-no-files-found: warn
          retention-days: 7
