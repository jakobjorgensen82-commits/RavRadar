name: Read-only weather cache forensics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-dmi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: active-donor
            key: dmi-zone-active-v1-Linux-2026-W36-118-preflight-34056999485-1
            path: .cache/dmi-active-complete.json
          - label: previous-candidate
            key: dmi-zone-candidate-v1-Linux-2026-W37-normal-34229976645-1
            path: .cache/dmi-candidate-progress.json
          - label: latest-candidate
            key: dmi-zone-candidate-v1-Linux-2026-W37-normal-34252960481-1
            path: .cache/dmi-candidate-progress.json
    name: Inspect ${{ matrix.label }} without changing it
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require reviewed diagnostic branch and unchanged production reader
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/weather-cache-forensic
          git diff --exit-code bf47198125401342426532df6de8d8d489188a0a -- scripts/update-dmi-bulk.py scripts/lib requirements-dmi.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install existing reader dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt
      - name: Restore exact existing cache read-only
        id: restored
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.path }}
          key: ${{ matrix.key }}
          fail-on-cache-miss: true
      - name: Require exact cache identity
        env:
          EXPECTED_KEY: ${{ matrix.key }}
          ACTUAL_KEY: ${{ steps.restored.outputs.cache-matched-key }}
        run: test "$EXPECTED_KEY" = "$ACTUAL_KEY"
      - name: Measure structure and duplicate metadata using safe aggregates
        run: python -B scripts/inspect-dmi-cache-aggregate.py --cache '${{ matrix.path }}'
      - name: Examine historic and current overlap proof using safe aggregates
        if: always() && steps.restored.outcome == 'success'
        run: python -B scripts/inspect-dmi-reuse-proof.py --cache '${{ matrix.path }}' --target 2026-09-08T16:00:00Z

# Intentionally no cache save, private artifact upload, producer, source gate,
# central/admin mutation, production write, model change or deploy. Never merge.
