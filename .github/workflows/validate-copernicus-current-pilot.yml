name: Read-only weather residual causes
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require isolated diagnostic branch
        run: test "$GITHUB_REF" = refs/heads/codex/weather-cache-forensic
      - name: Check out exact production readers
        uses: actions/checkout@v7
        with:
          ref: 5587001b45ffea056addaf6cd20084719540336a
          path: runtime-source
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact production source
        run: test "$(git -C runtime-source rev-parse HEAD)" = 5587001b45ffea056addaf6cd20084719540336a
      - name: Check out isolated candidate replay source
        uses: actions/checkout@v7
        with:
          ref: 5587001b45ffea056addaf6cd20084719540336a
          path: candidate-runtime
          persist-credentials: false
          fetch-depth: 1
      - name: Apply frozen regional candidate only to isolated reader checkout
        run: |
          set -euo pipefail
          test "$(git -C candidate-runtime rev-parse HEAD)" = 5587001b45ffea056addaf6cd20084719540336a
          git -C candidate-runtime apply --check ../diagnostic-regional-candidate.patch
          git -C candidate-runtime apply ../diagnostic-regional-candidate.patch
          sha256sum diagnostic-regional-candidate.patch
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reader dependencies
        run: python -m pip install --disable-pip-version-check -r runtime-source/requirements-dmi.txt -r runtime-source/requirements-copernicus.txt PyYAML==6.0.2
      - name: Check aggregate diagnostic contracts with synthetic data
        run: python -B scripts/test-inspect-current-route-causes.py --source runtime-source
      - name: Check frozen candidate syntax before reading private caches
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ('update-dmi-bulk.py', 'lib/current_field_shadow.py', 'lib/regional_current_operational.py', 'lib/regional_source_proofs.py'):
              ast.parse((Path('candidate-runtime/scripts') / name).read_text(encoding='utf-8'))
          ast.parse(Path('scripts/inspect-regional-migration-20260911.py').read_text(encoding='utf-8'))
          print('Frozen regional candidate syntax: OK')
          PY
      - name: Restore latest registry and ledger read-only
        id: reference-dmi
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          fail-on-cache-miss: true
      - name: Restore exact final residual read-only
        id: reference-residual
        uses: actions/cache/restore@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Bind and isolate the reference files
        env:
          DMI_KEY: ${{ steps.reference-dmi.outputs.cache-matched-key }}
          OM_KEY: ${{ steps.reference-residual.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$DMI_KEY" = dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          test "$OM_KEY" = open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          mkdir -p .diagnostic/reference
          mv .cache/dmi-candidate-progress.json .diagnostic/reference/diagnostic-latest-candidate.json
          mv .cache/open-meteo-current-fallback.json .diagnostic/reference/open-meteo-current-fallback.json
      - name: Restore DMI candidate from 34588002366 read-only
        id: g0-dmi
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          fail-on-cache-miss: true
      - name: Restore Copernicus bank from 34588002366 read-only
        id: g0-cp
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Restore exact Copernicus source journal read-only
        id: g0-cp-stage
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-118-preflight-ready-34588002366-1
          fail-on-cache-miss: true
      - name: Restore Open-Meteo bank from 34588002366 read-only
        id: g0-om
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/open-meteo-current-donor-bank.json
            .cache/open-meteo-current-donor-bank.json.rejected
            .cache/open-meteo-current-donor-bank.json.rejected.previous
            .cache/open-meteo-current-fallback.json.rejected
            .cache/open-meteo-current-fallback.json.rejected.previous
          key: open-meteo-current-donor-bank-v1-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Restore original Open-Meteo projection from 34588002366 read-only
        id: g0-projection
        uses: actions/cache/restore@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Restore regional DMI shadow from 34588002366 read-only
        id: g0-regional
        uses: actions/cache/restore@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-Linux-118-preflight-34588002366-1
          fail-on-cache-miss: true
      - name: Bind and isolate generation 34588002366
        env:
          DMI_KEY: ${{ steps.g0-dmi.outputs.cache-matched-key }}
          CP_KEY: ${{ steps.g0-cp.outputs.cache-matched-key }}
          CP_STAGE_KEY: ${{ steps.g0-cp-stage.outputs.cache-matched-key }}
          OM_KEY: ${{ steps.g0-om.outputs.cache-matched-key }}
          REGIONAL_KEY: ${{ steps.g0-regional.outputs.cache-matched-key }}
          PROJECTION_KEY: ${{ steps.g0-projection.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$DMI_KEY" = dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          test "$CP_KEY" = copernicus-current-donor-bank-v1-Linux-oneoff-34588002366-1
          test "$OM_KEY" = open-meteo-current-donor-bank-v1-Linux-oneoff-34588002366-1
          test "$REGIONAL_KEY" = current-field-shadow-v1-Linux-118-preflight-34588002366-1
          test "$PROJECTION_KEY" = open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          test "$CP_STAGE_KEY" = copernicus-current-progress-v3-118-preflight-ready-34588002366-1
          mkdir -p .diagnostic/34588002366
          mv .cache/copernicus-current-shadow.json .cache/copernicus-current-source-stage.json .diagnostic/34588002366/
          mv .cache/open-meteo-current-fallback.json .diagnostic/34588002366/open-meteo-generation-projection.json
          mv .cache/dmi-candidate-progress.json .cache/copernicus-current-donor-bank.json .cache/open-meteo-current-donor-bank.json .cache/current-field-shadow.json .diagnostic/34588002366/
          cp .diagnostic/reference/diagnostic-latest-candidate.json .diagnostic/reference/open-meteo-current-fallback.json .diagnostic/34588002366/
      - name: Classify the fixed 1658 residual using exact original journals
        id: audit-g0
        run: python -B scripts/inspect-current-residual-20260911.py --source runtime-source --cache .diagnostic/34588002366 --target 2026-09-11T10:00:00Z --generation 34588002366 --route-causes
      - name: Replay actual candidate regional migration in memory without changing inputs
        run: python -B scripts/inspect-regional-migration-20260911.py --source candidate-runtime --cache .diagnostic/34588002366

# Diagnostic branch only. No cache save, artifact upload, supplier fetch, secrets,
# public output generation, model activation, production gate or deployment.
