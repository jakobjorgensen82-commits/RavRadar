name: Validate private Copernicus current pilot

on:
  schedule:
    # Byg den nye UTC-time før produktionskadencens første kørsel ved :14.
    - cron: "6 * * * *"
  workflow_dispatch:
    inputs:
      sample_time:
        description: "Optional exact UTC hour for controlled private backfill"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: private-copernicus-current-pilot
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install central geometry and Copernicus dependencies
        run: |
          python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"
          python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Rebuild the latest centrally approved sampling points
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/refine-coastlines-constrained-4.0.48.py
          python scripts/sync-admin-config.py
          python scripts/apply-central-zone-reviews.py
          node scripts/build-public-coastal-parts-v2.mjs

      - name: Run deterministic pilot tests
        run: |
          python scripts/test-copernicus-current-pilot.py
          python scripts/test-copernicus-shadow-retention-4.0.232.py
          python scripts/test-current-regional-proxy-policy.py

      - name: Restore private seven-day Copernicus shadow cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-shadow-v1-

      - name: Inspect requested hour and authoritative target geometry
        id: cache-state
        env:
          PILOT_SAMPLE_TIME: ${{ inputs.sample_time }}
        run: |
          if [ -n "$PILOT_SAMPLE_TIME" ]; then
            python scripts/check-copernicus-current-hour.py --at "$PILOT_SAMPLE_TIME" --targets data/live/coastal-parts-v2.json --github-output "$GITHUB_OUTPUT"
          else
            python scripts/check-copernicus-current-hour.py --targets data/live/coastal-parts-v2.json --github-output "$GITHUB_OUTPUT"
          fi

      - name: Verify Copernicus secrets are configured
        if: steps.cache-state.outputs.current_hour_present != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          test -n "$COPERNICUSMARINE_SERVICE_USERNAME"
          test -n "$COPERNICUSMARINE_SERVICE_PASSWORD"

      - name: Run authenticated score-neutral current pilot
        if: steps.cache-state.outputs.current_hour_present != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          PILOT_SAMPLE_TIME: ${{ inputs.sample_time }}
        run: |
          if [ -n "$PILOT_SAMPLE_TIME" ]; then
            python scripts/run-copernicus-current-pilot.py --at "$PILOT_SAMPLE_TIME"
          else
            python scripts/run-copernicus-current-pilot.py
          fi

      - name: Save private seven-day Copernicus shadow cache
        if: steps.cache-state.outputs.current_hour_present != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .cache/copernicus-current-shadow.json
          key: copernicus-current-shadow-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reject secret or raw-vector leakage from support report
        if: steps.cache-state.outputs.current_hour_present != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('data/diagnostics/copernicus-current-pilot.json')
          text=path.read_text(encoding='utf-8')
          data=json.loads(text)
          assert data['scoreImpact'] is False and data['publicRuntime'] is False
          def raw_vector_present(value):
              if isinstance(value, dict):
                  return any(key in {'uMps','vMps'} or raw_vector_present(child) for key, child in value.items())
              if isinstance(value, list):
                  return any(raw_vector_present(child) for child in value)
              return False
          assert not raw_vector_present(data)
          for name in ('COPERNICUSMARINE_SERVICE_USERNAME','COPERNICUSMARINE_SERVICE_PASSWORD'):
              value=os.environ.get(name,'')
              assert value and value not in text
          print('Safe support report: no credentials and no raw U/V values')
          PY

      - name: Upload private support evidence
        if: steps.cache-state.outputs.current_hour_present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-current-pilot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            data/diagnostics/copernicus-current-pilot.json
            data/diagnostics/copernicus-current-pilot.txt

      - name: Report safe duplicate suppression
        if: steps.cache-state.outputs.current_hour_present == 'true'
        run: echo "Requested UTC hour already exists for the centrally approved target geometry; authenticated download skipped."
