name: Validate private Copernicus current pilot

on:
  workflow_dispatch:
    inputs:
      sample_time:
        description: "Optional exact UTC hour for controlled private backfill"
        required: false
        type: string
      full_coast:
        description: "Manual nationwide research audit instead of normal DMI-gap targeting"
        required: false
        default: false
        type: boolean
      operational_118_preflight:
        description: "Prove only the integrated 673-part target..+117 weather/runtime coverage; never deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ravradar-weather-production
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.operational_118_preflight != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require exact main before private DMI cache selection
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-copernicus.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore source-content validation locator
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-pilot
          restore-keys: |
            weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-

      - name: Verify exact-content source validation with GitHub
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare exact pinned Candidate G source before source validation
        if: steps.source-proof.outputs.required != 'false'
        shell: bash
        run: |
          set -euo pipefail
          read -r legacy_source_head legacy_source_tree < <(node --input-type=module -e "import { LEGACY_CANDIDATE_G_SOURCE_HEAD, LEGACY_CANDIDATE_G_SOURCE_TREE } from './scripts/lib/ravscore-legacy-candidate-g-source.mjs'; process.stdout.write(LEGACY_CANDIDATE_G_SOURCE_HEAD + ' ' + LEGACY_CANDIDATE_G_SOURCE_TREE + '\n');")
          [[ "$legacy_source_head" =~ ^[a-f0-9]{40}$ ]]
          [[ "$legacy_source_tree" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$legacy_source_head"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$legacy_source_head"
          test "$(git rev-parse "${legacy_source_head}^{tree}")" = "$legacy_source_tree"

      - name: Install source-gate dependencies
        if: steps.source-proof.outputs.required != 'false'
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt

      - name: Run exact-main source gate before private acquisition
        id: source-gate
        if: steps.source-proof.outputs.required != 'false'
        run: npm run validate:source

      - name: Record actual source validation outcome
        id: source-record
        if: always() && github.ref == 'refs/heads/main' && (steps.source-gate.outcome == 'success' || steps.source-gate.outcome == 'failure' || steps.source-gate.outcome == 'cancelled')
        run: node scripts/weather-source-gate.mjs record
        env:
          SOURCE_GATE_OUTCOME: ${{ steps.source-gate.outcome }}

      - name: Preserve latest verified source-content validation outcome
        if: always() && (steps.source-record.outcome == 'success' || (steps.source-proof.outcome == 'success' && steps.source-proof.outputs.required == 'false'))
        uses: actions/cache/save@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-pilot

      - name: Install central geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Rebuild the latest centrally approved sampling points
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/refine-coastlines-constrained-4.0.48.py
          python scripts/sync-admin-config.py
          python scripts/apply-central-zone-reviews.py
          node scripts/build-public-coastal-parts-v2.mjs

      - name: Restore complete active DMI coverage for target selection
        id: dmi-coverage-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-active-complete.json
          key: dmi-zone-active-v1-${{ runner.os }}-copernicus-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-active-v1-${{ runner.os }}-

      - name: Resolve terminal-proven legacy DMI coverage for pilot selection
        id: dmi-coverage-legacy-key
        if: steps.dmi-coverage-cache.outputs.cache-matched-key == ''
        run: node scripts/resolve-terminal-dmi-cache.mjs --allow-missing
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Bootstrap pilot selection from the terminal-proven exact legacy DMI generation
        id: dmi-coverage-legacy-bootstrap
        if: steps.dmi-coverage-cache.outputs.cache-matched-key == '' && steps.dmi-coverage-legacy-key.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: ${{ steps.dmi-coverage-legacy-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Materialize restored active DMI coverage
        if: steps.dmi-coverage-cache.outputs.cache-matched-key != ''
        shell: bash
        run: |
          test -s .cache/dmi-active-complete.json
          mkdir -p data/live
          cp .cache/dmi-active-complete.json data/live/dmi-bulk-cache.json

      - name: Inspect private DMI coverage availability
        id: dmi-coverage
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.dmi-coverage-cache.outputs.cache-matched-key || steps.dmi-coverage-legacy-bootstrap.outputs.cache-matched-key }}
        run: |
          if test -n "$MATCHED_CACHE_KEY" && test -f data/live/dmi-bulk-cache.json; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "A restored private DMI cache is available for contract and freshness validation."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No private DMI cache was restored; a checkout file alone is never treated as a cache hit."
          fi

      - name: Materialize bounded DMI storage before pilot readers
        if: steps.dmi-coverage.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          materialized="$RUNNER_TEMP/dmi-pilot-materialized.json"
          python scripts/materialize-dmi-bulk-storage.py --input data/live/dmi-bulk-cache.json --output "$materialized"
          cp "$materialized" data/live/dmi-bulk-cache.json.tmp
          mv data/live/dmi-bulk-cache.json.tmp data/live/dmi-bulk-cache.json

      - name: Bind the pilot to a ready restored DMI ledger
        if: steps.dmi-coverage.outputs.available == 'true' && inputs.full_coast != true
        id: dmi-operational-reference
        shell: bash
        env:
          PILOT_SAMPLE_TIME: ${{ inputs.sample_time }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          from scripts.lib.copernicus_target_identity import (
              target_fingerprint,
              targets_from_registry,
          )
          from scripts.lib.dmi_native_provenance import (
              canonical_verified_part_current_attestation,
              current_attestation_authorization_from_operational_ledger,
              validate_current_operational_availability_ledger,
              validate_current_operational_ledger,
          )
          from scripts.lib.dmi_bulk_storage import read_dmi_bulk_document

          dmi = read_dmi_bulk_document(Path('data/live/dmi-bulk-cache.json'))
          ledger = ((dmi.get('diagnostics') or {}).get('currentOperationalLedger'))
          if not isinstance(ledger, dict):
              raise SystemExit('Restored DMI current operational ledger is missing or malformed')
          if not isinstance(ledger.get('ready'), bool):
              raise SystemExit('Restored DMI current operational ledger readiness is malformed')

          def exact_hour(value, label):
              if not isinstance(value, str) or not value.endswith('Z'):
                  raise SystemExit(f'Restored DMI current operational ledger {label} is malformed')
              try:
                  parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              except ValueError:
                  raise SystemExit(f'Restored DMI current operational ledger {label} is malformed') from None
              if parsed.tzinfo is None:
                  raise SystemExit(f'Restored DMI current operational ledger {label} lacks UTC')
              parsed = parsed.astimezone(timezone.utc)
              if parsed != parsed.replace(minute=0, second=0, microsecond=0):
                  raise SystemExit(f'Restored DMI current operational ledger {label} is not an exact hour')
              canonical = parsed.isoformat().replace('+00:00', 'Z')
              if value != canonical:
                  raise SystemExit(f'Restored DMI current operational ledger {label} is not canonical')
              return parsed

          reference = exact_hour(ledger.get('productionReferenceAt'), 'production reference')
          targets_path = Path('data/live/coastal-parts-v2.json')
          targets = targets_from_registry(targets_path)
          range_end = reference + timedelta(hours=117)
          allowed_source_assets, allowed_retained_pair_sources = (
              current_attestation_authorization_from_operational_ledger(ledger)
          )
          attestation = canonical_verified_part_current_attestation(
              dmi,
              targets,
              reference,
              range_end,
              allowed_source_assets,
              allowed_retained_pair_sources,
          )
          ready = ledger['ready']
          validation_error = None
          try:
              ledger_validator = (
                  validate_current_operational_ledger
                  if ready
                  else validate_current_operational_availability_ledger
              )
              ledger_validator(
                  ledger,
                  attestation,
                  targets,
                  reference,
                  range_end,
                  target_fingerprint(targets),
              )
          except (TypeError, ValueError) as error:
              validation_error = str(error)

          if validation_error is not None:
              disposition = 'ready' if ready else 'non-ready'
              raise SystemExit(
                  f'Restored {disposition} DMI ledger is invalid: {validation_error}'
              )
          requested = os.environ.get('PILOT_SAMPLE_TIME', '').strip()
          if requested and exact_hour(requested, 'requested sample time') != reference:
              raise SystemExit('Requested pilot sample time does not match the restored DMI ledger')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
              if ready:
                  handle.write(f"production_reference_at={ledger['productionReferenceAt']}\n")
          if ready:
              print('The scheduled pilot is bound to the ready restored DMI ledger reference.')
          else:
              print('The restored DMI ledger is incomplete; the optional pilot will skip neutrally.')
          PY

      - name: Seal the exact target-48 through target+117 DMI gap matrix
        if: steps.dmi-coverage.outputs.available == 'true' && (inputs.full_coast == true || steps.dmi-operational-reference.outputs.ready == 'true')
        id: target-registry
        env:
          PILOT_SAMPLE_TIME: ${{ inputs.sample_time }}
          PILOT_FULL_COAST: ${{ inputs.full_coast }}
          DMI_LEDGER_REFERENCE: ${{ steps.dmi-operational-reference.outputs.production_reference_at }}
        shell: bash
        run: |
          args=()
          if [ "$PILOT_FULL_COAST" = "true" ]; then
            if [ -n "$PILOT_SAMPLE_TIME" ]; then args+=(--at "$PILOT_SAMPLE_TIME"); fi
            args+=(--full-coast)
          else
            test -n "$DMI_LEDGER_REFERENCE"
            args+=(--at "$DMI_LEDGER_REFERENCE")
          fi
          args+=(--github-output "$GITHUB_OUTPUT")
          python scripts/build-copernicus-target-registry.py "${args[@]}"

      - name: Restore private sealed Copernicus range cache
        if: steps.target-registry.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-progress-v3-
            copernicus-current-range-v2-
            copernicus-current-shadow-v1-

      - name: Restore shared private Copernicus donor bank for pilot
        if: steps.target-registry.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-donor-bank-v1-${{ runner.os }}-

      - name: Inspect the exact sealed DMI-gap range
        if: steps.target-registry.outcome == 'success'
        id: cache-state
        run: >-
          python scripts/check-copernicus-current-range.py
          --at "${{ steps.target-registry.outputs.target_hour }}"
          --registry .cache/copernicus-current-targets.json
          --dmi data/live/dmi-bulk-cache.json
          --targets data/live/coastal-parts-v2.json
          --source-stage .cache/copernicus-current-source-stage.json
          --allow-nonmatching-seal
          --allow-invalid-shadow-as-absent
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve original Copernicus admission evidence before pilot rebase
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_reusable != 'true'
        run: echo "Preserve original source-stage evidence for validated donor migration before rebase."

      - name: Install Copernicus acquisition dependency only when source stage is absent
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_ready != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Run deterministic pilot tests only before a new acquisition
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_ready != 'true'
        run: |
          python scripts/test-copernicus-current-pilot.py
          python scripts/test-copernicus-range-runner-v2.py
          python scripts/test-copernicus-range-checker-v2.py
          python scripts/test-copernicus-shadow-retention-4.0.232.py
          python scripts/test-current-operational-closure.py
          python scripts/test-current-operational-live-builder.py
          python scripts/test-current-regional-proxy-policy.py

      - name: Verify Copernicus secrets are configured
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_ready != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          test -n "$COPERNICUSMARINE_SERVICE_USERNAME"
          test -n "$COPERNICUSMARINE_SERVICE_PASSWORD"

      - name: Complete only the exact sealed DMI-gap range
        id: acquisition
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_ready != 'true'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: >-
          python scripts/run-copernicus-current-pilot-with-retry.py
          --attempts 1
          --timeout-seconds 1200
          --backoff-seconds 20
          --
          --donor-bank .cache/copernicus-current-donor-bank.json
          --segment-journal .cache/copernicus-current-segment-journal.json
          --targets .cache/copernicus-current-targets.json
          --authoritative-targets data/live/coastal-parts-v2.json
          --at "${{ steps.target-registry.outputs.target_hour }}"

      - name: Reconfirm exact main before pilot Copernicus progress cache
        id: pilot-copernicus-progress-write-authority
        if: always() && steps.target-registry.outcome == 'success' && steps.acquisition.outcome != 'cancelled' && steps.acquisition.outcome != 'skipped' && (hashFiles('.cache/copernicus-current-shadow.json') != '' || steps.acquisition.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save shared private Copernicus pilot donor bank before projection gates
        if: always() && steps.pilot-copernicus-progress-write-authority.outcome == 'success' && (steps.acquisition.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save non-cancelled Copernicus source-stage progress
        if: always() && steps.pilot-copernicus-progress-write-authority.outcome == 'success' && steps.target-registry.outcome == 'success' && steps.acquisition.outcome != 'cancelled' && steps.acquisition.outcome != 'skipped' && hashFiles('.cache/copernicus-current-shadow.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-pilot-progress-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prove the resulting exact Copernicus source stage
        if: steps.target-registry.outcome == 'success'
        run: >-
          python scripts/check-copernicus-current-range.py
          --at "${{ steps.target-registry.outputs.target_hour }}"
          --registry .cache/copernicus-current-targets.json
          --dmi data/live/dmi-bulk-cache.json
          --targets data/live/coastal-parts-v2.json
          --source-stage .cache/copernicus-current-source-stage.json
          --require-source-stage-ready
          --github-output "$GITHUB_OUTPUT"

      - name: Reconfirm exact main before pilot validated Copernicus cache
        id: pilot-copernicus-ready-write-authority
        if: steps.target-registry.outcome == 'success' && success()
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save validated private Copernicus source stage
        if: steps.pilot-copernicus-ready-write-authority.outcome == 'success' && steps.target-registry.outcome == 'success' && success()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-pilot-ready-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Reject secret or raw-vector leakage from support report
        if: steps.acquisition.outcome == 'success'
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('data/diagnostics/copernicus-current-pilot.json')
          text=path.read_text(encoding='utf-8')
          data=json.loads(text)
          assert data['scoreImpact'] is False and data['publicRuntime'] is False
          def raw_vector_present(value):
              if isinstance(value, dict):
                  return any(key in {'uMps','vMps'} or raw_vector_present(child) for key, child in value.items())
              if isinstance(value, list):
                  return any(raw_vector_present(child) for child in value)
              return False
          assert not raw_vector_present(data)
          for name in ('COPERNICUSMARINE_SERVICE_USERNAME','COPERNICUSMARINE_SERVICE_PASSWORD'):
              value=os.environ.get(name,'')
              assert value and value not in text
          print('Safe support report: no credentials and no raw U/V values')
          PY

      - name: Upload private support evidence
        if: steps.acquisition.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: copernicus-current-pilot-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            data/diagnostics/copernicus-current-pilot.json
            data/diagnostics/copernicus-current-pilot.txt

      - name: Report safe duplicate suppression
        if: steps.target-registry.outcome == 'success' && steps.cache-state.outputs.source_stage_ready == 'true'
        run: echo "The exact target/DMI/shadow-bound Copernicus source stage is already valid; dependency installation, credentials and authenticated download were skipped."

      - name: Report neutral incomplete-ledger skip
        if: steps.dmi-coverage.outputs.available == 'true' && inputs.full_coast != true && steps.dmi-operational-reference.outputs.ready == 'false'
        run: echo "Optional Copernicus pilot skipped because the restored DMI operational ledger is not ready yet; no acquisition or public write was attempted."

      - name: Report safe private-cache skip
        if: steps.dmi-coverage.outputs.available != 'true'
        run: echo "Optional Copernicus pilot skipped because no private DMI target cache was restored; production weather coverage is unchanged."

  operational-118-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.operational_118_preflight == true
    runs-on: ubuntu-latest
    # 55m DMI + 57m Copernicus + 17m runtime + at least 60m for
    # setup, cache restore/save and closure. Acquisition soft deadlines remain
    # below their step limits so progress can be saved before terminal gates.
    timeout-minutes: 200
    env:
      RAVRADAR_PRIVATE_PREFLIGHT_REPORT: .geometry-v2-work/ravscore-integrated-118h-preflight.json
    steps:
      - name: Check out requested model branch
        uses: actions/checkout@v7

      - name: Require requested one-off HEAD to equal current origin/main
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dmi.txt
            requirements-copernicus.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore source-content validation locator
        uses: actions/cache/restore@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-oneoff
          restore-keys: |
            weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-

      - name: Verify exact-content source validation with GitHub
        id: source-proof
        run: node scripts/weather-source-gate.mjs check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare exact pinned Candidate G source before source validation
        if: steps.source-proof.outputs.required != 'false'
        shell: bash
        run: |
          set -euo pipefail
          read -r legacy_source_head legacy_source_tree < <(node --input-type=module -e "import { LEGACY_CANDIDATE_G_SOURCE_HEAD, LEGACY_CANDIDATE_G_SOURCE_TREE } from './scripts/lib/ravscore-legacy-candidate-g-source.mjs'; process.stdout.write(LEGACY_CANDIDATE_G_SOURCE_HEAD + ' ' + LEGACY_CANDIDATE_G_SOURCE_TREE + '\n');")
          [[ "$legacy_source_head" =~ ^[a-f0-9]{40}$ ]]
          [[ "$legacy_source_tree" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$legacy_source_head"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$legacy_source_head"
          test "$(git rev-parse "${legacy_source_head}^{tree}")" = "$legacy_source_tree"

      - name: Install source-gate dependencies
        if: steps.source-proof.outputs.required != 'false'
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt

      - name: Run exact-main source gate before one-off acquisition
        id: source-gate
        if: steps.source-proof.outputs.required != 'false'
        run: npm run validate:source

      - name: Record actual source validation outcome
        id: source-record
        if: always() && github.ref == 'refs/heads/main' && (steps.source-gate.outcome == 'success' || steps.source-gate.outcome == 'failure' || steps.source-gate.outcome == 'cancelled')
        run: node scripts/weather-source-gate.mjs record
        env:
          SOURCE_GATE_OUTCOME: ${{ steps.source-gate.outcome }}

      - name: Preserve latest verified source-content validation outcome
        if: always() && (steps.source-record.outcome == 'success' || (steps.source-proof.outcome == 'success' && steps.source-proof.outputs.required == 'false'))
        uses: actions/cache/save@v6
        with:
          path: .cache/weather-source-validation.json
          key: weather-source-proof-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-oneoff

      - name: Validate the operational request and bind the exact target hour
        id: operational-target
        shell: bash
        env:
          PREFLIGHT_SAMPLE_TIME: ${{ inputs.sample_time }}
          PILOT_FULL_COAST: ${{ inputs.full_coast }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PILOT_FULL_COAST" != "true"
          test -z "$PREFLIGHT_SAMPLE_TIME"
          target_hour="$(date -u +%Y-%m-%dT%H:00:00Z)"
          printf '%s\n' "$target_hour" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$'
          echo "target_hour=$target_hour" >> "$GITHUB_OUTPUT"
          echo "cache_generation=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "Accepted a current-hour, non-deploying 118-hour data preflight."

      - name: Install only weather-source dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt

      - name: Smoke-test the required low-level ecCodes API
        run: python scripts/smoke-test-eccodes.py

      - name: Hydrate current central admin configuration read-only
        run: python scripts/sync-admin-config.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Apply centrally approved zone reviews locally
        run: python scripts/apply-central-zone-reviews.py

      - name: Materialize the centrally hydrated authoritative coastal-part registry
        run: node scripts/build-public-coastal-parts-v2.mjs

      - name: Hydrate an optional independent deployed Candidate G DMI donor
        shell: bash
        run: |
          donor_root="$RUNNER_TEMP/ravradar-118-deployed-donor"
          mkdir -p "$donor_root/data" .cache
          rm -f .cache/deployed-dmi-bulk-cache.json
          cp data/zones.geojson "$donor_root/data/zones.geojson"
          if python scripts/hydrate-deployed-weather.py \
              --legacy-candidate-g-bootstrap \
              --root "$donor_root" \
              && test -s "$donor_root/data/live/dmi-bulk-cache.json"; then
            cp "$donor_root/data/live/dmi-bulk-cache.json" .cache/deployed-dmi-bulk-cache.json
            echo "A strictly validated independent deployed DMI donor is available."
          else
            rm -f .cache/deployed-dmi-bulk-cache.json
            echo "::warning title=Optional deployed DMI donor unavailable::The fresh official DMI attempt continues without a deployed fallback."
          fi
        env:
          RAVRADAR_DEPLOYED_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          RAVRADAR_HYDRATE_TIMEOUT_SECONDS: 180
          WEATHER_USER_AGENT: "RavRadar/4.0.345 118h deployed DMI donor (${{ github.server_url }}/${{ github.repository }})"

      - name: Resolve one aggregate Candidate G wave-bootstrap target
        id: ravscore-wave-bootstrap-target
        run: >-
          node scripts/resolve-candidate-g-wave-bootstrap-target.mjs
          --conditions "$RUNNER_TEMP/ravradar-118-deployed-donor/data/live/conditions.json"
          --source-registry "$RUNNER_TEMP/ravradar-118-deployed-donor/.cache/ravscore-legacy-candidate-g-source/coastal-parts-v2.json"
          --registry data/live/coastal-parts-v2.json
          --production-target "${{ steps.operational-target.outputs.target_hour }}"

      - name: Refresh the official DMI water-source registry
        run: node scripts/update-water-source-registry.mjs
        env:
          WEATHER_USER_AGENT: "RavRadar 118h preflight water-source registry (${{ github.server_url }}/${{ github.repository }})"

      - name: Restore bounded DMI GRIB cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-grib-v4-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-
            dmi-grib-v4-${{ runner.os }}-

      - name: Restore last complete active DMI generation
        id: dmi-active-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-active-complete.json
          key: dmi-zone-active-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-active-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-
            dmi-zone-active-v1-${{ runner.os }}-

      - name: Resolve newest terminal-proven exact-main legacy DMI generation
        id: dmi-active-legacy-key
        if: steps.dmi-active-restore.outputs.cache-matched-key == ''
        run: node scripts/resolve-terminal-dmi-cache.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Bootstrap the terminal-proven exact legacy DMI generation
        id: dmi-active-legacy-bootstrap
        if: steps.dmi-active-restore.outputs.cache-matched-key == '' && steps.dmi-active-legacy-key.outputs.available == 'true'
        uses: actions/cache/restore@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: ${{ steps.dmi-active-legacy-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Strictly bind and materialize the active DMI generation
        shell: bash
        run: |
          mkdir -p .cache data/live "$RUNNER_TEMP/dmi-active-proof"
          if test -n "${{ steps.dmi-active-restore.outputs.cache-matched-key }}"; then
            source_path=.cache/dmi-active-complete.json
          else
            source_path=data/live/dmi-bulk-cache.json
          fi
          test -s "$source_path"
          materialized_path="$RUNNER_TEMP/dmi-active-proof/materialized.json"
          python scripts/materialize-dmi-bulk-storage.py --input "$source_path" --output "$materialized_path"
          reference="$(python scripts/check-dmi-bulk-operational-ready.py --cache "$materialized_path")"
          python scripts/build-copernicus-target-registry.py \
            --require-strict-dmi-ledger \
            --targets data/live/coastal-parts-v2.json \
            --dmi "$materialized_path" \
            --output "$RUNNER_TEMP/dmi-active-proof/targets.json" \
            --at "$reference"
          cp "$materialized_path" .cache/dmi-active-complete.json.tmp
          mv .cache/dmi-active-complete.json.tmp .cache/dmi-active-complete.json
          cp .cache/dmi-active-complete.json data/live/dmi-bulk-cache.json

      - name: Reconfirm exact main before materialized legacy DMI cache
        id: oneoff-dmi-legacy-materialized-write-authority
        if: steps.dmi-active-restore.outputs.cache-matched-key == '' && steps.dmi-active-legacy-bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save materialized legacy active DMI generation
        if: steps.oneoff-dmi-legacy-materialized-write-authority.outcome == 'success' && hashFiles('.cache/dmi-active-complete.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-active-complete.json
          key: dmi-zone-active-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-legacy-materialized-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore isolated DMI candidate progress
        id: dmi-candidate-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-candidate-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-
            dmi-zone-candidate-v1-${{ runner.os }}-

      - name: Restore legacy DMI progress only as an isolated candidate
        id: dmi-candidate-legacy-restore
        if: steps.dmi-candidate-restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: data/live/dmi-bulk-cache.json
          key: dmi-zone-candidate-legacy-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dmi-zone-cache-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-
            dmi-zone-cache-v1-${{ runner.os }}-

      - name: Isolate restored candidate and restore active working copy
        shell: bash
        run: |
          if test -z "${{ steps.dmi-candidate-restore.outputs.cache-matched-key }}" \
              && test -n "${{ steps.dmi-candidate-legacy-restore.outputs.cache-matched-key }}"; then
            cp data/live/dmi-bulk-cache.json .cache/dmi-candidate-progress.json.tmp
            mv .cache/dmi-candidate-progress.json.tmp .cache/dmi-candidate-progress.json
          fi
          cp .cache/dmi-active-complete.json data/live/dmi-bulk-cache.json

      - name: Restore private regional current evidence for normal maintenance
        uses: actions/cache/restore@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            current-field-shadow-v1-${{ runner.os }}-

      - name: Restore private Copernicus operational range cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-progress-v3-
            copernicus-current-shadow-v1-
            copernicus-current-range-v2-

      - name: Restore shared private Copernicus donor bank before DMI
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            copernicus-current-donor-bank-v1-${{ runner.os }}-

      - name: Restore shared private Open-Meteo current progress
        uses: actions/cache/restore@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            open-meteo-current-fallback-v2-${{ runner.os }}-

      - name: Restore shared private Open-Meteo donor bank
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/open-meteo-current-donor-bank.json
            .cache/open-meteo-current-donor-bank.json.rejected
            .cache/open-meteo-current-donor-bank.json.rejected.previous
            .cache/open-meteo-current-fallback.json.rejected
            .cache/open-meteo-current-fallback.json.rejected.previous
          key: open-meteo-current-donor-bank-v1-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            open-meteo-current-donor-bank-v1-${{ runner.os }}-

      - name: Plan global current acquisition before DMI
        continue-on-error: true
        shell: bash
        run: |
          if ! python scripts/build-weather-acquisition-plan.py \
            --at "${{ steps.operational-target.outputs.target_hour }}" \
            --report data/diagnostics/weather-acquisition-plan-before-dmi.json; then
            rm -f .cache/weather-current-acquisition-plan.json
            echo "::warning::Advisory acquisition plan unavailable; DMI uses conservative native coverage."
          fi

      - name: Refresh all bounded official DMI collections for the proof
        id: dmi-bulk
        continue-on-error: true
        timeout-minutes: 55
        run: python -u scripts/run-dmi-oneoff-fill.py
        env:
          DMI_BULK_OUTPUT_PATH: .cache/dmi-candidate-progress.json
          DMI_BULK_PROMOTION_PATH: data/live/dmi-bulk-cache.json
          DMI_BULK_PREFER_OUTPUT_CACHE: true
          DMI_BULK_RETAIN_PREFERRED_NATIVE_RUN: false
          DMI_BULK_DKSS_PRIMARY_MODE: true
          DMI_BULK_CURRENT_ACQUISITION_PLAN_PATH: .cache/weather-current-acquisition-plan.json
          DMI_BULK_HOURS: 118
          DMI_BULK_MAX_DOWNLOAD_MB: 4096
          DMI_BULK_RAW_CACHE_MAX_MB: 4096
          DMI_BULK_MAX_RUNTIME_SECONDS: 3000
          DMI_BULK_FINALIZE_RESERVE_SECONDS: 180
          DMI_BULK_MAX_ASSETS_PER_COLLECTION: 130
          DMI_BULK_TIME_STRIDE_HOURS: 3
          DMI_BULK_COLLECTIONS_PER_RUN: 6
          DMI_BULK_REQUEST_TIMEOUT_SECONDS: 90
          DMI_BULK_ASSET_PROCESSING_TIMEOUT_SECONDS: 180
          DMI_BULK_HARMONIE_ASSET_TIMEOUT_SECONDS: 180
          DMI_BULK_SUPERVISED_FINALIZE_TIMEOUT_SECONDS: 420
          DMI_BULK_REFRESH_MINUTES: 60
          DMI_BULK_COMPLETE_HORIZON_HOURS: 118
          DMI_BULK_FORCE_REFRESH: false
          DMI_BULK_RAW_DIR: .cache/dmi-grib
          DMI_BULK_DEPLOYED_FALLBACK_PATH: .cache/dmi-active-complete.json
          DMI_BULK_PRIVATE_WAVE_BOOTSTRAP_MODE: ${{ steps.ravscore-wave-bootstrap-target.outputs.mode }}
          DMI_BULK_PRIVATE_WAVE_BOOTSTRAP_TARGET_HOUR: ${{ steps.ravscore-wave-bootstrap-target.outputs.target_hour }}
          RAVRADAR_PRODUCTION_TARGET_HOUR: ${{ steps.operational-target.outputs.target_hour }}
          CURRENT_FIELD_SHADOW_PATH: .cache/current-field-shadow.json
          WEATHER_USER_AGENT: "RavRadar/4.0.345 118h preflight (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Reconfirm exact main before one-off shared DMI progress caches
        id: oneoff-dmi-progress-write-authority
        if: always() && steps.dmi-bulk.outcome != 'cancelled' && steps.dmi-bulk.outcome != 'skipped'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save progressed DMI GRIB cache before any terminal decision
        if: always() && steps.oneoff-dmi-progress-write-authority.outcome == 'success' && steps.dmi-bulk.outcome != 'cancelled' && steps.dmi-bulk.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-grib
          key: dmi-grib-v4-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save isolated DMI candidate progress before any terminal decision
        if: always() && steps.oneoff-dmi-progress-write-authority.outcome == 'success' && steps.dmi-bulk.outcome != 'cancelled' && steps.dmi-bulk.outcome != 'skipped' && hashFiles('.cache/dmi-candidate-progress.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Strictly snapshot only a promoted READY DMI generation
        if: steps.dmi-bulk.outcome == 'success' && steps.dmi-bulk.outputs.candidate_promoted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/live/dmi-bulk-cache.json
          python scripts/check-dmi-bulk-operational-ready.py \
            --cache data/live/dmi-bulk-cache.json
          python scripts/build-copernicus-target-registry.py \
            --require-strict-dmi-ledger \
            --targets data/live/coastal-parts-v2.json \
            --dmi data/live/dmi-bulk-cache.json \
            --output "$RUNNER_TEMP/dmi-promoted-proof.json" \
            --at "${{ steps.operational-target.outputs.target_hour }}"
          cp data/live/dmi-bulk-cache.json .cache/dmi-active-complete.json.tmp
          mv .cache/dmi-active-complete.json.tmp .cache/dmi-active-complete.json

      - name: Reconfirm exact main before one-off shared active DMI cache
        id: oneoff-dmi-active-write-authority
        if: steps.dmi-bulk.outcome == 'success' && steps.dmi-bulk.outputs.candidate_promoted == 'true' && hashFiles('.cache/dmi-active-complete.json') != ''
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save the promoted complete active DMI generation
        if: steps.oneoff-dmi-active-write-authority.outcome == 'success' && steps.dmi-bulk.outcome == 'success' && steps.dmi-bulk.outputs.candidate_promoted == 'true' && hashFiles('.cache/dmi-active-complete.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/dmi-active-complete.json
          key: dmi-zone-active-v1-${{ runner.os }}-${{ steps.operational-target.outputs.cache_generation }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save private regional current evidence before any terminal decision
        if: always() && steps.oneoff-dmi-progress-write-authority.outcome == 'success' && steps.dmi-bulk.outcome != 'cancelled' && steps.dmi-bulk.outcome != 'skipped' && hashFiles('.cache/current-field-shadow.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/current-field-shadow.json
          key: current-field-shadow-v1-${{ runner.os }}-118-preflight-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Inspect operational WAM handoff before one-off downstream providers
        id: wam-bootstrap-readiness
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          attestation="$(python -B scripts/validate_dmi_wave_history_bootstrap.py \
            --mode "${{ steps.ravscore-wave-bootstrap-target.outputs.mode }}" \
            --target-hour "${{ steps.ravscore-wave-bootstrap-target.outputs.target_hour }}" \
            --production-target-hour "${{ steps.operational-target.outputs.target_hour }}" \
            --forecast-hour-count 118 \
            --cache .cache/dmi-candidate-progress.json \
            --registry data/live/coastal-parts-v2.json)"
          validator_status=$?
          set -e
          printf '%s\n' "$attestation"
          wam_code="$(printf '%s' "$attestation" | jq -r 'if .status == "invalid" then .code else "NONE" end')"
          history_incomplete="$(printf '%s' "$attestation" | jq -r 'if .status == "ok" and .historyIncomplete == true then "true" else "false" end')"
          test "$wam_code" = "NONE" || printf '%s\n' "$wam_code" | grep -Eq '^[A-Z][A-Z0-9_]{2,63}$'
          echo "code=$wam_code" >> "$GITHUB_OUTPUT"
          echo "history_incomplete=$history_incomplete" >> "$GITHUB_OUTPUT"
          exit "$validator_status"

      - name: "Classify DMI availability (${{ steps.dmi-bulk.outputs.terminal_code }}; ${{ steps.dmi-bulk.outputs.collection_failure_codes }})"
        id: dmi-terminal-gate
        shell: bash
        env:
          PRODUCER_OUTCOME: ${{ steps.dmi-bulk.outcome }}
          PRODUCER_STATUS: ${{ steps.dmi-bulk.outputs.status }}
          PRODUCER_CODE: ${{ steps.dmi-bulk.outputs.terminal_code }}
          STRICT_CURRENT_ANCHOR_READY: ${{ steps.dmi-bulk.outputs.strict_current_anchor_ready }}
        run: |
          code="$PRODUCER_CODE"
          if ! printf '%s\n' "$code" | grep -Eq '^[A-Z][A-Z0-9_]{2,63}$'; then
            code="DMI_UNCLASSIFIED"
          fi
          status_ready=false
          case "$PRODUCER_STATUS" in
            ok|partial|fresh-bulk-cache) status_ready=true ;;
          esac
          ready=false
          if test "$PRODUCER_OUTCOME" = "success" \
            && test "$code" = "DMI_READY" \
            && test "$STRICT_CURRENT_ANCHOR_READY" = "true" \
            && test "$status_ready" = "true"; then
            ready=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if test "$ready" = "true"; then
            echo "DMI producer is READY; exact gap selection may start."
          else
            echo "::warning title=DMI partial availability::$code; verified pairs remain eligible and the exact residual continues to fallback providers."
          fi

      - name: Expose the exact target hour already used by the DMI refresh
        shell: bash
        env:
          LOCKED_TARGET_HOUR: ${{ steps.operational-target.outputs.target_hour }}
        run: |
          printf '%s\n' "$LOCKED_TARGET_HOUR" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$'
          test "$(date -u -d "$LOCKED_TARGET_HOUR" +%Y-%m-%dT%H:00:00Z)" = "$LOCKED_TARGET_HOUR"
          echo "RAVRADAR_PRODUCTION_TARGET_HOUR=$LOCKED_TARGET_HOUR" >> "$GITHUB_ENV"
          echo "Reused the exact UTC target already bound before the DMI refresh."

      - name: Seal exact operational DMI gaps for target through target plus 117
        id: target-registry
        run: >-
          python scripts/build-copernicus-target-registry.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --dmi .cache/dmi-candidate-progress.json
          --output .cache/copernicus-current-targets.json
          --github-output "$GITHUB_OUTPUT"

      - name: Inspect existing exact operational Copernicus source stage
        id: current-range
        run: >-
          python scripts/check-copernicus-current-range.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --registry .cache/copernicus-current-targets.json
          --dmi .cache/dmi-candidate-progress.json
          --targets data/live/coastal-parts-v2.json
          --source-stage .cache/copernicus-current-source-stage.json
          --allow-nonmatching-seal
          --allow-invalid-shadow-as-absent
          --github-output "$GITHUB_OUTPUT"

      - name: Preserve original Copernicus admission evidence before operational rebase
        if: steps.current-range.outputs.source_stage_reusable != 'true'
        run: echo "Preserve original source-stage evidence for validated donor migration before rebase."

      - name: Plan global current acquisition before Copernicus
        continue-on-error: true
        shell: bash
        run: |
          if ! python scripts/build-weather-acquisition-plan.py \
            --at "$RAVRADAR_PRODUCTION_TARGET_HOUR" \
            --dmi .cache/dmi-candidate-progress.json \
            --report data/diagnostics/weather-acquisition-plan-before-copernicus.json; then
            rm -f .cache/weather-current-acquisition-plan.json
            echo "::warning::Advisory acquisition plan unavailable; Copernicus uses conservative native coverage."
          fi

      - name: Install Copernicus acquisition dependency only when source stage is absent
        if: steps.current-range.outputs.source_stage_ready != 'true'
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements-copernicus.txt

      - name: Verify Copernicus credentials only when exact gaps remain
        if: steps.current-range.outputs.source_stage_ready != 'true'
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -z "$COPERNICUSMARINE_SERVICE_USERNAME" ] || [ -z "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "::warning::Copernicus credentials are unavailable; the exact residual will continue to Open-Meteo."
            exit 1
          fi

      - name: Fill only the exact operational DMI gap seal
        id: copernicus-fill
        if: steps.current-range.outputs.source_stage_ready != 'true'
        continue-on-error: true
        timeout-minutes: 57
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: >-
          python scripts/run-copernicus-current-pilot-with-retry.py
          --attempts 1
          --timeout-seconds 3300
          --backoff-seconds 20
          --
          --donor-bank .cache/copernicus-current-donor-bank.json
          --segment-journal .cache/copernicus-current-segment-journal.json
          --acquisition-plan .cache/weather-current-acquisition-plan.json
          --targets .cache/copernicus-current-targets.json
          --authoritative-targets data/live/coastal-parts-v2.json
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"

      - name: Reconfirm exact main before one-off shared Copernicus progress cache
        id: oneoff-copernicus-progress-write-authority
        if: always() && steps.copernicus-fill.outcome != 'cancelled' && steps.copernicus-fill.outcome != 'skipped' && (hashFiles('.cache/copernicus-current-shadow.json') != '' || steps.copernicus-fill.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save shared private Copernicus one-off donor bank before projection gates
        if: always() && steps.oneoff-copernicus-progress-write-authority.outcome == 'success' && (steps.copernicus-fill.outputs.donor_bank_written == 'true' || hashFiles('.cache/copernicus-current-segment-journal.json') != '' || hashFiles('.cache/copernicus-current-donor-bank.json.invalid-*') != '')
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-segment-journal.json
            .cache/copernicus-current-segment-journal.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save non-cancelled private Copernicus source-stage progress
        if: always() && steps.oneoff-copernicus-progress-write-authority.outcome == 'success' && steps.copernicus-fill.outcome != 'cancelled' && steps.copernicus-fill.outcome != 'skipped' && hashFiles('.cache/copernicus-current-shadow.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-118-preflight-progress-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require reusable Copernicus source stage
        run: >-
          python scripts/check-copernicus-current-range.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --registry .cache/copernicus-current-targets.json
          --dmi .cache/dmi-candidate-progress.json
          --targets data/live/coastal-parts-v2.json
          --source-stage .cache/copernicus-current-source-stage.json
          --require-source-stage-reusable

      - name: Reconfirm exact main before one-off shared validated Copernicus cache
        id: oneoff-copernicus-ready-write-authority
        if: success()
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save validated private Copernicus progress before downstream closure
        if: steps.oneoff-copernicus-ready-write-authority.outcome == 'success' && success()
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/copernicus-current-shadow.json
            .cache/copernicus-current-source-stage.json
          key: copernicus-current-progress-v3-118-preflight-ready-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fill only the exact remaining current gaps from Open-Meteo
        id: open-meteo-fill
        continue-on-error: true
        run: >-
          python scripts/fill-open-meteo-current-fallback.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --dmi .cache/dmi-candidate-progress.json
          --timeout-seconds 45
          --runtime-seconds 900

      - name: Reconfirm exact main before shared Open-Meteo progress cache
        id: open-meteo-progress-write-authority
        if: always() && steps.open-meteo-fill.outcome != 'cancelled' && steps.open-meteo-fill.outcome != 'skipped' && (steps.open-meteo-fill.outputs.checkpoint_written == 'true' || steps.open-meteo-fill.outputs.donor_bank_written == 'true')
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Save shared private Open-Meteo donor bank before projection gates
        if: always() && steps.open-meteo-progress-write-authority.outcome == 'success' && steps.open-meteo-fill.outputs.donor_bank_written == 'true' && hashFiles('.cache/open-meteo-current-donor-bank.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/open-meteo-current-donor-bank.json
            .cache/open-meteo-current-donor-bank.json.rejected
            .cache/open-meteo-current-donor-bank.json.rejected.previous
            .cache/open-meteo-current-fallback.json.rejected
            .cache/open-meteo-current-fallback.json.rejected.previous
          key: open-meteo-current-donor-bank-v1-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save shared private Open-Meteo current progress
        if: always() && steps.open-meteo-progress-write-authority.outcome == 'success' && steps.open-meteo-fill.outputs.checkpoint_written == 'true' && hashFiles('.cache/open-meteo-current-fallback.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-${{ runner.os }}-oneoff-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve safe weather acquisition diagnostics before terminal gates
        if: always() && steps.dmi-bulk.outcome != 'skipped' && steps.dmi-bulk.outcome != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: weather-acquisition-safe-oneoff-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/diagnostics/weather-acquisition-plan-before-dmi.json
            data/diagnostics/weather-acquisition-plan-before-copernicus.json
            data/diagnostics/open-meteo-current-fetch.json

      - name: Require complete Open-Meteo residual before freshness and closure
        if: always()
        shell: bash
        env:
          SOURCE_GATE_OUTCOME: ${{ steps.source-gate.outcome }}
          DMI_ACQUISITION_OUTCOME: ${{ steps.dmi-bulk.outcome }}
          COPERNICUS_ACQUISITION_OUTCOME: ${{ steps.copernicus-fill.outcome }}
          OPEN_METEO_ACQUISITION_OUTCOME: ${{ steps.open-meteo-fill.outcome }}
        run: |
          set -euo pipefail
          if [ "$OPEN_METEO_ACQUISITION_OUTCOME" = "skipped" ]; then
            echo "::error title=Weather provider chain stopped upstream::Open-Meteo was not evaluated because an earlier required step failed or was skipped (source_gate=$SOURCE_GATE_OUTCOME, dmi=$DMI_ACQUISITION_OUTCOME, copernicus=$COPERNICUS_ACQUISITION_OUTCOME)."
            exit 1
          fi
          test "${{ steps.open-meteo-fill.outcome }}" = "success"
          test "${{ steps.open-meteo-fill.outputs.checkpoint_written }}" = "true"
          test "${{ steps.open-meteo-fill.outputs.missing_pair_count }}" = "0"

      - name: Require complete operational WAM after provider progress
        if: always()
        shell: bash
        env:
          WAM_OUTCOME: ${{ steps.wam-bootstrap-readiness.outcome }}
          WAM_CODE: ${{ steps.wam-bootstrap-readiness.outputs.code }}
        run: |
          set -euo pipefail
          test "$WAM_OUTCOME" = "success"
          test "$WAM_CODE" = "NONE"

      - name: Classify one-off target freshness after the extended supplier chain
        id: oneoff-target-freshness
        run: >-
          node scripts/check-production-target-freshness.mjs
          --target "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --maximum-age-minutes 240
          --github-output "$GITHUB_OUTPUT"

      - name: Build exact DMI-first target through target plus 117 current closure
        run: >-
          python scripts/build-current-operational-closure.py
          --at "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          --dmi .cache/dmi-candidate-progress.json

      - name: Build controlled live current selection
        run: >-
          python scripts/build-live-current-pilot.py
          --dmi .cache/dmi-candidate-progress.json

      - name: Build the integrated runtime without release or deploy
        timeout-minutes: 17
        run: npm run update:weather
        env:
          DMI_BULK_CACHE_PATH: .cache/dmi-candidate-progress.json
          DMI_MAX_RETRIES: 0
          DMI_REQUEST_GAP_MS: 12000
          DMI_REQUEST_CONCURRENCY: 1
          DMI_LIVE_ZONE_BUDGET: 4
          DMI_REQUEST_BUDGET: 6
          DMI_CACHE_REFRESH_BELOW_HOURS: 24
          DMI_SCHEDULE_INTERVAL_MINUTES: 15
          DMI_RETRY_JITTER_MIN_MS: 30000
          DMI_RETRY_JITTER_MAX_MS: 180000
          DMI_OBSERVATION_INTERVAL_MINUTES: 60
          WEATHER_REQUEST_TIMEOUT_MS: 25000
          DMI_OCEAN_REQUEST_TIMEOUT_MS: 60000
          RAVSCORE_FIRST_CUTOVER_BOOTSTRAP_MODE: auto
          RAVSCORE_FIRST_CUTOVER_SOURCE_VALIDATED: false
          RAVSCORE_STATELESS_INTEGRATED_COLD_START_ALLOWED: true
          WEATHER_USER_AGENT: "RavRadar/4.0.345 118h preflight (${{ github.server_url }}/${{ github.repository }})"
          DMI_API_KEY: ${{ secrets.DMI_API_KEY }}

      - name: Attach exact current provenance and rebuild the public projection
        env:
          DMI_BULK_CACHE_PATH: .cache/dmi-candidate-progress.json
        run: |
          npm run build:current-provenance
          node scripts/generate-public-conditions.mjs

      - name: Prove only 210 zones, 673 parts and all 118 forecast hours
        run: >-
          node scripts/audit-ravscore-integrated-public-runtime.mjs
          --input data/live/conditions.json
          --output "$RAVRADAR_PRIVATE_PREFLIGHT_REPORT"

      - name: Measure incremental production-equivalent private runtime size without Supabase
        shell: bash
        run: |
          private_root="$RUNNER_TEMP/ravradar-private-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          private_bundle="$private_root/bundle"
          mkdir -p "$private_root"
          node scripts/private-production-runtime-workflow.mjs incremental-size-dry-run \
            --repository-root "$GITHUB_WORKSPACE" \
            --dmi-bulk .cache/dmi-candidate-progress.json \
            --private-root "$private_root" \
            --bundle "$private_bundle" \
            --source-head "$GITHUB_SHA" \
            --checkpoint .cache/ravscore-continuation-checkpoint/checkpoint.json \
            --runtime-audit "$RAVRADAR_PRIVATE_PREFLIGHT_REPORT" \
            --first-cutover-exception-decision APPLY-DEC-0122-FIRST-CUTOVER-EXCEPTION \
            --output .geometry-v2-work/ravscore-private-runtime-incremental-size-safe.json
          rmdir "$private_root"

      - name: Require conservative bounds or the approved single first-cutover exception
        run: >-
          jq -e '. as $report
          | $report.kind == "RAVRADAR_PRIVATE_RUNTIME_INCREMENTAL_SIZE_DRY_RUN"
          and $report.privacyClass == "AGGREGATE_PRIVATE_RUNTIME_CAPACITY"
          and $report.incrementalGate.scope == "INCREMENTAL_PRIVATE_RUNTIME_ONLY"
          and ($report.incrementalGate.status == "WITHIN_INCREMENTAL_SIZE_BOUNDS"
            or $report.incrementalGate.status == "EXCEEDS_INCREMENTAL_SIZE_BOUNDS")
          and $report.incrementalGate.fullCutoverCapacityEvaluated == false
          and $report.firstCutoverException.decisionId
            == "DEC-0122-OWNER-APPROVAL-2026-09-09"
          and $report.firstCutoverException.releaseVersion == "4.0.345"
          and $report.firstCutoverException.scope
            == "ONE_EXACT_VERIFIED_FIRST_CUTOVER"
          and $report.firstCutoverException.status
            == "ELIGIBLE_FOR_ONE_EXACT_VERIFIED_FIRST_CUTOVER"
          and $report.firstCutoverException.eligible == true
          and $report.firstCutoverException.maximumArchiveObjectBytes == 50000000
          and $report.firstCutoverException.archiveWithinBound == true
          and $report.firstCutoverException.retainedStorageWithinBudget == true
          and $report.firstCutoverException.checkpointDatabaseWithinBound == true
          and $report.firstCutoverException.recurringAutomaticCadenceEligible == false
          and $report.firstCutoverException.cacheTransportMigrationRequired == true
          and $report.firstCutoverException.existingCacheResetRequired == false
          and $report.firstCutoverException.exactSuccessfulOneoffAndHandoffRequired == true
          and $report.firstCutoverException.privateRuntimeIntegrityPrivacyAndReadbackGatesRemainRequired == true
          and $report.egress.reservePercent == 30
          and $report.egress.usableBudgetPercent == 70
          and $report.egress.conservativeMonthDays == 31
          and $report.egress.scheduledFullBuildsPerDay == 60
          and $report.egress.scheduledFullBuildsPerMonth == 1860
          and $report.egress.normalObjectReadsPerFullBuild == 2
          and $report.egress.rollbackObjectReadsPerFullBuild == 3
          and $report.egress.monthlyQuotaBytes == 5000000000
          and $report.egress.usableBudgetBytes
            == (($report.egress.monthlyQuotaBytes * 70 / 100) | floor)
          and $report.egress.normalPerFullBuildBytes
            == ($report.measurements.archiveObjectBytes * 2)
          and $report.egress.rollbackPerFullBuildBytes
            == ($report.measurements.archiveObjectBytes * 3)
          and $report.egress.projectedMonthlyNormalBytes
            == ($report.measurements.archiveObjectBytes * 2 * 1860)
          and $report.egress.projectedMonthlyRollbackBytes
            == ($report.measurements.archiveObjectBytes * 3 * 1860)
          and $report.egress.projectedMonthlyNormalWithCheckpointBytes
            == ($report.egress.projectedMonthlyNormalBytes
              + $report.checkpointDatabaseEgress.projectedMonthlyRpcMetadataBytes
              + (($report.checkpointDatabaseEgress.projectedCheckpointBytes
                + $report.checkpointDatabaseEgress.fullRestoreEnvelopeBytesPerRead) * 60))
          and $report.egress.projectedMonthlyRollbackWithCheckpointBytes
            == ($report.egress.projectedMonthlyRollbackBytes
              + $report.checkpointDatabaseEgress.projectedMonthlyRpcMetadataBytes
              + (($report.checkpointDatabaseEgress.projectedCheckpointBytes
                + $report.checkpointDatabaseEgress.fullRestoreEnvelopeBytesPerRead) * 60))
          and ($report.egress.normalWithCheckpointWithinBudget | type) == "boolean"
          and ($report.egress.rollbackWithCheckpointWithinBudget | type) == "boolean"
          and $report.firstCutoverException.generalMonthlyEgressWithinBudget
            == ($report.egress.normalWithCheckpointWithinBudget
              and $report.egress.rollbackWithCheckpointWithinBudget)
          and $report.storage.reservePercent == 30
          and $report.storage.usableBudgetPercent == 70
          and $report.storage.retainedObjectGenerations == 2
          and $report.storage.quotaBytes == 1000000000
          and $report.storage.usableBudgetBytes
            == (($report.storage.quotaBytes * 70 / 100) | floor)
          and $report.storage.retainedStorageBytes
            == ($report.measurements.archiveObjectBytes * 2)
          and $report.database.quotaBytes == 500000000
          and $report.database.usableBudgetBytes == 350000000
          and $report.database.projectedCheckpointBytes > 0
          and $report.database.projectedCheckpointBytes <= 16777216
          and $report.database.withinIncrementalBound == true
          and $report.database.currentDatabaseSizeIncluded == false
          and $report.checkpointDatabaseEgress.maximumSerializedBytes == 16777216
          and $report.checkpointDatabaseEgress.rpcMetadataResponsesPerFullBuild == 2
          and $report.checkpointDatabaseEgress.rpcMetadataBytesPerResponse == 4096
          and $report.checkpointDatabaseEgress.fullRestoreEnvelopeBytesPerRead == 4096
          and $report.checkpointDatabaseEgress.rpcMetadataPerFullBuildBytes == 8192
          and $report.checkpointDatabaseEgress.projectedMonthlyRpcMetadataBytes
            == (8192 * 1860)
          and $report.checkpointDatabaseEgress.bindingRestoresPerMonth == 60
          and $report.checkpointDatabaseEgress.observedCacheMissRateRequired == true
          and $report.checkpointDatabaseEgress.observedCacheMissRateIncluded == false
          and ($report.checkpointDatabaseEgress.restoreScenarios
            | map(.restoresPerMonth)) == [1,31,60,1860]
          and ($report.checkpointDatabaseEgress.restoreScenarios
            | map(.role)) == ["INFORMATIONAL_SCENARIO","INFORMATIONAL_SCENARIO",
              "BINDING_PLANNING_LIMIT","NON_BINDING_ALL_BUILD_STRESS"]
          and (($report.measurements.checkpointAvailable == true
            and $report.measurements.checkpointSerializedBytes > 0
            and $report.measurements.checkpointDisposition == "CHECKPOINT_SIZE_MEASURED"
            and $report.measurements.checkpointAbsenceAttestedByRuntimeAudit == false)
            or ($report.measurements.checkpointAvailable == false
            and $report.measurements.checkpointSerializedBytes == null
            and $report.measurements.checkpointDisposition
              == "NOT_APPLICABLE_DURING_MEASURED_WARMUP"
            and $report.measurements.checkpointAbsenceAttestedByRuntimeAudit == true))
          and $report.cutoverGate.status
            == "BLOCKED_PENDING_LIVE_BEFORE_AFTER_AND_OTHER_EGRESS"
          and $report.cutoverGate.cutoverEligible == false
          and $report.cutoverGate.liveSupabaseBeforeAfterMeasurementRequired == true
          and $report.cutoverGate.liveSupabaseBeforeAfterMeasurementIncluded == false
          and $report.cutoverGate.otherUnifiedEgressProjectionRequired == true
          and $report.cutoverGate.otherUnifiedEgressProjectionIncluded == false
          and $report.cutoverGate.liveDatabaseSizeMeasurementRequired == true
          and $report.cutoverGate.liveDatabaseSizeMeasurementIncluded == false
          and $report.cutoverGate.observedCheckpointRestoreRateRequired == true
          and $report.cutoverGate.observedCheckpointRestoreRateIncluded == false
          and $report.cutoverGate.checkpointDatabaseEgressIncluded == true
          and $report.cutoverGate.checkpointDatabaseStorageIncluded == true
          and $report.controls.supabaseRequestAttempted == false
          and $report.controls.privatePayloadUploaded == false
          and $report.controls.privatePayloadArtifactUploaded == false
          and $report.controls.archivePersisted == false
          and $report.controls.temporaryBundleRemoved == true'
          .geometry-v2-work/ravscore-private-runtime-incremental-size-safe.json
          > /dev/null

      - name: Report only aggregate incremental private runtime size evidence
        shell: bash
        run: |
          jq -c '{
            schemaVersion,
            kind,
            privacyClass,
            incrementalGate,
            firstCutoverException,
            measurements,
            egress: (.egress | {
              monthlyQuotaBytes,
              reservePercent,
              usableBudgetPercent,
              usableBudgetBytes,
              conservativeMonthDays,
              scheduledFullBuildsPerDay,
              scheduledFullBuildsPerMonth,
              normalObjectReadsPerFullBuild,
              rollbackObjectReadsPerFullBuild,
              normalPerFullBuildBytes,
              rollbackPerFullBuildBytes,
              projectedMonthlyNormalBytes,
              projectedMonthlyRollbackBytes,
              projectedMonthlyNormalWithCheckpointBytes,
              projectedMonthlyRollbackWithCheckpointBytes,
              normalWithinBudget,
              rollbackWithinBudget,
              normalWithCheckpointWithinBudget,
              rollbackWithCheckpointWithinBudget
            }),
            storage: (.storage | {
              quotaBytes,
              reservePercent,
              usableBudgetPercent,
              usableBudgetBytes,
              retainedObjectGenerations,
              retainedStorageBytes,
              withinBudget
            }),
            database,
            checkpointDatabaseEgress,
            cutoverGate,
            controls
          }' .geometry-v2-work/ravscore-private-runtime-incremental-size-safe.json
          echo "The owner-approved 4.0.345 successor exception permits only this exact successful oneoff as first-cutover input. It does not approve recurring automatic cadence; cache transport migration remains mandatory. Live Supabase egress/database before-and-after measurements and all other unified egress remain mandatory before recurring operation."

      - name: Report only privacy-safe 118-hour evidence
        shell: bash
        run: |
          jq -e '{schemaVersion,status,productionReferenceAt,evidencePurpose:"CURRENT_CUTOVER_PREFLIGHT",model,coverage,history,rollback,payload}' \
            "$RAVRADAR_PRIVATE_PREFLIGHT_REPORT" \
            > .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json
          test "$(jq -r '.status' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "passed"
          test "$(jq -r '.productionReferenceAt' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "$RAVRADAR_PRODUCTION_TARGET_HOUR"
          test "$(jq -r '.evidencePurpose' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "CURRENT_CUTOVER_PREFLIGHT"
          test "$(jq -r '.coverage.zoneCount' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "210"
          test "$(jq -r '.coverage.partCount' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "673"
          test "$(jq -r '.coverage.publicForecastHours' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "118"
          test "$(jq -r '.coverage.unavailableZoneModeCount' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "0"
          test "$(jq -er '.coverage.feggesundWave.targetPartCount | select(type == "number")' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "3"
          test "$(jq -er '.coverage.feggesundWave.forecastHours | select(type == "number")' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "118"
          test "$(jq -er '.coverage.feggesundWave.expectedEntries | select(type == "number")' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "354"
          test "$(jq -er '.coverage.feggesundWave.acceptedEntries | select(type == "number")' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "354"
          test "$(jq -er '.coverage.feggesundWave.missingEntries | select(type == "number")' .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json)" = "0"
          jq -e '.coverage.feggesundWave as $wave | (($wave.directEntries + $wave.proxyEntries) == 354)' \
            .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json > /dev/null
          jq -e '.coverage.feggesundWave.policySha256 | strings | test("^[0-9a-f]{64}$")' \
            .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json > /dev/null
          jq -e '.coverage.feggesundWave.coverageSha256 | strings | test("^[0-9a-f]{64}$")' \
            .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json > /dev/null
          echo "Integrated weather preflight passed for its one exact bounded target: 210 zones, 673 parts and 118 available forecast hours; no deploy was attempted."

      - name: Reconfirm exact main before sealing verified weather source handoff
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$EXPECTED_HEAD_SHA"

      - name: Seal exact run-bound verified weather source handoff
        id: weather-source-handoff-seal
        shell: bash
        run: >-
          node scripts/verified-weather-source-handoff.mjs seal
          --root "$GITHUB_WORKSPACE"
          --cache-root "$GITHUB_WORKSPACE/.cache/verified-weather-source-handoff-cache"
          --repository "$GITHUB_REPOSITORY"
          --producer-workflow ".github/workflows/validate-copernicus-current-pilot.yml"
          --source-head "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --runner-os "$RUNNER_OS"
          --closure data/diagnostics/current-operational-closure.json
          --github-output "$GITHUB_OUTPUT"

      - name: Save exact run-bound verified weather source cache
        uses: actions/cache/save@v6
        with:
          path: .cache/verified-weather-source-handoff-cache
          key: ${{ steps.weather-source-handoff-seal.outputs.cache_key }}

      - name: Upload only aggregate verified weather source handoff attestation
        uses: actions/upload-artifact@v7
        with:
          name: ravradar-weather-source-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: .cache/verified-weather-source-handoff-cache/attestation.json

      - name: Upload only the privacy-safe preflight evidence
        uses: actions/upload-artifact@v7
        with:
          name: ravscore-integrated-118h-preflight-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: .geometry-v2-work/ravscore-integrated-118h-preflight-safe.json
