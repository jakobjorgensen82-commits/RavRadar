          test "$PROJECTION_KEY" = open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          mkdir -p .diagnostic/34588002366
          mv .cache/open-meteo-current-fallback.json .diagnostic/34588002366/open-meteo-generation-projection.json
          mv .cache/dmi-candidate-progress.json .cache/copernicus-current-donor-bank.json .cache/open-meteo-current-donor-bank.json .cache/current-field-shadow.json .diagnostic/34588002366/
          cp .diagnostic/reference/diagnostic-latest-candidate.json .diagnostic/reference/open-meteo-current-fallback.json .diagnostic/34588002366/
      - name: Inspect generation 34588002366 and accumulate private union
        id: audit-g0
        continue-on-error: true
        run: python -B scripts/inspect-current-residual-20260911.py --source runtime-source --cache .diagnostic/34588002366 --target 2026-09-11T10:00:00Z --generation 34588002366 --union-state .diagnostic/union.json
