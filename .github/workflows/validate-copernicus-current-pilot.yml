name: Read-only weather cache forensics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        probe: [recovery-union, lossless-storage]
    name: Read-only ${{ matrix.probe }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the exact 4.0.337 release candidate without executing it
        if: matrix.probe == 'lossless-storage'
        uses: actions/checkout@v7
        with:
          ref: codex/weather-handoff-runtime-4.0.337
          path: release-source
          persist-credentials: false
          fetch-depth: 1
      - name: Require isolated branch and unchanged production code
        if: matrix.probe == 'recovery-union'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/weather-cache-forensic
          git diff --exit-code bf47198125401342426532df6de8d8d489188a0a -- scripts/update-dmi-bulk.py scripts/lib requirements-dmi.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt
      - name: Restore exact latest candidate read-only
        id: latest
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-normal-34252960481-1
          fail-on-cache-miss: true
      - name: Require exact latest cache identity
        env:
          ACTUAL_KEY: ${{ steps.latest.outputs.cache-matched-key }}
        run: test "$ACTUAL_KEY" = dmi-zone-candidate-v1-Linux-2026-W37-normal-34252960481-1
      - name: Keep isolated runner copy of latest input
        if: matrix.probe == 'recovery-union'
        run: mv .cache/dmi-candidate-progress.json .cache/diagnostic-latest-candidate.json
      - name: Restore exact newer historical candidate read-only
        id: historical
        if: matrix.probe == 'recovery-union'
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34212820037-1
          fail-on-cache-miss: true
      - name: Require exact historical cache identity
        if: matrix.probe == 'recovery-union'
        env:
          ACTUAL_KEY: ${{ steps.historical.outputs.cache-matched-key }}
        run: test "$ACTUAL_KEY" = dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34212820037-1
      - name: Restore exact Open-Meteo checkpoint read-only
        id: open-meteo
        if: matrix.probe == 'recovery-union'
        uses: actions/cache/restore@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-Linux-normal-34252960481-1
          fail-on-cache-miss: true
      - name: Require exact Open-Meteo cache identity
        if: matrix.probe == 'recovery-union'
        env:
          ACTUAL_KEY: ${{ steps.open-meteo.outputs.cache-matched-key }}
        run: test "$ACTUAL_KEY" = open-meteo-current-fallback-v2-Linux-normal-34252960481-1
      - name: Measure independently proved overlap and union without saving
        if: matrix.probe == 'recovery-union'
        run: python -B scripts/inspect-dmi-reuse-proof.py --cache .cache/dmi-candidate-progress.json --supplement .cache/diagnostic-latest-candidate.json --target 2026-09-08T16:00:00Z --compatibility-probe
      - name: Measure which Open-Meteo gaps are already recovered by DMI
        if: matrix.probe == 'recovery-union'
        run: python -B scripts/inspect-dmi-open-meteo-overlap.py --historical-dmi .cache/dmi-candidate-progress.json --latest-dmi .cache/diagnostic-latest-candidate.json --open-meteo .cache/open-meteo-current-fallback.json --target 2026-09-08T16:00:00Z
      - name: Measure lossless roundtrip without saving cache
        if: matrix.probe == 'lossless-storage'
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/dmi-production-codec-scale.json"
          cd release-source
          python -B scripts/inspect-dmi-source-codec.py \
            --cache "$GITHUB_WORKSPACE/.cache/dmi-candidate-progress.json" \
            --encoded-output "$encoded" \
            --retain-encoded
          node --input-type=module -e "import {readDmiBulkDocument,DMI_BULK_STORAGE_SCHEMA} from './scripts/lib/dmi-bulk-storage.mjs'; const value=await readDmiBulkDocument(process.argv[1],{expandSources:false}); if(!value?.zones||typeof value.zones!=='object') throw new Error('invalid encoded document'); console.log(JSON.stringify({contract:'DMI_NODE_PRODUCTION_STORAGE_SCALE_PROOF_V1',status:'PRODUCTION_NODE_CODEC_SCALE_VERIFIED',storageSchema:DMI_BULK_STORAGE_SCHEMA,zoneCount:Object.keys(value.zones).length,privatePayloadIncluded:false,cacheReplaced:false}));" "$encoded"
          rm -f "$encoded"

# Diagnostic branch only. No saved cache, uploaded data, producer or deploy.
