name: Read-only weather cache forensics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require isolated diagnostic branch
        run: test "$GITHUB_REF" = refs/heads/codex/weather-cache-forensic
      - name: Check out exact production readers
        uses: actions/checkout@v7
        with:
          ref: 5587001b45ffea056addaf6cd20084719540336a
          path: runtime-source
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact production source
        run: test "$(git -C runtime-source rev-parse HEAD)" = 5587001b45ffea056addaf6cd20084719540336a
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned reader dependencies
        run: python -m pip install --disable-pip-version-check -r runtime-source/requirements-dmi.txt -r runtime-source/requirements-copernicus.txt
      - name: Restore latest registry and ledger read-only
        id: reference-dmi
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          fail-on-cache-miss: true
      - name: Restore exact final residual read-only
        id: reference-residual
        uses: actions/cache/restore@v6
        with:
          path: .cache/open-meteo-current-fallback.json
          key: open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Bind and isolate the reference files
        env:
          DMI_KEY: ${{ steps.reference-dmi.outputs.cache-matched-key }}
          OM_KEY: ${{ steps.reference-residual.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$DMI_KEY" = dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          test "$OM_KEY" = open-meteo-current-fallback-v2-Linux-oneoff-34588002366-1
          mkdir -p .diagnostic/reference
          mv .cache/dmi-candidate-progress.json .diagnostic/reference/diagnostic-latest-candidate.json
          mv .cache/open-meteo-current-fallback.json .diagnostic/reference/open-meteo-current-fallback.json
      - name: Restore DMI candidate from 34588002366 read-only
        id: g0-dmi
        uses: actions/cache/restore@v6
        with:
          path: .cache/dmi-candidate-progress.json
          key: dmi-zone-candidate-v1-Linux-2026-W37-118-preflight-34588002366-1
          fail-on-cache-miss: true
      - name: Restore Copernicus bank from 34588002366 read-only
        id: g0-cp
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/copernicus-current-donor-bank.json
            .cache/copernicus-current-donor-bank.json.invalid-*
            .cache/copernicus-current-shadow.json.invalid-*
            .cache/copernicus-current-source-stage.json.invalid-*
          key: copernicus-current-donor-bank-v1-Linux-oneoff-34588002366-1
          fail-on-cache-miss: true
      - name: Restore Open-Meteo bank from 34588002366 read-only
        id: g0-om
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/open-meteo-current-donor-bank.json
            .cache/open-meteo-current-donor-bank.json.rejected
            .cache/open-meteo-current-donor-bank.json.rejected.previous
            .cache/open-meteo-current-fallback.json.rejected
            .cache/open-meteo-current-fallback.json.rejected.previous
