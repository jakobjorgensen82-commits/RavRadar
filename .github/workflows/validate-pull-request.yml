name: Validate RavRadar pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ravradar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-native-scope:
    name: Determine exact SOURCE native fixture scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Classify only exact SOURCE fixture and normal runtime inputs
        id: scope
        run: node scripts/source19-native-ci-scope.mjs
        env:
          SOURCE19_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE19_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  source-native:
    name: SOURCE native ${{ matrix.family }} / ${{ matrix.case }}
    needs: source-native-scope
    if: needs.source-native-scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: h70
            case: normal-install
          - family: h70
            case: replace-bank
          - family: h70
            case: replace-root
          - family: h70
            case: lose-supervisor
          - family: h71
            case: native-union-install
          - family: h71
            case: replace-union-root
          - family: h71
            case: lose-union-supervisor
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require exact native fixture pull-request head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"
          test ! -e /tmp/ravradar-private-production-runtime
          test ! -L /tmp/ravradar-private-production-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install only existing SOURCE native fixture requirements
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt
      - name: Install locked native action dependencies without scripts
        working-directory: .github/actions/save-owned-dmi-grib
        env:
          npm_config_cache: ${{ github.workspace }}/.github/actions/save-owned-dmi-grib/.npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retain verified Node24 path for the isolated action
        id: native-node24
        shell: bash
        run: |
          set -euo pipefail
          executable="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          case "$executable" in /*) ;; *) exit 1 ;; esac
          test -x "$executable"
          test "$("$executable" -p 'process.versions.node.split(".")[0]')" = 24
          printf 'path=%s\n' "$executable" >> "$GITHUB_OUTPUT"
      - name: Restore Node22 for normal SOURCE prelude programs
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Retain verified Node22 path for the normal prelude
        id: native-node22
        shell: bash
        run: |
          set -euo pipefail
          executable="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          case "$executable" in /*) ;; *) exit 1 ;; esac
          test -x "$executable"
          test "$("$executable" -p 'process.versions.node.split(".")[0]')" = 22
          printf 'path=%s\n' "$executable" >> "$GITHUB_OUTPUT"
      - name: Run one fixed native case in its fresh disposable Linux job
        shell: bash
        env:
          SOURCE_NATIVE_FAMILY: ${{ matrix.family }}
          SOURCE_NATIVE_CASE: ${{ matrix.case }}
          SOURCE_NODE22_PATH: ${{ steps.native-node22.outputs.path }}
          SOURCE_NODE24_PATH: ${{ steps.native-node24.outputs.path }}
        run: |
          set -euo pipefail
          case "$SOURCE_NATIVE_FAMILY/$SOURCE_NATIVE_CASE" in
            h70/normal-install|h70/replace-bank|h70/replace-root|h70/lose-supervisor)
              python -I -B scripts/test-source19-cp-install-native.py --node22-path "$SOURCE_NODE22_PATH" --node24-path "$SOURCE_NODE24_PATH" --case "$SOURCE_NATIVE_CASE" --composition integrated-d504-diagnostics-v2
              ;;
            h71/native-union-install|h71/replace-union-root|h71/lose-union-supervisor)
              python -I -B scripts/test-source19-union-native.py --node22-path "$SOURCE_NODE22_PATH" --node24-path "$SOURCE_NODE24_PATH" --case "$SOURCE_NATIVE_CASE" --composition integrated-d504-diagnostics-v2
              ;;
            *) exit 1 ;;
          esac

  validate:
    needs: [source-native-scope, source-native]
    if: always() && needs.source-native-scope.result == 'success' && ((needs.source-native-scope.outputs.required == 'true' && needs.source-native.result == 'success') || (needs.source-native-scope.outputs.required == 'false' && needs.source-native.result == 'skipped'))
    name: Source validation and release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The source gate seals the exact production Candidate G source at
          # its pinned historical commit. A one-commit PR checkout cannot
          # prove those immutable Git bytes.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require exact pull-request source head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build deterministic source-tree content identity
        id: source-content
        run: node scripts/weather-source-gate.mjs digest
        env:
          SOURCE_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install source-gate dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt

      # The fixed local cache action uses Node24. Exercise it only against its
      # own synthetic native fixture; never invoke the real cache service here.
      - name: Set up Node24 for isolated acquisition contracts
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install exact local cache-action dependencies without scripts
        working-directory: .github/actions/save-owned-dmi-grib
        env:
          npm_config_cache: ${{ github.workspace }}/.github/actions/save-owned-dmi-grib/.npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked cache API distribution without runtime calls
        run: node scripts/test-owned-dmi-cache-dependency.mjs

      - name: Validate isolated acquisition ownership and raw-save cohort
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-weather-acquisition-writer.mjs
          python -B scripts/test-weather-acquisition-writer.py
          python -B scripts/test-owned-dmi-grib-save-native.py --node24-path "$(command -v node)"

      - name: Restore Node22 for existing source validation
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # En ra PR-checkout har med vilje ikke Supabase-hemmeligheder og kan
      # derfor ikke hydrere den centrale admin-sandhed, som fuld produktion
      # kraever. De kildebaserede gates her maa aldrig bygge eller deploye.
      # Exact-original tests are part of this mandatory native/source proof,
      # not an expansion of the ordinary weather source-check command budget.
      - name: Validate bounded native current diagnosis on artificial data only
        run: npm run test:exact-dmi-original-restore && python -B scripts/test-native-current-grid.py --native && python -B scripts/test-dmi-exact-original-restore.py --native

      # Diagnose the short native SQL boundary before the long source matrix.
      # All the same gates must succeed; only their execution order changes.
      - name: Validate native PostgreSQL checkpoint CAS on artificial data only
        shell: bash
        run: |
          set -euo pipefail
          # Use only PostgreSQL binaries already present in the normal runner.
          # No package/runtime install, network, cloud database or skip fallback.
          node scripts/test-code-only-userdata-policy-routing.mjs
          # Includes the unchanged 213 -> 220 -> 230 phases in the SAME owned
          # cluster, then executes the actual native-identity SQL and CAS cases.
          node scripts/test-protected-ravscore-continuation-checkpoint.mjs --native-statistics-revision --native-sampling-identity

      - name: Validate source contracts and release governance
        run: npm run validate:source && node scripts/test-fixed-public-rate-log-20261013.mjs && node scripts/test-fixed-storage-upload-log-20261013.mjs && node scripts/test-fixed-public-rate-console-log-20261015.mjs

      - name: Validate durable Copernicus current-reference baseline on artificial data only
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test-copernicus-current-source-stage.py
          python -B scripts/test-copernicus-range-checker-v2.py

      - name: Validate download-inclusive DMI capacity on artificial data only
        run: python -B scripts/test_dmi_wave_bootstrap_update_integration.py

      - name: Require validated source tree to remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          tracked_status="$(git status --short --untracked-files=no)"
          if [[ -n "$tracked_status" ]]; then
            echo "::error::Source validation changed tracked files; proof is forbidden."
            printf '%s\n' "$tracked_status"
            git diff --summary
            git diff --stat
            exit 1
          fi
          test -z "$tracked_status"

      - name: Upload tree-content source validation proof
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source-content.outputs.artifact_name }}
          path: .cache/source-tree-content-proof.json
          if-no-files-found: error
          retention-days: 30
