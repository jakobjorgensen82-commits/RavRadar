name: Validate RavRadar pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ravradar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full validation and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          "shapely>=2.0,<3"
          "pyproj>=3.6,<4"

      - name: Validate full project
        run: npm run validate

      - name: Run release governance gate
        run: npm run release:gate
