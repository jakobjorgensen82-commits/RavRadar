name: Validate RavRadar pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ravradar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The source gate seals the exact production Candidate G source at
          # its pinned historical commit. A one-commit PR checkout cannot
          # prove those immutable Git bytes.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install source-gate dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          -r requirements-geometry.txt
          -r requirements-copernicus.txt

      # En ra PR-checkout har med vilje ikke Supabase-hemmeligheder og kan
      # derfor ikke hydrere den centrale admin-sandhed, som fuld produktion
      # kraever. De kildebaserede gates her maa aldrig bygge eller deploye.
      - name: Validate source contracts and release governance
        run: npm run validate:source
