name: Validate RavRadar pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ravradar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source validation and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt
          "shapely>=2.0,<3"
          "pyproj>=3.6,<4"

      # En ra PR-checkout har med vilje ikke Supabase-hemmeligheder og kan
      # derfor ikke hydrere den centrale admin-sandhed, som fuld produktion
      # kraever. De kildebaserede gates her maa aldrig bygge eller deploye.
      - name: Validate project memory
        run: npm run validate:rdks

      - name: Validate current history and reference-hour handling
        run: npm run test:current-transport-history

      - name: Validate production-hour lock
        run: npm run test:production-hour-lock

      - name: Validate DMI and fallback integration
        run: |
          npm run test:dmi-acquisition
          npm run test:dmi-bulk-forecast-integration
          npm run test:water-source-production-chain

      - name: Validate production workflow gate order
        run: npm run test:workflow-validation-order

      - name: Validate online browser audit syntax
        run: node --check scripts/audit-online-browser-playwright-4.0.237.mjs

      - name: Run release governance gate
        run: npm run release:gate
