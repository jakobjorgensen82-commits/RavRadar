name: Validate RavRadar pull request

on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ravradar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prefix-preparation-only:
    name: PREFIX preparation only — no source qualification
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/source-prefix-preparation-only-20261114' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Require the exact same-repository diagnostic source head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_HEAD_REF" = codex/source-prefix-preparation-only-20261114
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install existing native acquisition dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-dmi.txt -r requirements-geometry.txt -r requirements-copernicus.txt

      - name: Install the same locked local SDK without scripts
        working-directory: .github/actions/save-owned-dmi-grib
        env:
          npm_config_cache: ${{ github.workspace }}/.github/actions/save-owned-dmi-grib/.npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund

      # This explicit diagnostic branch must never be merged. It cannot write
      # source-completed/native-phase receipts or qualify a release/main tree.
      - name: Prepare the normal PREFIX only without PG or source admission
        shell: bash
        run: |
          set -euo pipefail
          python -I -B scripts/test-source598-current-native-profile.py \
            --prepare-current598-prefix --node24-path "$(command -v node)" \
            --input-profile current598-preparation

      - name: Require the diagnostic source checkout to remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short --untracked-files=no)"

  validate:
    name: Source validation and release gate
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'codex/source-prefix-preparation-only-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # The source gate seals the exact production Candidate G source at
          # its pinned historical commit. A one-commit PR checkout cannot
          # prove those immutable Git bytes.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require exact pull-request source head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Environment only: the unchanged producer still verifies the whole
      # real plan and ROOT review before any target or source receipt.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared DMI dependencies before source planning
        timeout-minutes: 2
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --timeout 15 --retries 0 --only-binary=:all: -r requirements-dmi.txt
          && python -c "import requests.adapters; import urllib3.util.retry; import eccodes; assert eccodes.codes_get_api_version() == '2.48.2'"

      - name: Build deterministic source-tree content identity
        id: source-content
        run: node scripts/weather-source-gate.mjs impact-digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

      # Reproduce the failing normal B/S caller before the long matrix. The
      # observer only counts fixed categories around real native fs calls;
      # it neither substitutes results nor relaxes the pack's close proof.
      - name: Diagnose normal pack-reader closure on artificial data only
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        timeout-minutes: 3
        run: >-
          node scripts/test-production-hour-lock-4.0.236.mjs &&
          node scripts/reclaim-runner-android-sdk.mjs &&
          node scripts/test-post-cutover-migration-routing.mjs &&
          node --test scripts/test-owned-pack-close-probe.mjs && node
          -e "require('node:assert/strict').equal(process.platform, 'linux')" && node --test
          --test-name-pattern='^owned stream closure distinguishes physical fd reuse / (different-file|same-file)$|^Linux owned stream closure accepts a genuinely reused directory fd$|^shared own-fd close proof'
          scripts/test-private-weather-component-pack.mjs && node --test
          --test-name-pattern='^actual normal B/S admission'
          scripts/test-completed-private-runtime-admission.mjs

      - name: Install source-gate dependencies
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-dmi.txt -r requirements-geometry.txt -r requirements-copernicus.txt
          if test "${{ steps.source-content.outputs.selection }}" = FULL; then
            node scripts/test-source-impact-plan.mjs
            node scripts/test-source-impact-git-diff.mjs
            node --test scripts/test-source-impact-full-baseline.mjs
            node scripts/test-source-targeted-receipt.mjs
            node scripts/test-source-targeted-producer.mjs
            node scripts/test-source-targeted-consumer.mjs
            node scripts/test-source-impact-workflow.mjs
          fi

      # The fixed local cache action uses Node24. Exercise it only against its
      # own synthetic native fixture; never invoke the real cache service here.
      - name: Set up Node24 for isolated acquisition contracts
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install exact local cache-action dependencies without scripts
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        working-directory: .github/actions/save-owned-dmi-grib
        env:
          npm_config_cache: ${{ github.workspace }}/.github/actions/save-owned-dmi-grib/.npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked cache API distribution without runtime calls
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        run: node scripts/test-owned-dmi-cache-dependency.mjs

      - name: Prepare Node24 for Source native and validate acquisition only on FULL
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.source-content.outputs.selection }}" = FULL; then
            node --test scripts/test-weather-acquisition-writer.mjs
            python -B scripts/test-weather-acquisition-writer.py
            python -B scripts/test-owned-dmi-grib-save-native.py --node24-path "$(command -v node)"
          fi
          printf 'node24_path=%s\n' "$(command -v node)" >> "$GITHUB_OUTPUT"
        id: source-native-node24

      - name: Restore Node22 for existing source validation
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # En ra PR-checkout har med vilje ikke Supabase-hemmeligheder og kan
      # derfor ikke hydrere den centrale admin-sandhed, som fuld produktion
      # kraever. De kildebaserede gates her maa aldrig bygge eller deploye.
      # Exact-original tests are part of this mandatory native/source proof,
      # not an expansion of the ordinary weather source-check command budget.
      - name: Validate bounded native current diagnosis on artificial data only
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        run: npm run test:exact-dmi-original-restore && python -B scripts/test-native-current-grid.py --native && python -B scripts/test-dmi-exact-original-restore.py --native

      - name: Validate source contracts and release governance
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        run: npm run validate:source && node scripts/test-fixed-public-rate-log-20261013.mjs && node scripts/test-fixed-storage-upload-log-20261013.mjs && node scripts/test-fixed-public-rate-console-log-20261015.mjs && node scripts/test-prepare-candidate-g-operational-rollback.mjs && node scripts/test-candidate-g-rollback-public-stage.mjs

      # Reject source-contract regressions before the native PostgreSQL matrix.
      # All the same gates must succeed; only their execution order changes.
      - name: Validate current Source contracts and release governance
        if: ${{ steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        env:
          RAVRADAR_SOURCE_NATIVE_NODE24_PATH: ${{ steps.source-native-node24.outputs.node24_path }}
          SOURCE_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/source-first-issuance-contracts.mjs contracts

      - name: Validate native PostgreSQL checkpoint CAS on artificial data only
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          RAVRADAR_SOURCE_NATIVE_NODE24_PATH: ${{ steps.source-native-node24.outputs.node24_path }}
        run: |
          set -euo pipefail
          node --test scripts/test-native-postgres-evidence.mjs
          node scripts/native-postgres-evidence.mjs

      - name: Upload independently completed native586 PostgreSQL phase
        if: ${{ steps.source-content.outputs.selection == 'FULL' || steps.source-content.outputs.selection == 'SOURCE_FIRST_ISSUANCE' || steps.source-content.outputs.selection == 'SOURCE_CURRENT_UNCHANGED' }}
        uses: actions/upload-artifact@v7
        with:
          name: native586-phase-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: .cache/native-postgres-phase-proof.json
          if-no-files-found: error
          retention-days: 30

      # A single sequential national preactivation proof, not a weather-run
      # budget change or another concurrent member of the small source group.
      - name: Validate isolated restart and two ordinary national followers
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/national584-source-evidence.mjs

      - name: Validate durable Copernicus current-reference baseline on artificial data only
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/test-copernicus-current-source-stage.py
          python -B scripts/test-copernicus-range-checker-v2.py

      - name: Validate download-inclusive DMI capacity on artificial data only
        if: ${{ steps.source-content.outputs.selection == 'FULL' }}
        run: python -B scripts/test_dmi_wave_bootstrap_update_integration.py

      - name: Require validated source tree to remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          tracked_status="$(git status --short --untracked-files=no)"
          if [[ -n "$tracked_status" ]]; then
            echo "::error::Source validation changed tracked files; proof is forbidden."
            printf '%s\n' "$tracked_status"
            git diff --summary
            git diff --stat
            exit 1
          fi
          test -z "$tracked_status"

      - name: Upload tree-content source validation proof
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source-content.outputs.artifact_name }}
          path: ${{ steps.source-content.outputs.receipt_path || '.cache/source-tree-content-proof.json' }}
          if-no-files-found: error
          retention-days: 30
