name: Validate six-zone coast recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravradar-six-zone-coast-recovery
  cancel-in-progress: true

jobs:
  validate-six-zone-recovery:
    name: Validate only the six approved recovery zones
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install geometry and DMI readers
        run: python -m pip install --disable-pip-version-check -r requirements-dmi.txt "shapely>=2.0,<3" "pyproj>=3.6,<4"

      - name: Validate fixed six-zone scope and geometry contract
        run: >-
          python scripts/validate-fallback-zone-recovery.py
          --candidate .github/private-data/six-zone-recovery/candidate.geojson
          --points .github/private-data/six-zone-recovery/point-pairs.json
          --plan .github/private-data/six-zone-recovery/recovery-plan.json
          --output six-zone-recovery-validation.json

      - name: Validate all 22 target and neighbour-remainder water points on native DMI grids
        run: >-
          python scripts/validate-national-local-part-dmi-grid.py
          --input .github/private-data/six-zone-recovery/point-pairs.json
          --report six-zone-recovery-dmi-grid.json

      - name: Build disabled private runtime candidate
        run: >-
          python scripts/build-six-zone-private-runtime.py
          --candidate .github/private-data/six-zone-recovery/candidate.geojson
          --points .github/private-data/six-zone-recovery/point-pairs.json
          --grid six-zone-recovery-dmi-grid.json
          --plan .github/private-data/six-zone-recovery/recovery-plan.json
          --output .geometry-v2-work/six-zone-private-runtime

      - name: Validate runtime isolation and rollback
        run: >-
          node --input-type=module -e
          "import path from 'node:path';import{build}from'./scripts/build-public-coastal-parts-v2.mjs';await build({source:path.resolve('.geometry-v2-work/six-zone-private-runtime'),overrides:path.resolve('.geometry-v2-work/six-zone-private-runtime/coastline-overrides.json'),output:path.resolve('.geometry-v2-work/six-zone-private-public.json')});"
          && node scripts/validate-six-zone-private-runtime.mjs

      - name: Upload private six-zone evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: six-zone-coast-recovery-${{ github.run_id }}
          path: |
            six-zone-recovery-validation.json
            six-zone-recovery-dmi-grid.json
            .geometry-v2-work/six-zone-private-runtime/manifest.json
            .geometry-v2-work/six-zone-private-public.json
          if-no-files-found: warn
          retention-days: 14
