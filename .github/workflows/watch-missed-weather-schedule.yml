name: Guard external RavRadar weather cadence

on:
  workflow_dispatch:
    inputs:
      external_watchdog:
        description: "Explicit cron-job.org four-hour weather cadence; omission is dry-run only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ravradar-weather-cadence-watchdog
  queue: max
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Inspect both production entrances for this external cadence slot
        id: first-check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/run-current-weather-once.yml" --jq .state)" = active
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-and-deploy.yml/runs?per_page=100" > "$RUNNER_TEMP/normal-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/run-current-weather-once.yml/runs?per_page=100" > "$RUNNER_TEMP/manual-runs.json"
          node scripts/check-weather-cadence-watchdog.mjs \
            --normal-runs "$RUNNER_TEMP/normal-runs.json" \
            --manual-runs "$RUNNER_TEMP/manual-runs.json" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      - name: Recheck immediately before a scheduled rescue
        id: recheck
        if: inputs.external_watchdog == true && steps.first-check.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-and-deploy.yml/runs?per_page=100" > "$RUNNER_TEMP/normal-runs-recheck.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/run-current-weather-once.yml/runs?per_page=100" > "$RUNNER_TEMP/manual-runs-recheck.json"
          node scripts/check-weather-cadence-watchdog.mjs \
            --normal-runs "$RUNNER_TEMP/normal-runs-recheck.json" \
            --manual-runs "$RUNNER_TEMP/manual-runs-recheck.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch one ordinary current-weather run
        if: inputs.external_watchdog == true && steps.first-check.outputs.dispatch == 'true' && steps.recheck.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/run-current-weather-once.yml/dispatches" \
            -f ref=main -F "inputs[quick_confirmation]=false"
