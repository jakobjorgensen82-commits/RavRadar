<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RavRadar administration</title><link rel="stylesheet" href="style.css?v=2.6.28"><style>body{background:#07131c;color:#eef7fb}.admin{max-width:1100px;margin:auto;padding:20px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.admin-card{background:#102431;border:1px solid #2d4b5d;border-radius:14px;padding:16px}.admin-card h2{margin-top:0}.metric{font-size:2rem;font-weight:800}.status-ok{color:#5ee093}.status-warning{color:#ffd166}.status-alarm{color:#ff6b6b}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #29404e}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}button,a.button{padding:10px 14px;border-radius:9px;border:0;background:#d8a232;color:#111;text-decoration:none;font-weight:700}</style></head><body><main class="admin"><h1>RavRadar administration</h1><p><a class="button" href="./">Tilbage til kortet</a></p><div id="summary" class="admin-grid"></div><section class="admin-card"><h2>Aktive regler</h2><div id="rules">Indlæser…</div></section><section class="admin-card"><h2>Lokale observationer</h2><div id="observations"></div></section><section class="admin-card"><h2>Vedligeholdelse</h2><p>Vejrhistorik kan slettes centralt uden at røre snapshots i observationer. Kør <code>npm run maintenance:weather</code> med ønsket retention.</p><div class="admin-actions"><button id="downloadObservations">Eksportér pseudonymiseret JSON</button><button id="refresh">Opdatér status</button></div></section></main><script type="module" src="js/ui/admin-dashboard.js?v=2.6.28"></script></body></html>
