<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Hvor kan ravet være fra havbund til strand?</title>
  <desc id="desc">Et forenklet kysttværsnit med seks nummererede positioner fra dyb havbund til stranden.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#48c5e8"/><stop offset="1" stop-color="#087ca7"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b98624"/><stop offset="1" stop-color="#e2bc63"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#eaf7fb"/>
  <path d="M0 152 Q55 122 110 152 T220 152 T330 152 T440 152 T550 152 T660 152 T770 152 T880 152 T990 152 L1200 152 L1200 520 L0 520Z" fill="url(#water)"/>
  <path d="M0 470 C190 454 320 430 430 382 C505 350 530 318 585 300 C640 282 677 362 742 370 C817 380 845 318 925 305 C1010 291 1050 251 1095 205 C1140 159 1162 91 1200 20 L1200 520 L0 520Z" fill="url(#sand)"/>
  <path d="M0 470 C190 454 320 430 430 382 C505 350 530 318 585 300 C640 282 677 362 742 370 C817 380 845 318 925 305 C1010 291 1050 251 1095 205 C1140 159 1162 91 1200 20" fill="none" stroke="#76581e" stroke-width="5"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".92">
    <path d="M410 151q20-35 40 0t40 0"/><path d="M700 151q20-35 40 0t40 0"/><path d="M910 151q20-35 40 0t40 0"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="30" font-weight="900" text-anchor="middle" filter="url(#shadow)">
    <g><circle cx="105" cy="415" r="31" fill="#fff"/><text x="105" y="426" fill="#073b4c">1</text></g>
    <g><circle cx="300" cy="235" r="31" fill="#fff"/><text x="300" y="246" fill="#073b4c">2</text></g>
    <g><circle cx="520" cy="333" r="31" fill="#fff"/><text x="520" y="344" fill="#073b4c">3</text></g>
    <g><circle cx="760" cy="327" r="31" fill="#fff"/><text x="760" y="338" fill="#073b4c">4</text></g>
    <g><circle cx="965" cy="276" r="31" fill="#fff"/><text x="965" y="287" fill="#073b4c">5</text></g>
    <g><circle cx="1080" cy="201" r="31" fill="#fff"/><text x="1080" y="212" fill="#073b4c">6</text></g>
  </g>
  <g fill="#073b4c" font-family="system-ui,sans-serif">
    <text x="42" y="55" font-size="34" font-weight="900">Hvor kan ravet være?</text>
    <text x="43" y="91" font-size="20">Et forenklet tværsnit – de lokale forhold kan se anderledes ud</text>
  </g>
</svg>
